<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>İstatistiklerim | Dijital Öğretmen</title>
<style>
  :root{
    --purple:#16345C;
    --purple-dark:#0E1D33;
    --cream:#F2F4F8;
    --coral:#C08A2E;
    --line:#DCE3EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--cream);
    color:var(--purple-dark);
  }
  header{
    background:var(--purple);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.15rem;
  }
  header a{
    color:#fff;
    text-decoration:none;
    font-size:.85rem;
    border:1px solid rgba(255,255,255,.5);
    padding:6px 12px;
    border-radius:20px;
  }
  header a:hover{background:rgba(255,255,255,.15);}
  .wrap{
    padding:16px;
  }
  .kart{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(22,52,92,.06);
  }
  iframe{
    width:100%;
    height:calc(100vh - 130px);
    min-height:500px;
    border:0;
    display:block;
  }
  .not{
    font-size:.8rem;
    color:#5E6E82;
    padding:10px 4px 0;
  }
</style>
</head>
<body>

<header>
  <h1>📊 İstatistiklerim</h1>
  <a href="https://dijitalogretmen.goatcounter.com" target="_blank" rel="noopener">Panelde tam ekran aç ↗</a>
</header>

<div class="wrap">
  <div class="kart">
    <iframe src="https://dijitalogretmen.goatcounter.com/" title="Ziyaretçi istatistikleri" loading="lazy"></iframe>
  </div>
  <p class="not">Bu sayfa gizlidir, menüde ve sitemap'te yer almaz; sadece bu adresi bilenler (sen) görebilir. Veriler görünmüyorsa GoatCounter hesabına giriş yapmış olman gerekir.</p>
</div>

</body>
</html>
