<style>
:root{
  --navy-1:#0b0f1e;
  --navy-2:#161d38;
  --navy-3:#212a4d;
  --gold:#e3b04b;
  --gold-soft:#f3d896;
  --red:#e2504f;
  --red-deep:#b5342f;
  --ink:#f1f0f6;
  --ink-dim:#aeb4d1;
  --line:rgba(255,255,255,.12);
  --accent:var(--red);
  --accent-soft:rgba(226,80,79,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:DORakam,"Nunito",sans-serif;
  background:
    radial-gradient(900px 600px at 12% -8%, #2a3462 0%, transparent 60%),
    radial-gradient(800px 600px at 108% 108%, #34204a 0%, transparent 55%),
    linear-gradient(180deg,var(--navy-1),var(--navy-2));
  background-attachment:fixed;
  color:var(--ink);
  height:100vh;width:100vw;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background 1s ease;
}
body.warm{ --accent:var(--gold); --accent-soft:rgba(227,176,75,.18); }

/* ===== TOP BAR ===== */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:14px 18px 10px;
}
.progress-track{
  flex:1; height:3px; background:rgba(255,255,255,.14); border-radius:3px; overflow:hidden;
}
.progress-fill{
  height:100%; width:4.16%;
  background:linear-gradient(90deg,var(--red),var(--gold));
  transition:width .45s cubic-bezier(.65,0,.35,1);
  border-radius:3px;
}
.topbar .counter{
  font-size:.72rem; font-weight:800; letter-spacing:.04em; color:var(--ink-dim);
  white-space:nowrap; min-width:44px; text-align:right;
}
.close-btn{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.08); border:1px solid var(--line);
  color:var(--ink-dim); text-decoration:none; font-size:.95rem;
  flex-shrink:0; transition:all .2s;
}
.close-btn:hover{ background:rgba(255,255,255,.16); color:#fff; }

/* ===== STAGE ===== */
.stage{
  position:relative; height:100vh; width:100vw;
  display:flex; align-items:center; justify-content:center;
  padding:64px 0 56px;
  touch-action:pan-y;
}
.page{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:20px 22px;
  opacity:0; pointer-events:none;
  transform:translateX(24px) scale(.985);
  transition:opacity .5s ease, transform .5s cubic-bezier(.22,.8,.32,1);
}
.page.active{ opacity:1; pointer-events:auto; transform:translateX(0) scale(1); }
.page.leaving-left{ transform:translateX(-24px) scale(.985); }

.page-inner{
  position:relative; z-index:2;
  max-width:520px; width:100%;
  text-align:center;
}
.icon-wrap{
  position:absolute; z-index:1; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.icon-wrap svg{
  width:min(78vw,420px); height:min(78vw,420px);
  fill:none; stroke:var(--accent); stroke-width:1.4; opacity:.10;
  transition:stroke 1s ease;
}

.kicker{
  font-size:.72rem; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
  color:var(--accent); margin-bottom:14px; transition:color 1s ease;
}
.chapter-title{
  font-family:DORakam,"Anton",sans-serif; font-weight:400; text-transform:uppercase;
  font-size:clamp(1.9rem,7.5vw,2.7rem); line-height:1.05; letter-spacing:.01em;
  margin-bottom:22px; color:#fff;
}
.para{
  font-size:1.02rem; line-height:1.75; color:var(--ink-dim);
  margin-bottom:16px; text-align:left;
}
.para:last-child{ margin-bottom:0; }
.quote{
  font-family:DORakam,"Nunito",sans-serif; font-style:italic; font-weight:600;
  font-size:1.12rem; line-height:1.6; color:var(--ink);
  border-left:3px solid var(--accent); padding:2px 0 2px 16px;
  margin:18px 0; text-align:left; transition:border-color 1s ease;
}
.note{
  margin-top:26px; padding:16px 18px; border-radius:14px;
  background:rgba(227,176,75,.09); border:1px solid rgba(227,176,75,.28);
  text-align:left; font-size:.9rem; line-height:1.6; color:var(--gold-soft);
}
.note b{ display:block; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }

/* ---- COVER (recreation of the original kapak artwork) ---- */
.page.cover-page{
  display:block; padding:0; overflow-y:auto; background:#f4efe3;
}
.cover-scene{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#0c1226; }
.cover-scene svg{ width:100%; height:100%; display:block; }
.cover-scene img{ width:100%; height:100%; object-fit:contain; display:block; }
.cover-textzone{ position:relative; padding:20px 24px 32px; text-align:center; }
.cover-kicker2{ font-size:.64rem; letter-spacing:.3em; text-transform:uppercase; color:var(--red-deep); font-weight:800; margin-bottom:10px; }
.cover-author2{ font-size:.78rem; font-weight:800; letter-spacing:.1em; color:#8a7a5c; margin-bottom:8px; }
.cover-stencil-title{
  font-family:DORakam,"Stardos Stencil",cursive; font-weight:700; text-transform:uppercase;
  color:#c23b36; font-size:clamp(1.65rem,8.2vw,2.5rem); line-height:1.15;
}
.cover-sub2{ margin:16px auto 0; max-width:320px; font-size:.86rem; color:#7a6f5a; }
.cover-btn2{
  margin-top:28px; display:inline-flex; align-items:center; gap:10px;
  background:linear-gradient(135deg,#c23b36,#8e2a26); color:#fff;
  font-family:DORakam,"Nunito",sans-serif; font-weight:800; font-size:.9rem;
  padding:13px 28px; border-radius:30px; border:none; cursor:pointer;
  box-shadow:0 10px 24px rgba(194,59,54,.32);
}

/* ---- TITLE / EPIGRAPH PAGE ---- */
.page.titlepage .chapter-title{ font-size:clamp(1.7rem,6.6vw,2.3rem); }
.author-credit{ margin-top:8px; font-size:.82rem; font-weight:800; letter-spacing:.08em; color:var(--gold-soft); }
.epigraph{
  font-style:italic; font-weight:700; font-size:1.15rem; line-height:1.55;
  color:var(--gold-soft); margin:22px 0 26px;
}
.epigraph::before,.epigraph::after{ content:'"'; color:var(--gold); }

/* ---- NAV ARROWS (desktop) ---- */
.arrow{
  position:fixed; top:50%; transform:translateY(-50%); z-index:40;
  width:42px; height:42px; border-radius:50%;
  background:rgba(255,255,255,.06); border:1px solid var(--line);
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:1.1rem; transition:all .2s;
}
.arrow:hover{ background:rgba(255,255,255,.14); color:#fff; }
.arrow.left{ left:14px; } .arrow.right{ right:14px; }
.arrow.hidden{ opacity:0; pointer-events:none; }
@media (max-width:760px){ .arrow{ display:none; } }

/* ---- SWIPE HINT ---- */
.swipe-hint{
  position:fixed; bottom:16px; left:0; right:0; text-align:center; z-index:40;
  font-size:.72rem; color:var(--ink-dim); letter-spacing:.05em;
  opacity:0; transition:opacity .6s ease; pointer-events:none;
}
.swipe-hint.show{ opacity:.75; }

/* tap zones */
.tapzone{ position:absolute; top:0; bottom:0; width:26%; z-index:5; }
.tapzone.l{ left:0; } .tapzone.r{ right:0; }

function buildPageEl(p, idx){
  const el = document.createElement('div');
  el.className = 'page' + (p.type === 'cover' ? ' cover-page' : '');
  el.dataset.idx = idx;

  let inner = '';
  if(p.icon && p.type !== 'cover'){ inner += `<div class="icon-wrap">${iconSVG(p.icon)}</div>`; }

  if(p.type === 'cover'){
    inner += `
      <div class="cover-scene"><img src="kotuler-kazansin-kapak.jpg" alt="Bırak Son Kez Kötüler Kazansın kapak görseli"></div>
      <div class="cover-textzone">
        <div class="cover-sub2">${p.sub}</div>
        <button class="cover-btn2" id="startBtn">Hikâyeyi Aç ›</button>
      </div>`;
  } else if(p.type === 'titlepage'){
    inner += `<div class="page-inner">
      <div class="chapter-title">${p.title}</div>
      <div class="epigraph">${p.epigraph}</div>
      <div class="author-credit">${p.author}</div>
    </div>`;
  } else {
    let body = '';
    if(p.kicker) body += `<div class="kicker">${p.kicker}</div>`;
    if(p.title) body += `<div class="chapter-title">${p.title}</div>`;
    (p.paragraphs||[]).forEach(seg=>{
      if(seg.q) body += `<div class="quote">${seg.q}</div>`;
      else if(seg.note) body += `<div class="note"><b>Ebeveynlere ve Öğretmenlere Not</b>${seg.note}</div>`;
      else body += `<p class="para">${seg.t}</p>`;
    });
    inner += `<div class="page-inner">${body}</div>`;
  }
  el.innerHTML = inner;
  return el;
}

function render(idx, dir){
  stage.querySelectorAll('.page').forEach(n=>n.remove());
  const el = buildPageEl(PAGES[idx], idx);
  stage.appendChild(el);
  requestAnimationFrame(()=>{ el.classList.add('active'); });

  document.body.classList.toggle('warm', PAGES[idx].mood === 'warm');
  progressFill.style.width = ((idx+1)/total*100) + '%';
  counter.textContent = (idx+1) + ' / ' + total;

  document.getElementById('btnPrev').classList.toggle('hidden', idx===0);
  document.getElementById('btnNext').classList.toggle('hidden', idx===total-1);

  if(idx===0){
    const btn = document.getElementById('startBtn');
    if(btn) btn.addEventListener('click', ()=>go(1));
    swipeHint.classList.remove('show');
    setTimeout(()=>swipeHint.classList.add('show'), 900);
  } else {
    swipeHint.classList.remove('show');
  }
}

function go(step){
  const next = current + step;
  if(next < 0 || next >= total) return;
  current = next;
  render(current);
}

document.getElementById('btnPrev').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.getElementById('tapLeft').addEventListener('click', ()=>go(-1));
document.getElementById('tapRight').addEventListener('click', ()=>go(1));

document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

let touchX = null;
stage.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 45){ go(dx < 0 ? 1 : -1); }
  touchX = null;
}, {passive:true});

render(0);

<script id="indir-sayac">(function(){var son={};function say(yol,baslik){var k=yol;if(son[k]&&Date.now()-son[k]<2000)return;son[k]=Date.now();var n=0;(function dene(){if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:yol,title:baslik,event:true});}else if(n++<20){setTimeout(dene,500);}})();}
function dosyaAdi(a){var d=a.getAttribute('download');if(d)return d;try{var u=new URL(a.href,location.href);if(u.protocol==='blob:'||u.protocol==='data:')return '';return decodeURIComponent(u.pathname.split('/').pop());}catch(e){return '';}}
function bak(a){if(!a||!a.href)return;var ad=dosyaAdi(a);var dl=a.hasAttribute('download');if(!ad&&dl)ad='dosya';if(!/\.(pdf|docx?|pptx?|xlsx?|zip)$/i.test(ad)&&!dl)return;var sayfa=location.pathname.split('/').pop()||'index.html';say('indir/'+(ad||sayfa),'İndirme: '+(ad||sayfa)+' ('+sayfa+')');}
document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;bak(a);},true);
var kc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(!this.isConnected)bak(this);return kc.apply(this,arguments);};
var kd=EventTarget.prototype.dispatchEvent;EventTarget.prototype.dispatchEvent=function(ev){if(this instanceof HTMLAnchorElement&&!this.isConnected&&ev&&ev.type==='click')bak(this);return kd.apply(this,arguments);};
window.addEventListener('beforeprint',function(){var sayfa=location.pathname.split('/').pop()||'index.html';say('yazdir/'+sayfa,'Yazdırma: '+sayfa);});})();</script>
<script src="indirme-sayaci.js" defer></script>
</body>
</html>
