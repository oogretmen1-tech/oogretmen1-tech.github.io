<title>Çizgi Çalışmaları · İnteraktif</title>

<style>
:root{
  --ink:#12263A; --kagit:#FFFFFF; --zemin:#DCE4EC; --sari:#FFC53D;
  --mavi:#2F6F8F; --yesil:#2E9E5B; --kirmizi:#E8503A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--zemin);color:var(--ink);
  font-family:'Andika','Verdana','Segoe UI',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
}
header{
  background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;flex:none;
}
header h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap}
header .yonerge{font-size:14px;opacity:.85;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gez{display:flex;gap:8px;align-items:center}
button{font:inherit;border:0;border-radius:12px;cursor:pointer;background:#fff;color:var(--ink);padding:10px 14px;font-size:15px}
button:active{transform:translateY(1px)}
.gez button{background:#243b52;color:#fff;font-size:20px;width:46px;height:46px;padding:0;border-radius:50%}
.sayac{font-size:14px;opacity:.8;min-width:52px;text-align:center}

.sahne-sar{flex:1;display:grid;place-items:center;padding:10px;min-height:0}
.sahne{position:relative;width:100%;max-width:1200px;aspect-ratio:1000/620;max-height:100%;
  background:var(--kagit);border-radius:16px;box-shadow:0 8px 24px rgba(18,38,58,.2);overflow:hidden}
.sahne svg,.sahne canvas{position:absolute;inset:0;width:100%;height:100%}
.sahne canvas{touch-action:none;cursor:crosshair}

.band{fill:#F4F7FA;stroke:#DDE5EC;stroke-width:2}
.hedef.iz{fill:none;stroke:#A6B2BE;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 15}
.hedef.gizli{fill:none;stroke:none}
.hedef.ipucu{stroke:#FFC53D!important;stroke-width:9;stroke-dasharray:none;opacity:.75}
.ornek{fill:none;stroke:var(--mavi);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.start{fill:var(--yesil)}
.start-yazi{fill:#fff;font-size:14px;font-weight:700;text-anchor:middle}
.ikon{text-anchor:middle}
.db-nokta{fill:var(--ink)}
.db-yazi{fill:var(--ink);font-size:21px;font-weight:700;text-anchor:middle}
.duvar{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.eksen{stroke:var(--kirmizi);stroke-width:3;stroke-dasharray:9 8}
.not{fill:#8C99A6;font-size:19px;text-anchor:middle}

footer{background:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex:none;
  flex-wrap:wrap;box-shadow:0 -3px 14px rgba(18,38,58,.12)}
.renkler{display:flex;gap:8px}
.renk{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #D6DEE6}
.renk.secili{box-shadow:0 0 0 4px var(--ink)}
.kalinlik{display:flex;gap:6px}
.kalinlik button{width:44px;height:40px;background:#EDF2F6;display:grid;place-items:center}
.kalinlik button.secili{background:var(--ink);color:#fff}
.ara{flex:1}
footer .islem{background:#EDF2F6}
footer .islem.vurgu{background:var(--sari)}
.silgi.acik{background:var(--kirmizi);color:#fff}
.imza{width:100%;text-align:center;font-size:12.5px;color:#7C8B99;padding-top:4px;border-top:1px solid #E7EDF2;margin-top:2px}

.mesaj{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.9)}
.mesaj.acik{display:grid}
.mesaj-ic{text-align:center;padding:26px 34px;background:#fff;border-radius:20px;
  box-shadow:0 10px 30px rgba(18,38,58,.25);max-width:80%}
.mesaj-ic .yildizlar{font-size:44px;letter-spacing:6px}
.mesaj-ic h2{margin:8px 0 4px;font-size:26px}
.mesaj-ic p{margin:0 0 16px;font-size:16px;color:#5A6874}
@media (max-width:760px){
  header h1{font-size:16px} header .yonerge{display:none}
  footer{gap:7px} .renk{width:34px;height:34px}
  button{padding:9px 11px;font-size:14px}
}
</style>

const svg = document.getElementById('svg');
const tuval = document.getElementById('tuval');
const ctx = tuval.getContext('2d');
const VW = 1000, VH = 620;

let sira = 0, cizgiler = [], aktif = null, renk = '#2F6F8F', kalin = 7, silgiMod = false;
let ornekNoktalar = [], kapsandi = [];

const RENKLER = ['#2F6F8F', '#E8503A', '#2E9E5B', '#7B4FA8', '#12263A'];
const KALINLIK = [{ad:'İnce', v:5}, {ad:'Orta', v:9}, {ad:'Kalın', v:15}];

document.getElementById('renkler').innerHTML =
  RENKLER.map((r,i)=>`<button class="renk${i===0?' secili':''}" data-renk="${r}" style="background:${r}"></button>`).join('');
document.getElementById('kalinlik').innerHTML =
  KALINLIK.map((k,i)=>`<button data-kalin="${k.v}"${i===1?' class="secili"':''}>${k.ad}</button>`).join('');
document.getElementById('kalinlik').children[1].classList.add('secili');
kalin = 9;

document.getElementById('renkler').addEventListener('click', e => {
  const b = e.target.closest('[data-renk]'); if(!b) return;
  renk = b.dataset.renk; silgiMod = false;
  document.getElementById('silgi').classList.remove('acik');
  [...e.currentTarget.children].forEach(c=>c.classList.remove('secili'));
  b.classList.add('secili');
});
document.getElementById('kalinlik').addEventListener('click', e => {
  const b = e.target.closest('[data-kalin]'); if(!b) return;
  kalin = +b.dataset.kalin;
  [...e.currentTarget.children].forEach(c=>c.classList.remove('secili'));
  b.classList.add('secili');
});

function olcek(){ return tuval.width / VW; }

function boyutla(){
  const r = tuval.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  tuval.width = Math.round(r.width * dpr);
  tuval.height = Math.round(r.height * dpr);
  ciz();
}

function ciz(){
  ctx.clearRect(0,0,tuval.width,tuval.height);
  const s = olcek();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for(const c of cizgiler){
    if(c.nokta.length < 2) {
      ctx.beginPath(); ctx.arc(c.nokta[0].x*s, c.nokta[0].y*s, c.kalin*s/2, 0, 6.3);
      ctx.fillStyle = c.renk; ctx.fill(); continue;
    }
    ctx.beginPath();
    ctx.strokeStyle = c.renk; ctx.lineWidth = c.kalin * s;
    ctx.moveTo(c.nokta[0].x*s, c.nokta[0].y*s);
    for(let i=1;i<c.nokta.length;i++) ctx.lineTo(c.nokta[i].x*s, c.nokta[i].y*s);
    ctx.stroke();
  }
}

function svgNokta(e){
  const r = tuval.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}

function silgiUygula(p){
  const yari = 26;
  cizgiler = cizgiler.filter(c => !c.nokta.some(n => Math.hypot(n.x-p.x, n.y-p.y) < yari));
  ciz();
}

tuval.addEventListener('pointerdown', e => {
  e.preventDefault(); tuval.setPointerCapture(e.pointerId);
  const p = svgNokta(e);
  if(silgiMod){ aktif = 'sil'; silgiUygula(p); return; }
  aktif = { renk, kalin, nokta:[p] };
  cizgiler.push(aktif);
  isaretle(p);
  ciz();
});
tuval.addEventListener('pointermove', e => {
  if(!aktif) return;
  e.preventDefault();
  const p = svgNokta(e);
  if(aktif === 'sil'){ silgiUygula(p); return; }
  const son = aktif.nokta[aktif.nokta.length-1];
  if(Math.hypot(p.x-son.x, p.y-son.y) < 2) return;
  aktif.nokta.push(p);
  isaretle(p);
  ciz();
});
['pointerup','pointercancel','pointerleave'].forEach(t =>
  tuval.addEventListener(t, () => { aktif = null; }));

function isaretle(p){
  for(let i=0;i<ornekNoktalar.length;i++){
    if(kapsandi[i]) continue;
    const o = ornekNoktalar[i];
    if(Math.hypot(o.x-p.x, o.y-p.y) < 26) kapsandi[i] = true;
  }
}

function yukle(i){
  sira = (i + ETK.length) % ETK.length;
  const e = ETK[sira];
  svg.innerHTML = e.svg;
  document.getElementById('ad').textContent = e.ad;
  document.getElementById('yonerge').textContent = e.yonerge;
  document.getElementById('sayac').textContent = (sira+1) + ' / ' + ETK.length;
  document.getElementById('kontrol').style.display = e.kontrol ? '' : 'none';
  document.getElementById('ipucu').style.display = e.kontrol ? '' : 'none';
  cizgiler = []; aktif = null;
  ornekNoktalar = []; kapsandi = [];
  svg.querySelectorAll('.hedef').forEach(el => {
    let uz = 0;
    try { uz = el.getTotalLength(); } catch(err){ return; }
    const adim = 7;
    for(let d=0; d<=uz; d+=adim){
      const pt = el.getPointAtLength(d);
      ornekNoktalar.push({x:pt.x, y:pt.y});
    }
  });
  kapsandi = new Array(ornekNoktalar.length).fill(false);
  ciz();
}

document.getElementById('ileri').onclick = () => yukle(sira+1);
document.getElementById('geri').onclick  = () => yukle(sira-1);
document.getElementById('temizle').onclick = () => {
  cizgiler = []; kapsandi = kapsandi.map(()=>false); ciz();
};
document.getElementById('geri-al').onclick = () => { cizgiler.pop(); ciz(); };
document.getElementById('silgi').onclick = e => {
  silgiMod = !silgiMod;
  e.currentTarget.classList.toggle('acik', silgiMod);
};
document.getElementById('ipucu').onclick = () => {
  const h = svg.querySelectorAll('.hedef');
  h.forEach(el => el.classList.add('ipucu'));
  setTimeout(()=>h.forEach(el=>el.classList.remove('ipucu')), 1600);
};
document.getElementById('mesaj-kapat').onclick = () =>
  document.getElementById('mesaj').classList.remove('acik');

document.getElementById('kontrol').onclick = () => {
  if(!ornekNoktalar.length) return;
  const oran = kapsandi.filter(Boolean).length / ornekNoktalar.length;
  const yuzde = Math.round(oran*100);
  let yildiz = 1, bas = 'Biraz daha dene', alt = 'Çizginin üzerinden geçmeye çalış.';
  if(yuzde >= 90){ yildiz = 3; bas = 'Muhteşem!'; alt = 'Çizgilerin tamamını takip ettin.'; }
  else if(yuzde >= 65){ yildiz = 2; bas = 'Çok iyi!'; alt = 'Birkaç yer eksik kaldı, tamamlayabilirsin.'; }
  document.getElementById('yildizlar').textContent = '★★★☆☆☆'.slice(3-yildiz, 6-yildiz);
  document.getElementById('mesaj-bas').textContent = bas;
  document.getElementById('mesaj-alt').textContent = alt + ' (Tamamlanan: %' + yuzde + ')';
  document.getElementById('mesaj').classList.add('acik');
};

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') yukle(sira+1);
  if(e.key === 'ArrowLeft') yukle(sira-1);
});

window.addEventListener('resize', boyutla);
yukle(0);
boyutla();
</script>
