        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .main-menu {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 40px;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .mode-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 40px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            border: 4px solid transparent;
        }

        .mode-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
            border-color: #fff;
        }

        .mode-card h2 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .mode-card p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .game-screen {
            display: none;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .timer {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-size: 2em;
            min-width: 150px;
            text-align: center;
        }

        .score {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .two-player-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .player-section {
            border: 4px solid #667eea;
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s;
        }

        .player-section.active {
            border-color: #f5576c;
            background: #fff5f8;
            box-shadow: 0 0 30px rgba(245, 87, 108, 0.3);
        }

        .player-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 2.5em;
            font-weight: bold;
            color: #f5576c;
        }

        .flag-container {
            text-align: center;
            margin: 30px 0;
        }

        .flag {
            width: 400px;
            height: 270px;
            border: 5px solid #333;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            object-fit: cover;
            margin: 0 auto;
            display: block;
            background: white;
        }

        .question-number {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            border: 3px solid #667eea;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
        }

        .option-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .option-btn.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
            animation: correctPulse 0.5s;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
            animation: wrongShake 0.5s;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 4em;
            font-weight: bold;
            color: #f5576c;
            margin: 20px 0;
        }

        .result-details {
            background: #f0f0f0;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.3em;
        }

        .result-detail {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 2px solid #ddd;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            margin: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .back-btn {
            background: #666;
            padding: 15px 30px;
            font-size: 1.2em;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        .difficulty-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: 3px solid #667eea;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty-btn.selected {
            background: #667eea;
            color: white;
        }

        .streak-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff9800;
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 152, 0, 0.4);
            display: none;
        }

        @media (max-width: 768px) {
            .flag {
                width: 100%;
                max-width: 350px;
                height: auto;
            }

            .two-player-layout {
                grid-template-columns: 1fr;
            }

            .options {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ana Menü -->
        <div id="main-menu" class="main-menu">
            <h1>🏁 Bayrak Yarışı 🏁</h1>
            <p class="subtitle">Dünyadan 195 ülke bayrağını tahmin et!</p>
            
            <div class="mode-selection">
                <div class="mode-card" onclick="startGame('single')">
                    <h2>⏱️</h2>
                    <h3>Tekli Oyun</h3>
                    <p>Süreye karşı yarış! 60 saniyede kaç bayrağı doğru tahmin edebilirsin?</p>
                </div>
                
                <div class="mode-card" onclick="startGame('versus')">
                    <h2>⚔️</h2>
                    <h3>İkili Oyun</h3>
                    <p>Arkadaşınla yarış! İlk 10 puanı alan kazanır!</p>
                </div>
            </div>
        </div>

        <!-- Oyun Ekranı -->
        <div id="game-screen" class="game-screen">
            <div class="game-header">
                <div class="game-info">
                    <button class="btn-primary back-btn" onclick="backToMenu()">◀ Geri</button>
                    <div class="info-box timer" id="timer">60</div>
                    <div class="info-box score" id="score">Skor: 0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress">0%</div>
                </div>
            </div>

            <div class="game-area">
                <!-- Tekli Oyun İçeriği -->
                <div id="single-game">
                    <div class="question-number" id="question-num">Soru 1</div>
                    <div class="flag-container">
                        <img class="flag" id="flag-img" src="" alt="Bayrak">
                    </div>
                    <div class="options" id="options"></div>
                </div>

                <!-- İkili Oyun İçeriği -->
                <div id="versus-game" style="display: none;">
                    <div class="question-number" id="versus-question-num">Soru 1</div>
                    <div class="flag-container">
                        <img class="flag" id="versus-flag-img" src="" alt="Bayrak">
                    </div>
                    
                    <div class="two-player-layout">
                        <div class="player-section active" id="player1-section">
                            <div class="player-header">
                                <div class="player-name">👤 Oyuncu 1</div>
                                <div class="player-score" id="player1-score">0</div>
                            </div>
                            <div class="options" id="player1-options"></div>
                        </div>

                        <div class="player-section" id="player2-section">
                            <div class="player-header">
                                <div class="player-name">👤 Oyuncu 2</div>
                                <div class="player-score" id="player2-score">0</div>
                            </div>
                            <div class="options" id="player2-options"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sonuç Ekranı -->
        <div id="result-screen" class="main-menu result-screen">
            <div class="result-title" id="result-title">🏆 Tebrikler! 🏆</div>
            <div class="final-score" id="final-score">0 Puan</div>
            <div class="result-details" id="result-details"></div>
            <button class="btn-primary" onclick="backToMenu()">🏠 Ana Menü</button>
            <button class="btn-primary" onclick="restartGame()">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <div class="streak-indicator" id="streak">🔥 Seri: 0</div>

            { name: 'Barbados', code: 'bb', region: 'Amerika' },
            { name: 'Bahamas', code: 'bs', region: 'Amerika' },
            { name: 'Grenada', code: 'gd', region: 'Amerika' },
            { name: 'Saint Lucia', code: 'lc', region: 'Amerika' },
            { name: 'Saint Vincent', code: 'vc', region: 'Amerika' },
            { name: 'Dominika', code: 'dm', region: 'Amerika' },
            { name: 'Antigua ve Barbuda', code: 'ag', region: 'Amerika' },
            { name: 'Saint Kitts ve Nevis', code: 'kn', region: 'Amerika' },
            
            // Okyanusya
            { name: 'Avustralya', code: 'au', region: 'Okyanusya' },
            { name: 'Yeni Zelanda', code: 'nz', region: 'Okyanusya' },
            { name: 'Papua Yeni Gine', code: 'pg', region: 'Okyanusya' },
            { name: 'Fiji', code: 'fj', region: 'Okyanusya' },
            { name: 'Samoa', code: 'ws', region: 'Okyanusya' },
            { name: 'Solomon Adaları', code: 'sb', region: 'Okyanusya' },
            { name: 'Vanuatu', code: 'vu', region: 'Okyanusya' },
            { name: 'Tonga', code: 'to', region: 'Okyanusya' },
            { name: 'Mikronezya', code: 'fm', region: 'Okyanusya' },
            { name: 'Kiribati', code: 'ki', region: 'Okyanusya' },
            { name: 'Marshall Adaları', code: 'mh', region: 'Okyanusya' },
            { name: 'Palau', code: 'pw', region: 'Okyanusya' },
            { name: 'Nauru', code: 'nr', region: 'Okyanusya' },
            { name: 'Tuvalu', code: 'tv', region: 'Okyanusya' }
        ];

        let gameMode = '';
        let currentQuestion = 0;
        let score = 0;
        let timer = 60;
        let timerInterval;
        let correctAnswer = '';
        let usedCountries = [];
        let totalQuestions = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let streak = 0;
        let maxStreak = 0;
        
        // İkili oyun için
        let player1Score = 0;
        let player2Score = 0;
        let currentPlayer = 1;

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            // Reset
            currentQuestion = 0;
            score = 0;
            player1Score = 0;
            player2Score = 0;
            currentPlayer = 1;
            usedCountries = [];
            correctAnswers = 0;
            wrongAnswers = 0;
            totalQuestions = 0;
            streak = 0;
            maxStreak = 0;
            
            if (mode === 'single') {
                timer = 60;
                document.getElementById('single-game').style.display = 'block';
                document.getElementById('versus-game').style.display = 'none';
                document.getElementById('timer').style.display = 'block';
                startTimer();
                loadQuestion();
            } else {
                document.getElementById('single-game').style.display = 'none';
                document.getElementById('versus-game').style.display = 'block';
                document.getElementById('timer').style.display = 'none';
                document.getElementById('score').textContent = 'İlk 10 puana ulaşan kazanır!';
                loadVersusQuestion();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer').textContent = timer + 's';
                
                if (timer <= 10) {
                    document.getElementById('timer').style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%)';
                }
                
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function getRandomCountries(count) {
            const available = countries.filter(c => !usedCountries.includes(c.code));
            
            if (available.length < count) {
                usedCountries = [];
                return getRandomCountries(count);
            }
            
            const shuffled = available.sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        function loadQuestion() {
            currentQuestion++;
            totalQuestions++;
            
            const selected = getRandomCountries(4);
            correctAnswer = selected[0];
            usedCountries.push(correctAnswer.code);
            
            const shuffled = selected.sort(() => Math.random() - 0.5);
            
            document.getElementById('question-num').textContent = `Soru ${currentQuestion}`;
            document.getElementById('flag-img').src = `https://flagcdn.com/w640/${correctAnswer.code}.png`;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            shuffled.forEach(country => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = country.name;
                btn.onclick = () => checkAnswer(country, btn);
                optionsContainer.appendChild(btn);
            });
            
            updateProgress();
        }

        function loadVersusQuestion() {
            currentQuestion++;
            totalQuestions++;
            
            const selected = getRandomCountries(4);
            correctAnswer = selected[0];
            usedCountries.push(correctAnswer.code);
            
            const shuffled = selected.sort(() => Math.random() - 0.5);
            
            document.getElementById('versus-question-num').textContent = `Soru ${currentQuestion}`;
            document.getElementById('versus-flag-img').src = `https://flagcdn.com/w640/${correctAnswer.code}.png`;
            
            // Her iki oyuncu için de aynı seçenekleri göster
            ['player1', 'player2'].forEach(player => {
                const optionsContainer = document.getElementById(`${player}-options`);
                optionsContainer.innerHTML = '';
                
                shuffled.forEach(country => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = country.name;
                    btn.onclick = () => checkVersusAnswer(player, country, btn);
                    optionsContainer.appendChild(btn);
                });
            });
            
            updateProgress();
        }

        function checkAnswer(country, btn) {
            const allBtns = document.querySelectorAll('#options .option-btn');
            allBtns.forEach(b => b.disabled = true);
            
            if (country.code === correctAnswer.code) {
                btn.classList.add('correct');
                score += 10;
                correctAnswers++;
                streak++;
                maxStreak = Math.max(maxStreak, streak);
                
                if (streak >= 3) {
                    document.getElementById('streak').textContent = `🔥 Seri: ${streak}`;
                    document.getElementById('streak').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('streak').style.display = 'none';
                    }, 2000);
                }
            } else {
                btn.classList.add('wrong');
                wrongAnswers++;
                streak = 0;
                
                // Doğru cevabı göster
                allBtns.forEach(b => {
                    if (b.textContent === correctAnswer.name) {
                        b.classList.add('correct');
                    }
                });
            }
            
            document.getElementById('score').textContent = `Skor: ${score}`;
            
            setTimeout(() => {
                if (timer > 0) {
                    loadQuestion();
                }
            }, 1500);
        }

        function checkVersusAnswer(player, country, btn) {
            const playerNum = player === 'player1' ? 1 : 2;
            
            // Sadece aktif oyuncu cevap verebilir
            if (playerNum !== currentPlayer) return;
            
            const allBtns = document.querySelectorAll(`#${player}-options .option-btn`);
            allBtns.forEach(b => b.disabled = true);
            
            if (country.code === correctAnswer.code) {
                btn.classList.add('correct');
                
                if (player === 'player1') {
                    player1Score++;
                    document.getElementById('player1-score').textContent = player1Score;
                } else {
                    player2Score++;
                    document.getElementById('player2-score').textContent = player2Score;
                }
                
                correctAnswers++;
                score += 10;
            } else {
                btn.classList.add('wrong');
                wrongAnswers++;
                
                // Doğru cevabı göster
                allBtns.forEach(b => {
                    if (b.textContent === correctAnswer.name) {
                        b.classList.add('correct');
                    }
                });
            }
            
            // Oyuncu değiştir
            setTimeout(() => {
                if (player1Score >= 10 || player2Score >= 10) {
                    endVersusGame();
                } else {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    updateActivePlayer();
                    loadVersusQuestion();
                }
            }, 1500);
        }

        function updateActivePlayer() {
            if (currentPlayer === 1) {
                document.getElementById('player1-section').classList.add('active');
                document.getElementById('player2-section').classList.remove('active');
            } else {
                document.getElementById('player1-section').classList.remove('active');
                document.getElementById('player2-section').classList.add('active');
            }
        }

        function updateProgress() {
            const progress = (correctAnswers / totalQuestions) * 100;
            const progressBar = document.getElementById('progress');
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const accuracy = totalQuestions > 0 ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
            
            document.getElementById('result-title').textContent = score >= 100 ? '🏆 Muhteşem! 🏆' : score >= 50 ? '👏 İyi İş! 👏' : '💪 Tekrar Dene! 💪';
            document.getElementById('final-score').textContent = score + ' Puan';
            
            document.getElementById('result-details').innerHTML = `
                <div class="result-detail">
                    <span>📊 Toplam Soru:</span>
                    <span>${totalQuestions}</span>
                </div>
                <div class="result-detail">
                    <span>✅ Doğru Cevap:</span>
                    <span>${correctAnswers}</span>
                </div>
                <div class="result-detail">
                    <span>❌ Yanlış Cevap:</span>
                    <span>${wrongAnswers}</span>
                </div>
                <div class="result-detail">
                    <span>🎯 Doğruluk Oranı:</span>
                    <span>${accuracy}%</span>
                </div>
                <div class="result-detail">
                    <span>🔥 En Uzun Seri:</span>
                    <span>${maxStreak}</span>
                </div>
                <div class="result-detail">
                    <span>⏱️ Süre:</span>
                    <span>${60 - timer} saniye</span>
                </div>
            `;
        }

        function endVersusGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const winner = player1Score >= 10 ? 1 : 2;
            const accuracy = totalQuestions > 0 ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
            
            document.getElementById('result-title').textContent = `🏆 Oyuncu ${winner} Kazandı! 🏆`;
            document.getElementById('final-score').textContent = `${player1Score} - ${player2Score}`;
            
            document.getElementById('result-details').innerHTML = `
                <div class="result-detail">
                    <span>👤 Oyuncu 1 Skoru:</span>
                    <span>${player1Score}</span>
                </div>
                <div class="result-detail">
                    <span>👤 Oyuncu 2 Skoru:</span>
                    <span>${player2Score}</span>
                </div>
                <div class="result-detail">
                    <span>📊 Toplam Soru:</span>
                    <span>${totalQuestions}</span>
                </div>
                <div class="result-detail">
                    <span>✅ Doğru Cevap:</span>
                    <span>${correctAnswers}</span>
                </div>
                <div class="result-detail">
                    <span>❌ Yanlış Cevap:</span>
                    <span>${wrongAnswers}</span>
                </div>
                <div class="result-detail">
                    <span>🎯 Doğruluk Oranı:</span>
                    <span>${accuracy}%</span>
                </div>
            `;
        }

        function backToMenu() {
            clearInterval(timerInterval);
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
        }

        function restartGame() {
            document.getElementById('result-screen').style.display = 'none';
            startGame(gameMode);
        }
    </script>
</body>
</html>
