<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkçe Sözlük</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-edge:#FFFFFF;
    --ink:#2B2118;
    --ink-soft:#5A4B3B;
    --red:#B5231F;
    --red-deep:#8C1A17;
    --gold:#B4903F;
    --line:#E7D9D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #C22823 0%, transparent 60%),
      var(--red);
    font-family:'Source Sans 3', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .book{
    width:100%;
    max-width:760px;
    position:relative;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  .kicker{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#FFD9D7;
    font-weight:700;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:44px;
    margin:6px 0 4px;
    color:#FFFFFF;
  }
  .sub{
    color:#FBE4E3;
    font-size:15px;
  }

  /* --- Alphabet tab rail: the signature element --- */
  .rail-wrap{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .rail{
    display:flex;
    flex-direction:column;
    flex-wrap:wrap;
    max-height:520px;
    gap:3px;
    padding-right:4px;
  }
  .tab{
    font-family:'Fraunces', serif;
    font-size:12px;
    font-weight:700;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    color:var(--red);
    border:1px solid #FFFFFF;
    border-left:none;
    border-radius:0 5px 5px 0;
    cursor:pointer;
    transition:all .15s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .tab:hover{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold);
    transform:translateX(2px);
  }

  main{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 1px 0 var(--line), 0 14px 30px -18px rgba(43,33,24,.35);
    padding:26px;
    min-height:520px;
    position:relative;
  }
  main::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:linear-gradient(var(--gold), var(--red));
    border-radius:4px 0 0 4px;
    opacity:.55;
  }

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  input[type=text]{
    flex:1;
    font-family:'Fraunces', serif;
    font-size:20px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type=text]:focus{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(140,47,42,.12);
  }
  button.go{
    font-family:'Source Sans 3', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.03em;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:0 22px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button.go:hover{background:var(--red-deep);}
  button.go:disabled{background:#c9b9a3; cursor:default;}

  #status{
    color:var(--ink-soft);
    font-size:14px;
    min-height:20px;
    margin-bottom:6px;
  }

  .entry-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:1px dashed var(--line);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  .entry-word{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:34px;
    color:var(--red);
  }
  .entry-origin{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  ol.meanings{
    margin:0;
    padding-left:22px;
  }
  ol.meanings li{
    margin-bottom:14px;
    line-height:1.55;
  }
  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:1px 8px;
    margin-right:8px;
    vertical-align:middle;
  }
  .example{
    display:block;
    margin-top:4px;
    color:var(--ink-soft);
    font-style:italic;
    font-size:14.5px;
  }
  .example::before{content:"“"; }
  .example::after{content:"”"; }

  .suggestions{
    margin-top:6px;
  }
  .suggestions .chip{
    display:inline-block;
    background:var(--paper-edge);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:20px;
    padding:4px 12px;
    margin:4px 6px 0 0;
    font-size:14px;
    cursor:pointer;
  }
  .suggestions .chip:hover{border-color:var(--red); color:var(--red);}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:60px 10px;
  }
  .empty .big{
    font-family:'Fraunces', serif;
    font-size:26px;
    color:var(--ink);
    margin-bottom:8px;
  }

  footer{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:#FBE4E3;
    opacity:.85;
  }

  @media (max-width:600px){
    .rail{max-height:400px;}
    h1{font-size:32px;}
    .entry-word{font-size:26px;}
  }
</style>
</head>
<body>

    <div class="kicker">Güncel Türkçe Sözlük</div>

    <main>
      <div class="search-row">

        <button class="go" id="searchBtn">Ara</button>

      <div id="result">

        </div>

const SAMPLE_WORDS = {
  A:"armut", B:"balık", C:"cam", Ç:"çınar", D:"deniz", E:"elma", F:"fener",

const rail = document.getElementById('rail');
ALPHABET.forEach(letter=>{
  const btn = document.createElement('div');
  btn.className = 'tab';

  btn.addEventListener('click', ()=>{
    input.value = SAMPLE_WORDS[letter];
    search(SAMPLE_WORDS[letter]);
  });
  rail.appendChild(btn);
});

const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

btn.addEventListener('click', ()=> search(input.value));
input.addEventListener('keydown', e=>{ if(e.key === 'Enter') search(input.value); });

function turkishLower(str){
  return str
    .replace(/İ/g,'i').replace(/I/g,'ı')
    .toLocaleLowerCase('tr');
}

// TDK'nin API'si tarayıcıdan doğrudan çağrılara CORS izni vermiyor.
// Önce doğrudan denenir, olmazsa bir CORS proxy üzerinden tekrar denenir.
async function fetchJson(targetUrl){
  try{
    const res = await fetch(targetUrl);
    if(!res.ok) throw new Error('direct-failed');
    return await res.json();
  }catch(e){
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
    const res2 = await fetch(proxied);
    if(!res2.ok) throw new Error('proxy-failed');
    return await res2.json();
  }
}

async function search(raw){
  const word = (raw||'').trim();
  if(!word){ return; }
  btn.disabled = true;
  statusEl.textContent = "Aranıyor…";
  resultEl.innerHTML = '';

  try{
    const data = await fetchJson('https://sozluk.gov.tr/gts?ara=' + encodeURIComponent(word));

    if(Array.isArray(data) && data.length && data[0].madde){
      renderEntries(data);
      statusEl.textContent = '';
    } else {
      await renderSuggestions(word);
    }
  }catch(err){
    const offlineHit = OFFLINE_DICT[turkishLower(word)];
    if(offlineHit){
      renderOffline(word, offlineHit);
      statusEl.textContent = '';
    } else {
      statusEl.textContent = '';
      resultEl.innerHTML = `
        <div class="empty">
          <div class="big">🚧 Sözlüğe şu an ulaşılamadı</div>
          TDK sözlüğüne şu anda erişilemiyor ve bu kelime çevrimdışı listede de yok.
          Birkaç saniye sonra tekrar dener misin? Sorun devam ederse
          <a href="https://sozluk.gov.tr/?ara=${encodeURIComponent(word)}" target="_blank" rel="noopener">sozluk.gov.tr</a>
          adresinden bakabilirsin.
        </div>`;
    }
  }finally{
    btn.disabled = false;
  }
}

function renderOffline(word, meaning){
  resultEl.innerHTML = `
    <div>
      <div class="entry-head">
        <span class="entry-word">${word}</span>
        <span class="entry-origin">(çevrimdışı sözlük)</span>
      </div>
      <ol class="meanings"><li>${meaning}</li></ol>
    </div>`;
}

async function renderSuggestions(word){
  try{
    const data = await fetchJson('https://sozluk.gov.tr/oneri?soz=' + encodeURIComponent(word));
    if(Array.isArray(data) && data.length){
      const chips = data.slice(0,12).map(o=>`<span class="chip">${o.madde}</span>`).join('');
      resultEl.innerHTML = `
        <div class="empty">
          <div class="big">🔎 "${word}" bulunamadı</div>
          Şunu mu demek istedin?
          <div class="suggestions">${chips}</div>
        </div>`;
      resultEl.querySelectorAll('.chip').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          input.value = chip.textContent;
          search(chip.textContent);
        });
      });
      return;
    }
  }catch(e){ /* ignore, fall through */ }

  resultEl.innerHTML = `
    <div class="empty">
      <div class="big">🔎 "${word}" bulunamadı</div>
      Yazımı kontrol edip tekrar dener misin?
    </div>`;
}

function renderEntries(entries){
  const html = entries.map(entry=>{
    const origin = entry.lisan ? `<span class="entry-origin">(${entry.lisan})</span>` : '';
    const meanings = (entry.anlamlarListe || []).map(m=>{
      const tag = m.ozelliklerListe && m.ozelliklerListe.length
        ? `<span class="tag">${m.ozelliklerListe.map(o=>o.tam_adi).join(', ')}</span>`
        : '';
      const example = m.orneklerListe && m.orneklerListe.length
        ? `<span class="example">${m.orneklerListe[0].ornek}</span>`
        : '';
      return `<li>${tag}${m.anlam}${example}</li>`;
    }).join('');

    return `
      <div>
        <div class="entry-head">
          <span class="entry-word">${entry.madde}</span>
          ${origin}
        </div>
        <ol class="meanings">${meanings}</ol>
      </div>`;
  }).join('<hr style="border:none;border-top:1px dashed var(--line);margin:22px 0;">');

  resultEl.innerHTML = html;
}
</script>
</body>
</html>
