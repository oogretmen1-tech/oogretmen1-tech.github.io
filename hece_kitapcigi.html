<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hece Kitapçığı | 1. Sınıf İlk Okuma Yazma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* ===== Andika yazi sistemi - klasik (tek katli) a ===== */
:root{
  --yazi:'Andika','Segoe UI',Arial,sans-serif;
  --renk:#E8503A; --renk2:#FF8E53; --tint:#FFF2EC;
  --metin:#2C2C3A; --soluk:#8A8A9E;
}
html,body,button,input,select,textarea,h1,h2,h3,h4,h5,h6,p,span,div,li,td,th,label,a,strong,b,em,small,summary,option{font-family:var(--yazi);}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#F4F6FB;
  color:var(--metin);
  padding-bottom:90px;
  -webkit-text-size-adjust:100%;
}

/* ---------- ust baslik ---------- */
header{
  background:linear-gradient(135deg,#5B4BE0 0%,#8E5BE8 45%,#2FA8E0 100%);
  color:#fff;text-align:center;padding:26px 16px 22px;
  border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(60,40,150,.25);
}
header h1{font-size:1.6rem;letter-spacing:.5px;}
header p{font-size:.92rem;opacity:.93;margin-top:5px;}
.ilerleme-kutu{max-width:420px;margin:14px auto 0;}
.ilerleme-cubuk{height:10px;background:rgba(255,255,255,.3);border-radius:20px;overflow:hidden;}
.ilerleme-dolu{height:100%;width:0;background:#FFD93D;border-radius:20px;transition:width .35s;}
.ilerleme-yazi{font-size:.78rem;margin-top:6px;opacity:.95;}

/* ---------- ayar cubugu ---------- */
.ayarlar{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:12px 10px;background:#fff;margin:0 auto;
  border-bottom:1px solid #ECECF4;
}
.ayar-btn{
  border:2px solid #E4E4F0;background:#fff;color:#555;
  border-radius:20px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;
  transition:.15s;
}
.ayar-btn.acik{background:#5B4BE0;border-color:#5B4BE0;color:#fff;}
.ayar-btn:active{transform:scale(.95);}

/* ---------- menu ---------- */
nav.menu{
  position:sticky;top:0;z-index:60;background:#fff;
  padding:10px 8px;box-shadow:0 3px 12px rgba(40,40,90,.10);
}
.menu-satir{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:5px;}
.menu-satir:last-child{margin-bottom:0;}
.menu-harf{
  width:34px;height:34px;border:none;border-radius:12px;
  background:var(--mrenk);color:#fff;font-weight:700;font-size:.92rem;
  cursor:pointer;transition:transform .15s;opacity:.88;
}
.menu-harf:hover,.menu-harf:active{transform:scale(1.15);opacity:1;}
.menu-harf.bitti::after{content:"✓";position:absolute;}

/* ---------- grup ayraci ---------- */
.grup-ayrac{
  max-width:600px;margin:26px auto 6px;padding:14px 18px;
  border-radius:20px;color:#fff;text-align:center;
  background:linear-gradient(135deg,var(--renk),var(--renk2));
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}
.grup-ayrac h3{font-size:1.05rem;}
.grup-ayrac span{font-size:.85rem;opacity:.95;letter-spacing:3px;font-weight:700;}

/* ---------- sayfa ---------- */
.sayfa{
  max-width:600px;margin:18px auto;background:#fff;border-radius:26px;
  padding:20px 16px 24px;box-shadow:0 8px 22px rgba(40,40,90,.10);
  border-top:10px solid var(--renk);
  scroll-margin-top:120px;
}
.sayfa-ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.grup-etiket{
  background:var(--renk);color:#fff;font-size:.7rem;font-weight:700;
  padding:5px 12px;border-radius:20px;letter-spacing:1px;
}
.sayfa-no{color:var(--soluk);font-size:.76rem;font-weight:700;}

.harf-baslik{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px;}
.harf-btn{
  border:none;cursor:pointer;border-radius:18px;color:#fff;font-weight:700;
  background:linear-gradient(135deg,var(--renk),var(--renk2));
  box-shadow:0 6px 14px rgba(0,0,0,.18);
}
.harf-buyuk{font-size:2.6rem;width:70px;height:82px;}
.harf-kucuk{font-size:2.2rem;width:62px;height:82px;opacity:.9;}
.harf-adi{color:var(--soluk);font-size:.9rem;font-weight:700;}
.harf-btn:active{transform:scale(.92);}
.ogrenilen-serit{
  text-align:center;font-size:.72rem;color:var(--soluk);font-weight:700;
  background:var(--tint);border-radius:14px;padding:7px 10px;margin:10px 0 4px;
  line-height:1.6;
}

.bolum{margin-top:18px;}
.bolum-basligi{
  display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;
  color:var(--renk);margin-bottom:9px;padding-bottom:6px;border-bottom:2px dashed var(--tint);
}
.izgara{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.hece-btn{
  border:none;border-radius:14px;padding:12px 4px;cursor:pointer;
  background:var(--tint);color:var(--metin);font-weight:700;font-size:1.15rem;
  box-shadow:0 2px 6px rgba(0,0,0,.05);transition:.12s;
}
.hece-btn:active{transform:scale(.93);background:var(--renk);color:#fff;}

.kelime-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.kelime-kart{
  background:#FBFBFF;border:2px solid var(--tint);border-radius:16px;
  padding:10px 4px;text-align:center;cursor:pointer;transition:.12s;
}
.kelime-kart:active{transform:scale(.95);border-color:var(--renk);}
.kelime-emoji{font-size:1.9rem;line-height:1.2;}
.kelime-yazi{font-weight:700;font-size:1.02rem;margin-top:4px;word-break:break-word;}
.h1r{color:var(--renk);}
.h2r{color:#3C7DD9;}

.birlestir{display:flex;flex-direction:column;gap:8px;}
.birlestir-satir{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  background:var(--tint);border-radius:16px;padding:9px 6px;
}
.parca{background:#fff;border:2px solid var(--renk);color:var(--renk);
  border-radius:12px;padding:5px 12px;font-weight:700;font-size:1rem;cursor:pointer;}
.isaret{font-weight:700;color:var(--soluk);}
.sonuc{background:var(--renk);color:#fff;border:none;border-radius:12px;
  padding:6px 14px;font-weight:700;font-size:1.05rem;cursor:pointer;}

.bilgi{background:var(--tint);border-radius:16px;padding:14px;text-align:center;
  font-size:.9rem;font-weight:700;color:var(--metin);line-height:1.6;}
.cumle-kutu{
  background:#FFFDF3;border-left:6px solid #FFD93D;border-radius:12px;
  padding:11px 14px;margin-bottom:8px;font-size:1.08rem;font-weight:700;cursor:pointer;
}
.cumle-kutu:active{background:#FFF7D6;}

.karisik-alan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px;}
.yenile-btn{
  width:100%;border:2px dashed var(--renk);background:#fff;color:var(--renk);
  border-radius:14px;padding:9px;font-weight:700;font-size:.85rem;cursor:pointer;
}
.yenile-btn:active{background:var(--tint);}

.okudum-btn{
  width:100%;margin-top:18px;border:none;border-radius:16px;padding:12px;
  background:#EFEFF7;color:#7A7A92;font-weight:700;font-size:.92rem;cursor:pointer;
}
.okudum-btn.tamam{background:#2FB380;color:#fff;}

.sayfa-gezinti{display:flex;justify-content:space-between;gap:8px;margin-top:12px;}
.gez-btn{
  flex:1;border:none;border-radius:14px;padding:10px;background:var(--tint);
  color:var(--renk);font-weight:700;font-size:.82rem;cursor:pointer;
}
.gez-btn:disabled{opacity:.35;}

footer{text-align:center;color:#9A9AB0;font-size:.78rem;padding:26px 16px;}
.yukari-btn{
  position:fixed;bottom:18px;right:18px;width:52px;height:52px;border-radius:50%;
  background:#5B4BE0;color:#fff;border:none;font-size:1.3rem;
  box-shadow:0 6px 14px rgba(0,0,0,.25);cursor:pointer;z-index:70;
}
body.buyukharf .hece-btn,body.buyukharf .kelime-yazi,body.buyukharf .parca,
body.buyukharf .sonuc,body.buyukharf .bilgi{background:var(--tint);border-radius:16px;padding:14px;text-align:center;
  font-size:.9rem;font-weight:700;color:var(--metin);line-height:1.6;}
.cumle-kutu{text-transform:uppercase;}
body.renksiz .h1r,body.renksiz .h2r{color:var(--metin);}

@media (max-width:400px){
  .izgara,.karisik-alan{grid-template-columns:repeat(3,1fr);}
  .kelime-izgara{grid-template-columns:repeat(2,1fr);}
  header h1{font-size:1.35rem;}
}
@media print{
  nav.menu,.ayarlar,.yukari-btn,.okudum-btn,.sayfa-gezinti,.yenile-btn,.ilerleme-kutu{display:none;}
  .sayfa{break-inside:avoid;box-shadow:none;border:1px solid #ddd;margin:8px auto;}
  body{background:#fff;}
}
</style>
</head>

  renkAcik = !renkAcik;
  document.body.classList.toggle("renksiz", !renkAcik);
  document.getElementById("btnRenk").classList.toggle("acik", renkAcik);
}
function hizDegis(){
  const b = document.getElementById("btnHiz");
  if(hiz === 0.7){ hiz = 1.0; b.textContent = "🐇 Ses: Normal"; }
  else { hiz = 0.7; b.textContent = "🐢 Ses: Yavaş"; }
}

function heceli(hec){
  return hec.map((h,i) => '<span class="' + (i%2===0 ? "h1r":"h2r") + '">' + h + '</span>').join("");
}
function esc(s){ return s.replace(/'/g,"\\'"); }

function karisikUret(sayfa){
  const ogr = sayfa.ogrenilen;
  const unluler = ogr.filter(x => UNLU.includes(x));
  const unsuzler = ogr.filter(x => !UNLU.includes(x));
  let liste = [];
  unsuzler.forEach(c => { if(c !== "ğ") unluler.forEach(v => liste.push(c+v)); });
  unluler.forEach(v => unsuzler.forEach(c => liste.push(v+c)));
  liste = [...new Set(liste)];
  for(let i = liste.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [liste[i], liste[j]] = [liste[j], liste[i]];
  }
  return liste.slice(0, 8);
}
function karisikYenile(no){
  const s = VERI.sayfalar[no-1];
  const alan = document.getElementById("karisik-" + no);
  alan.innerHTML = karisikUret(s).map(h =>
    '<button class="hece-btn" onclick="seslendir(\'' + h + '\')">' + h + '</button>').join("");
}

function okuduml(no){
  okunan[no] = !okunan[no];
  kaydet();
  guncelle();
}
function guncelle(){
  VERI.sayfalar.forEach(s => {
    const b = document.getElementById("okudum-" + s.no);
    if(!b) return;
    const t = !!okunan[s.no];
    b.classList.toggle("tamam", t);
    b.textContent = t ? "✓ Bu sayfayı okudum" : "☐ Bu sayfayı okudum olarak işaretle";
  });
  const adet = VERI.sayfalar.filter(s => okunan[s.no]).length;
  document.getElementById("dolu").style.width = (adet / VERI.sayfalar.length * 100) + "%";
  document.getElementById("ilerlemeYazi").textContent = adet + " / " + VERI.sayfalar.length + " sayfa okundu";
}
function git(no){
  const el = document.getElementById("sayfa-" + no);
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- menu ---------- */
let menuHtml = "";
VERI.gruplar.forEach((g, gi) => {
  const harfler = VERI.sayfalar.filter(s => s.grup === gi);
  menuHtml += '<div class="menu-satir">' + harfler.map(s =>
    '<button class="menu-harf" style="--mrenk:' + g.renk + '" onclick="git(' + s.no + ')">' + s.H + '</button>'
  ).join("") + '</div>';
});
document.getElementById("menu").innerHTML = menuHtml;

/* ---------- sayfalar ---------- */
let html = "";
VERI.sayfalar.forEach((s, idx) => {
  const g = VERI.gruplar[s.grup];
  if(idx === 0 || VERI.sayfalar[idx-1].grup !== s.grup){
    html += '<div class="grup-ayrac" style="--renk:' + g.renk + ';--renk2:' + g.renk2 + '">' +
            '<h3>' + g.no + '. Ses Grubu</h3><span>' + g.harflerB + '</span></div>';
  }

  let ic = "";
  ic += '<div class="sayfa-ust"><span class="grup-etiket">' + g.ad + ' Grubu</span>' +
        '<span class="sayfa-no">' + s.no + ' / ' + VERI.sayfalar.length + '</span></div>';
  ic += '<div class="harf-baslik">' +
        '<button class="harf-btn harf-buyuk" onclick="seslendir(\'' + s.h + '\')">' + s.H + '</button>' +
        '<button class="harf-btn harf-kucuk" onclick="seslendir(\'' + s.h + '\')">' + s.h + '</button>' +
        '<span class="harf-adi">sesi</span></div>';
  ic += '<div class="ogrenilen-serit">Bildiğimiz harfler: ' +
        s.ogrenilen.join(" · ") + '</div>';

  if(s.sesibul.length){
    ic += '<div class="bolum"><div class="bolum-basligi">🔎 Sesi Bul — resme dokun, adını söyle</div>' +
      '<div class="kelime-izgara">' + s.sesibul.map(o =>
        '<div class="kelime-kart" onclick="seslendir(\'' + esc(o.k) + '\')"><div class="kelime-emoji">' + o.e + '</div></div>'
      ).join("") + '</div></div>';
  }
  if(!s.acik.length && !s.kapali.length){
    ic += '<div class="bolum"><div class="bilgi">Bu sayfada yalnızca <b>' + s.h +
          '</b> sesini tanıyoruz.<br>Hece kurmak için ikinci harfi bekliyoruz. 🙂</div></div>';
  }
  if(s.acik.length){
    ic += '<div class="bolum"><div class="bolum-basligi">🟢 Açık Heceler</div><div class="izgara">' +
      s.acik.map(h => '<button class="hece-btn" onclick="seslendir(\'' + h + '\')">' + h + '</button>').join("") +
      '</div></div>';
  }
  if(s.kapali.length){
    ic += '<div class="bolum"><div class="bolum-basligi">🔵 Kapalı Heceler</div><div class="izgara">' +
      s.kapali.map(h => '<button class="hece-btn" onclick="seslendir(\'' + h + '\')">' + h + '</button>').join("") +
      '</div></div>';
  }
  const ikili = s.kelimeler.filter(k => k.h.length === 2).slice(0,4);
  if(ikili.length){
    ic += '<div class="bolum"><div class="bolum-basligi">🧩 Hece Birleştir</div><div class="birlestir">' +
      ikili.map(k => '<div class="birlestir-satir">' +
        k.h.map(p => '<button class="parca" onclick="seslendir(\'' + p + '\')">' + p + '</button>').join('<span class="isaret">+</span>') +
        '<span class="isaret">=</span><button class="sonuc" onclick="seslendir(\'' + esc(k.k) + '\')">' + k.k + '</button></div>'
      ).join("") + '</div></div>';
  }
  if(s.kelimeler.length){
    ic += '<div class="bolum"><div class="bolum-basligi">📚 Kelimeler — hecelere dikkat!</div><div class="kelime-izgara">' +
      s.kelimeler.map(k => '<div class="kelime-kart" onclick="seslendir(\'' + esc(k.k) + '\')">' +
        '<div class="kelime-emoji">' + k.e + '</div><div class="kelime-yazi">' + heceli(k.h) + '</div></div>').join("") +
      '</div></div>';
  }
  if(s.cumleler.length){
    ic += '<div class="bolum"><div class="bolum-basligi">✏️ Cümle Okuyalım</div>' +
      s.cumleler.map(c => '<div class="cumle-kutu" onclick="seslendir(\'' + esc(c) + '\')">' + c + '</div>').join("") +
      '</div>';
  }
  if(s.no > 1){
    ic += '<div class="bolum"><div class="bolum-basligi">🎲 Karışık Hece Okuma</div>' +
      '<div class="karisik-alan" id="karisik-' + s.no + '"></div>' +
      '<button class="yenile-btn" onclick="karisikYenile(' + s.no + ')">🔄 Yeni Heceler Getir</button></div>';
  }
  ic += '<button class="okudum-btn" id="okudum-' + s.no + '" onclick="okuduml(' + s.no + ')"></button>';
  ic += '<div class="sayfa-gezinti">' +
        '<button class="gez-btn" onclick="git(' + (s.no-1) + ')" ' + (s.no===1?'disabled':'') + '>← Önceki</button>' +
        '<button class="gez-btn" onclick="git(' + (s.no+1) + ')" ' + (s.no===VERI.sayfalar.length?'disabled':'') + '>Sonraki →</button></div>';

  html += '<section class="sayfa" id="sayfa-' + s.no + '" style="--renk:' + g.renk +
          ';--renk2:' + g.renk2 + ';--tint:' + g.tint + '">' + ic + '</section>';
});
document.getElementById("icerik").innerHTML = html;
VERI.sayfalar.forEach(s => { if(s.no > 1) karisikYenile(s.no); });
guncelle();
</script>
