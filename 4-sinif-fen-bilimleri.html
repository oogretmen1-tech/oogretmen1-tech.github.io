<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4. Sınıf Fen Bilimleri | Konu Defteri</title>
<style>
  :root{
    --primary:#1e3a5f;
    --primary-light:#2c5282;
    --accent:#0d9488;
    --accent-light:#14b8a6;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#1e293b;
    --text-light:#5b6472;
    --border:#e2e8f0;
    --danger:#dc2626;
    --ok:#059669;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Verdana,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
    color:#fff;
    padding:28px 18px 22px;
    text-align:center;
  }
  header h1{margin:0 0 6px;font-size:1.5rem;letter-spacing:.3px;}
  header p{margin:0;font-size:.95rem;opacity:.85;}

  .tabbar{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:14px 12px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
    -webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{height:6px;}
  .tabbar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .tab-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#f8fafc;
    color:var(--primary);
    padding:9px 14px;
    border-radius:20px;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  main{max-width:820px;margin:0 auto;padding:18px 14px 60px;}

  .unit{display:none;animation:fade .25s ease;}
  .unit.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .unit-head{
    background:var(--card);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:16px;
    border-left:6px solid var(--accent);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .unit-eyebrow{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--accent);
    text-transform:uppercase;
  }
  .unit-head h2{margin:4px 0 8px;font-size:1.3rem;color:var(--primary);}
  .unit-head p{margin:0;color:var(--text-light);font-size:.95rem;}

  .section-block{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .section-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--primary);
    margin-bottom:14px;
  }
  .section-label .dot{
    width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;
  }

  .konu-sub{margin-bottom:16px;}
  .konu-sub:last-child{margin-bottom:0;}
  .konu-sub h3{
    margin:0 0 6px;
    font-size:1.02rem;
    color:var(--primary-light);
    border-bottom:2px solid var(--bg);
    padding-bottom:6px;
  }
  .konu-sub p{margin:0;font-size:.95rem;color:var(--text);}

  figure{margin:14px 0;text-align:center;}
  figure img{
    width:100%;
    max-height:280px;
    object-fit:cover;
    border-radius:12px;
    display:block;
  }
  figcaption{
    font-size:.78rem;
    color:var(--text-light);
    margin-top:6px;
  }

  /* Quiz */
  .quiz-item{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--border);}
  .quiz-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .quiz-q{font-weight:600;margin-bottom:10px;font-size:.95rem;}
  .quiz-opts{display:grid;gap:8px;}
  .quiz-opt{
    text-align:left;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:#f8fafc;
    cursor:pointer;
    font-size:.9rem;
    color:var(--text);
    transition:.15s;
  }
  .quiz-opt:hover{border-color:var(--accent);}
  .quiz-opt.correct{background:#ecfdf5;border-color:var(--ok);color:#065f46;font-weight:600;}
  .quiz-opt.wrong{background:#fef2f2;border-color:var(--danger);color:#991b1b;}
  .quiz-opt.disabled{pointer-events:none;opacity:.75;}
  .quiz-explain{
    margin-top:8px;
    font-size:.85rem;
    color:var(--primary-light);
    background:#f0fdfa;
    border-left:3px solid var(--accent);
    padding:8px 10px;
    border-radius:6px;
    display:none;
  }

  /* Matching game */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .match-col{display:flex;flex-direction:column;gap:8px;}
  .match-card{
    padding:10px 10px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:#f8fafc;
    font-size:.85rem;
    cursor:pointer;
    text-align:center;
    transition:.15s;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .match-card.selected{border-color:var(--accent);background:#ccfbf1;}
  .match-card.matched{border-color:var(--ok);background:#ecfdf5;color:#065f46;font-weight:600;cursor:default;}
  .match-card.shake{animation:shake .3s;border-color:var(--danger);}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .match-status{margin-top:12px;font-size:.85rem;color:var(--text-light);text-align:center;}

  /* Worksheet */
  .ws-item{margin-bottom:14px;}
  .ws-item p.q{font-weight:600;margin:0 0 6px;font-size:.93rem;}
  .ws-reveal{
    font-size:.85rem;
    color:var(--primary);
    background:var(--bg);
    border-radius:8px;
    padding:8px 10px;
    display:none;
  }
  .ws-toggle{
    border:none;background:none;color:var(--accent);font-weight:600;font-size:.82rem;
    cursor:pointer;padding:0;
  }
  .ws-note{
    margin-top:6px;font-size:.82rem;color:var(--text-light);font-style:italic;
  }

  .reset-btn{
    display:block;margin:14px auto 0;
    background:none;border:1.5px solid var(--border);color:var(--text-light);
    padding:7px 14px;border-radius:8px;font-size:.8rem;cursor:pointer;
  }

  footer{text-align:center;padding:18px;color:var(--text-light);font-size:.8rem;}
</style>
</head>

/* ---------- RENDER ---------- */
const tabbar = document.getElementById('tabbar');
const main = document.getElementById('main');

UNITS.forEach((u,idx)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0?' active':'');
  btn.textContent = u.no + '. Ünite';
  btn.title = u.title;
  btn.onclick = ()=>showUnit(idx);
  tabbar.appendChild(btn);

  const wrap = document.createElement('section');
  wrap.className = 'unit' + (idx===0?' active':'');
  wrap.id = u.id;
  wrap.innerHTML = renderUnit(u);
  main.appendChild(wrap);
});

function showUnit(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
  document.querySelectorAll('.unit').forEach((s,i)=>s.classList.toggle('active', i===idx));
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderUnit(u){
  let konu = u.sections.map(s=>`
    <div class="konu-sub">
      <h3>${s.h}</h3>
      <p>${s.p}</p>
    </div>`).join('');

  let img2 = u.image2 ? `
    <figure>
      <img src="${u.image2.url}" alt="${u.title}" loading="lazy">
      <figcaption>${u.image2.caption}</figcaption>
    </figure>` : '';

  return `
    <div class="unit-head">
      <div class="unit-eyebrow">${u.no}. Ünite</div>
      <h2>${u.title}</h2>
      <p>${u.intro}</p>
    </div>

    <div class="section-block">
      <div class="section-label"><span class="dot"></span>Konu Anlatımı</div>
      <figure>
        <img src="${u.image.url}" alt="${u.title}" loading="lazy">
        <figcaption>${u.image.caption}</figcaption>
      </figure>
      ${konu}
      ${img2}
    </div>

    <div class="section-block">
      <div class="section-label"><span class="dot"></span>Etkinlik — Ne Öğrendik?</div>
      <div class="quiz-box" id="quiz-${u.id}"></div>
    </div>

    <div class="section-block">
      <div class="section-label"><span class="dot"></span>Oyun — Eşleştirme</div>
      <div class="match-box" id="match-${u.id}"></div>
      <button class="reset-btn" onclick="renderMatch('${u.id}')">Oyunu Yeniden Başlat</button>
    </div>

    <div class="section-block">
      <div class="section-label"><span class="dot"></span>Çalışma Kağıdı</div>
      <div class="ws-box" id="ws-${u.id}"></div>
    </div>
  `;
}

/* ---------- QUIZ ENGINE ---------- */
function renderQuiz(unit){
  const box = document.getElementById('quiz-'+unit.id);
  box.innerHTML = unit.quiz.map((item,qi)=>`
    <div class="quiz-item">
      <div class="quiz-q">${qi+1}. ${item.q}</div>
      <div class="quiz-opts" id="qopts-${unit.id}-${qi}">
        ${item.o.map((opt,oi)=>`<button class="quiz-opt" onclick="answerQuiz('${unit.id}',${qi},${oi})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="qexp-${unit.id}-${qi}">${item.e}</div>
    </div>
  `).join('');
}
function answerQuiz(uid,qi,oi){
  const unit = UNITS.find(u=>u.id===uid);
  const correct = unit.quiz[qi].c;
  const optsWrap = document.getElementById(`qopts-${uid}-${qi}`);
  const btns = optsWrap.querySelectorAll('.quiz-opt');
  btns.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===correct) b.classList.add('correct');
    else if(i===oi) b.classList.add('wrong');
  });
  document.getElementById(`qexp-${uid}-${qi}`).style.display='block';
}

/* ---------- MATCHING ENGINE ---------- */
function renderMatch(uid){
  const unit = UNITS.find(u=>u.id===uid);
  const box = document.getElementById('match-'+uid);
  const lefts = unit.match.map((p,i)=>({...p,i,side:'l'}));
  const rights = shuffle(unit.match.map((p,i)=>({...p,i,side:'r'})));
  box.innerHTML = `
    <div class="match-wrap">
      <div class="match-col">${lefts.map(item=>`<div class="match-card" data-i="${item.i}" data-side="l" onclick="pickMatch('${uid}',this)">${item.l}</div>`).join('')}</div>
      <div class="match-col">${rights.map(item=>`<div class="match-card" data-i="${item.i}" data-side="r" onclick="pickMatch('${uid}',this)">${item.r}</div>`).join('')}</div>
    </div>
    <div class="match-status" id="mstat-${uid}">Sol ve sağdan doğru eşi bulup sırayla tıkla.</div>
  `;
}
let matchState = {};
function pickMatch(uid, el){
  if(el.classList.contains('matched')) return;
  if(!matchState[uid]) matchState[uid] = {sel:null, done:0};
  const st = matchState[uid];
  const unit = UNITS.find(u=>u.id===uid);

  if(!st.sel){
    st.sel = el;
    el.classList.add('selected');
    return;
  }
  if(st.sel === el){ el.classList.remove('selected'); st.sel=null; return; }

  const sideA = st.sel.dataset.side, sideB = el.dataset.side;
  if(sideA === sideB){
    st.sel.classList.remove('selected');
    st.sel = el; el.classList.add('selected');
    return;
  }
  const iA = +st.sel.dataset.i, iB = +el.dataset.i;
  if(iA === iB){
    st.sel.classList.remove('selected');
    st.sel.classList.add('matched');
    el.classList.add('matched');
    st.sel = null;
    st.done++;
    document.getElementById(`mstat-${uid}`).textContent = st.done===unit.match.length ? 'Tebrikler, tüm eşleri buldun!' : `${st.done}/${unit.match.length} eş bulundu.`;
  } else {
    el.classList.add('shake');
    st.sel.classList.add('shake');
    setTimeout(()=>{
      el.classList.remove('shake');
      st.sel.classList.remove('shake','selected');
      st.sel = null;
    }, 350);
  }
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------- WORKSHEET ENGINE ---------- */
function renderWs(unit){
  const box = document.getElementById('ws-'+unit.id);
  box.innerHTML = unit.ws.map((item,wi)=>`
    <div class="ws-item">
      <p class="q">${wi+1}. ${item.q}</p>
      <button class="ws-toggle" onclick="toggleWs('${unit.id}',${wi})">Örnek cevabı göster</button>
      <div class="ws-reveal" id="wsr-${unit.id}-${wi}">${item.a}</div>
    </div>
  `).join('') + `<p class="ws-note">Bu çalışma kağıdını deftere yazarak da cevaplayabilirsin.</p>`;
}
function toggleWs(uid,wi){
  const el = document.getElementById(`wsr-${uid}-${wi}`);
  el.style.display = el.style.display==='block' ? 'none' : 'block';
}

/* ---------- INIT ALL ---------- */
UNITS.forEach(u=>{
  renderQuiz(u);
  renderMatch(u.id);
  renderWs(u);
});
