    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'PoppinsA', 'Segoe UI', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      background: linear-gradient(to bottom, #2fa8e6 0%, #8edcf7 38%, #5cc35a 38%, #1f7a3a 100%);
      display: flex;
      justify-content: center;
      color: #123f22;
    }

    .game { width: min(1000px, 100%); text-align: center; }

    h1 {
      margin: 4px 0 10px;
      color: #ffffff;
      font-size: clamp(26px, 6vw, 42px);
      font-weight: 700;
      text-shadow: 0 3px 0 #0e6b33, 0 6px 14px rgba(0,0,0,.25);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      background: #ffffff;
      border: 3px solid #12833f;
      border-radius: 18px;
      box-shadow: 0 5px 0 #0d4d27;
      margin-bottom: 10px;
    }

    .control { display: flex; align-items: center; gap: 6px; font-weight: 700; }

    select {
      padding: 8px 10px;
      border: 2px solid #12833f;
      border-radius: 10px;
      background: #fff;
      color: #123f22;
      font-size: 17px;
      font-weight: 700;
    }

    button {
      padding: 11px 26px;
      border: 0;
      border-radius: 25px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #0d4d27;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d4d27; }
    button:disabled { background: #94a3b8; box-shadow: none; cursor: default; }

    .mission {
      padding: 10px;
      margin-bottom: 10px;
      background: #fff7ae;
      border: 3px solid #eab308;
      border-radius: 14px;
      box-shadow: 0 4px 0 #ca8a04;
      color: #6b3f10;
      font-size: 19px;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .box {
      padding: 8px;
      background: #ffffff;
      border: 2px solid #12833f;
      border-radius: 12px;
      font-weight: 700;
    }
    .box strong { display: block; margin-top: 2px; color: #0d4d27; font-size: 24px; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #9ddff8;
      border: 5px solid #0d4d27;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      touch-action: none;
    }

    .help {
      margin-top: 10px;
      padding: 10px;
      background: #ffffff;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .imza {
      margin-top: 10px;
      padding-bottom: 6px;
      color: #ffffff;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
    }

    @media (max-width: 600px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
      .control { width: 100%; justify-content: space-between; }
      button { width: 100%; }
    }

<meta property="og:image" content="https://oogretmen1-tech.github.io/logo.png">
<meta name="twitter:card" content="summary">
</head>

<body>
  <div class="game">
    <h1>Orman Bulutları</h1>

    <div class="controls">
      <div class="control">
        <label for="numberSelect">Hedef Sayı:</label>
        <select id="numberSelect"></select>
      </div>
      <div class="control">
        <label for="timeSelect">Süre:</label>
        <select id="timeSelect">
          <option value="30">30 saniye</option>
          <option value="60" selected>60 saniye</option>
          <option value="90">90 saniye</option>
        </select>
      </div>
      <button id="startButton">Oyunu Başlat</button>
    </div>

    <div class="mission" id="mission">Hedef sayıyı seçip oyunu başlatın.</div>

    <div class="dashboard">
      <div class="box">Puan<strong id="score">0</strong></div>
      <div class="box">Süre<strong id="timer">60</strong></div>
      <div class="box">Doğru<strong id="correct">0</strong></div>
      <div class="box">Yanlış<strong id="wrong">0</strong></div>
    </div>

    <canvas id="gameCanvas" width="1000" height="620"></canvas>

    <div class="help">
      Sapanın altındaki çimene dokun, parmağını aşağı doğru çek ve bırak. Noktalı çizgi taşın gideceği yolu gösterir.
      Üzerinde hedef sayı yazan bulutları vur!
    </div>

    <div class="imza">Dijital Öğretmen · Hasan Tutuş</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const numberSelect = document.getElementById("numberSelect");
    const timeSelect = document.getElementById("timeSelect");
    const startButton = document.getElementById("startButton");
    const mission = document.getElementById("mission");
    const scoreElement = document.getElementById("score");
    const timerElement = document.getElementById("timer");
    const correctElement = document.getElementById("correct");
    const wrongElement = document.getElementById("wrong");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const FONT = "PoppinsA, 'Segoe UI', Arial, sans-serif";

    for (let i = 1; i <= 20; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = i;
      numberSelect.appendChild(option);
    }
    numberSelect.value = "10";

    /* ---------- AYARLAR ---------- */
    const sling = { x: 500, y: 500 };
    const MAX_PULL = 98;
    const MIN_PULL = 22;
    const POWER = 0.2;       // çekme -> hız
    const GRAVITY = 0.11;    // yerçekimi (kare başına)
    const MAX_FLIGHT = 1500; // ms — taş en fazla bu kadar uçar, sonra hemen geri gelir
    const CLOUD_COUNT = 7;
    const MIN_TARGET = 3;

    const ball = { x: sling.x, y: sling.y, radius: 17, vx: 0, vy: 0, dragging: false, flying: false, flightStart: 0 };

    let clouds = [];
    let backTrees = [], frontTrees = [], bushes = [], flowers = [], birds = [], butterflies = [], mushrooms = [];
    let particles = [], floatTexts = [];

    let selectedNumber = 10;
    let gameRunning = false;
    let gameOver = false;
    let score = 0, correct = 0, wrong = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let tick = 0;

    /* ---------- SES ---------- */
    let audioCtx = null;
    function beep(freq, dur, type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.18, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }
    function soundCorrect() { beep(660, 0.12); setTimeout(() => beep(880, 0.18), 90); }
    function soundWrong() { beep(200, 0.25, "triangle"); }

    /* ---------- BULUTLAR ---------- */
    function getDifferentNumber() {
      let n;
      do { n = Math.floor(Math.random() * 20) + 1; } while (n === selectedNumber);
      return n;
    }

    function targetCount(exclude) {
      let c = 0;
      clouds.forEach(cl => {
        if (cl === exclude) return;
        if (cl.respawning) { if (cl.nextNumber === selectedNumber) c++; }
        else if (cl.number === selectedNumber) c++;
      });
      return c;
    }

    function pickNumber(exclude) {
      if (targetCount(exclude) < MIN_TARGET) return selectedNumber;
      return Math.random() < 0.3 ? selectedNumber : getDifferentNumber();
    }

    // Bulutlar 5 sıra hâlinde akar; her sıranın yönü ve hızı sabittir, böylece bulutlar üst üste binmez
    const LANES = [80, 150, 220, 290, 360];
    let laneDir = [], laneSpeed = [];

    function setupLanes() {
      laneDir = LANES.map((_, i) => (i % 2 === 0 ? 1 : -1));
      laneSpeed = LANES.map(() => 0.6 + Math.random() * 0.6);
    }

    function laneHasRoom(lane, x, exclude) {
      return clouds.every(c => c === exclude || c.respawning || c.lane !== lane || Math.abs(c.x - x) > 230);
    }

    function makeCloud(number, lane, x) {
      return {
        x: x, lane: lane, y: LANES[lane], number: number,
        bob: Math.random() * Math.PI * 2,
        respawning: false, respawnTime: 0, nextNumber: null
      };
    }

    function createClouds() {
      setupLanes();
      clouds = [];
      // 5 sıraya 7 bulut: iki sırada ikişer bulut, aralarında geniş boşluk
      const plan = [[0, 0.2], [0, 0.7], [1, 0.45], [2, 0.15], [2, 0.65], [3, 0.4], [4, 0.8]];
      const nums = plan.map((_, i) => (i < MIN_TARGET ? selectedNumber : getDifferentNumber()));
      nums.sort(() => Math.random() - 0.5);
      plan.forEach((pl, i) => clouds.push(makeCloud(nums[i], pl[0], 80 + pl[1] * (WIDTH - 160))));
    }

    function popCloud(cloud, delay) {
      cloud.respawning = true;
      cloud.respawnTime = performance.now() + delay;
      cloud.nextNumber = pickNumber(cloud);
    }

    function respawnCloud(cloud) {
      // Sırada yer olan bir şerit bul; yoksa biraz bekle
      const order = LANES.map((_, i) => i).sort(() => Math.random() - 0.5);
      for (const lane of order) {
        const x = laneDir[lane] === 1 ? -90 : WIDTH + 90;
        const count = clouds.filter(c => c !== cloud && !c.respawning && c.lane === lane).length;
        if (count < 2 && laneHasRoom(lane, x, cloud)) {
          cloud.number = cloud.nextNumber !== null ? cloud.nextNumber : pickNumber(cloud);
          cloud.lane = lane;
          cloud.y = LANES[lane];
          cloud.x = x;
          cloud.respawning = false;
          cloud.nextNumber = null;
          return;
        }
      }
      cloud.respawnTime = performance.now() + 250;
    }

    function updateClouds(dt) {
      const now = performance.now();
      clouds.forEach(cloud => {
        if (cloud.respawning) {
          if (now >= cloud.respawnTime) respawnCloud(cloud);
          return;
        }
        cloud.x += laneSpeed[cloud.lane] * laneDir[cloud.lane] * dt;
        cloud.bob += 0.02 * dt;
        if (cloud.x < -120 || cloud.x > WIDTH + 120) popCloud(cloud, 150);
      });
    }

    function cloudDrawY(cloud) { return cloud.y + Math.sin(cloud.bob) * 4; }

    /* ---------- SAPAN ---------- */
    function resetBall() {
      ball.x = sling.x; ball.y = sling.y;
      ball.vx = 0; ball.vy = 0;
      ball.dragging = false; ball.flying = false;
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * WIDTH / rect.width,
        y: (event.clientY - rect.top) * HEIGHT / rect.height
      };
    }

    // Çekme vektörünü sınırla: taş hep sapanın altına/yanına çekilir, böylece hep yukarı atılır
    function pullVector(px, py) {
      let dx = px - sling.x;
      let dy = py - sling.y;
      if (dy < 12) dy = 12;
      const len = Math.hypot(dx, dy);
      if (len > MAX_PULL) { dx = dx / len * MAX_PULL; dy = dy / len * MAX_PULL; }
      return { dx, dy };
    }

    let dragStart = null;

    canvas.addEventListener("pointerdown", function (event) {
      if (!gameRunning) return;
      // Taş uçarken dokunulursa hemen geri gelsin
      if (ball.flying) resetBall();
      const p = getPointerPosition(event);
      // Taşın çevresine ya da ekranın alt kısmına dokunmak yeterli
      if (Math.hypot(p.x - ball.x, p.y - ball.y) < 110 || p.y > 420) {
        ball.dragging = true;
        dragStart = p;
        canvas.setPointerCapture(event.pointerId);
      }
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!ball.dragging) return;
      const p = getPointerPosition(event);
      // Parmağın ilk değdiği yere göre çekme (taşa tam isabet gerekmez)
      const v = pullVector(sling.x + (p.x - dragStart.x), sling.y + (p.y - dragStart.y));
      ball.x = sling.x + v.dx;
      ball.y = sling.y + v.dy;
    });

    function release(event) {
      if (!ball.dragging) return;
      ball.dragging = false;
      if (event && canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);

      const dx = sling.x - ball.x;
      const dy = sling.y - ball.y;
      if (Math.hypot(dx, dy) < MIN_PULL) { resetBall(); return; }

      ball.vx = dx * POWER;
      ball.vy = dy * POWER;
      ball.flying = true;
      ball.flightStart = performance.now();
      beep(420, 0.08, "triangle");
    }

    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", resetBall);
    canvas.addEventListener("lostpointercapture", function () { if (ball.dragging) resetBall(); });

    function hitTest(cloud) {
      // Bulutun gövdesine elips şeklinde isabet alanı
      const cy = cloudDrawY(cloud) + 6;
      const nx = (ball.x - cloud.x) / (66 + ball.radius);
      const ny = (ball.y - cy) / (44 + ball.radius);
      return nx * nx + ny * ny < 1;
    }

    function checkCollisions() {
      for (const cloud of clouds) {
        if (cloud.respawning) continue;
        if (!hitTest(cloud)) continue;

        if (cloud.number === selectedNumber) {
          score += 10; correct++;
          addFloatText("+10", cloud.x, cloudDrawY(cloud), "#16a34a");
          createParticles(cloud.x, cloudDrawY(cloud), ["#ffffff", "#ffe066", "#7dd3fc"]);
          soundCorrect();
          popCloud(cloud, 600);
        } else {
          score = Math.max(0, score - 3); wrong++;
          addFloatText("-3", cloud.x, cloudDrawY(cloud), "#ef4444");
          createParticles(cloud.x, cloudDrawY(cloud), ["#ffffff", "#cbd5e1"]);
          soundWrong();
          popCloud(cloud, 600);
        }
        scoreElement.textContent = score;
        correctElement.textContent = correct;
        wrongElement.textContent = wrong;
        resetBall();
        return true;
      }
      return false;
    }

    function updateBall(dt) {
      if (!ball.flying) return;
      // Küçük adımlarla ilerle ki hızlı taş bulutun içinden geçip gitmesin
      const steps = 4;
      for (let i = 0; i < steps; i++) {
        ball.x += ball.vx * dt / steps;
        ball.y += ball.vy * dt / steps;
        ball.vy += GRAVITY * dt / steps;
        if (checkCollisions()) return;
      }
      const out = ball.y < -25 || ball.x < -25 || ball.x > WIDTH + 25 ||
                  (ball.vy > 0 && ball.y > sling.y + 40);
      if (out || performance.now() - ball.flightStart > MAX_FLIGHT) {
        resetBall(); // ıska: taş beklemeden sapana döner
      }
    }

    /* ---------- EFEKTLER ---------- */
    function createParticles(x, y, colors) {
      for (let i = 0; i < 26; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          size: 4 + Math.random() * 7,
          life: 40,
          color: colors[i % colors.length]
        });
      }
    }
    function updateParticles(dt) {
      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.06 * dt; p.life -= dt; }
      particles = particles.filter(p => p.life > 0);
    }
    function addFloatText(text, x, y, color) { floatTexts.push({ text, x, y, color, life: 50 }); }
    function updateFloatTexts(dt) {
      for (const t of floatTexts) { t.y -= 1.1 * dt; t.life -= dt; }
      floatTexts = floatTexts.filter(t => t.life > 0);
    }

    /* ---------- ORMAN ---------- */
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function createScenery() {
      backTrees = []; frontTrees = []; bushes = []; flowers = []; birds = []; butterflies = []; mushrooms = [];

      for (let i = 0; i < 24; i++) {
        backTrees.push({ x: i * 44 + rnd(0, 16), y: 418 + rnd(0, 10), scale: rnd(0.48, 0.68),
          type: Math.random() < 0.55 ? "cam" : "round", hue: Math.floor(rnd(0, 3)), sway: rnd(0, 6) });
      }
      const frontX = [30, 110, 190, 270, 345, 655, 730, 810, 890, 970];
      frontX.forEach((x, i) => {
        frontTrees.push({ x: x + rnd(-10, 10), y: 470 + rnd(0, 22), scale: rnd(0.9, 1.25),
          type: i % 3 === 1 ? "cam" : "round", hue: i % 3, fruit: i % 2 === 0, sway: rnd(0, 6) });
      });
      for (let i = 0; i < 14; i++) {
        let x = rnd(0, WIDTH);
        if (Math.abs(x - sling.x) < 80) x += 160;
        bushes.push({ x, y: rnd(520, 600), scale: rnd(0.6, 1.2), berries: Math.random() < 0.5 });
      }
      const flowerColors = ["#ff5d8f", "#ffd23f", "#ffffff", "#b388ff", "#ff8a3d"];
      for (let i = 0; i < 40; i++) {
        flowers.push({ x: rnd(0, WIDTH), y: rnd(492, 612), color: flowerColors[i % flowerColors.length], size: rnd(3.5, 6) });
      }
      for (let i = 0; i < 6; i++) {
        let x = rnd(30, WIDTH - 30);
        if (Math.abs(x - sling.x) < 90) x = x < sling.x ? x - 90 : x + 90;
        mushrooms.push({ x, y: rnd(545, 600), s: rnd(0.8, 1.2) });
      }
      for (let i = 0; i < 4; i++) {
        birds.push({ x: rnd(0, WIDTH), y: rnd(40, 110), speed: rnd(0.4, 0.8), size: rnd(7, 11), flap: rnd(0, 6) });
      }
      for (let i = 0; i < 4; i++) {
        butterflies.push({ x: rnd(0, WIDTH), y: rnd(470, 560), t: rnd(0, 100),
          color: ["#ff7ab6", "#ffd23f", "#7dd3fc", "#c084fc"][i] });
      }
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, 470);
      sky.addColorStop(0, "#1e9be0");
      sky.addColorStop(0.55, "#7fd3f7");
      sky.addColorStop(1, "#d6f4ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Güneş ve dönen ışınlar
      const sx = 900, sy = 80;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(tick * 0.003);
      ctx.fillStyle = "rgba(255, 230, 120, 0.35)";
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath();
        ctx.moveTo(-9, 50); ctx.lineTo(9, 50); ctx.lineTo(0, 92);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      const halo = ctx.createRadialGradient(sx, sy, 20, sx, sy, 80);
      halo.addColorStop(0, "rgba(255,245,180,0.9)");
      halo.addColorStop(1, "rgba(255,245,180,0)");
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(sx, sy, 80, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd93b";
      ctx.beginPath(); ctx.arc(sx, sy, 42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffe877";
      ctx.beginPath(); ctx.arc(sx - 8, sy - 8, 28, 0, Math.PI * 2); ctx.fill();
    }

    function drawHills() {
      // Uzak mavi-yeşil tepeler
      ctx.fillStyle = "#8fcf9a";
      ctx.beginPath();
      ctx.moveTo(0, 420);
      ctx.quadraticCurveTo(140, 330, 300, 400);
      ctx.quadraticCurveTo(470, 320, 640, 395);
      ctx.quadraticCurveTo(820, 330, 1000, 400);
      ctx.lineTo(1000, HEIGHT); ctx.lineTo(0, HEIGHT); ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#5fb865";
      ctx.beginPath();
      ctx.moveTo(0, 440);
      ctx.quadraticCurveTo(200, 385, 420, 438);
      ctx.quadraticCurveTo(640, 490, 820, 430);
      ctx.quadraticCurveTo(920, 400, 1000, 432);
      ctx.lineTo(1000, HEIGHT); ctx.lineTo(0, HEIGHT); ctx.closePath(); ctx.fill();
    }

    function drawGround() {
      const g = ctx.createLinearGradient(0, 470, 0, HEIGHT);
      g.addColorStop(0, "#7ed957");
      g.addColorStop(0.5, "#4cb848");
      g.addColorStop(1, "#2e8f3a");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 486);
      ctx.quadraticCurveTo(250, 466, 520, 484);
      ctx.quadraticCurveTo(780, 504, 1000, 478);
      ctx.lineTo(1000, HEIGHT); ctx.lineTo(0, HEIGHT); ctx.closePath(); ctx.fill();

      // Patika (sapana giden yol)
      ctx.fillStyle = "rgba(214, 170, 105, 0.55)";
      ctx.beginPath();
      ctx.moveTo(sling.x - 40, 488);
      ctx.quadraticCurveTo(sling.x - 70, 560, sling.x - 120, HEIGHT);
      ctx.lineTo(sling.x + 120, HEIGHT);
      ctx.quadraticCurveTo(sling.x + 70, 560, sling.x + 40, 488);
      ctx.closePath(); ctx.fill();

      // Çim tutamları
      ctx.strokeStyle = "rgba(25, 110, 45, 0.45)";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      for (let i = 0; i < 110; i++) {
        const x = (i * 37 + 11) % WIDTH;
        const y = 500 + ((i * 53) % 115);
        const w = Math.sin(tick * 0.03 + i) * 2;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - 5 + w, y - 12);
        ctx.moveTo(x, y); ctx.lineTo(x + 1 + w, y - 15);
        ctx.moveTo(x, y); ctx.lineTo(x + 6 + w, y - 11);
        ctx.stroke();
      }
    }

    function drawFlowers() {
      for (const f of flowers) {
        ctx.fillStyle = f.color;
        for (let k = 0; k < 5; k++) {
          const a = k * Math.PI * 2 / 5;
          ctx.beginPath();
          ctx.arc(f.x + Math.cos(a) * f.size * 0.8, f.y + Math.sin(a) * f.size * 0.8, f.size * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#f59e0b";
        ctx.beginPath(); ctx.arc(f.x, f.y, f.size * 0.45, 0, Math.PI * 2); ctx.fill();
      }
    }

    const TREE_GREENS = [
      ["#3fbf55", "#2ea347", "#1f8a3c"],
      ["#5ccf4f", "#41b33f", "#2b9334"],
      ["#2fae6a", "#23935a", "#187a4a"]
    ];

    function drawTree(tree, far) {
      const x = tree.x, y = tree.y, s = tree.scale;
      const greens = TREE_GREENS[tree.hue];
      const sway = Math.sin(tick * 0.02 + tree.sway) * (far ? 1 : 2.5) * s;

      ctx.save();
      if (far) ctx.globalAlpha = 0.8;

      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(x - 6 * s, y - 10 * s, 12 * s, 66 * s);
      ctx.fillStyle = "#6f4520";
      ctx.fillRect(x + 1 * s, y - 10 * s, 5 * s, 66 * s);

      if (tree.type === "cam") {
        const layers = [{ dy: -80, w: 32, h: 46 }, { dy: -54, w: 42, h: 50 }, { dy: -26, w: 52, h: 52 }];
        layers.forEach((l, i) => {
          const sw = sway * (1 - i * 0.3);
          ctx.fillStyle = greens[i];
          ctx.beginPath();
          ctx.moveTo(x + sw, y + l.dy * s - l.h * s * 0.55);
          ctx.lineTo(x - l.w * s, y + l.dy * s + l.h * s * 0.35);
          ctx.lineTo(x + l.w * s, y + l.dy * s + l.h * s * 0.35);
          ctx.closePath(); ctx.fill();
        });
      } else {
        const cx = x + sway;
        ctx.fillStyle = greens[2];
        ctx.beginPath();
        ctx.arc(cx, y - 42 * s, 36 * s, 0, Math.PI * 2);
        ctx.arc(cx - 28 * s, y - 18 * s, 27 * s, 0, Math.PI * 2);
        ctx.arc(cx + 28 * s, y - 18 * s, 27 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = greens[1];
        ctx.beginPath();
        ctx.arc(cx - 6 * s, y - 46 * s, 26 * s, 0, Math.PI * 2);
        ctx.arc(cx - 26 * s, y - 24 * s, 17 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = greens[0];
        ctx.beginPath();
        ctx.arc(cx - 12 * s, y - 56 * s, 13 * s, 0, Math.PI * 2);
        ctx.fill();

        if (tree.fruit && !far) {
          ctx.fillStyle = "#ef3b3b";
          [[-20, -30], [14, -46], [24, -14], [-4, -16], [-30, -6]].forEach(p => {
            ctx.beginPath(); ctx.arc(cx + p[0] * s, y + p[1] * s, 5.5 * s, 0, Math.PI * 2); ctx.fill();
          });
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          [[-20, -30], [14, -46], [24, -14], [-4, -16], [-30, -6]].forEach(p => {
            ctx.beginPath(); ctx.arc(cx + p[0] * s - 1.8, y + p[1] * s - 1.8, 1.6 * s, 0, Math.PI * 2); ctx.fill();
          });
        }
      }
      ctx.restore();
    }

    function drawBushes() {
      for (const b of bushes) {
        const s = b.scale;
        ctx.fillStyle = "#2f9a45";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 18 * s, 0, Math.PI * 2);
        ctx.arc(b.x - 16 * s, b.y + 6 * s, 13 * s, 0, Math.PI * 2);
        ctx.arc(b.x + 16 * s, b.y + 6 * s, 13 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#4cc05a";
        ctx.beginPath(); ctx.arc(b.x - 5 * s, b.y - 6 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
        if (b.berries) {
          ctx.fillStyle = "#7c3aed";
          [[-10, 4], [6, -2], [12, 8], [-2, 10]].forEach(p => {
            ctx.beginPath(); ctx.arc(b.x + p[0] * s, b.y + p[1] * s, 3 * s, 0, Math.PI * 2); ctx.fill();
          });
        }
      }
    }

    function drawMushrooms() {
      for (const m of mushrooms) {
        const s = m.s;
        ctx.fillStyle = "#fff4e0";
        ctx.fillRect(m.x - 4 * s, m.y - 10 * s, 8 * s, 12 * s);
        ctx.fillStyle = "#e53935";
        ctx.beginPath(); ctx.arc(m.x, m.y - 10 * s, 12 * s, Math.PI, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ffffff";
        [[-5, -15], [4, -18], [7, -12]].forEach(p => {
          ctx.beginPath(); ctx.arc(m.x + p[0] * s, m.y + p[1] * s, 2 * s, 0, Math.PI * 2); ctx.fill();
        });
      }
    }

    function drawBirds(dt) {
      ctx.strokeStyle = "rgba(40, 60, 80, 0.7)";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      for (const b of birds) {
        b.x += b.speed * dt;
        b.flap += 0.15 * dt;
        if (b.x > WIDTH + 30) { b.x = -30; b.y = rnd(40, 110); }
        const s = b.size, w = Math.sin(b.flap) * s * 0.5;
        ctx.beginPath();
        ctx.moveTo(b.x - s, b.y - w);
        ctx.quadraticCurveTo(b.x - s / 2, b.y - s / 2, b.x, b.y);
        ctx.quadraticCurveTo(b.x + s / 2, b.y - s / 2, b.x + s, b.y - w);
        ctx.stroke();
      }
    }

    function drawButterflies(dt) {
      for (const b of butterflies) {
        b.t += 0.03 * dt;
        b.x += Math.cos(b.t * 0.7) * 0.9 * dt;
        b.y += Math.sin(b.t * 1.3) * 0.5 * dt;
        if (b.x < 10) b.x = 10; if (b.x > WIDTH - 10) b.x = WIDTH - 10;
        if (b.y < 470) b.y = 470; if (b.y > 600) b.y = 600;
        const open = Math.abs(Math.sin(b.t * 6));
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.ellipse(b.x - 5 * open, b.y, 6 * open + 1, 8, -0.3, 0, Math.PI * 2);
        ctx.ellipse(b.x + 5 * open, b.y, 6 * open + 1, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#3b2a1a";
        ctx.fillRect(b.x - 1, b.y - 6, 2, 12);
      }
    }

    function drawCloud(cloud) {
      if (cloud.respawning) return;
      const x = cloud.x;
      const y = cloudDrawY(cloud);

      ctx.save();
      // Yumuşak gölge
      ctx.fillStyle = "rgba(60, 120, 160, 0.18)";
      ctx.beginPath();
      ctx.ellipse(x + 4, y + 40, 62, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Alt katman (hafif mavi gölgeli)
      ctx.fillStyle = "#dceefa";
      ctx.beginPath();
      ctx.arc(x - 40, y + 14, 26, 0, Math.PI * 2);
      ctx.arc(x - 10, y - 6, 34, 0, Math.PI * 2);
      ctx.arc(x + 26, y - 2, 30, 0, Math.PI * 2);
      ctx.arc(x + 48, y + 16, 22, 0, Math.PI * 2);
      ctx.arc(x, y + 22, 30, 0, Math.PI * 2);
      ctx.fill();

      // Bembeyaz üst katman
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x - 40, y + 10, 24, 0, Math.PI * 2);
      ctx.arc(x - 10, y - 10, 32, 0, Math.PI * 2);
      ctx.arc(x + 26, y - 6, 28, 0, Math.PI * 2);
      ctx.arc(x + 46, y + 12, 20, 0, Math.PI * 2);
      ctx.arc(x, y + 16, 28, 0, Math.PI * 2);
      ctx.fill();

      // Parlak vurgu
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.arc(x - 22, y - 20, 12, 0, Math.PI * 2);
      ctx.fill();

      // Sayı
      ctx.font = `700 40px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#1e3a8a";
      ctx.fillText(cloud.number, x + 2, y + 8);
      ctx.restore();
    }

    function drawAim() {
      if (!ball.dragging) return;
      const dx = sling.x - ball.x, dy = sling.y - ball.y;
      if (Math.hypot(dx, dy) < MIN_PULL) return;
      let x = ball.x, y = ball.y, vx = dx * POWER, vy = dy * POWER;
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      for (let i = 1; i <= 60; i++) {
        x += vx; y += vy; vy += GRAVITY;
        if (y < 0 || x < 0 || x > WIDTH) break;
        if (i % 3 === 0) {
          const r = Math.max(2.5, 6 - i * 0.06);
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function drawSling() {
      // Tahta sapan
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath(); ctx.ellipse(sling.x, sling.y + 92, 60, 14, 0, 0, Math.PI * 2); ctx.fill();

      ctx.lineCap = "round";
      ctx.strokeStyle = "#7a4a1e";
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.moveTo(sling.x, sling.y + 90); ctx.lineTo(sling.x, sling.y + 26);
      ctx.moveTo(sling.x, sling.y + 30); ctx.lineTo(sling.x - 40, sling.y - 22);
      ctx.moveTo(sling.x, sling.y + 30); ctx.lineTo(sling.x + 40, sling.y - 22);
      ctx.stroke();
      ctx.strokeStyle = "#a8692f";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(sling.x - 3, sling.y + 86); ctx.lineTo(sling.x - 3, sling.y + 28);
      ctx.moveTo(sling.x - 3, sling.y + 28); ctx.lineTo(sling.x - 42, sling.y - 20);
      ctx.stroke();

      // Lastik (arka)
      ctx.strokeStyle = "#c81e1e";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(sling.x + 40, sling.y - 22); ctx.lineTo(ball.x, ball.y);
      ctx.stroke();

      drawAim();

      // Taş
      ctx.fillStyle = "#64748b";
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath(); ctx.arc(ball.x - 5, ball.y - 6, 5, 0, Math.PI * 2); ctx.fill();

      // Lastik (ön)
      if (!ball.flying) {
        ctx.strokeStyle = "#e02424";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(sling.x - 40, sling.y - 22); ctx.lineTo(ball.x, ball.y);
        ctx.stroke();
      } else {
        ctx.strokeStyle = "#e02424";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(sling.x - 40, sling.y - 22); ctx.lineTo(sling.x + 40, sling.y - 22);
        ctx.stroke();
      }

      // Çekme ipucu (oyun başında, taş beklerken)
      if (gameRunning && !ball.dragging && !ball.flying && correct + wrong === 0) {
        const a = (Math.sin(tick * 0.08) + 1) / 2;
        ctx.globalAlpha = 0.5 + a * 0.5;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#0d4d27";
        ctx.lineWidth = 4;
        const hy = sling.y + 40 + a * 30;
        ctx.beginPath();
        ctx.moveTo(sling.x + 70, hy); ctx.lineTo(sling.x + 70, hy + 30);
        ctx.moveTo(sling.x + 60, hy + 20); ctx.lineTo(sling.x + 70, hy + 32); ctx.lineTo(sling.x + 80, hy + 20);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawTargetBadge() {
      if (!gameRunning) return;
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.strokeStyle = "#eab308";
      ctx.lineWidth = 4;
      roundRect(16, HEIGHT - 80, 150, 64, 16);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#6b3f10";
      ctx.font = `600 16px ${FONT}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("Hedef", 30, HEIGHT - 48);
      ctx.fillStyle = "#1e3a8a";
      ctx.font = `700 38px ${FONT}`;
      ctx.textAlign = "center";
      ctx.fillText(selectedNumber, 125, HEIGHT - 46);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawOverlay() {
      if (gameRunning) return;
      ctx.save();
      ctx.fillStyle = "rgba(10, 60, 35, 0.45)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#12833f";
      ctx.lineWidth = 5;
      roundRect(WIDTH / 2 - 260, 170, 520, 190, 26);
      ctx.fill(); ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (gameOver) {
        ctx.fillStyle = "#0d4d27";
        ctx.font = `700 40px ${FONT}`;
        ctx.fillText("Süre bitti!", WIDTH / 2, 220);
        ctx.font = `600 26px ${FONT}`;
        ctx.fillStyle = "#1e3a8a";
        ctx.fillText(`Puan: ${score}   Doğru: ${correct}   Yanlış: ${wrong}`, WIDTH / 2, 275);
        ctx.font = `600 20px ${FONT}`;
        ctx.fillStyle = "#475569";
        ctx.fillText("Tekrar oynamak için düğmeye dokun.", WIDTH / 2, 320);
      } else {
        ctx.fillStyle = "#0d4d27";
        ctx.font = `700 36px ${FONT}`;
        ctx.fillText("Bulutları vurmaya hazır mısın?", WIDTH / 2, 230);
        ctx.font = `600 21px ${FONT}`;
        ctx.fillStyle = "#475569";
        ctx.fillText("Hedef sayıyı seç ve “Oyunu Başlat”a dokun.", WIDTH / 2, 295);
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `700 36px ${FONT}`;
      for (const t of floatTexts) {
        ctx.globalAlpha = Math.min(1, t.life / 25);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#ffffff";
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    /* ---------- OYUN AKIŞI ---------- */
    function startGame() {
      clearInterval(timerInterval);
      selectedNumber = Number(numberSelect.value);
      timeLeft = Number(timeSelect.value);
      score = 0; correct = 0; wrong = 0;
      gameRunning = true; gameOver = false;
      particles = []; floatTexts = [];

      scoreElement.textContent = "0";
      correctElement.textContent = "0";
      wrongElement.textContent = "0";
      timerElement.textContent = timeLeft;
      mission.textContent = `Görev: Üzerinde ${selectedNumber} yazan bulutları vur!`;

      startButton.disabled = true;
      numberSelect.disabled = true;
      timeSelect.disabled = true;
      startButton.textContent = "Oyun Oynanıyor";

      createClouds();
      resetBall();

      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      clearInterval(timerInterval);
      gameRunning = false; gameOver = true;
      resetBall();
      startButton.disabled = false;
      numberSelect.disabled = false;
      timeSelect.disabled = false;
      startButton.textContent = "Tekrar Oyna";
      mission.textContent = `Süre bitti! Puanın: ${score}`;
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min(3, Math.max(0.2, (now - lastTime) / 16.667));
      lastTime = now;
      tick += dt;

      drawSky();
      drawBirds(dt);
      drawHills();
      for (const t of backTrees) drawTree(t, true);
      drawGround();
      drawFlowers();
      for (const t of frontTrees) drawTree(t, false);
      drawBushes();
      drawMushrooms();
      drawButterflies(dt);

      updateClouds(dt);
      if (gameRunning) updateBall(dt);
      updateParticles(dt);
      updateFloatTexts(dt);

      for (const c of clouds) drawCloud(c);
      drawSling();
      drawParticles();
      drawFloatTexts();
      drawTargetBadge();
      drawOverlay();

      requestAnimationFrame(gameLoop);
    }

    createScenery();
    createClouds();
    startButton.addEventListener("click", startGame);
    if (document.fonts && document.fonts.load) document.fonts.load(`700 20px PoppinsA`);
    requestAnimationFrame(gameLoop);
  </script>

     aşağıdaki "dijitalogretmen" kısmını kendi GoatCounter kodunuzla değiştirin. -->
<script data-goatcounter="https://dijitalogretmen.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
