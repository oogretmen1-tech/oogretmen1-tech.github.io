<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orman Bulutları</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      font-family: 'Andika', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 8%, #8ad9f7 0%, transparent 45%),
        linear-gradient(to bottom, #4fb6e8 0%, #a9e4f7 42%, #77c85f 42%, #1c5a2c 100%);
      display: flex;
      justify-content: center;
      color: #123f22;
    }

    .game {
      width: min(1000px, 100%);
      text-align: center;
    }

    h1 {
      margin: 5px 0 12px;
      color: #0a4d2c;
      font-size: clamp(26px, 6vw, 42px);
      text-shadow: 2px 3px #ffffff;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #12833f;
      border-radius: 18px;
      box-shadow: 0 5px 0 #0d4d27;
      margin-bottom: 12px;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }

    select {
      padding: 8px 10px;
      border: 2px solid #12833f;
      border-radius: 9px;
      background: #fff;
      color: #123f22;
      font-size: 15px;
      font-weight: bold;
    }

    button {
      padding: 10px 22px;
      border: 0;
      border-radius: 25px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #0d4d27;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d4d27;
    }

    button:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: default;
    }

    .mission {
      padding: 10px;
      margin-bottom: 10px;
      background: #fff7ae;
      border: 3px solid #eab308;
      border-radius: 14px;
      box-shadow: 0 4px 0 #ca8a04;
      color: #6b3f10;
      font-size: 19px;
      font-weight: bold;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .box {
      padding: 8px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #12833f;
      border-radius: 12px;
      font-weight: bold;
    }

    .box strong {
      display: block;
      margin-top: 3px;
      color: #0d4d27;
      font-size: 22px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #9ddff8;
      border: 5px solid #0d4d27;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      touch-action: none;
      cursor: crosshair;
    }

    .help {
      margin-top: 10px;
      padding: 9px;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .imza {
      margin-top: 10px;
      padding-bottom: 6px;
      color: #ffffff;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
    }

    @media (max-width: 600px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
      .control { width: 100%; justify-content: space-between; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="game">
    <h1>🌲 Orman Bulutları 🎯</h1>

    <div class="controls">
      <div class="control">
        <label for="numberSelect">🎯 Hedef Sayı:</label>
        <select id="numberSelect"></select>
      </div>

      <div class="control">
        <label for="timeSelect">⏱️ Süre:</label>
        <select id="timeSelect">
          <option value="30">30 saniye</option>
          <option value="60">60 saniye</option>
          <option value="90">90 saniye</option>
        </select>
      </div>

      <button id="startButton">Oyunu Başlat</button>
    </div>

    <div class="mission" id="mission">
      Hedef sayıyı seçip oyunu başlatın.
    </div>

    <div class="dashboard">
      <div class="box">Puan<strong id="score">0</strong></div>
      <div class="box">Süre<strong id="timer">30</strong></div>
      <div class="box">Doğru<strong id="correct">0</strong></div>
      <div class="box">Yanlış<strong id="wrong">0</strong></div>
    </div>

    <canvas id="gameCanvas" width="1000" height="620"></canvas>

    <div class="help">
      Taşı basılı tutup geriye çek ve bırak. Sarı bulutlar hedef sayıyı gösterir.
    </div>

    <div class="imza">Hazırlayan: Hasan Tutuş</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const numberSelect = document.getElementById("numberSelect");
    const timeSelect = document.getElementById("timeSelect");
    const startButton = document.getElementById("startButton");

    const mission = document.getElementById("mission");
    const scoreElement = document.getElementById("score");
    const timerElement = document.getElementById("timer");
    const correctElement = document.getElementById("correct");
    const wrongElement = document.getElementById("wrong");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // Sayı seçenekleri
    for (let i = 1; i <= 20; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = i;
      numberSelect.appendChild(option);
    }
    numberSelect.value = "10";

    const sling = { x: 500, y: 535 };

    const ball = {
      x: sling.x,
      y: sling.y,
      radius: 17,
      vx: 0,
      vy: 0,
      dragging: false,
      flying: false
    };

    let clouds = [];
    let backTrees = [];
    let frontTrees = [];
    let bushes = [];
    let flowers = [];
    let birds = [];
    let particles = [];
    let floatTexts = [];

    let selectedNumber = 10;
    let gameRunning = false;
    let score = 0;
    let correct = 0;
    let wrong = 0;
    let timeLeft = 30;
    let timerInterval = null;

    const CLOUD_COUNT = 8;
    const MIN_TARGET = 3;   // Ekranda en az bu kadar hedef bulut bulunur

    /* ---------- BULUTLAR ---------- */

    function getDifferentNumber() {
      let number;
      do {
        number = Math.floor(Math.random() * 20) + 1;
      } while (number === selectedNumber);
      return number;
    }

    // Ekranda ve yolda kaç hedef bulut var?
    function targetCount(exclude) {
      let sayi = 0;

      clouds.forEach(cloud => {
        if (cloud === exclude) return;

        if (cloud.respawning) {
          if (cloud.nextNumber === selectedNumber) sayi++;
        } else if (cloud.visible && cloud.number === selectedNumber) {
          sayi++;
        }
      });

      return sayi;
    }

    /*
      Yeni bulutun sayısını seçer.
      Ekranda yeterli hedef bulut yoksa yenisi hedef sayı olur.
    */
    function pickNumber(exclude) {
      if (targetCount(exclude) < MIN_TARGET) return selectedNumber;
      return Math.random() < 0.35 ? selectedNumber : getDifferentNumber();
    }

    function makeCloud(number, atEdge) {
      const fromLeft = Math.random() < 0.5;

      return {
        x: atEdge ? (fromLeft ? -110 : WIDTH + 110)
                  : 120 + Math.random() * (WIDTH - 240),
        y: 70 + Math.random() * 250,
        radius: 38,
        number: number,
        direction: fromLeft ? 1 : -1,
        speed: 0.9 + Math.random() * 1.2,
        bob: Math.random() * Math.PI * 2,
        visible: true,
        respawning: false,
        respawnTime: 0,
        nextNumber: null
      };
    }

    function createClouds() {
      clouds = [];

      // İlk üç bulut kesinlikle hedef sayıyı taşır
      for (let i = 0; i < MIN_TARGET; i++) {
        clouds.push(makeCloud(selectedNumber, false));
      }

      for (let i = MIN_TARGET; i < CLOUD_COUNT; i++) {
        clouds.push(makeCloud(getDifferentNumber(), false));
      }
    }

    // Bulut vurulunca kaybolur, kısa süre sonra kenardan yenisi girer
    function popCloud(cloud) {
      if (!cloud.visible || cloud.respawning) return;

      createParticles(
        cloud.x,
        cloud.y,
        cloud.number === selectedNumber ? "#ffd21f" : "#ef4444"
      );

      cloud.visible = false;
      cloud.respawning = true;
      cloud.respawnTime = performance.now() + 350;
      cloud.nextNumber = null;
      cloud.nextNumber = pickNumber(cloud);
    }

    function respawnCloud(cloud) {
      const fromLeft = Math.random() < 0.5;

      cloud.number = (cloud.nextNumber !== null)
        ? cloud.nextNumber
        : pickNumber(cloud);

      cloud.x = fromLeft ? -110 : WIDTH + 110;
      cloud.y = 70 + Math.random() * 250;
      cloud.direction = fromLeft ? 1 : -1;
      cloud.speed = 0.9 + Math.random() * 1.2;
      cloud.visible = true;
      cloud.respawning = false;
      cloud.respawnTime = 0;
      cloud.nextNumber = null;
    }

    function updateClouds() {
      const now = performance.now();

      clouds.forEach(cloud => {
        if (cloud.respawning) {
          if (now >= cloud.respawnTime) respawnCloud(cloud);
          return;
        }

        if (!cloud.visible) return;

        cloud.x += cloud.speed * cloud.direction;
        cloud.bob += 0.02;

        // Ekrandan çıkan bulut karşı taraftan yeniden girer
        if (cloud.x < -160 || cloud.x > WIDTH + 160) {
          cloud.visible = false;
          cloud.respawning = true;
          cloud.respawnTime = now + 200;
          cloud.nextNumber = null;
          cloud.nextNumber = pickNumber(cloud);
        }
      });
    }

    /* ---------- SAPAN ---------- */

    function resetBall() {
      ball.x = sling.x;
      ball.y = sling.y;
      ball.vx = 0;
      ball.vy = 0;
      ball.dragging = false;
      ball.flying = false;
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * WIDTH / rect.width,
        y: (event.clientY - rect.top) * HEIGHT / rect.height
      };
    }

    function distance(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }

    canvas.addEventListener("pointerdown", function (event) {
      if (!gameRunning || ball.flying) return;

      const position = getPointerPosition(event);

      if (distance(position.x, position.y, ball.x, ball.y) < 55) {
        ball.dragging = true;
        canvas.setPointerCapture(event.pointerId);
      }
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!ball.dragging) return;

      const position = getPointerPosition(event);

      let dx = position.x - sling.x;
      let dy = position.y - sling.y;
      let length = Math.hypot(dx, dy);

      const maxPull = 125;

      if (length > maxPull) {
        dx = dx / length * maxPull;
        dy = dy / length * maxPull;
      }

      ball.x = sling.x + dx;
      ball.y = sling.y + dy;

      if (ball.y < sling.y - 110) ball.y = sling.y - 110;
    });

    canvas.addEventListener("pointerup", function (event) {
      if (!ball.dragging) return;

      ball.dragging = false;
      ball.flying = true;

      ball.vx = (sling.x - ball.x) * 0.18;
      ball.vy = (sling.y - ball.y) * 0.18;

      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    });

    canvas.addEventListener("pointercancel", resetBall);

    function checkCollisions() {
      for (const cloud of clouds) {
        if (!cloud.visible || cloud.respawning) continue;

        const hit = distance(ball.x, ball.y, cloud.x, cloud.y);

        if (hit < ball.radius + cloud.radius) {
          if (cloud.number === selectedNumber) {
            score += 10;
            correct++;
            addFloatText("+10", cloud.x, cloud.y, "#f7c331");
          } else {
            score = Math.max(0, score - 3);
            wrong++;
            addFloatText("-3", cloud.x, cloud.y, "#ef4444");
          }

          scoreElement.textContent = score;
          correctElement.textContent = correct;
          wrongElement.textContent = wrong;

          popCloud(cloud);
          resetBall();
          return;
        }
      }
    }

    /* ---------- EFEKTLER ---------- */

    function createParticles(x, y, color) {
      for (let i = 0; i < 24; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: 3 + Math.random() * 5,
          life: 35,
          color: color
        });
      }
    }

    function updateParticles() {
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.08;
        particle.life--;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function addFloatText(text, x, y, color) {
      floatTexts.push({ text, x, y, color, life: 45 });
    }

    function updateFloatTexts() {
      for (const t of floatTexts) {
        t.y -= 1.2;
        t.life--;
      }
      floatTexts = floatTexts.filter(t => t.life > 0);
    }

    /* ---------- ORMAN GÖRSELİ ---------- */

    function createScenery() {
      backTrees = [];
      frontTrees = [];
      bushes = [];
      flowers = [];
      birds = [];

      // Arka sıra ağaçlar (soluk, küçük)
      for (let i = 0; i < 22; i++) {
        backTrees.push({
          x: 10 + i * 48 + Math.random() * 18,
          y: 405 + Math.random() * 12,
          scale: 0.5 + Math.random() * 0.22,
          type: Math.random() < 0.6 ? "cam" : "round"
        });
      }

      // Ön sıra ağaçlar
      for (let i = 0; i < 13; i++) {
        frontTrees.push({
          x: 30 + i * 80 + Math.random() * 24,
          y: 452 + Math.random() * 26,
          scale: 0.85 + Math.random() * 0.45,
          type: i % 3 === 0 ? "round" : "cam"
        });
      }

      for (let i = 0; i < 12; i++) {
        bushes.push({
          x: Math.random() * WIDTH,
          y: 500 + Math.random() * 90,
          scale: 0.6 + Math.random() * 0.7
        });
      }

      for (let i = 0; i < 26; i++) {
        flowers.push({
          x: Math.random() * WIDTH,
          y: 480 + Math.random() * 125,
          color: ["#fff06b", "#ff8fb1", "#ffffff", "#d59bff"][Math.floor(Math.random() * 4)]
        });
      }

      for (let i = 0; i < 3; i++) {
        birds.push({
          x: Math.random() * WIDTH,
          y: 60 + Math.random() * 70,
          speed: 0.35 + Math.random() * 0.4,
          size: 7 + Math.random() * 5
        });
      }
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, "#3aa7e0");
      sky.addColorStop(0.35, "#8fd6f2");
      sky.addColorStop(0.62, "#d9f3ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Güneş ve halesi
      const halo = ctx.createRadialGradient(105, 85, 10, 105, 85, 110);
      halo.addColorStop(0, "rgba(255,244,170,0.95)");
      halo.addColorStop(1, "rgba(255,244,170,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(105, 85, 110, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.arc(105, 85, 46, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMountains() {
      // Uzak dağlar
      ctx.fillStyle = "#7fa8a0";
      ctx.beginPath();
      ctx.moveTo(0, 410);
      ctx.lineTo(150, 268);
      ctx.lineTo(300, 402);
      ctx.lineTo(470, 240);
      ctx.lineTo(640, 400);
      ctx.lineTo(810, 275);
      ctx.lineTo(1000, 410);
      ctx.lineTo(1000, 470);
      ctx.lineTo(0, 470);
      ctx.closePath();
      ctx.fill();

      // Kar başlıkları
      ctx.fillStyle = "#eef8fb";
      [[150, 268], [470, 240], [810, 275]].forEach(function (tepe) {
        ctx.beginPath();
        ctx.moveTo(tepe[0], tepe[1]);
        ctx.lineTo(tepe[0] - 26, tepe[1] + 26);
        ctx.lineTo(tepe[0] - 12, tepe[1] + 20);
        ctx.lineTo(tepe[0] + 5, tepe[1] + 28);
        ctx.lineTo(tepe[0] + 26, tepe[1] + 26);
        ctx.closePath();
        ctx.fill();
      });

      // Yakın tepeler
      ctx.fillStyle = "#3f8b4a";
      ctx.beginPath();
      ctx.moveTo(0, 430);
      ctx.quadraticCurveTo(180, 372, 380, 428);
      ctx.quadraticCurveTo(600, 480, 780, 420);
      ctx.quadraticCurveTo(900, 384, 1000, 428);
      ctx.lineTo(1000, HEIGHT);
      ctx.lineTo(0, HEIGHT);
      ctx.closePath();
      ctx.fill();
    }

    function drawGround() {
      const ground = ctx.createLinearGradient(0, 455, 0, HEIGHT);
      ground.addColorStop(0, "#67c153");
      ground.addColorStop(0.5, "#3ea344");
      ground.addColorStop(1, "#1d6b2f");
      ctx.fillStyle = ground;
      ctx.beginPath();
      ctx.moveTo(0, 478);
      ctx.quadraticCurveTo(250, 452, 520, 476);
      ctx.quadraticCurveTo(780, 500, 1000, 466);
      ctx.lineTo(1000, HEIGHT);
      ctx.lineTo(0, HEIGHT);
      ctx.closePath();
      ctx.fill();

      // Çim tutamları
      ctx.strokeStyle = "rgba(20,90,40,0.35)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 90; i++) {
        const x = (i * 37) % WIDTH;
        const y = 495 + ((i * 53) % 110);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 4, y - 11);
        ctx.moveTo(x, y);
        ctx.lineTo(x + 4, y - 12);
        ctx.stroke();
      }

      // Çiçekler
      for (const flower of flowers) {
        ctx.fillStyle = flower.color;
        ctx.beginPath();
        ctx.arc(flower.x, flower.y, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f6c343";
        ctx.beginPath();
        ctx.arc(flower.x, flower.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTree(tree, faded) {
      const x = tree.x;
      const y = tree.y;
      const s = tree.scale;

      ctx.save();
      if (faded) ctx.globalAlpha = 0.72;

      // Gövde
      ctx.fillStyle = faded ? "#6b4a2a" : "#7a4f26";
      ctx.fillRect(x - 6 * s, y, 12 * s, 62 * s);

      if (tree.type === "cam") {
        // Çam ağacı: üç katlı üçgen
        const katlar = [
          { dy: -78, w: 34, h: 46 },
          { dy: -52, w: 44, h: 50 },
          { dy: -24, w: 54, h: 52 }
        ];

        katlar.forEach(function (kat, index) {
          ctx.fillStyle = faded
            ? "#3d7d47"
            : (index === 0 ? "#3f9b4c" : index === 1 ? "#2f8942" : "#22753a");
          ctx.beginPath();
          ctx.moveTo(x, y + kat.dy * s - kat.h * s * 0.55);
          ctx.lineTo(x - kat.w * s, y + kat.dy * s + kat.h * s * 0.35);
          ctx.lineTo(x + kat.w * s, y + kat.dy * s + kat.h * s * 0.35);
          ctx.closePath();
          ctx.fill();
        });
      } else {
        // Yuvarlak taçlı ağaç
        ctx.fillStyle = faded ? "#3d7d47" : "#2f8942";
        ctx.beginPath();
        ctx.arc(x, y - 40 * s, 34 * s, 0, Math.PI * 2);
        ctx.arc(x - 26 * s, y - 16 * s, 26 * s, 0, Math.PI * 2);
        ctx.arc(x + 26 * s, y - 16 * s, 26 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = faded ? "#4c9556" : "#46ab55";
        ctx.beginPath();
        ctx.arc(x - 9 * s, y - 48 * s, 16 * s, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBushes() {
      for (const bush of bushes) {
        const s = bush.scale;
        ctx.fillStyle = "#2c8040";
        ctx.beginPath();
        ctx.arc(bush.x, bush.y, 17 * s, 0, Math.PI * 2);
        ctx.arc(bush.x - 15 * s, bush.y + 5 * s, 12 * s, 0, Math.PI * 2);
        ctx.arc(bush.x + 15 * s, bush.y + 5 * s, 12 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#3ea052";
        ctx.beginPath();
        ctx.arc(bush.x - 5 * s, bush.y - 6 * s, 8 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBirds() {
      ctx.strokeStyle = "rgba(45,72,90,0.55)";
      ctx.lineWidth = 2;

      for (const bird of birds) {
        bird.x += bird.speed;
        if (bird.x > WIDTH + 30) bird.x = -30;

        const s = bird.size;
        ctx.beginPath();
        ctx.moveTo(bird.x - s, bird.y);
        ctx.quadraticCurveTo(bird.x - s / 2, bird.y - s / 2, bird.x, bird.y);
        ctx.quadraticCurveTo(bird.x + s / 2, bird.y - s / 2, bird.x + s, bird.y);
        ctx.stroke();
      }
    }

    function drawCloud(cloud) {
      if (!cloud.visible || cloud.respawning) return;

      const x = cloud.x;
      const y = cloud.y + Math.sin(cloud.bob) * 4;
      const target = cloud.number === selectedNumber;

      ctx.save();

      if (target) {
        ctx.shadowColor = "#ffd000";
        ctx.shadowBlur = 26;
      }

      ctx.fillStyle = target ? "#fff0a0" : "#ffffff";
      ctx.strokeStyle = target ? "#e0a90d" : "#a8dff2";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.arc(x - 32, y + 8, 24, 0, Math.PI * 2);
      ctx.arc(x - 6, y - 12, 30, 0, Math.PI * 2);
      ctx.arc(x + 26, y - 2, 26, 0, Math.PI * 2);
      ctx.arc(x + 44, y + 12, 19, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 52, y + 6);
      ctx.lineTo(x + 52, y + 6);
      ctx.lineTo(x + 52, y + 34);
      ctx.lineTo(x - 52, y + 34);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;

      // Hedef bulutta küçük yıldız
      if (target) {
        ctx.fillStyle = "#f4b400";
        ctx.font = "bold 18px Andika, Arial";
        ctx.textAlign = "center";
        ctx.fillText("★", x - 42, y - 6);
      }

      ctx.fillStyle = target ? "#5a3c00" : "#124a2a";
      ctx.font = "bold 30px Andika, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cloud.number, x, y + 18);

      ctx.restore();
    }

    function drawSling() {
      // Toprak tümsek
      ctx.fillStyle = "#4a7c34";
      ctx.beginPath();
      ctx.ellipse(sling.x, sling.y + 82, 66, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#7a4f26";
      ctx.lineWidth = 16;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(sling.x, sling.y + 78);
      ctx.lineTo(sling.x, sling.y + 10);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(sling.x, sling.y + 25);
      ctx.lineTo(sling.x - 40, sling.y - 20);
      ctx.moveTo(sling.x, sling.y + 25);
      ctx.lineTo(sling.x + 40, sling.y - 20);
      ctx.stroke();

      ctx.strokeStyle = "#d62828";
      ctx.lineWidth = 6;

      ctx.beginPath();
      ctx.moveTo(sling.x - 40, sling.y - 20);
      ctx.lineTo(ball.x, ball.y);
      ctx.moveTo(sling.x + 40, sling.y - 20);
      ctx.lineTo(ball.x, ball.y);
      ctx.stroke();

      // Nişan çizgisi
      if (ball.dragging) {
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 3;
        ctx.setLineDash([9, 9]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(
          sling.x + (sling.x - ball.x) * 2.6,
          sling.y + (sling.y - ball.y) * 2.6
        );
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Taş
      ctx.fillStyle = "#4b5563";
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(ball.x - 5, ball.y - 5, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = particle.life / 35;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      ctx.textAlign = "center";
      ctx.font = "bold 30px Andika, Arial";

      for (const t of floatTexts) {
        ctx.globalAlpha = Math.min(1, t.life / 25);
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
      }

      ctx.globalAlpha = 1;
    }

    /* ---------- OYUN AKIŞI ---------- */

    function startGame() {
      clearInterval(timerInterval);

      selectedNumber = Number(numberSelect.value);
      timeLeft = Number(timeSelect.value);

      score = 0;
      correct = 0;
      wrong = 0;
      gameRunning = true;
      particles = [];
      floatTexts = [];

      scoreElement.textContent = "0";
      correctElement.textContent = "0";
      wrongElement.textContent = "0";
      timerElement.textContent = timeLeft;

      mission.textContent = `🎯 Görev: Üzerinde ${selectedNumber} yazan bulutları vur!`;

      startButton.disabled = true;
      numberSelect.disabled = true;
      timeSelect.disabled = true;
      startButton.textContent = "Oyun Oynanıyor";

      createClouds();
      resetBall();

      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      clearInterval(timerInterval);

      gameRunning = false;
      resetBall();

      startButton.disabled = false;
      numberSelect.disabled = false;
      timeSelect.disabled = false;
      startButton.textContent = "Tekrar Oyna";

      mission.textContent = `⏰ Süre bitti! Puanınız: ${score}`;
    }

    function gameLoop() {
      drawSky();
      drawBirds();
      drawMountains();

      for (const tree of backTrees) drawTree(tree, true);

      drawGround();

      for (const tree of frontTrees) drawTree(tree, false);

      drawBushes();

      updateClouds();

      if (gameRunning && ball.flying) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += 0.16;

        checkCollisions();

        if (ball.x < -70 || ball.x > WIDTH + 70 || ball.y < -400 || ball.y > HEIGHT + 70) {
          resetBall();
        }
      }

      updateParticles();
      updateFloatTexts();

      for (const cloud of clouds) drawCloud(cloud);

      drawSling();
      drawParticles();
      drawFloatTexts();

      requestAnimationFrame(gameLoop);
    }

    createScenery();
    selectedNumber = 10;
    createClouds();

    startButton.addEventListener("click", startGame);

    gameLoop();
  </script>
</body>
</html>
