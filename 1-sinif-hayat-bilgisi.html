<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. Sınıf Hayat Bilgisi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --turuncu:#ff754e;
  --mavi:#4285d4;
  --yesil:#55af68;
  --kirmizi:#ed5757;
  --mor:#9b59b6;
  --sari:#ffc928;
  --koyu:#4c342b;
}

html,body,body *{
  font-family:'Andika','Andika New Basic',Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Andika','Andika New Basic',Arial,sans-serif;
  background:linear-gradient(135deg,#fff4de,#e8f7ff);
  color:var(--koyu);
}

/* ÜST BAŞLIK */

header{
  padding:25px 15px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#ff7043,#ffbd28);
  box-shadow:0 4px 12px rgba(0,0,0,.22);
}

header h1{
  margin:7px 0;
  font-size:clamp(28px,5vw,45px);
  text-shadow:2px 2px 3px rgba(0,0,0,.2);
}

header p{
  margin:5px;
  font-size:18px;
}

/* SEKMELER */

.tabs{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  padding:13px;
  background:white;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 3px 9px rgba(0,0,0,.16);
}

.tabs button{
  border:none;
  border-radius:17px;
  padding:11px 13px;
  font-size:15px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  transition:.2s;
  touch-action:manipulation;
}

.tabs button:hover{
  transform:scale(1.05);
}

.tabs button.active{
  outline:4px solid white;
  box-shadow:0 0 0 4px #ff7043;
}

/* ANA ALAN */

main{
  width:min(1150px,94%);
  margin:23px auto;
}

.unit-title{
  background:white;
  text-align:center;
  padding:23px;
  border-radius:27px;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
}

.unit-emoji{
  font-size:70px;
}

.unit-title h2{
  margin:6px 0;
  font-size:clamp(25px,4vw,36px);
}

.unit-title p{
  margin:7px auto;
  max-width:800px;
  line-height:1.55;
  font-size:18px;
}

/* KONU BAŞLIKLARI */

.section-box{
  background:white;
  padding:22px;
  margin-top:22px;
  border-radius:25px;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
}

.section-box h2{
  margin-top:0;
  text-align:center;
  font-size:27px;
}

.topic-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.topic-card{
  background:#fff9ed;
  border:3px solid #ffe0a5;
  border-radius:20px;
  padding:16px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  min-height:177px;
}

.topic-card:hover{
  transform:translateY(-5px);
  background:#fff2cd;
}

.topic-card.open{
  background:#e8f5ff;
  border-color:#90caf9;
}

.topic-icon{
  font-size:48px;
}

.topic-card h3{
  margin:8px 0;
  font-size:19px;
}

.topic-short{
  font-size:15px;
  line-height:1.4;
}

.topic-detail{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:2px dashed #90caf9;
  font-size:15px;
  line-height:1.55;
  text-align:left;
}

.topic-card.open .topic-detail{
  display:block;
}

/* DİNLEME */

.lesson-text{
  background:#fff9e5;
  border-left:8px solid var(--sari);
  border-radius:14px;
  padding:17px;
  font-size:18px;
  line-height:1.75;
}

.button-row{
  display:flex;
  justify-content:center;
  gap:11px;
  flex-wrap:wrap;
  margin-top:15px;
}

button.general-button{
  border:none;
  border-radius:16px;
  padding:12px 17px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  touch-action:manipulation;
}

.listen-button{background:var(--mavi);}
.stop-button{background:var(--kirmizi);}

/* OYUN MENÜSÜ */

.game-menu{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:17px;
}

.game-menu button{
  border:none;
  border-radius:17px;
  padding:12px 15px;
  font-weight:bold;
  font-size:16px;
  color:white;
  cursor:pointer;
  touch-action:manipulation;
}

.balloon-button{background:#f06a57;}
.order-button{background:#50a965;}
.memory-button{background:#8c55b0;}

.game-area{
  min-height:370px;
  padding:18px;
  text-align:center;
  background:#f4fbff;
  border:3px dashed #91c8eb;
  border-radius:21px;
}

.game-message{
  min-height:38px;
  font-size:21px;
  font-weight:bold;
  color:#70483b;
}

/* BALON OYUNU */

.balloon-info{
  font-size:17px;
  margin:10px auto 18px;
}

.balloon-board{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-end;
  gap:42px 18px;
  padding:22px 5px 45px;
}

.balloon{
  width:164px;
  min-height:150px;
  padding:20px 14px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border:4px solid rgba(255,255,255,.7);
  border-radius:50% 50% 46% 46%;
  color:white;
  font-size:15px;
  font-weight:bold;
  line-height:1.35;
  box-shadow:inset -11px -11px rgba(0,0,0,.12),0 6px 9px rgba(0,0,0,.22);
  cursor:pointer;
  transition:.25s;
  touch-action:manipulation;
}

.balloon:hover{
  transform:translateY(-6px) scale(1.04);
}

.balloon:after{
  content:"";
  position:absolute;
  width:3px;
  height:38px;
  bottom:-42px;
  background:#7c5a4a;
}

.balloon:nth-child(5n+1){background:#ef5350;}
.balloon:nth-child(5n+2){background:#42a5f5;}
.balloon:nth-child(5n+3){background:#ab47bc;}
.balloon:nth-child(5n+4){background:#ff9800;}
.balloon:nth-child(5n+5){background:#26a69a;}

.balloon.popped{
  opacity:0;
  transform:scale(1.7) rotate(25deg);
  pointer-events:none;
}

/* SIRALAMA OYUNU */

.order-help{
  background:#fff3cd;
  border-radius:13px;
  padding:12px;
  font-size:16px;
  margin:10px auto 18px;
  max-width:700px;
}

.order-board{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:13px;
  margin:20px auto;
}

.order-card{
  width:175px;
  min-height:130px;
  border:4px solid #ef9c42;
  border-radius:19px;
  background:#ffe0a3;
  padding:13px;
  font-size:17px;
  font-weight:bold;
  color:#56372b;
  cursor:pointer;
  box-shadow:0 5px 8px rgba(0,0,0,.18);
  touch-action:manipulation;
}

.order-card:hover{
  transform:translateY(-3px);
}

.order-card.selected{
  background:#fff176;
  border-color:#2d8ae0;
  outline:5px solid #90caf9;
  transform:scale(1.05);
}

.order-number{
  display:block;
  font-size:29px;
  margin-bottom:6px;
}

/* KART ÇEVİRME */

.memory-board{
  display:grid;
  grid-template-columns:repeat(4,minmax(110px,150px));
  justify-content:center;
  gap:14px;
  margin:20px auto;
}

.memory-card{
  height:130px;
  cursor:pointer;
  perspective:900px;
  touch-action:manipulation;
}

.memory-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s;
}

.memory-card.open .memory-inner,
.memory-card.matched .memory-inner{
  transform:rotateY(180deg);
}

.memory-front,
.memory-back{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  backface-visibility:hidden;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
}

.memory-front{
  color:white;
  background:linear-gradient(135deg,#5e9de0,#8e65bb);
  font-size:48px;
}

.memory-back{
  background:white;
  border:4px solid #a5d6a7;
  transform:rotateY(180deg);
  flex-direction:column;
  padding:8px;
  font-size:42px;
}

.memory-word{
  margin-top:5px;
  color:#513b31;
  font-size:15px;
  font-weight:bold;
}

.memory-card.matched .memory-back{
  background:#d8f4da;
  border-color:#55af68;
}

/* PUAN */

.score-area{
  margin-top:17px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.score-box{
  padding:9px 15px;
  border-radius:18px;
  background:#fff7c9;
  border:3px solid #ffd54f;
  font-size:18px;
  font-weight:bold;
}

footer{
  margin-top:25px;
  padding:23px;
  text-align:center;
  background:#513a31;
  color:white;
}

@media(max-width:650px){
  .tabs{
    position:relative;
  }

  .tabs button{
    font-size:13px;
    padding:10px;
  }

  .memory-board{
    grid-template-columns:repeat(2,minmax(120px,150px));
  }

  .balloon{
    width:140px;
    min-height:135px;
    font-size:14px;
  }

  .order-card{
    width:145px;
    min-height:115px;
    font-size:15px;
  }

  .lesson-text{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <div style="font-size:54px">🏫 📚 🌈 🎈</div>
  <h1>1. Sınıf Hayat Bilgisi</h1>
  <p>Konuları öğren, dinle, oyunlarla pekiştir!</p>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <section class="unit-title">
    <div id="unitEmoji" class="unit-emoji"></div>
    <h2 id="unitName"></h2>
    <p id="unitDescription"></p>
  </section>

  <section class="section-box">
    <h2>📚 Konu Başlıklarımız</h2>
    <p style="text-align:center">
      Bir konu kartına basarak ayrıntılı açıklamasını okuyabilirsin.
    </p>
    <div class="topic-grid" id="topicGrid"></div>
  </section>

  <section class="section-box">
    <h2>🎧 Ünitenin Konu Anlatımı</h2>
    <div id="lessonText" class="lesson-text"></div>

    <div class="button-row">
      <button class="general-button listen-button" onclick="readLesson()">
        🔊 Konu Anlatımını Dinle
      </button>
      <button class="general-button stop-button" onclick="stopVoice()">
        ⏹ Dinlemeyi Durdur
      </button>
    </div>
  </section>

  <section class="section-box">
    <h2>🎮 Oyun Alanı</h2>

    <div class="game-menu">
      <button class="balloon-button" onclick="startBalloonGame()">
        🎈 Doğru Balonu Patlat
      </button>

      <button class="order-button" onclick="startOrderGame()">
        🚂 Sırala ve Düzenle
      </button>

      <button class="memory-button" onclick="startMemoryGame()">
        🃏 Kart Çevirme
      </button>
    </div>

    <div class="game-area">
      <div class="game-message" id="gameMessage">
        Bir oyun seçerek başlayabilirsin! 🌟
      </div>
      <div id="gameContent"></div>
    </div>

    <div class="score-area">
      <div class="score-box">⭐ Puan: <span id="score">0</span></div>
      <div class="score-box">🏆 Yıldız: <span id="stars">0</span></div>
    </div>
  </section>
</main>

<footer>
  🌟 Hayat Bilgisi öğrenmek çok güzel! 🌟
</footer>

<script>
const units = [
  {
    title:"1. Ünite: Okulumuzda Hayat",
    emoji:"🏫",
    color:"#ff7043",
    description:"Okulumuza uyum sağlıyor, arkadaşlarımızla tanışıyor ve okul kurallarını öğreniyoruz.",
    lesson:`Okul, bilgi öğrendiğimiz ve arkadaşlarımızla güzel zaman geçirdiğimiz yerdir. Okula geldiğimizde öğretmenimizi ve arkadaşlarımızı selamlarız. Sınıfta konuşmak istediğimizde parmak kaldırır, arkadaşımız konuşurken onu dikkatle dinleriz. Koridorlarda koşmayız, sıraya girerken birbirimizi itmeyiz. Okulumuzdaki Türk bayrağına, Atatürk resmine ve İstiklâl Marşı'na saygı gösteririz. Ders programımıza bakarak kitaplarımızı, defterlerimizi ve kalemlerimizi çantamıza koyarız.`,
    topics:[
      ["🤝","Tanışıyoruz","Kendimizi tanıtır, arkadaşlarımızla tanışırız.","Adımızı söyler, karşımızdaki kişinin adını sorarız. Tanışırken gülümsemek ve nazik konuşmak güzel bir davranıştır."],
      ["🧒","Fiziksel Özelliklerim","Hepimizin dış görünüşü farklı olabilir.","Saç rengimiz, göz rengimiz, boyumuz ve yüzümüz birbirinden farklı olabilir. Bu farklılıklar bizi özel yapar."],
      ["🏫","Okulumuzu Tanıyoruz","Okuldaki bölümlerin görevlerini öğreniriz.","Sınıfta ders işleriz. Kantinde yiyecek ve içecek alırız. Lavaboda ellerimizi yıkarız. Müdür odasında okul müdürü çalışır."],
      ["🇹🇷","Bayrağımız ve Atatürk","Bayrağımızı, Atatürk'ü ve İstiklâl Marşı'nı tanırız.","Türk bayrağı kırmızı renktedir; üzerinde beyaz ay ve yıldız bulunur. Atatürk, Cumhuriyetimizin kurucusudur. İstiklâl Marşı okunurken saygıyla dinleriz."],
      ["📏","Okul Kuralları","Sınıfta ve okulda kurallara uyarız.","Söz almak için parmak kaldırırız. Arkadaşlarımızın eşyalarını izinsiz almayız. Çöpleri çöp kutusuna atar, okul eşyalarını dikkatli kullanırız."],
      ["🎒","Çantamı Hazırlıyorum","Ders programına göre çantamızı düzenleriz.","Ertesi gün hangi derslerimiz varsa o derslerin kitabını ve defterini çantamıza koyarız. Kalem kutumuzu da kontrol ederiz."]
    ],
    good:["Söz almak için parmak kaldırmak","Arkadaşıma yardım etmek","Sırada beklemek","Çantamı düzenli hazırlamak"],
    bad:["Sınıfta bağırmak","Arkadaşımı itmek","Yere çöp atmak","İzinsiz eşya almak"],
    order:["Okula gelirim","Sınıfa girip selam veririm","Dersimi dikkatle dinlerim","Çantamı düzenlerim"],
    pairs:[["🏫","Okul"],["🎒","Çanta"],["🧑‍🏫","Öğretmen"],["🇹🇷","Bayrak"]]
  },

  {
    title:"2. Ünite: Evimizde Hayat",
    emoji:"🏠",
    color:"#55af68",
    description:"Ailemizi tanıyor, evde görev alıyor ve kaynakları tasarruflu kullanıyoruz.",
    lesson:`Evimiz ailemizle birlikte yaşadığımız yerdir. Aile bireyleri birbirine sevgiyle yaklaşır ve yardım eder. Evde oyuncaklarımızı toplamak, odamızı düzenlemek ve sofraya yardım etmek gibi görevlerimiz olabilir. Su ve elektrik gibi kaynakları dikkatli kullanmalıyız. Diş fırçalarken musluğu kapatır, kullanmadığımız odanın ışığını söndürürüz. Su, yemek, ev ve giysi ihtiyaçtır. Her istediğimiz oyuncak veya eşya ise ihtiyaç olmayabilir.`,
    topics:[
      ["👨‍👩‍👧","Ailemizi Tanıyoruz","Aile bireylerimizi ve akrabalarımızı tanırız.","Anne, baba, kardeş, dede, nine, hala, teyze, amca ve dayı ailemizin üyeleri veya yakın akrabaları olabilir."],
      ["📍","Evimizin Yeri","Evimizin adresini ve çevresini öğreniriz.","Evimizin bulunduğu mahalleyi, sokağı ve kapı numarasını bilmek önemlidir. Yakınımızdaki okul, park veya marketi de tanıyabiliriz."],
      ["🧹","Evdeki Görevlerimiz","Evde ailemize yardım ederiz.","Oyuncakları toplamak, yatağımızı düzeltmek, sofraya kaşık koymak ve odamızı düzenlemek yapabileceğimiz görevlerdendir."],
      ["💧","Tasarruf Yapıyorum","Su ve elektriği dikkatli kullanırız.","Gereksiz yanan lambaları kapatırız. Musluğu açık bırakmayız. Yiyecekleri çöpe atmayarak israfı önleriz."],
      ["🍎","İstek ve İhtiyaç","İhtiyaçlarımızla isteklerimizi ayırırız.","Su içmek, yemek yemek, barınmak ve giyinmek ihtiyaçtır. Çok sayıda oyuncak almak ise istek olabilir."]
    ],
    good:["Musluğu kapatmak","Oyuncakları toplamak","Sofraya yardım etmek","Gereksiz ışığı söndürmek"],
    bad:["Suyu boşa akıtmak","Yemeği çöpe atmak","Odayı dağıtmak","Açık ışık bırakmak"],
    order:["Oyuncakları toplarım","Ellerimi yıkarım","Sofraya yardım ederim","Aileme teşekkür ederim"],
    pairs:[["🏠","Ev"],["👨‍👩‍👧","Aile"],["💧","Su"],["💡","Elektrik"]]
  },

  {
    title:"3. Ünite: Sağlıklı Hayat",
    emoji:"🍎",
    color:"#ef5350",
    description:"Kişisel bakım, sağlıklı beslenme ve sağlığımızı koruma yollarını öğreniyoruz.",
    lesson:`Sağlıklı olmak için temizliğimize ve beslenmemize dikkat etmeliyiz. Yemekten önce, tuvaletten sonra ve dışarıdan eve gelince ellerimizi sabunla yıkarız. Dişlerimizi sabah ve akşam fırçalarız. Meyve, sebze, süt, yoğurt, yumurta ve peynir gibi besinler büyümemize yardım eder. Yemekte ağzımız kapalı çiğner, sofrada nazik konuşuruz. Hastalandığımızda doktor, hemşire, eczacı ve diş hekimi bize yardımcı olur. Hava durumuna göre uygun kıyafet giymek de sağlığımızı korur.`,
    topics:[
      ["🧼","Kişisel Bakımımız","Temizliğimize dikkat ederiz.","Ellerimizi sabunla yıkar, düzenli banyo yapar, tırnaklarımızı temiz tutar ve temiz kıyafetler giyeriz."],
      ["🥦","Sağlıklı Beslenme","Dengeli besinler seçeriz.","Meyve, sebze, süt ürünleri ve protein içeren yiyecekler vücudumuzu güçlendirir. Çok fazla şeker tüketmemeliyiz."],
      ["🍽️","Yemekte Görgü Kuralları","Sofrada nazik davranırız.","Yemekten önce ellerimizi yıkarız. Ağzımız kapalı çiğner, ağzımız doluyken konuşmayız ve yemeğimizi israf etmeyiz."],
      ["🩺","Sağlık Çalışanları","Sağlığımız için çalışan meslekleri tanırız.","Doktor hastalıklarımızı inceler. Hemşire doktora yardım eder. Eczacı ilaçlar konusunda yardımcı olur. Diş hekimi dişlerimizi kontrol eder."],
      ["🧥","Mevsime Uygun Giyinme","Hava durumuna göre giyiniriz.","Kışın mont, bere ve atkı; yağmurda yağmurluk; yazın ise ince ve rahat kıyafetler seçeriz."]
    ],
    good:["Ellerini sabunla yıkamak","Meyve yemek","Dişlerini fırçalamak","Hava durumuna uygun giyinmek"],
    bad:["Kirli ellerle yemek yemek","Sadece şeker yemek","Diş fırçalamamak","Kışın ince giyinmek"],
    order:["Ellerimi yıkarım","Sağlıklı yemeğimi yerim","Dişlerimi fırçalarım","Dinlenirim"],
    pairs:[["🧼","Sabun"],["🪥","Diş fırçası"],["🥦","Sebze"],["🩺","Doktor"]]
  },

  {
    title:"4. Ünite: Güvenli Hayat",
    emoji:"🚦",
    color:"#4285d4",
    description:"Evde, okulda, sokakta ve teknoloji kullanırken güvenli davranıyoruz.",
    lesson:`Güvenli davranmak bizi kazalardan korur. Karşıdan karşıya geçerken yaya geçidini kullanırız. Kırmızı ışıkta durur, yeşil ışıkta önce sağımıza, solumuza ve tekrar sağımıza bakarak geçeriz. Evde prizlerle, kesici aletlerle ve sıcak eşyalarla oynamayız. Tanımadığımız kişilerle hiçbir yere gitmeyiz. Tablet, telefon ve bilgisayarı ailemizin belirlediği süre kadar kullanırız. Acil bir durumda ambulans, polis ve itfaiye için 112 numarası aranır.`,

/* GENEL DEĞİŞKENLER */

let currentUnit = 0;
let score = 0;
let stars = 0;

const tabs = document.getElementById("tabs");
const topicGrid = document.getElementById("topicGrid");
const gameContent = document.getElementById("gameContent");
const gameMessage = document.getElementById("gameMessage");

function addPoint(point){
  score += point;
  stars += 1;
  document.getElementById("score").textContent = score;
  document.getElementById("stars").textContent = stars;
}

function createTabs(){
  tabs.innerHTML = "";

  units.forEach((unit,index)=>{
    const button = document.createElement("button");
    button.textContent = unit.emoji + " " + (index + 1) + ". Ünite";
    button.style.background = unit.color;

    if(index === currentUnit){
      button.classList.add("active");
    }

    button.onclick = ()=>{
      currentUnit = index;
      stopVoice();
      renderUnit();
      window.scrollTo({top:0,behavior:"smooth"});
    };

    tabs.appendChild(button);
  });
}

function renderUnit(){
  const unit = units[currentUnit];

  document.getElementById("unitEmoji").textContent = unit.emoji;
  document.getElementById("unitName").textContent = unit.title;
  document.getElementById("unitDescription").textContent = unit.description;
  document.getElementById("lessonText").textContent = unit.lesson;

  topicGrid.innerHTML = "";

  unit.topics.forEach((topic,index)=>{
    const card = document.createElement("article");
    card.className = "topic-card";

    card.innerHTML = `
      <div class="topic-icon">${topic[0]}</div>
      <h3>${index+1}. ${topic[1]}</h3>
      <div class="topic-short">${topic[2]}</div>
      <div class="topic-detail">
        <b>Ayrıntılı açıklama:</b><br>
        ${topic[3]}
        <br><br>
        <button class="general-button listen-button dinle-dugmesi">
          🔊 Dinle
        </button>
      </div>
    `;

    const dinleDugmesi = card.querySelector(".dinle-dugmesi");
    dinleDugmesi.onclick = (olay)=>{
      olay.stopPropagation();
      readText(topic[1] + ". " + topic[3]);
    };

    card.onclick = ()=>{
      card.classList.toggle("open");
    };

    topicGrid.appendChild(card);
  });

  createTabs();
  gameContent.innerHTML = "";
  gameMessage.textContent = "Bir oyun seçerek başlayabilirsin! 🌟";
  window.checkOrderGame = null;
}

/* SESLİ ANLATIM */

function readText(text){
  if(!("speechSynthesis" in window)){
    alert("Bu tarayıcı sesli okumayı desteklemiyor.");
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "tr-TR";
  speech.rate = 0.82;
  speech.pitch = 0.9;

  const sesler = speechSynthesis.getVoices();
  const turkceSes = sesler.find(v => v.lang.toLowerCase().startsWith("tr"));

  if(turkceSes){
    speech.voice = turkceSes;
    speechSynthesis.speak(speech);
    return;
  }

  /* Sesler henüz yüklenmemişse yüklenince tekrar dene */
  if(sesler.length === 0){
    speechSynthesis.onvoiceschanged = ()=>{
      speechSynthesis.onvoiceschanged = null;
      const yeniSesler = speechSynthesis.getVoices();
      const ses = yeniSesler.find(v => v.lang.toLowerCase().startsWith("tr"));
      if(ses){ speech.voice = ses; }
      speechSynthesis.speak(speech);
    };
    return;
  }

  speechSynthesis.speak(speech);
}

function readLesson(){
  readText(units[currentUnit].lesson);
}

function stopVoice(){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
}

/* 1. OYUN: BALON PATLATMA */

function startBalloonGame(){
  const unit = units[currentUnit];
  const allItems = [
    ...unit.good.map(text => ({text:text,correct:true})),
    ...unit.bad.map(text => ({text:text,correct:false}))
  ].sort(()=>Math.random()-0.5);

  let correctFound = 0;

  gameMessage.textContent = "Balonların üzerindeki doğru davranışları bul ve patlat! 🎈";

  gameContent.innerHTML = `
    <div class="balloon-info">
      <b>Görev:</b> Doğru davranış yazan balonlara bas. 
      Yanlış davranış yazan balonlara basma.
    </div>
    <div class="balloon-board" id="balloonBoard"></div>
  `;

  const balloonBoard = document.getElementById("balloonBoard");

  allItems.forEach(item=>{
    const balloon = document.createElement("button");
    balloon.className = "balloon";
    balloon.textContent = item.text;

    balloon.onclick = ()=>{
      if(item.correct){
        if(!balloon.classList.contains("popped")){
          balloon.classList.add("popped");
          correctFound++;
          addPoint(10);
          gameMessage.textContent = "Harika! Bu doğru bir davranış! ⭐";

          if(correctFound === unit.good.length){
            gameMessage.textContent = "Tebrikler! Tüm doğru davranış balonlarını patlattın! 🎉";
          }
        }
      }else{
        gameMessage.textContent = "Dikkat! Bu doğru bir davranış değil. Başka bir balon seç. 🤔";
        balloon.style.opacity = ".55";
      }
    };

    balloonBoard.appendChild(balloon);
  });
}

/* 2. OYUN: SIRALAMA */

function startOrderGame(){
  const unit = units[currentUnit];
  const orderList = [...unit.order].sort(()=>Math.random()-0.5);
  let selectedCard = null;

  gameMessage.textContent = "Kartlara dokunarak olayları doğru sıraya koy! 🚂";

  gameContent.innerHTML = `
    <div class="order-help">
      <b>Nasıl oynanır?</b><br>
      Önce bir kartı seç. Sonra yerini değiştirmek istediğin ikinci karta bas.
      İki kartın yeri değişir.
    </div>

    <div class="order-board" id="orderBoard"></div>

    <button class="general-button" style="background:#55af68" onclick="checkOrderGame()">
      ✅ Sıramı Kontrol Et
    </button>
  `;

  const orderBoard = document.getElementById("orderBoard");

  function drawCards(){
    orderBoard.innerHTML = "";

    orderList.forEach((text,index)=>{
      const card = document.createElement("button");
      card.className = "order-card";
      card.dataset.text = text;

      card.innerHTML = `
        <span class="order-number">🚃 ${index+1}</span>
        ${text}
      `;

      card.onclick = ()=>{
        if(selectedCard === null){
          selectedCard = index;
          card.classList.add("selected");
          gameMessage.textContent = "Şimdi yer değiştirmek istediğin başka bir karta bas.";
          return;
        }

        if(selectedCard === index){
          selectedCard = null;
          drawCards();
          gameMessage.textContent = "Kart seçimi kaldırıldı.";
          return;
        }

        const temporary = orderList[selectedCard];
        orderList[selectedCard] = orderList[index];
        orderList[index] = temporary;

        selectedCard = null;
        drawCards();
        gameMessage.textContent = "Kartların yerleri değişti. Sıralamayı tamamla! 🚂";
      };

      orderBoard.appendChild(card);
    });
  }

  window.checkOrderGame = function(){
    const correct = unit.order.join("|");
    const answer = orderList.join("|");

    if(answer === correct){
      gameMessage.textContent = "Mükemmel! Olayları doğru sıraya koydun! 🎉";
      addPoint(25);
    }else{
      let doguSayisi = 0;
      unit.order.forEach((metin,sira)=>{ if(orderList[sira] === metin) doguSayisi++; });
      gameMessage.textContent =
        doguSayisi + " kart doğru yerde. Diğerlerinin yerini değiştirip tekrar dene! 💪";
    }
  };

  drawCards();
}

/* 3. OYUN: KART ÇEVİRME */

function startMemoryGame(){
  const unit = units[currentUnit];
  const selectedPairs = unit.pairs;

  let cards = [];

  selectedPairs.forEach((pair,index)=>{
    cards.push({
      pair:index,
      type:"emoji",
      value:pair[0]
    });

    cards.push({
      pair:index,
      type:"word",
      value:pair[1]
    });
  });

  cards.sort(()=>Math.random()-0.5);

  let firstCard = null;
  let lock = false;
  let matchedCount = 0;

  gameMessage.textContent = "Görsel kart ile kelime kartını eşleştir! 🃏";

  gameContent.innerHTML = `<div class="memory-board" id="memoryBoard"></div>`;

  const memoryBoard = document.getElementById("memoryBoard");

  cards.forEach(cardData=>{
    const card = document.createElement("div");
    card.className = "memory-card";
    card.dataset.pair = cardData.pair;
    card.dataset.type = cardData.type;

    let backContent = "";

    if(cardData.type === "emoji"){
      backContent = `
        <div style="font-size:43px">${cardData.value}</div>
        <div class="memory-word">Görsel</div>
      `;
    }else{
      backContent = `
        <div style="font-size:29px">📖</div>
        <div class="memory-word">${cardData.value}</div>
      `;
    }

    card.innerHTML = `
      <div class="memory-inner">
        <div class="memory-front">❓</div>
        <div class="memory-back">${backContent}</div>
      </div>
    `;

    card.onclick = ()=>{
      if(lock || card.classList.contains("open") || card.classList.contains("matched")){
        return;
      }

      card.classList.add("open");

      if(firstCard === null){
        firstCard = card;
        return;
      }

      const samePair = firstCard.dataset.pair === card.dataset.pair;
      const differentType = firstCard.dataset.type !== card.dataset.type;

      if(samePair && differentType){
        firstCard.classList.remove("open");
        firstCard.classList.add("matched");

        card.classList.remove("open");
        card.classList.add("matched");

        firstCard = null;
        matchedCount++;
        addPoint(10);

        gameMessage.textContent = "Doğru eşleştirme! Harikasın! ⭐";

        if(matchedCount === selectedPairs.length){
          gameMessage.textContent = "Tebrikler! Bütün kartları eşleştirdin! 🎉";
        }
      }else{
        lock = true;
        gameMessage.textContent = "Bu kartlar eşleşmedi. Bir daha dene!";

        setTimeout(()=>{
          firstCard.classList.remove("open");
          card.classList.remove("open");
          firstCard = null;
          lock = false;
        },900);
      }
    };

    memoryBoard.appendChild(card);
  });
}

renderUnit();
