<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayıs Ayı ÇEDES Etkinlikleri</title>
<style>
:root{ --navy:#2F3C7E; --coral:#F96167; --gold:#F9E795; --cream:#FFF9F0; --dark:#2B2B2B; }
*{box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
body{margin:0; background:linear-gradient(180deg,#eef1fb,#fff); color:var(--dark);}
header{padding:28px 16px; text-align:center; color:#fff;}
header h1{margin:0 0 6px; font-size:1.8em;}
header p{margin:0; color:var(--gold); font-weight:600;}
.tabs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:16px; background:#fff; position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.08);}
.tab-btn{border:none; padding:10px 16px; border-radius:20px; background:#eee; cursor:pointer; font-weight:600; font-size:.95em;}
.tab-btn.active{background:var(--coral); color:#fff;}
.panel{display:none; max-width:820px; margin:24px auto; padding:0 16px 40px;}
.panel.active{display:block;}
.card{background:#fff; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.08); padding:24px; margin-bottom:20px;}
.card h2{margin-top:0; color:var(--navy);}
.badge{display:inline-block; background:var(--gold); color:#7a5c00; padding:4px 12px; border-radius:12px; font-size:.8em; font-weight:700; margin-bottom:10px;}
button.act{background:var(--navy); color:#fff; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:600;}
button.act:hover{background:var(--coral);}
.dy-item{display:flex; justify-content:space-between; align-items:center; padding:12px; border-radius:10px; background:var(--cream); margin-bottom:10px; gap:10px;}
.dy-item .choices button{margin-left:6px; border:2px solid #ccc; background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:700;}
.dy-item.correct{background:#dcf5e0;} .dy-item.wrong{background:#fbdada;}
.match-wrap{display:flex; gap:24px; flex-wrap:wrap; justify-content:center;}
.match-col{display:flex; flex-direction:column; gap:10px;}
.match-item{padding:10px 14px; border-radius:10px; background:#eef1fb; border:2px solid transparent; cursor:pointer; font-weight:600; min-width:180px; text-align:center;}
.match-item.selected{border-color:var(--coral);} .match-item.matched{background:#dcf5e0; border-color:#4caf50; cursor:default;}
.cards-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.memcard{aspect-ratio:1; background:var(--navy); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2em; cursor:pointer; color:#fff;}
.memcard.flipped{background:var(--gold); color:var(--dark);} .memcard.matched{background:#a8e6a1; color:#333;}
.quiz-opt{display:block; width:100%; text-align:left; padding:10px 14px; margin:6px 0; border-radius:10px; border:2px solid #ddd; background:#fff; cursor:pointer;}
.quiz-opt.correct{background:#dcf5e0; border-color:#4caf50;} .quiz-opt.wrong{background:#fbdada; border-color:#e57373;}
textarea{width:100%; min-height:90px; border-radius:10px; border:2px solid #ddd; padding:10px; font-size:1em;}
.heart{font-size:2.5em; cursor:pointer; opacity:.25;} .heart.on{opacity:1;}
.score{font-weight:700; color:var(--navy);}
 header{background:50808E;}</style></head>
<body>
<header><h1>🌟 Mayıs Ayı ÇEDES Etkinlikleri</h1><p>AİLE BÜTÜNLÜĞÜ • MAHREMİYET</p></header>
<div class="tabs"><button class="tab-btn active" onclick="showTab('p1', this)">1️⃣ AİLE BÜTÜNLÜĞÜ</button>
<button class="tab-btn" onclick="showTab('p2', this)">2️⃣ MAHREMİYET</button>
</div>
<div class="panel" id="p1"><div class="card"><span class="badge">1. HAFTA • AİLE BÜTÜNLÜĞÜ</span><h2>🏡 Doğru mu, Yanlış mı?</h2><p>Aşağıdaki davranışların "Doğru" ya da "Yanlış" olduğuna karar ver!</p>
    <div id="dyList_1"></div><p class="score">Puan: <span id="dyScore_1">0</span> / <span id="dyTotal_1">0</span></p></div></div><div class="panel" id="p2"><div class="card"><span class="badge">2. HAFTA • MAHREMİYET</span><h2>🔒 Eşleştir!</h2><p>Soldaki davranışı sağdaki doğru değerle eşleştir.</p>
    <div class="match-wrap"><div class="match-col" id="matchLeft_2"></div><div class="match-col" id="matchRight_2"></div></div>
    <p class="score">Eşleşen: <span id="matchScore_2">0</span> / 4</p></div></div>
<script>
function showTab(id, btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

const dyData_1 = [{"text":"Ailemizle birlikte vakit geçirmeye özen gösteririz.","correct":true},{"text":"Birbirimizi dinler, destek oluruz.","correct":true},{"text":"Aile içi görevleri paylaşırız.","correct":true},{"text":"Sevgi ve saygı aileyi güçlü kılar.","correct":true}];
let dyScore_1=0, dyAnswered_1=0;
document.getElementById('dyTotal_1').textContent = dyData_1.length;
const dyList_1 = document.getElementById('dyList_1');
dyData_1.forEach((item, i) => {
  const div = document.createElement('div'); div.className='dy-item';
  div.innerHTML = '<span>'+item.text+'</span><span class="choices"><button onclick="answerDY_1('+i+', true, this)">✅ Doğru</button><button onclick="answerDY_1('+i+', false, this)">❌ Yanlış</button></span>';
  dyList_1.appendChild(div);
});
function answerDY_1(i, choice, btn){
  const parent = btn.closest('.dy-item');
  if(parent.dataset.done) return; parent.dataset.done='1';
  const isRight = choice === dyData_1[i].correct;
  parent.classList.add(isRight?'correct':'wrong');
  if(isRight) dyScore_1++;
  dyAnswered_1++;
  document.getElementById('dyScore_1').textContent = dyScore_1;
}

const matchPairs_2 = [{"l":"Başkasının eşyasını izinsiz kullanmayız.","r":"✅ MAHREMİYET"},{"l":"Kapalı kapıyı çalmadan açmayız.","r":"✅ MAHREMİYET"},{"l":"Vücudumuz bize aittir, sınırlarımızı biliriz.","r":"✅ MAHREMİYET"},{"l":"Rahatsız eden bir duruma 'hayır' diyebiliriz.","r":"✅ MAHREMİYET"}];
let leftSel_2=null, rightSel_2=null, matchScore_2=0;
const leftShuf_2 = [...matchPairs_2].sort(()=>Math.random()-0.5);
const rightShuf_2 = [...matchPairs_2].sort(()=>Math.random()-0.5);
const mL_2 = document.getElementById('matchLeft_2');
const mR_2 = document.getElementById('matchRight_2');
leftShuf_2.forEach(p=>{ const d=document.createElement('div'); d.className='match-item'; d.textContent=p.l; d.dataset.key=p.l; d.onclick=()=>selMatch_2(d,'left',p.l); mL_2.appendChild(d); });
rightShuf_2.forEach(p=>{ const d=document.createElement('div'); d.className='match-item'; d.textContent=p.r; d.dataset.key=p.l; d.onclick=()=>selMatch_2(d,'right',p.l); mR_2.appendChild(d); });
function selMatch_2(el, side, key){
  if(el.classList.contains('matched')) return;
  if(side==='left'){ if(leftSel_2) leftSel_2.classList.remove('selected'); leftSel_2=el; el.classList.add('selected'); }
  else { if(rightSel_2) rightSel_2.classList.remove('selected'); rightSel_2=el; el.classList.add('selected'); }
  if(leftSel_2 && rightSel_2){
    if(leftSel_2.dataset.key === rightSel_2.dataset.key){
      leftSel_2.classList.add('matched'); rightSel_2.classList.add('matched');
      leftSel_2.classList.remove('selected'); rightSel_2.classList.remove('selected');
      matchScore_2++; document.getElementById('matchScore_2').textContent = matchScore_2;
      leftSel_2=null; rightSel_2=null;
    } else {
      setTimeout(()=>{ leftSel_2.classList.remove('selected'); rightSel_2.classList.remove('selected'); leftSel_2=null; rightSel_2=null; }, 500);
    }
  }
}

</script>
</body></html>
