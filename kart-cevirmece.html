<html lang="tr">

<title>Kart Çevirmece Deluxe</title>

<style>
:root {
  --bg-1: #10172f;
  --bg-2: #1d2855;
  --panel: rgba(255,255,255,.11);
  --panel-border: rgba(255,255,255,.16);
  --primary: #ffd166;
  --secondary: #7bdff2;
  --pink: #ff7aa2;
  --green: #73d69a;
  --text-soft: rgba(255,255,255,.68);
  --card-back-1: #6c63ff;
  --card-back-2: #4338a8;
  --card-front-1: #25366d;
  --card-front-2: #172447;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  color: white;
  font-family: 'Nunito', sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(123,223,242,.18), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(255,122,162,.15), transparent 30%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2));
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .14;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1px);
  background-size: 34px 34px;
}

button {
  font-family: inherit;
}

.app {
  width: min(1180px, 100%);
  margin: auto;
  padding: 24px 18px 42px;
  position: relative;
  z-index: 1;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  display: inline-block;
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: var(--primary);
  text-shadow: 0 5px 0 rgba(0,0,0,.15);
  letter-spacing: .5px;
}

.subtitle {
  margin-top: 4px;
  color: var(--text-soft);
  font-size: 14px;
  font-weight: 800;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 18px;
}

.panel {
  border: 1px solid var(--panel-border);
  background: var(--panel);
  border-radius: 22px;
  padding: 15px;
  backdrop-filter: blur(12px);
  box-shadow: 0 18px 45px rgba(0,0,0,.13);
}

.panel-title {
  font-size: 12px;
  color: var(--text-soft);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.category-list,
.size-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice {
  border: 1px solid rgba(255,255,255,.18);
  color: white;
  background: rgba(255,255,255,.09);
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  transition: .2s ease;
}

.choice:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.18);
}

.choice.active {
  color: #172447;
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 5px 0 rgba(0,0,0,.12);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat {
  min-width: 0;
  padding: 12px 8px;
  text-align: center;
  border-radius: 18px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(10px);
}

.stat-icon {
  font-size: 18px;
}

.stat-number {
  margin-top: 2px;
  color: var(--primary);
  font-family: 'Fredoka', sans-serif;
  font-size: 25px;
}

.stat-label {
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
}

.game-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}

.timer {
  color: var(--primary);
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(1.6rem, 4vw, 2.2rem);
}

.status {
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 800;
  text-align: right;
}

.restart-button {
  border: 0;
  border-radius: 999px;
  color: #172447;
  background: var(--secondary);
  padding: 10px 17px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  transition: .2s ease;
}

.restart-button:hover {
  transform: translateY(-2px) scale(1.03);
  filter: brightness(1.08);
}

.grid {
  width: min(100%, 1040px);
  margin: auto;
  display: grid;
  gap: clamp(7px, 1.2vw, 13px);
}

.card {
  aspect-ratio: 1;
  min-width: 0;
  cursor: pointer;
  perspective: 900px;
  user-select: none;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.2,.75,.25,1);
}

.card.flipped .card-inner,
.card.matched .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(10px, 1.5vw, 18px);
  backface-visibility: hidden;
  overflow: hidden;
}

.card-back {
  border: 2px solid rgba(255,255,255,.23);
  background:
    linear-gradient(135deg, rgba(255,255,255,.15) 25%, transparent 25%) 0 0 / 17px 17px,
    linear-gradient(315deg, rgba(255,255,255,.1) 25%, transparent 25%) 0 0 / 17px 17px,
    linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.06),
    0 8px 15px rgba(0,0,0,.17);
  font-size: clamp(20px, 4vw, 42px);
}

.card-back::after {
  content: "✦";
  color: rgba(255,255,255,.75);
  text-shadow: 0 0 14px rgba(255,255,255,.7);
}

.card-front {
  transform: rotateY(180deg);
  flex-direction: column;
  gap: 4px;
  border: 2px solid rgba(123,223,242,.3);
  background: linear-gradient(145deg, var(--card-front-1), var(--card-front-2));
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.04),
    0 8px 15px rgba(0,0,0,.18);
}

.card-front .emoji {
  font-size: clamp(22px, 4vw, 48px);
  line-height: 1;
}

.card-front .label {
  max-width: 95%;
  overflow: hidden;
  color: rgba(255,255,255,.8);
  font-size: clamp(8px, 1.3vw, 12px);
  font-weight: 900;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card.matched .card-front {
  border-color: var(--green);
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.16), transparent 45%),
    linear-gradient(145deg, #22734d, #164b3b);
  animation: matchedPulse .55s ease;
}

@keyframes matchedPulse {
  0% { transform: rotateY(180deg) scale(.88); }
  70% { transform: rotateY(180deg) scale(1.05); }
  100% { transform: rotateY(180deg) scale(1); }
}

.win-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(5,10,28,.84);
  backdrop-filter: blur(9px);
}

.win-overlay.show {
  display: flex;
}

.win-box {
  width: min(420px, 100%);
  padding: 35px 26px;
  text-align: center;
  border: 2px solid var(--primary);
  border-radius: 28px;
  background: linear-gradient(145deg, #202e62, #121c40);
  box-shadow: 0 25px 80px rgba(0,0,0,.4);
  animation: popIn .45s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(.75) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.win-emoji {
  font-size: 65px;
  margin-bottom: 8px;
}

.win-title {
  color: var(--primary);
  font-family: 'Fredoka', sans-serif;
  font-size: 31px;
}

.win-stats {
  margin: 9px 0 22px;
  color: var(--text-soft);
  font-size: 15px;
  font-weight: 800;
  line-height: 1.6;
}

.win-button {
  border: 0;
  border-radius: 999px;
  color: #172447;
  background: var(--primary);
  padding: 13px 27px;
  font-family: 'Fredoka', sans-serif;
  font-size: 18px;
  cursor: pointer;
}

.confetti {
  position: fixed;
  top: -20px;
  z-index: 100;
  width: 10px;
  height: 15px;
  pointer-events: none;
  animation: confettiFall 2.8s linear forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

@media (min-width: 720px) {
  .toolbar {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  .app {
    padding: 17px 10px 30px;
  }

  .stats-row {
    gap: 6px;
  }

  .stat {
    padding: 9px 3px;
    border-radius: 14px;
  }

  .stat-number {
    font-size: 21px;
  }

  .stat-label {
    font-size: 8px;
  }

  .game-top {
    align-items: flex-start;
    flex-direction: column;
  }

  .status {
    text-align: left;
  }

  .restart-button {
    width: 100%;
  }

  .choice {
    padding: 8px 10px;
    font-size: 11px;
  }
}
</style>
</head>

<main class="app">

  <section class="toolbar">

  <section class="stats-row">

    <div class="stat">
      <div class="stat-icon">🃏</div>
      <div class="stat-number" id="cardNum">12</div>
      <div class="stat-label">Kart</div>
    </div>
  </section>

  <div class="game-top">
    <div class="timer" id="timer">⏱ 00:00</div>

    <div class="status" id="status">
      Bir karta tıklayarak oyunu başlat.
    </div>

    <button class="restart-button" id="restartButton">
      🔄 Yeni Oyun
    </button>
  </div>

  <section class="grid" id="grid"></section>

</main>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <div class="win-emoji">🎉</div>
    <div class="win-title">Harika İş Çıkardın!</div>
    <div class="win-stats" id="winStats"></div>
    <button class="win-button" id="winButton">🔄 Tekrar Oyna</button>
  </div>
</div>

      ["🌻", "Ayçiçeği"], ["🌹", "Gül"], ["🌷", "Lale"], ["🌺", "Çiçek"],
      ["🍀", "Yonca"], ["🍁", "Sonbahar Yaprağı"], ["🌱", "Filiz"], ["🍄", "Mantar"],
      ["☀️", "Güneş"], ["🌙", "Ay"], ["⭐", "Yıldız"], ["☁️", "Bulut"],
      ["🌧️", "Yağmur"], ["❄️", "Kar"], ["🌈", "Gökkuşağı"], ["⚡", "Şimşek"],
      ["🔥", "Ateş"], ["💧", "Su"], ["🏔️", "Dağ"], ["🌊", "Dalga"]
    ]
  }
};

/* --------------------------------------------------
   OYUN DURUMU
-------------------------------------------------- */

let currentTheme = "hayvan";
let cardCount = 12;

let flipped = [];
let matched = 0;
let moves = 0;
let seconds = 0;

let timer = null;
let gameStarted = false;
let canFlip = true;

const grid = document.getElementById("grid");
const timerElement = document.getElementById("timer");
const moveElement = document.getElementById("moveNum");
const matchElement = document.getElementById("matchNum");
const bestElement = document.getElementById("bestNum");
const cardElement = document.getElementById("cardNum");
const statusElement = document.getElementById("status");
const winOverlay = document.getElementById("winOverlay");
const winStats = document.getElementById("winStats");

/* --------------------------------------------------
   SESLER
-------------------------------------------------- */

let audioContext = null;

function getAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioContext;
}

function playTone(frequencies, duration = .12, type = "sine") {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    frequencies.forEach((frequency, index) => {
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type;
      oscillator.frequency.value = frequency;

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      const start = now + index * duration;

      gain.gain.setValueAtTime(.18, start);
      gain.gain.exponentialRampToValueAtTime(.001, start + duration);

      oscillator.start(start);
      oscillator.stop(start + duration);
    });
  } catch (error) {
    // Tarayıcı ses desteği yoksa oyun çalışmaya devam eder.
  }
}

/* --------------------------------------------------
   ARAYÜZÜ OLUŞTUR
-------------------------------------------------- */

function createCategoryButtons() {
  const categoryList = document.getElementById("categoryList");

  Object.entries(themes).forEach(([key, theme]) => {
    const button = document.createElement("button");

    button.className = "choice";
    button.dataset.theme = key;
    button.textContent = `${theme.icon} ${theme.title}`;

    button.addEventListener("click", () => {
      currentTheme = key;

      document.querySelectorAll("[data-theme]").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      restartGame();
    });

    categoryList.appendChild(button);
  });
}

function createSizeButtons() {
  const sizeList = document.getElementById("sizeList");
  const sizes = [8, 12, 16, 24, 32, 48];

  sizes.forEach(size => {
    const button = document.createElement("button");

    button.className = "choice";
    button.dataset.size = size;
    button.textContent = `${size} Kart`;

    button.addEventListener("click", () => {
      cardCount = size;

      document.querySelectorAll("[data-size]").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      restartGame();
    });

    sizeList.appendChild(button);
  });
}

/* --------------------------------------------------
   YARDIMCI FONKSİYONLAR
-------------------------------------------------- */

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function formatTime(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const secondsPart = totalSeconds % 60;

  return `${String(minutes).padStart(2, "0")}:${String(secondsPart).padStart(2, "0")}`;
}

function getBestKey() {
  return `kart-cevirmce-best-${currentTheme}-${cardCount}`;
}

function getBestScore() {
  return localStorage.getItem(getBestKey()) || null;
}

function updateBestScore() {
  const best = getBestScore();
  bestElement.textContent = best ? `${best}` : "—";
}

function updateTimer() {
  timerElement.textContent = `⏱ ${formatTime(seconds)}`;
}

function setGridColumns() {
  let columns;

  if (cardCount <= 16) {
    columns = 4;
  } else if (cardCount === 24) {
    columns = 6;
  } else {
    columns = 8;
  }

  grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;

  if (window.innerWidth < 600) {
    if (cardCount <= 16) columns = 4;
    else columns = 6;

    grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
  }
}

function startTimer() {
  if (gameStarted) return;

  gameStarted = true;
  statusElement.textContent = "Eşleşmeleri bulmaya çalış!";

  timer = setInterval(() => {
    seconds++;
    updateTimer();
  }, 1000);
}

function stopTimer() {
  clearInterval(timer);
  timer = null;
}

/* --------------------------------------------------
   OYUNU BAŞLAT
-------------------------------------------------- */

function restartGame() {
  stopTimer();

  flipped = [];
  matched = 0;
  moves = 0;
  seconds = 0;
  gameStarted = false;
  canFlip = true;

  moveElement.textContent = "0";
  matchElement.textContent = "0";
  cardElement.textContent = cardCount;
  statusElement.textContent = "Bir karta tıklayarak oyunu başlat.";
  updateTimer();
  updateBestScore();

  winOverlay.classList.remove("show");

  const pairCount = cardCount / 2;
  const selectedCards = themes[currentTheme].cards.slice(0, pairCount);

  const deck = [];

  selectedCards.forEach((item, index) => {
    deck.push({
      id: index,
      emoji: item[0],
      label: item[1]
    });

    deck.push({
      id: index,
      emoji: item[0],
      label: item[1]
    });
  });

  const shuffledDeck = shuffle(deck);

  grid.innerHTML = "";
  setGridColumns();

  shuffledDeck.forEach((item, index) => {
    const card = document.createElement("div");

    card.className = "card";
    card.dataset.index = index;
    card.dataset.pairId = item.id;

    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>

        <div class="card-face card-front">
          <span class="emoji">${item.emoji}</span>
          <span class="label">${item.label}</span>
        </div>
      </div>
    `;

    card.addEventListener("click", () => flipCard(card));

    grid.appendChild(card);
  });
}

/* --------------------------------------------------
   KART ÇEVİRME
-------------------------------------------------- */

function flipCard(card) {
  if (!canFlip) return;
  if (card.classList.contains("flipped")) return;
  if (card.classList.contains("matched")) return;
  if (flipped.length >= 2) return;

  startTimer();
  playTone([440], .08);

  card.classList.add("flipped");

  flipped.push(card);

  if (flipped.length !== 2) return;

  moves++;
  moveElement.textContent = moves;
  canFlip = false;

  const firstCard = flipped[0];
  const secondCard = flipped[1];

  const isMatch =
    firstCard.dataset.pairId === secondCard.dataset.pairId;

  if (isMatch) {
    playTone([659, 784, 1047], .11);

    setTimeout(() => {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");

      matched++;
      matchElement.textContent = matched;
      flipped = [];
      canFlip = true;

      if (matched === cardCount / 2) {
        finishGame();
      }
    }, 500);

  } else {
    playTone([280, 210], .13, "triangle");

    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");

      flipped = [];
      canFlip = true;
    }, 850);
  }
}

/* --------------------------------------------------
   OYUNU TAMAMLA
-------------------------------------------------- */

function finishGame() {
  stopTimer();

  const oldBest = getBestScore();

  if (!oldBest || moves < Number(oldBest)) {
    localStorage.setItem(getBestKey(), moves);
    bestElement.textContent = moves;
  }

  statusElement.textContent = "Tüm kartları eşleştirdin!";
  playTone([523, 659, 784, 1047], .13);

  setTimeout(() => {
    const bestText =
      !oldBest || moves < Number(oldBest)
        ? "Yeni en iyi skor! 🏆"
        : `En iyi skorun: ${oldBest} hamle`;

    winStats.innerHTML = `
      <strong>${themes[currentTheme].title}</strong> kategorisini tamamladın.<br>
      ${moves} hamle • ${formatTime(seconds)} süre<br>
      <span style="color:#ffd166">${bestText}</span>
    `;

    winOverlay.classList.add("show");
    createConfetti();
  }, 550);
}

function createConfetti() {
  const colors = [
    "#ffd166",
    "#7bdff2",
    "#ff7aa2",
    "#73d69a",
    "#9b8cff",
    "#ffffff"
  ];

  for (let i = 0; i < 70; i++) {
    const piece = document.createElement("div");

    piece.className = "confetti";
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = `${Math.random() * .8}s`;
    piece.style.animationDuration = `${2 + Math.random() * 1.7}s`;
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    }, 4500);
  }
}

/* --------------------------------------------------
   BUTONLAR
-------------------------------------------------- */

document.getElementById("restartButton").addEventListener("click", restartGame);
document.getElementById("winButton").addEventListener("click", restartGame);

window.addEventListener("resize", setGridColumns);

/* --------------------------------------------------
   İLK AÇILIŞ
-------------------------------------------------- */

createCategoryButtons();
createSizeButtons();

document.querySelector('[data-theme="hayvan"]').classList.add("active");
document.querySelector('[data-size="12"]').classList.add("active");

restartGame();
</script>
