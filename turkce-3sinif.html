<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Sınıf Türkçe Konuları</title>
<style>
  :root{
    --mavi:#1e88e5;
    --acik-mavi:#e3f2fd;
    --pembe:#ff6f91;
    --sari:#ffc107;
    --yesil:#43a047;
    --kirmizi:#e53935;
    --mor:#7e57c2;
    --turuncu:#fb8c00;
    --lacivert:#3949ab;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:linear-gradient(135deg,#e3f2fd,#fff3e0);
    color:#263238;
  }
  header{
    background:linear-gradient(90deg,var(--mavi),var(--mor));
    color:#fff;
    padding:22px 16px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  header h1{margin:0;font-size:1.7rem;}
  header p{margin:6px 0 0;font-size:1rem;opacity:.95;}

  .layout{
    display:flex;
    max-width:1200px;
    margin:0 auto;
    min-height:80vh;
  }
  nav#konu-menu{
    width:280px;
    flex-shrink:0;
    background:#fff;
    padding:14px;
    border-right:3px solid var(--acik-mavi);
    max-height:90vh;
    overflow-y:auto;
    position:sticky;
    top:0;
  }
  nav#konu-menu h2{
    font-size:1rem;
    color:var(--mavi);
    margin:6px 4px 10px;
  }
  .konu-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--acik-mavi);
    border:none;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:6px;
    font-size:.92rem;
    color:#263238;
    cursor:pointer;
    transition:.2s;
    font-weight:600;
  }
  .konu-btn:hover{background:#bbdefb;}
  .konu-btn.aktif{
    background:var(--mavi);
    color:#fff;
  }
  main{
    flex:1;
    padding:20px;
  }
  .konu-bolumu{display:none;}
  .konu-bolumu.aktif{display:block;animation:fadeIn .4s;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .konu-baslik{
    background:linear-gradient(90deg,var(--pembe),var(--sari));
    color:#fff;
    padding:14px 18px;
    border-radius:14px;
    font-size:1.3rem;
    margin-bottom:16px;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
  }
  .anlatim{
    background:#fff;
    border-left:6px solid var(--mavi);
    padding:16px;
    border-radius:10px;
    margin-bottom:20px;
    line-height:1.7;
    font-size:1.05rem;
  }
  .anlatim ul{margin:8px 0;padding-left:22px;}
  .anlatim b{color:var(--mavi);}
  .ornek-kutu{
    background:var(--acik-mavi);
    border-radius:8px;
    padding:10px 14px;
    margin-top:10px;
    font-style:italic;
  }

  h3.etkinlik-baslik{
    color:var(--mor);
    display:flex;
    align-items:center;
    gap:8px;
    font-size:1.15rem;
    margin-top:26px;
  }
  .skor-rozeti{
    display:inline-block;
    background:linear-gradient(90deg,var(--turuncu),var(--sari));
    color:#fff;
    font-size:.85rem;
    font-weight:bold;
    padding:4px 12px;
    border-radius:20px;
    margin-left:auto;
  }

  .soru-alani{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
    border:2px solid #eceff1;
    position:relative;
    overflow:hidden;
  }
  .soru-alani::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:6px;
  }
  .soru-alani.tur-cs::before{background:var(--mavi);}
  .soru-alani.tur-bd::before{background:var(--turuncu);}
  .soru-alani.tur-es::before{background:var(--mor);}
  .soru-alani.tur-dy::before{background:var(--yesil);}

  .tur-etiket{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:.75rem;
    font-weight:bold;
    padding:3px 10px;
    border-radius:12px;
    margin-bottom:8px;
    color:#fff;
  }
  .tur-etiket.cs{background:var(--mavi);}
  .tur-etiket.bd{background:var(--turuncu);}
  .tur-etiket.es{background:var(--mor);}
  .tur-etiket.dy{background:var(--yesil);}

  .soru-basligi{
    font-weight:bold;
    margin-bottom:10px;
    font-size:1.02rem;
  }
  .soru-basligi span.numara{
    background:var(--lacivert);
    color:#fff;
    border-radius:50%;
    padding:3px 10px;
    margin-right:8px;
    font-size:.9rem;
  }

  /* çoktan seçmeli */
  .secenekler label{
    display:block;
    background:#f5f5f5;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    transition:.2s;
  }
  .secenekler label:hover{background:#eceff1;}
  .secenekler input{margin-right:8px;}
  .dogru{background:#c8e6c9 !important;font-weight:bold;}
  .yanlis{background:#ffcdd2 !important;}

  /* boşluk doldurma */
  .bosluk-metin{font-size:1.05rem;margin-bottom:10px;}
  .bosluk-input{
    border:2px solid var(--turuncu);
    border-radius:8px;
    padding:6px 10px;
    font-size:1rem;
    width:160px;
    font-family:inherit;
  }

  /* eşleştirme */
  .eslestirme-satir{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f5f5f5;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .eslestirme-sol{font-weight:bold;min-width:140px;}
  .eslestirme-satir select{
    padding:6px 8px;
    border-radius:8px;
    border:2px solid var(--mor);
    font-family:inherit;
    font-size:.95rem;
    flex:1;
    min-width:160px;
  }

  /* doğru yanlış */
  .dy-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f5f5f5;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:8px;
    gap:10px;
    flex-wrap:wrap;
  }
  .dy-metin{flex:1;min-width:150px;}
  .dy-secim button{
    border:2px solid var(--yesil);
    background:#fff;
    color:var(--yesil);
    padding:5px 14px;
    border-radius:16px;
    font-weight:bold;
    cursor:pointer;
    margin-right:6px;
  }
  .dy-secim button.yanlis-btn{border-color:var(--kirmizi);color:var(--kirmizi);}
  .dy-secim button.secili{color:#fff;}
  .dy-secim button.secili.dogru-btn{background:var(--yesil);}
  .dy-secim button.secili.yanlis-btn{background:var(--kirmizi);}

  .kontrol-btn{
    background:var(--yesil);
    color:#fff;
    border:none;
    padding:9px 20px;
    border-radius:20px;
    cursor:pointer;
    font-size:.95rem;
    font-weight:bold;
    margin-top:8px;
  }
  .kontrol-btn:hover{background:#2e7d32;}
  .sonuc-mesaji{
    margin-left:10px;
    font-weight:bold;
  }

  @media(max-width:850px){
    .layout{flex-direction:column;}
    nav#konu-menu{
      width:100%;
      max-height:none;
      position:static;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      border-right:none;
      border-bottom:3px solid var(--acik-mavi);
    }
    .konu-btn{width:auto;flex:1 1 45%;font-size:.82rem;padding:8px;}
  }
</style>

<body>

<header>
  <h1>📚 3. Sınıf Türkçe Konuları</h1>
  <p>Konuyu seç, oku, öğren ve yeni nesil sorularla kendini test et! 🚀</p>
</header>

<div class="layout">
  <nav id="konu-menu"></nav>
  <main id="icerik-alani"></main>
</div>

<script>
/* ================= VERİ TABANI ================= */
/* Soru türleri: cs = çoktan seçmeli, bd = boşluk doldurma,
   es = eşleştirme, dy = doğru/yanlış listesi */

const konular = [
{
  id:"okuma-anlama",
  baslik:"1. Okuma Anlama",
  anlatim:`
    <p><b>Okuduğunu anlama</b>, bir metni okuyup içindeki bilgileri, olayları ve duyguları kavrayabilme becerisidir.</p>
    <ul>
      <li>Metni dikkatli ve yavaş oku.</li>
      <li>Anlamını bilmediğin kelimelerin altını çiz.</li>
      <li>Metnin ana fikrini bulmaya çalış.</li>
      <li>Sorulara metne bakarak cevap ver.</li>
    </ul>
    <div class="ornek-kutu">Metin: "Merve, her Cumartesi büyükannesinin bahçesine gider. Büyükannesi ona sebze yetiştirmeyi öğretir. Bu hafta domates fideleri diktiler. Merve, fidelerin büyümesini sabırsızlıkla bekliyor."</div>
  `,
  sorular:[
    {tur:"cs", soru:"Merve büyükannesinin bahçesine hangi gün gider?", secenekler:["Pazartesi","Cumartesi","Pazar","Çarşamba"], dogru:1},
    {tur:"bd", soru:"Bu hafta diktikleri fidenin adı ___.", cevap:["domates","domates fidesi"]},
    {tur:"es", baslik:"Kim ne yaptı? Doğru eşleştir.", sol:["Merve","Büyükanne","İkisi birlikte"], sag:["bahçeye gider","sebze yetiştirmeyi öğretti","fide dikti"], dogru:[0,1,2]},
    {tur:"dy", ifadeler:[
      {metin:"Merve bahçeye her hafta gider.", dogru:true},
      {metin:"Diktikleri bitki çilektir.", dogru:false},
      {metin:"Merve fidelerin büyümesini merakla bekliyor.", dogru:true}
    ]}
  ]
},
{
  id:"harf-bilgisi",
  baslik:"2. Harf Bilgisi",
  anlatim:`
    <p>Türkçe alfabemizde <b>29 harf</b> vardır. Harfler ikiye ayrılır:</p>
    <ul>
      <li><b>Sesli (ünlü) harfler:</b> a, e, ı, i, o, ö, u, ü (8 tane)</li>
      <li><b>Sessiz (ünsüz) harfler:</b> geri kalan 21 harf</li>
    </ul>
    <p>Cümle başlarında ve özel isimlerde büyük harf kullanılır.</p>
    <div class="ornek-kutu">Örnek: "Ankara güzel bir şehirdir." → Ankara özel isim olduğu için büyük harfle başlar.</div>
  `,
  sorular:[
    {tur:"cs", soru:"Hangi kelimede 3 tane sesli harf vardır?", secenekler:["ev","araba","kalem","göz"], dogru:1},
    {tur:"bd", soru:"Türkçe alfabede ___ tane sesli harf vardır.", cevap:["8","sekiz"]},
    {tur:"es", baslik:"Harfleri türüne göre eşleştir.", sol:["a","p","ü","t"], sag:["Sesli","Sessiz","Sesli","Sessiz"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"'k' harfi sessiz bir harftir.", dogru:true},
      {metin:"'i' harfi sessiz bir harftir.", dogru:false},
      {metin:"Özel isimler büyük harfle başlar.", dogru:true}
    ]}
  ]
},
{
  id:"hece-bilgisi",
  baslik:"3. Hece Bilgisi",
  anlatim:`
    <p><b>Hece</b>, bir kelimenin tek seferde söylenebilen parçasıdır. Her hecede en az bir sesli harf bulunur.</p>
    <div class="ornek-kutu">
      ka-lem (2 hece) &nbsp; o-kul (2 hece) &nbsp; pen-ce-re (3 hece)
    </div>
    <p>Satır sonuna sığmayan kelimeler hecelerinden bölünerek kısa çizgi (-) ile yazılır.</p>
  `,
  sorular:[
    {tur:"cs", soru:"'Kelebek' kelimesi kaç hecelidir?", secenekler:["2","3","4","5"], dogru:1},
    {tur:"bd", soru:"'Kitap' kelimesi hecelenince: ki-___ olur.", cevap:["tap"]},
    {tur:"es", baslik:"Kelimeleri hece sayısıyla eşleştir.", sol:["kalem","pencere","el","kelebek"], sag:["2","3","1","3"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"Her hecede en az bir sesli harf bulunur.", dogru:true},
      {metin:"'Göz' kelimesi 2 hecelidir.", dogru:false},
      {metin:"Heceleme satır sonunda kısa çizgi ile yapılır.", dogru:true}
    ]}
  ]
},
{
  id:"kelime-bilgisi",
  baslik:"4. Kelime Bilgisi",
  anlatim:`
    <p><b>Kelime (sözcük)</b>, tek başına anlamı olan ses veya ses grubudur.</p>
    <ul>
      <li>Bir kelimenin <b>gerçek anlamı</b> ve bazen <b>mecaz anlamı</b> olabilir.</li>
    </ul>
    <div class="ornek-kutu">"Yüreği taş kesildi." cümlesinde "taş" kelimesi mecaz anlamda kullanılmıştır.</div>
  `,
  sorular:[
    {tur:"cs", soru:"'Yüreği yanıyordu.' cümlesinde 'yanmak' kelimesi hangi anlamda kullanılmıştır?", secenekler:["Gerçek anlam","Mecaz anlam","Eş anlam","Zıt anlam"], dogru:1},
    {tur:"bd", soru:"Tek başına anlamı olan ses veya ses grubuna ___ denir.", cevap:["kelime","sözcük"]},
    {tur:"es", baslik:"Cümledeki altı çizili kelimenin anlamını eşleştir.", sol:["Yüreği taş kesildi.","Elini yıkadı.","Kalbi kırıldı.","Kapıyı açtı."], sag:["Mecaz","Gerçek","Mecaz","Gerçek"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"Bir kelimenin sadece gerçek anlamı olabilir.", dogru:false},
      {metin:"Mecaz anlam, kelimenin gerçek anlamından farklı kullanılmasıdır.", dogru:true},
      {metin:"'Kalemi masaya koydu.' cümlesinde 'kalem' mecaz anlamdadır.", dogru:false}
    ]}
  ]
},
{
  id:"es-anlamli",
  baslik:"5. Eş Anlamlı Kelimeler",
  anlatim:`
    <p><b>Eş anlamlı (anlamdaş) kelimeler</b>, yazılışları farklı ama anlamları aynı veya birbirine çok yakın olan kelimelerdir.</p>
    <div class="ornek-kutu">Ev = Konut &nbsp; Kara = Siyah &nbsp; Sevgi = Aşk &nbsp; Cevap = Yanıt</div>
  `,
  sorular:[
    {tur:"cs", soru:"'Muvaffak oldu.' cümlesindeki 'muvaffak' kelimesinin eş anlamlısı hangisidir?", secenekler:["Başarılı","Başarısız","Yorgun","Mutlu"], dogru:0},
    {tur:"bd", soru:"'Kara' kelimesinin eş anlamlısı ___'dır.", cevap:["siyah"]},
    {tur:"es", baslik:"Kelimeleri eş anlamlısıyla eşleştir.", sol:["Ev","Cevap","Sevgi","Başarı"], sag:["Yanıt","Aşk","Konut","Muvaffakiyet"], dogru:[2,0,1,3]},
    {tur:"dy", ifadeler:[
      {metin:"'Güzel' ile 'çirkin' eş anlamlıdır.", dogru:false},
      {metin:"'Akıllı' ile 'zeki' eş anlamlıdır.", dogru:true},
      {metin:"Eş anlamlı kelimelerin yazılışı aynıdır.", dogru:false}
    ]}
  ]
},
{
  id:"zit-anlamli",
  baslik:"6. Zıt Anlamlı Kelimeler",
  anlatim:`
    <p><b>Zıt anlamlı (karşıt) kelimeler</b>, anlamca birbirinin tersi olan kelimelerdir.</p>
    <div class="ornek-kutu">Büyük ≠ Küçük &nbsp; Gece ≠ Gündüz &nbsp; Sıcak ≠ Soğuk &nbsp; Uzun ≠ Kısa</div>
  `,
  sorular:[
    {tur:"cs", soru:"'Karanlık bir gece' ifadesindeki 'karanlık' kelimesinin zıt anlamlısı nedir?", secenekler:["Loş","Aydınlık","Kara","Koyu"], dogru:1},
    {tur:"bd", soru:"'Uzun' kelimesinin zıt anlamlısı ___'dır.", cevap:["kısa"]},
    {tur:"es", baslik:"Kelimeleri zıt anlamlısıyla eşleştir.", sol:["Sıcak","Büyük","Hızlı","Gündüz"], sag:["Soğuk","Küçük","Yavaş","Gece"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"'İyi' kelimesinin zıddı 'kötü'dür.", dogru:true},
      {metin:"'Ağır' ile 'hafif' eş anlamlıdır.", dogru:false},
      {metin:"Zıt anlamlı kelimeler birbirinin tersidir.", dogru:true}
    ]}
  ]
},
{
  id:"es-sesli",
  baslik:"7. Eş Sesli Kelimeler",
  anlatim:`
    <p><b>Eş sesli (sesteş) kelimeler</b>, yazılışları aynı olduğu hâlde anlamları farklı olan kelimelerdir.</p>
    <div class="ornek-kutu">
      "Kır" → 1) Kırsal alan 2) Kırmak fiili<br>
      "Yüz" → 1) Sayı 2) Vücut kısmı 3) Yüzmek fiili
    </div>
  `,
  sorular:[
    {tur:"cs", soru:"'Yüzünü yıkadı.' cümlesinde 'yüz' kelimesi hangi anlamda kullanılmıştır?", secenekler:["Sayı","Vücut kısmı","Yüzme fiili","Hiçbiri"], dogru:1},
    {tur:"bd", soru:"Yazılışı aynı, anlamı farklı olan kelimelere ___ kelimeler denir.", cevap:["eş sesli","sesteş"]},
    {tur:"es", baslik:"Cümledeki 'kır'/'yüz' kelimesinin anlamını eşleştir.", sol:["Kırda gezdik.","Camı kırdı.","Yüz kişi geldi.","Havuzda yüzdü."], sag:["Kırsal alan","Kırmak fiili","Sayı","Yüzmek fiili"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"'Dolu' kelimesi hem yağış hem 'boş olmayan' anlamında kullanılabilir.", dogru:true},
      {metin:"Eş sesli kelimelerin anlamı her zaman aynıdır.", dogru:false},
      {metin:"'Kır' kelimesi sadece 'kırsal alan' anlamına gelir.", dogru:false}
    ]}
  ]
},
{
  id:"cumle-bilgisi",
  baslik:"8. Cümle Bilgisi",
  anlatim:`
    <p><b>Cümle</b>, bir duyguyu, düşünceyi ya da olayı anlatan, anlamlı ve bitmiş sözlerdir.</p>
    <p>Anlatım şekline göre: <b>Olumlu, Olumsuz, Soru, Ünlem</b> cümleleri olabilir.</p>
    <div class="ornek-kutu">
      Olumlu: Ahmet okula gitti. &nbsp; Olumsuz: Ahmet okula gitmedi.<br>
      Soru: Ahmet okula gitti mi? &nbsp; Ünlem: Ne kadar güzel bir gün!
    </div>
  `,
  sorular:[
    {tur:"cs", soru:"'Bugün okula gitmedim.' cümlesi ne tür bir cümledir?", secenekler:["Olumlu","Olumsuz","Soru","Ünlem"], dogru:1},
    {tur:"bd", soru:"Soru cümleleri genellikle '___' eki veya soru kelimesiyle kurulur.", cevap:["mi","mı","mu","mü"]},
    {tur:"es", baslik:"Cümleleri türüyle eşleştir.", sol:["Ne kadar güzel!","Ders çalıştın mı?","Kitap okudum.","Bugün gitmedim."], sag:["Ünlem","Soru","Olumlu","Olumsuz"], dogru:[0,1,2,3]},
    {tur:"dy", ifadeler:[
      {metin:"Cümleler büyük harfle başlar.", dogru:true},
      {metin:"Her cümle mutlaka soru cümlesidir.", dogru:false},
      {metin:"Ünlem cümlesi genellikle '!' ile biter.", dogru:true}
    ]}
  ]
},
{
  id:"isim-bilgisi",
  baslik:"9. Ad (İsim) Bilgisi",
  anlatim:`
    <p><b>İsim (ad)</b>, varlıkları ve kavramları karşılayan kelimelerdir.</p>
    <ul>
      <li><b>Özel isim:</b> Belirli, tek bir varlığı adlandırır (Ahmet, İstanbul).</li>
      <li><b>Cins isim:</b> Aynı türden birçok varlığı adlandırır (kalem, kuş).</li>
      <li><b>Somut isim:</b> Beş duyuyla algılanabilen (masa, çiçek).</li>
      <li><b>Soyut isim:</b> Beş duyuyla algılanamayan (sevgi, mutluluk).</li>
    </ul>
  `,

/* ================= YARDIMCI ================= */
function normallestir(s){
  return s.toString().trim().toLocaleLowerCase("tr-TR").replace(/[.,!?]/g,"");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

  menuHtml += `<button class="konu-btn" data-index="${i}" onclick="konuGoster(${i})">${k.baslik}</button>`;
});
menu.innerHTML = menuHtml;

const turEtiket = {
  cs:{ad:"Çoktan Seçmeli", ikon:"🤔"},
  bd:{ad:"Boşluk Doldurma", ikon:"✏️"},
  es:{ad:"Eşleştirme", ikon:"🧩"},
  dy:{ad:"Doğru mu Yanlış mı?", ikon:"🎯"}
};

function soruHtmlOlustur(konuIndex, soruIndex, s){
  const kutuId = `soru-alani-${konuIndex}-${soruIndex}`;
  let icHtml = "";

  if(s.tur === "cs"){
    let secenekHtml = "";
    s.secenekler.forEach((sec,j)=>{
      secenekHtml += `<label><input type="radio" name="soru-${konuIndex}-${soruIndex}" value="${j}"> ${sec}</label>`;
    });
    icHtml = `
      <div class="soru-basligi"><span class="numara">${soruIndex+1}</span>${s.soru}</div>
      <div class="secenekler">${secenekHtml}</div>`;
  }
  else if(s.tur === "bd"){
    icHtml = `
      <div class="soru-basligi"><span class="numara">${soruIndex+1}</span>Boşluğu doldur</div>
      <div class="bosluk-metin">${s.soru}</div>
      <input type="text" class="bosluk-input" id="bd-${konuIndex}-${soruIndex}" placeholder="Cevabını yaz...">`;
  }
  else if(s.tur === "es"){
    const sagKarisik = shuffle(s.sag);
    let satirHtml = "";
    s.sol.forEach((solOge,j)=>{
      let opsiyonlar = `<option value="">Seç...</option>`;
      sagKarisik.forEach(opt=>{
        opsiyonlar += `<option value="${opt.replace(/"/g,'&quot;')}">${opt}</option>`;
      });
      satirHtml += `
        <div class="eslestirme-satir" id="es-satir-${konuIndex}-${soruIndex}-${j}">
          <span class="eslestirme-sol">${solOge}</span>
          <select id="es-${konuIndex}-${soruIndex}-${j}">${opsiyonlar}</select>
        </div>`;
    });
    icHtml = `
      <div class="soru-basligi"><span class="numara">${soruIndex+1}</span>${s.baslik}</div>
      ${satirHtml}`;
  }
  else if(s.tur === "dy"){
    let satirHtml = "";
    s.ifadeler.forEach((ifade,j)=>{
      satirHtml += `
        <div class="dy-satir" id="dy-satir-${konuIndex}-${soruIndex}-${j}">
          <span class="dy-metin">${ifade.metin}</span>
          <span class="dy-secim">
            <button type="button" class="dogru-btn" onclick="dySec(${konuIndex},${soruIndex},${j},true,this)">Doğru</button>
            <button type="button" class="yanlis-btn" onclick="dySec(${konuIndex},${soruIndex},${j},false,this)">Yanlış</button>
          </span>
        </div>`;
    });
    icHtml = `
      <div class="soru-basligi"><span class="numara">${soruIndex+1}</span>Aşağıdaki ifadeler doğru mu, yanlış mı?</div>
      ${satirHtml}`;
  }

  return `
    <div class="soru-alani tur-${s.tur}" id="${kutuId}">
      <span class="tur-etiket ${s.tur}">${turEtiket[s.tur].ikon} ${turEtiket[s.tur].ad}</span>
      ${icHtml}
      <div>
        <button class="kontrol-btn" onclick="kontrolEt(${konuIndex},${soruIndex})">Kontrol Et</button>
        <span class="sonuc-mesaji" id="sonuc-${konuIndex}-${soruIndex}"></span>
      </div>
    </div>`;
}

/* doğru/yanlış seçim state saklama */
const dySecimleri = {};
function dySec(konuIndex, soruIndex, ifadeIndex, secim, btn){
  const key = `${konuIndex}-${soruIndex}-${ifadeIndex}`;
  dySecimleri[key] = secim;
  const satir = document.getElementById(`dy-satir-${konuIndex}-${soruIndex}-${ifadeIndex}`);
  satir.querySelectorAll(".dy-secim button").forEach(b=>b.classList.remove("secili"));
  btn.classList.add("secili");
}

function soruBlokOlustur(konuIndex){
  const k = konular[konuIndex];
  let html = "";
  k.sorular.forEach((s,i)=>{
    html += soruHtmlOlustur(konuIndex, i, s);
  });
  return html;
}

function icerikOlustur(){
  let html = "";
  konular.forEach((k,i)=>{
    html += `
      <section class="konu-bolumu" id="bolum-${i}">
        <div class="konu-baslik">${k.baslik}</div>
        <div class="anlatim">${k.anlatim}</div>
        <h3 class="etkinlik-baslik">📝 Yeni Nesil Alıştırmalar</h3>
        ${soruBlokOlustur(i)}
      </section>`;
  });
  icerik.innerHTML = html;
}
icerikOlustur();

function konuGoster(index){
  document.querySelectorAll(".konu-bolumu").forEach(el=>el.classList.remove("aktif"));
  document.querySelectorAll(".konu-btn").forEach(el=>el.classList.remove("aktif"));
  document.getElementById("bolum-"+index).classList.add("aktif");
  document.querySelectorAll(".konu-btn")[index].classList.add("aktif");
  window.scrollTo({top:0,behavior:"smooth"});
}
konuGoster(0);

/* ================= KONTROL FONKSİYONU ================= */
function kontrolEt(konuIndex, soruIndex){
  const s = konular[konuIndex].sorular[soruIndex];
  const sonucSpan = document.getElementById(`sonuc-${konuIndex}-${soruIndex}`);

  if(s.tur === "cs"){
    const secili = document.querySelector(`input[name="soru-${konuIndex}-${soruIndex}"]:checked`);
    const labels = document.querySelectorAll(`#soru-alani-${konuIndex}-${soruIndex} .secenekler label`);
    labels.forEach(l=>l.classList.remove("dogru","yanlis"));
    if(!secili){
      sonucSpan.textContent = "Lütfen bir seçenek işaretle!";
      sonucSpan.style.color = "var(--kirmizi)";
      return;
    }
    const seciliDeger = parseInt(secili.value);
    labels[s.dogru].classList.add("dogru");
    if(seciliDeger === s.dogru){
      sonucSpan.textContent = "Doğru! 🎉";
      sonucSpan.style.color = "var(--yesil)";
    } else {
      labels[seciliDeger].classList.add("yanlis");
      sonucSpan.textContent = "Yanlış, doğru cevap işaretlendi.";
      sonucSpan.style.color = "var(--kirmizi)";
    }
  }

  else if(s.tur === "bd"){
    const input = document.getElementById(`bd-${konuIndex}-${soruIndex}`);
    const deger = normallestir(input.value);
    const kabulEdilen = s.cevap.map(c=>normallestir(c));
    if(!input.value.trim()){
      sonucSpan.textContent = "Lütfen bir cevap yaz!";
      sonucSpan.style.color = "var(--kirmizi)";
      return;
    }
    if(kabulEdilen.includes(deger)){
      input.style.borderColor = "var(--yesil)";
      input.style.background = "#c8e6c9";
      sonucSpan.textContent = "Doğru! 🎉";
      sonucSpan.style.color = "var(--yesil)";
    } else {
      input.style.borderColor = "var(--kirmizi)";
      input.style.background = "#ffcdd2";
      sonucSpan.textContent = `Yanlış. Doğru cevap: ${s.cevap[0]}`;
      sonucSpan.style.color = "var(--kirmizi)";
    }
  }

  else if(s.tur === "es"){
    let dogruSayisi = 0;
    let tumuSecildi = true;
    s.sol.forEach((solOge,j)=>{
      const select = document.getElementById(`es-${konuIndex}-${soruIndex}-${j}`);
      const satir = document.getElementById(`es-satir-${konuIndex}-${soruIndex}-${j}`);
      satir.style.background = "#f5f5f5";
      if(!select.value){ tumuSecildi = false; return; }
      const dogruCevap = s.sag[s.dogru[j]];
      if(select.value === dogruCevap){
        satir.style.background = "#c8e6c9";
        dogruSayisi++;
      } else {
        satir.style.background = "#ffcdd2";
      }
    });
    if(!tumuSecildi){
      sonucSpan.textContent = "Lütfen tüm eşleştirmeleri tamamla!";
      sonucSpan.style.color = "var(--kirmizi)";
      return;
    }
    sonucSpan.textContent = `${dogruSayisi}/${s.sol.length} doğru`;
    sonucSpan.style.color = dogruSayisi === s.sol.length ? "var(--yesil)" : "var(--kirmizi)";
  }

  else if(s.tur === "dy"){
    let dogruSayisi = 0;
    let tumuSecildi = true;
    s.ifadeler.forEach((ifade,j)=>{
      const key = `${konuIndex}-${soruIndex}-${j}`;
      const satir = document.getElementById(`dy-satir-${konuIndex}-${soruIndex}-${j}`);
      if(dySecimleri[key] === undefined){ tumuSecildi = false; return; }
      if(dySecimleri[key] === ifade.dogru){
        satir.style.background = "#c8e6c9";
        dogruSayisi++;
      } else {
        satir.style.background = "#ffcdd2";
      }
    });
    if(!tumuSecildi){
      sonucSpan.textContent = "Lütfen tüm ifadeleri işaretle!";
      sonucSpan.style.color = "var(--kirmizi)";
      return;
    }
    sonucSpan.textContent = `${dogruSayisi}/${s.ifadeler.length} doğru`;
    sonucSpan.style.color = dogruSayisi === s.ifadeler.length ? "var(--yesil)" : "var(--kirmizi)";
  }
}
</script>
