<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Sınıf Türkçe | Konu Anlatımı ve Oyunlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --kagit:#eef2f7;
  --kart:#ffffff;
  --murekkep:#1c2a41;
  --soluk:#5d6b80;
  --cizgi:#d6dee9;
  --b1:#2f7de1;
  --b2:#e07a12;
  --b3:#7b45c9;
  --b4:#12996a;
  --b5:#d63c5e;
  --b6:#0d93b0;
  --dogru:#12996a;
  --yanlis:#d63c5e;
  --golge:0 2px 0 rgba(28,42,65,.07), 0 8px 24px rgba(28,42,65,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Andika','Segoe UI',system-ui,sans-serif;
  background:var(--kagit);
  background-image:radial-gradient(circle at 12% 8%, #ffffff 0%, transparent 45%),
                   radial-gradient(circle at 88% 0%, #e3ecf7 0%, transparent 40%);
  color:var(--murekkep);
  font-size:17px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 80px}

/* ---------- ÜST BAŞLIK ---------- */
.ust{
  position:sticky;top:0;z-index:40;
  background:rgba(238,242,247,.94);
  backdrop-filter:blur(8px);
  border-bottom:2px solid var(--cizgi);
  margin:0 -14px 18px;padding:10px 14px;
  display:flex;align-items:center;gap:12px;min-height:56px;
}
.ust h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:-.2px}
.ust .alt{font-size:.78rem;color:var(--soluk);display:block;font-weight:400}
.geri{
  border:2px solid var(--cizgi);background:#fff;color:var(--murekkep);
  font-family:inherit;font-size:.95rem;font-weight:700;
  padding:8px 14px;border-radius:12px;cursor:pointer;flex-shrink:0;
}
.geri:hover{border-color:var(--b1);color:var(--b1)}
.puan{margin-left:auto;font-weight:700;font-size:.9rem;background:#fff;border:2px solid var(--cizgi);
  padding:6px 12px;border-radius:999px;white-space:nowrap}

/* ---------- KAPAK ---------- */
.kapak{
  background:linear-gradient(150deg,#243a5e 0%,#35618f 55%,#3d8ac2 100%);
  color:#fff;border-radius:22px;padding:28px 22px;margin-bottom:26px;
  box-shadow:var(--golge);position:relative;overflow:hidden;
}
.kapak::after{
  content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.07);
}
.kapak .etiket{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.kapak h2{margin:6px 0 8px;font-size:1.8rem;line-height:1.25}
.kapak p{margin:0;opacity:.9;font-size:.98rem;max-width:46ch}
.kapak .sayilar{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.kapak .sayilar b{display:block;font-size:1.5rem;line-height:1}
.kapak .sayilar span{font-size:.8rem;opacity:.8}

/* ---------- İLERLEME ---------- */
.ilerleme-kutu{background:#fff;border:2px solid var(--cizgi);border-radius:16px;padding:14px 16px;margin-bottom:26px}
.ilerleme-ust{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-bottom:8px}
.cubuk{height:14px;background:#e6edf5;border-radius:999px;overflow:hidden}
.cubuk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--b4));transition:width .5s ease}

/* ---------- BÖLÜM ---------- */
.bolum{margin-bottom:26px}
.bolum-bas{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bolum-no{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:1.1rem;flex-shrink:0;
}
.bolum-bas h3{margin:0;font-size:1.12rem}
.bolum-bas small{display:block;color:var(--soluk);font-size:.8rem;font-weight:400}
.kartlar{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.kartlar{grid-template-columns:1fr 1fr}}
.konu-kart{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--kart);border:2px solid var(--cizgi);border-left-width:6px;
  border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;
  font-size:.97rem;color:var(--murekkep);transition:transform .15s, box-shadow .15s;
}
.konu-kart:hover{transform:translateY(-2px);box-shadow:var(--golge)}
.konu-kart .kno{font-weight:700;font-size:.82rem;color:var(--soluk);flex-shrink:0;min-width:26px}
.konu-kart .kad{flex:1;font-weight:700;line-height:1.35}
.konu-kart .tik{width:24px;height:24px;border-radius:50%;border:2px solid var(--cizgi);flex-shrink:0}
.konu-kart.bitti .tik{background:var(--dogru);border-color:var(--dogru);position:relative}
.konu-kart.bitti .tik::after{content:"✓";color:#fff;font-size:.85rem;font-weight:700;position:absolute;inset:0;display:grid;place-items:center}

/* ---------- KONU SAYFASI ---------- */
.konu-bas{border-radius:18px;padding:20px 20px;color:#fff;margin-bottom:20px}
.konu-bas .kb-no{font-size:.8rem;letter-spacing:2px;opacity:.8}
.konu-bas h2{margin:4px 0 0;font-size:1.45rem;line-height:1.25}
.anlatim{background:var(--kart);border:2px solid var(--cizgi);border-radius:18px;padding:18px 18px 6px;margin-bottom:20px}
.anlatim h4{margin:20px 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.anlatim h4:first-child{margin-top:2px}
.anlatim h4::before{content:"";width:10px;height:10px;border-radius:3px;background:currentColor;opacity:.5}
.anlatim p{margin:0 0 12px}
.anlatim ul{margin:0 0 14px;padding-left:22px}
.anlatim li{margin-bottom:5px}
.vurgu{background:#fff3cd;border-radius:5px;padding:0 4px;font-weight:700}
.kutu{border-radius:14px;padding:12px 14px;margin:0 0 14px;border:2px dashed var(--cizgi);background:#f7fafd}
.kutu b.bas{display:block;margin-bottom:6px;font-size:.9rem;letter-spacing:.4px;text-transform:uppercase}
.ornek{background:#f1f7ff;border-left:5px solid var(--b1);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 14px}
.ornek p{margin:0 0 4px}
.ornek p:last-child{margin:0}
.unutma{background:#fff5e6;border-left:5px solid var(--b2)}
.tablo{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:.93rem}
.tablo th,.tablo td{border:1px solid var(--cizgi);padding:7px 9px;text-align:left}
.tablo th{background:#f1f5fa;font-weight:700}
.harfler{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.harfler span{background:#fff;border:2px solid var(--cizgi);border-radius:9px;
  min-width:34px;text-align:center;padding:5px 4px;font-weight:700}
.harfler span.unlu{background:#ffe9c9;border-color:#f0b45c}

/* ---------- OYUN ---------- */
.oyun{background:var(--kart);border:2px solid var(--cizgi);border-radius:18px;padding:18px;margin-bottom:18px}
.oyun-bas{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.oyun-bas .rozet{font-size:.72rem;font-weight:700;letter-spacing:1px;color:#fff;padding:3px 10px;border-radius:999px}
.oyun h3{margin:0;font-size:1.08rem}
.oyun .yonerge{color:var(--soluk);font-size:.9rem;margin:0 0 14px}
.soru{font-size:1.08rem;font-weight:700;margin:0 0 14px;line-height:1.5}
.secenekler{display:grid;gap:9px}
.sec{
  text-align:left;background:#f7fafd;border:2px solid var(--cizgi);border-radius:12px;
  padding:12px 14px;font-family:inherit;font-size:1rem;cursor:pointer;color:var(--murekkep);
  transition:border-color .15s, background .15s;
}
.sec:hover:not(:disabled){border-color:var(--b1);background:#fff}
.sec:disabled{cursor:default}
.sec.dogru{background:#e3f6ed;border-color:var(--dogru);font-weight:700}
.sec.yanlis{background:#fde7ec;border-color:var(--yanlis)}
.geribildirim{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem;display:none}
.geribildirim.gor{display:block}
.geribildirim.iyi{background:#e3f6ed;border-left:5px solid var(--dogru)}
.geribildirim.kotu{background:#fde7ec;border-left:5px solid var(--yanlis)}
.sayac{font-size:.85rem;color:var(--soluk);font-weight:700;margin-bottom:10px}
.ileri{
  margin-top:14px;background:var(--murekkep);color:#fff;border:none;border-radius:12px;
  padding:12px 22px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;
}
.ileri:hover{opacity:.9}

/* eşleştirme */
.esles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.esles button{
  background:#f7fafd;border:2px solid var(--cizgi);border-radius:12px;padding:11px 8px;
  font-family:inherit;font-size:.97rem;cursor:pointer;color:var(--murekkep);min-height:48px;
}
.esles button.secili{border-color:var(--b3);background:#f2eaff;font-weight:700}
.esles button.tamam{background:#e3f6ed;border-color:var(--dogru);color:#0d7350;font-weight:700;cursor:default}
.esles button.hata{animation:salla .35s}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* sınıflandırma */
.kelime-kart{
  background:linear-gradient(135deg,#f7fafd,#e9f0f8);border:2px solid var(--cizgi);
  border-radius:16px;padding:22px 12px;text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:14px;
}
.kategoriler{display:grid;gap:9px}
@media(min-width:480px){.kategoriler{grid-template-columns:1fr 1fr}}
.kategoriler button{
  background:#fff;border:2px solid var(--cizgi);border-radius:12px;padding:14px 10px;
  font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;color:var(--murekkep);
}
.kategoriler button:hover:not(:disabled){border-color:var(--b4)}

/* sıralama */
.sira-hedef{
  min-height:56px;border:2px dashed var(--cizgi);border-radius:12px;padding:8px;
  display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;background:#f7fafd;align-items:center;
}
.sira-hedef:empty::before{content:"Sıraya dizdiklerin burada görünecek";color:var(--soluk);font-size:.88rem;padding-left:6px}
.sira-havuz{display:flex;flex-wrap:wrap;gap:8px}
.parca{
  background:#fff;border:2px solid var(--cizgi);border-radius:10px;padding:9px 13px;
  font-family:inherit;font-size:1rem;cursor:pointer;color:var(--murekkep);font-weight:700;
}
.parca:hover{border-color:var(--b1)}
.parca.yerlesti{background:#e3f6ed;border-color:var(--dogru);cursor:default}
.parca.hata{animation:salla .35s;border-color:var(--yanlis)}

/* bitiş */
.bitis{text-align:center;padding:20px 10px}
.bitis .yildizlar{font-size:2rem;letter-spacing:6px;color:#f0b45c}
.bitis h3{margin:8px 0 4px;font-size:1.25rem}
.bitis p{color:var(--soluk);margin:0 0 14px}
.tekrar{background:#fff;border:2px solid var(--cizgi);border-radius:12px;padding:10px 18px;
  font-family:inherit;font-weight:700;cursor:pointer;color:var(--murekkep);font-size:.95rem}
.tekrar:hover{border-color:var(--b1);color:var(--b1)}

.gezinme{display:flex;gap:10px;margin-top:24px}
.gezinme button{
  flex:1;background:#fff;border:2px solid var(--cizgi);border-radius:14px;padding:13px 10px;
  font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--murekkep);
}
.gezinme button:hover:not(:disabled){border-color:var(--b1);color:var(--b1)}
.gezinme button:disabled{opacity:.4;cursor:default}

.dipnot{text-align:center;color:var(--soluk);font-size:.82rem;margin-top:34px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

{no:"1.1", b:0, ad:"Alfabemiz ve Harf Bilgisi",
ic:`
<h4>Alfabemizde kaç harf var?</h4>
<p>Türk alfabesinde <span class="vurgu">29 harf</span> vardır. Bu harflerin <b>8 tanesi ünlü (sesli)</b>, <b>21 tanesi ünsüz (sessiz)</b> harftir.</p>
<p>Alfabetik sıra şöyledir:</p>
<div class="harfler">
<span class="unlu">a</span><span>b</span><span>c</span><span>ç</span><span>d</span><span class="unlu">e</span><span>f</span><span>g</span><span>ğ</span><span>h</span><span class="unlu">ı</span><span class="unlu">i</span><span>j</span><span>k</span><span>l</span><span>m</span><span>n</span><span class="unlu">o</span><span class="unlu">ö</span><span>p</span><span>r</span><span>s</span><span>ş</span><span>t</span><span class="unlu">u</span><span class="unlu">ü</span><span>v</span><span>y</span><span>z</span>

<div class="kutu"><b class="bas">21 ünsüz harf</b>
<p style="margin:0;font-size:1.05rem;font-weight:700;letter-spacing:1px">b &nbsp; c &nbsp; ç &nbsp; d &nbsp; f &nbsp; g &nbsp; ğ &nbsp; h &nbsp; j &nbsp; k &nbsp; l &nbsp; m &nbsp; n &nbsp; p &nbsp; r &nbsp; s &nbsp; ş &nbsp; t &nbsp; v &nbsp; y &nbsp; z</p></div>
<h4>Ünlü harfler ikiye ayrılır</h4>
<table class="tablo">
<tr><th>Kalın ünlüler</th><td>a, ı, o, u</td><td>kapı, orman, uçak</td></tr>
<tr><th>İnce ünlüler</th><td>e, i, ö, ü</td><td>ekmek, kirpi, gözlük</td></tr>
</table>
<h4>Alfabetik sıralama nasıl yapılır?</h4>
<p>Önce kelimelerin <b>ilk harfine</b> bakarız. İlk harfleri aynıysa <b>ikinci harfe</b>, o da aynıysa <b>üçüncü harfe</b> bakarız.</p>

<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Bir kelimede kaç ünlü harf varsa o kelime o kadar hecelidir. Ünlüler olmadan hece kurulamaz!</p></div>
`,

ic:`
<h4>Hece nedir?</h4>
<p>Ağzımızı bir kez açıp kapatarak söylediğimiz ses parçasına <span class="vurgu">hece</span> denir. <b>Her hecede mutlaka bir ünlü harf bulunur.</b></p>

<h4>Hece sayısını nasıl buluruz?</h4>
<p>Kelimedeki <b>ünlü harfleri sayarız</b>. Kaç ünlü varsa o kadar hece vardır.</p>
<table class="tablo">

<h4>Satır sonuna sığmayan kelimeler</h4>
<p>Bir kelime satırın sonuna sığmazsa <b>hecelerinden bölünür</b> ve satır sonuna <span class="vurgu">kısa çizgi (-)</span> konur.</p>

</ul></div>

{no:"1.3", b:0, ad:"Sözlük Kullanımı",
ic:`
<h4>Sözlük ne işe yarar?</h4>
<p>Anlamını bilmediğimiz bir kelimeyle karşılaştığımızda <span class="vurgu">sözlüğe</span> bakarız. Sözlükte kelimeler <b>alfabetik sıraya</b> göre dizilmiştir.</p>
<h4>Sözlükte kelime nasıl aranır?</h4>
<ul>
<li>Kelimenin <b>ilk harfine</b> bakarız ve sözlükte o harfin bölümünü buluruz.</li>
<li>İlk harfleri aynı olan kelimelerde <b>ikinci harfe</b> bakarız.</li>
<li>İkinci harfleri de aynıysa <b>üçüncü harfe</b> bakarız.</li>
<li>Kelimeyi <b>eksiz hâliyle</b> ararız: “kitaplarımız” değil, <b>“kitap”</b> diye ararız.</li>
</ul>
<div class="ornek"><p><b>“çiçeklerimiz”</b> kelimesini sözlükte ararken önce ekleri atarız → <b>çiçek</b>. Sonra “ç” bölümüne bakarız.</p></div>
<h4>Bir kelimenin birden fazla anlamı olabilir</h4>
<p>Sözlükte bir kelimenin karşısında birden çok anlam yazabilir. Doğru anlamı bulmak için kelimenin <b>cümle içinde nasıl kullanıldığına</b> bakarız.</p>
<div class="kutu"><b class="bas">Örnek: “yüz”</b>
<ul style="margin:0">
<li>Doksan dokuzdan sonra gelen sayı → <i>Sınıfta yüz kitap var.</i></li>
<li>İnsanın ön kısmı, sima → <i>Yüzünü yıka.</i></li>
<li>Suda ilerlemek → <i>Havuzda güzel yüz!</i></li>
</ul></div>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Sözlükte kelimeler ekleriyle değil, <b>kök hâliyle</b> bulunur. Ansiklopedi ise kelimenin anlamını değil, konuyla ilgili geniş bilgi verir.</p></div>
`,
oy:[
 {tur:"test", ad:"Sözlük dedektifi", yonerge:"Sözlük kullanımıyla ilgili soruları çöz.",
  sorular:[
   {s:"“Ormanlarımızda” kelimesini sözlükte hangi biçimde ararız?",o:["ormanlarımızda","ormanlar","ormanlarımız","orman"],d:3,
    a:"Sözlükte kelimeler eksiz kök hâliyle bulunur: orman."},
   {s:"Sözlükte “sabun” kelimesinden hemen sonra aşağıdakilerden hangisi gelir?",o:["saat","sağlık","sakin","sadece"],d:1,
    a:"İkinci harflere bakalım: sa-a, sa-ğ, sa-k, sa-d. Alfabede a, d, ğ, k sırasıyla gelir. “sabun”dan sonra gelecek olan “sağlık”tır (b’den sonra ğ)."},
   {s:"Ayşe sözlükte “üzüm” kelimesini arıyor. Sözlüğün hangi bölümüne bakmalıdır?",o:["Başlarına yakın","Ortasına","Sonuna yakın","Rastgele bir yere"],d:2,
    a:"“ü” harfi alfabenin sonlarına yakındır, bu yüzden sözlüğün son bölümlerine bakmalıdır."},
   {s:"“Kırmızı kalemin ucu kırıldı.” cümlesinde “uç” kelimesi hangi anlamda kullanılmıştır?",o:["Havada süzülmek","Bir şeyin sivri son bölümü","Çok hızlı gitmek","Kaybolmak"],d:1,
    a:"Cümlede kalemin sivri son kısmından söz ediliyor. Anlamı cümleden buluruz."},
   {s:"Aşağıdaki kelime gruplarından hangisi alfabetik olarak doğru sıralanmıştır?",o:["deniz – dere – dört – duvar","dere – deniz – duvar – dört","dört – dere – deniz – duvar","duvar – dört – dere – deniz"],d:0,
    a:"de-n, de-r, dö, du → alfabede e önce, sonra ö, sonra u gelir. Doğru sıra: deniz, dere, dört, duvar."}
  ]},
 {tur:"sirala", ad:"Sözlük sayfası kur", yonerge:"Kelimeleri sözlükteki sıraya göre tıkla.",
  setler:[
   {ipucu:"Üçüncü harfe dikkat et", diz:["sabun","saçak","sağlık","sakin"]},
   {ipucu:"İnce ünlüler alfabenin sonlarında", diz:["taş","tepe","tırtıl","tuz","tüy"]}
  ]}

{no:"2.1", b:1, ad:"Eş Anlamlı Kelimeler",
ic:`
<h4>Eş anlamlı kelime nedir?</h4>
<p>Yazılışları ve okunuşları farklı olduğu hâlde <span class="vurgu">aynı anlamı taşıyan</span> kelimelere <b>eş anlamlı (anlamdaş) kelimeler</b> denir.</p>
<div class="ornek">
<p>okul = mektep &nbsp;•&nbsp; kırmızı = al &nbsp;•&nbsp; siyah = kara</p>
<p>hatıra = anı &nbsp;•&nbsp; misafir = konuk &nbsp;•&nbsp; cevap = yanıt</p>
</div>
<h4>Cümlede birbirinin yerine kullanılabilirler</h4>
<div class="ornek">
<p>Bugün <b>okula</b> geç kaldım. = Bugün <b>mektebe</b> geç kaldım.</p>
<p>Sorumun <b>cevabını</b> bekliyorum. = Sorumun <b>yanıtını</b> bekliyorum.</p>
</div>
<h4>Sık kullanılan eş anlamlı kelimeler</h4>
<table class="tablo">
<tr><td>ak – beyaz</td><td>yaşam – hayat</td><td>ihtiyar – yaşlı</td></tr>
<tr><td>armağan – hediye</td><td>doktor – hekim</td><td>zor – güç</td></tr>
<tr><td>vazife – görev</td><td>fakir – yoksul</td><td>öykü – hikâye</td></tr>
<tr><td>sene – yıl</td><td>tabiat – doğa</td><td>şehir – kent</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Eş anlamlı kelimeler her zaman birbirinin yerine kullanılamaz. Örneğin “kara kaşlı” yerine “siyah kaşlı” denebilir ama “kara haber” yerine “siyah haber” denmez.</p></div>
`,
oy:[
 {tur:"eslestir", ad:"Eş anlam eşleştirme", yonerge:"Aynı anlama gelen kelimeleri sırayla tıklayarak eşleştir.",
  ciftler:[["misafir","konuk"],["hatıra","anı"],["cevap","yanıt"],["ihtiyar","yaşlı"],["armağan","hediye"],["şehir","kent"]]},
 {tur:"test", ad:"Doğru eşi seç", yonerge:"Altı çizili kelimenin eş anlamlısını bul.",
  sorular:[
   {s:"“Dedem her sabah <b>tabiatta</b> yürüyüş yapar.” cümlesindeki altı çizili kelimenin eş anlamlısı hangisidir?",o:["bahçe","doğa","orman","köy"],d:1,
    a:"“Tabiat” kelimesinin eş anlamlısı “doğa”dır. Bahçe ve orman doğanın parçalarıdır ama eş anlamlısı değildir."},
   {s:"“Sınavdaki soruların <b>yanıtlarını</b> kontrol ettim.” cümlesinde altı çizili kelimenin yerine hangisi getirilebilir?",o:["sorularını","cevaplarını","sonuçlarını","puanlarını"],d:1,
    a:"Yanıt ile cevap eş anlamlıdır; cümlenin anlamı değişmez."},
   {s:"Aşağıdaki kelime çiftlerinden hangisi eş anlamlı <b>değildir</b>?",o:["fakir – yoksul","sene – yıl","güç – zor","büyük – geniş"],d:3,
    a:"“Büyük” ile “geniş” yakın anlamlıdır ama aynı anlama gelmez. Bir oda geniş olabilir, büyük bir taş için “geniş taş” denmez."},
   {s:"“Öğretmenimiz bize önemli bir <b>vazife</b> verdi.” cümlesindeki altı çizili kelimenin eş anlamlısı hangisidir?",o:["görev","ödül","hediye","tavsiye"],d:0,
    a:"Vazife = görev. Yapılması gereken iş anlamındadır."},
   {s:"Aşağıdaki cümlelerin hangisinde eş anlamlı iki kelime <b>birlikte</b> kullanılmıştır?",o:["Bugün hava çok soğuk ve yağmurlu.","Hekimler, yani doktorlar bu konuda uyarıyor.","Kırmızı kalemimi kaybettim.","Yaşlı adam bastonuna dayandı."],d:1,
    a:"“Hekim” ve “doktor” aynı anlama gelen iki kelimedir ve aynı cümlede kullanılmıştır."}
  ]}
]},

{no:"2.2", b:1, ad:"Zıt Anlamlı Kelimeler",
ic:`
<h4>Zıt anlamlı kelime nedir?</h4>
<p>Anlam bakımından <span class="vurgu">birbirinin karşıtı</span> olan kelimelere <b>zıt (karşıt) anlamlı kelimeler</b> denir.</p>
<div class="ornek"><p>büyük ↔ küçük &nbsp;•&nbsp; sıcak ↔ soğuk &nbsp;•&nbsp; gece ↔ gündüz</p>
<p>uzun ↔ kısa &nbsp;•&nbsp; ileri ↔ geri &nbsp;•&nbsp; açık ↔ kapalı</p></div>
<h4>Olumsuzluk zıtlık değildir!</h4>
<p>Bir kelimenin başına <b>“değil”</b> getirmek ya da sonuna <b>“-ma / -me”</b> eklemek onu zıt anlamlı yapmaz.</p>
<table class="tablo">
<tr><th>Kelime</th><th>Olumsuzu</th><th>Zıt anlamlısı</th></tr>
<tr><td>gelmek</td><td>gelmemek</td><td>gitmek</td></tr>
<tr><td>güzel</td><td>güzel değil</td><td>çirkin</td></tr>
<tr><td>sevmek</td><td>sevmemek</td><td>nefret etmek</td></tr>
</table>
<h4>Her kelimenin zıddı yoktur</h4>
<p>“Kalem, ağaç, masa, defter” gibi varlık adlarının zıt anlamlısı bulunmaz. Zıtlık genellikle <b>özellik, durum ve hareket</b> bildiren kelimelerde görülür.</p>
<div class="kutu unutma"><b class="bas">Atasözlerinde zıtlık</b>
<p style="margin:0">Birçok atasözünde zıt anlamlı kelimeler bir arada kullanılır: <i>“Ak akçe kara gün içindir.”</i> — burada <b>ak</b> ile <b>kara</b> zıt anlamlıdır.</p></div>
`,
oy:[
 {tur:"eslestir", ad:"Zıtları buluşturalım", yonerge:"Birbirinin karşıtı olan kelimeleri eşleştir.",
  ciftler:[["cömert","cimri"],["derin","sığ"],["ıslak","kuru"],["ileri","geri"],["bol","dar"],["kalın","ince"]]},
 {tur:"test", ad:"Zıt anlam testi", yonerge:"Soruları dikkatle oku.",
  sorular:[
   {s:"“Ayşe soruyu <b>doğru</b> cevapladı.” cümlesindeki altı çizili kelimenin zıt anlamlısı hangisidir?",o:["eksik","yanlış","güzel","hızlı"],d:1,
    a:"Doğru ↔ yanlış. “Eksik”in zıddı “tam”, “hızlı”nın zıddı “yavaş”tır."},
   {s:"Aşağıdakilerden hangisi bir kelimenin zıt anlamlısı <b>değil</b>, olumsuz biçimidir?",o:["almak – vermek","koşmak – koşmamak","inmek – çıkmak","açmak – kapatmak"],d:1,
    a:"“Koşmamak” yalnızca olumsuzluk ekiyle yapılmıştır; “koşmak”ın zıddı değildir."},
   {s:"Aşağıdaki kelimelerden hangisinin zıt anlamlısı <b>yoktur</b>?",o:["kalem","hızlı","sabah","boş"],d:0,
    a:"“Kalem” bir varlık adıdır; karşıtı olamaz. Diğerlerinin zıddı: yavaş, akşam, dolu."},
   {s:"“Kışın günler <b>kısalır</b>, geceler uzar.” cümlesinde zıt anlamlı olarak kullanılan kelimeler hangileridir?",o:["kış – gün","kısalmak – uzamak","gece – kış","gün – kısalmak"],d:1,
    a:"Cümlede “kısalmak” ve “uzamak” fiilleri birbirinin karşıtıdır."},
   {s:"“Bardağın yarısı boş demek yerine yarısı dolu demeyi öğren.” cümlesinden çıkarılabilecek en doğru yargı hangisidir?",o:["Bardaklar hep yarım doludur.","Aynı durum karşıt bakış açılarıyla anlatılabilir.","Boş bardak kullanılmamalıdır.","Su içmek sağlığa faydalıdır."],d:1,
    a:"Cümlede aynı gerçeğin (yarım bardak) zıt iki kelimeyle nasıl farklı anlatıldığı vurgulanmaktadır."}
  ]}
]},

{no:"2.3", b:1, ad:"Eş Sesli (Sesteş) Kelimeler",
ic:`
<h4>Eş sesli kelime nedir?</h4>
<p>Yazılışları ve okunuşları <b>aynı</b> olduğu hâlde <span class="vurgu">anlamları tamamen farklı</span> olan kelimelere <b>eş sesli (sesteş) kelimeler</b> denir.</p>
<div class="ornek">
<p><b>yüz</b> → Havuzda <b>yüz</b>. / <b>Yüz</b>ünü yıka. / Sınıfta <b>yüz</b> kitap var.</p>
<p><b>gül</b> → Bahçede <b>gül</b> açtı. / Şakama <b>gül</b>.</p>
<p><b>yaz</b> → <b>Yaz</b> mevsimi geldi. / Defterine <b>yaz</b>.</p>
</div>
<h4>Sık karşılaşılan eş sesli kelimeler</h4>
<table class="tablo">
<tr><th>Kelime</th><th>1. anlam</th><th>2. anlam</th></tr>
<tr><td>yat</td><td>Uzanmak, uyumak</td><td>Deniz taşıtı</td></tr>
<tr><td>kaz</td><td>Bir kuş türü</td><td>Toprağı kazmak</td></tr>
<tr><td>çay</td><td>İçilen sıcak içecek</td><td>Küçük akarsu</td></tr>
<tr><td>ben</td><td>Kendimden söz ederken</td><td>Deri üzerindeki küçük leke</td></tr>

</table>
<div class="kutu unutma"><b class="bas">Şapkalı harflere dikkat!</b>
<p style="margin:0">Yazılışı benzese de üzerinde düzeltme işareti (^) bulunan kelimeler eş sesli sayılmaz: <b>hala</b> (babanın kız kardeşi) ile <b>hâlâ</b> (henüz) farklı yazılır.</p></div>

   {s:"“Deniz kenarında büyük bir <b>yat</b> demirlemişti.” cümlesindeki altı çizili kelimenin diğer anlamı hangi cümlede kullanılmıştır?",o:["Yatağını topladı.","Erken yat, sabah okul var.","Yatay çizgi çizdi.","Yatırım yaptı."],d:1,

{no:"2.4", b:1, ad:"Gerçek ve Mecaz Anlam",
ic:`
<h4>Gerçek anlam</h4>
<p>Bir kelimenin akla ilk gelen, sözlükteki <span class="vurgu">temel anlamına</span> gerçek anlam denir.</p>
<div class="ornek"><p><b>Soğuk:</b> Kışın hava çok <b>soğuktu</b>. (Isısı düşük)</p>
<p><b>Ağır:</b> Çantam çok <b>ağırdı</b>. (Kilosu fazla)</p></div>
<h4>Mecaz anlam</h4>
<p>Bir kelimenin gerçek anlamının dışında, <span class="vurgu">benzetme yoluyla kazandığı yeni anlama</span> mecaz anlam denir.</p>
<div class="ornek"><p><b>Soğuk:</b> Bize çok <b>soğuk</b> davrandı. (İlgisiz, sevimsiz)</p>
<p><b>Ağır:</b> Bu sözler bana çok <b>ağır</b> geldi. (Kırıcı)</p>
<p><b>Tatlı:</b> Ne <b>tatlı</b> bir çocuksun! (Sevimli)</p></div>
<h4>Nasıl ayırt ederiz?</h4>
<p>Kendimize şu soruyu sorarız: <b>“Bu gerçekten olabilir mi?”</b></p>
<table class="tablo">
<tr><th>Cümle</th><th>Anlam</th><th>Neden?</th></tr>
<tr><td>Buzlar eridi.</td><td>Gerçek</td><td>Buz gerçekten erir.</td></tr>
<tr><td>Aramızdaki buzlar eridi.</td><td>Mecaz</td><td>Arkadaşlık düzeldi demek istenmiş.</td></tr>
<tr><td>Elleri kirlenmiş.</td><td>Gerçek</td><td>Gerçekten kir var.</td></tr>
<tr><td>Eli açık bir insandır.</td><td>Mecaz</td><td>Cömert anlamında.</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Deyimlerin hemen hepsi mecaz anlamlıdır. “Etekleri zil çalmak” gerçekten etekte zil olması demek değil, çok sevinmek demektir.</p></div>
`,

{no:"2.5", b:1, ad:"Deyimler ve Atasözleri",
ic:`
<h4>Deyim nedir?</h4>
<p>En az iki kelimeden oluşan, <span class="vurgu">çoğunlukla gerçek anlamının dışında</span> bir durumu, olayı ilgi çekici biçimde anlatan kalıplaşmış söz gruplarına <b>deyim</b> denir.</p>
<div class="ornek"><p><b>Ağzı kulaklarına varmak</b> → Çok sevinmek</p>
<p><b>Burnu havada olmak</b> → Kibirli davranmak</p>
<p><b>İki eli kanda olsa</b> → Ne olursa olsun, mutlaka</p></div>
<h4>Atasözü nedir?</h4>
<p>Atalarımızın uzun yılların deneyimiyle söylediği, <span class="vurgu">öğüt veren, ders çıkarmamızı sağlayan</span> kalıplaşmış sözlere <b>atasözü</b> denir.</p>
<div class="ornek"><p><b>Damlaya damlaya göl olur.</b> → Küçük birikimler zamanla büyür.</p>
<p><b>Ağaç yaşken eğilir.</b> → İyi alışkanlıklar küçük yaşta kazandırılır.</p></div>
<h4>Aralarındaki fark</h4>
<table class="tablo">
<tr><th></th><th>Deyim</th><th>Atasözü</th></tr>
<tr><th>Amacı</th><td>Bir durumu etkili anlatmak</td><td>Öğüt vermek, ders çıkarmak</td></tr>
<tr><th>Yapısı</th><td>Genellikle cümle değildir</td><td>Genellikle tam bir cümledir</td></tr>
<tr><th>Örnek</th><td>göz atmak, pabucu dama atılmak</td><td>Sakla samanı, gelir zamanı.</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Deyimlerin ve atasözlerinin kelimeleri değiştirilemez. “Ağaç yaşken eğilir” yerine “Ağaç gençken bükülür” denmez.</p></div>
`,

{no:"3.1", b:2, ad:"İsimler (Varlıkların Adları)",
ic:`
<h4>İsim nedir?</h4>
<p>Canlı ve cansız bütün varlıkları, kavramları karşılayan kelimelere <span class="vurgu">isim (ad)</span> denir.</p>
<div class="ornek"><p>kalem, ağaç, Ankara, sevgi, kuş, Ahmet, deniz…</p></div>
<h4>1) Özel isim – Cins (tür) isim</h4>
<table class="tablo">
<tr><th>Özel isim</th><td>Tek bir varlığa verilen ad. <b>Büyük harfle</b> başlar.</td><td>Ayşe, Türkiye, Kızılırmak, Ali Baba Kitabı</td></tr>
<tr><th>Cins isim</th><td>Aynı türden varlıkların ortak adı. Küçük harfle yazılır.</td><td>çocuk, ülke, nehir, kitap</td></tr>
</table>
<div class="ornek"><p><b>Mersin</b> güzel bir <b>şehirdir</b>. → “Mersin” özel isim, “şehir” cins isimdir.</p></div>
<h4>2) Tekil isim – Çoğul isim</h4>
<p>Bir tek varlığı karşılayan isimler <b>tekil</b>, birden fazla varlığı karşılayanlar <b>çoğul</b>dur. Çoğul isimler <span class="vurgu">-ler / -lar</span> ekiyle yapılır.</p>
<table class="tablo">
<tr><th>Tekil</th><td>kalem, defter, çocuk, ev</td></tr>
<tr><th>Çoğul</th><td>kalemler, defterler, çocuklar, evler</td></tr>
</table>
<h4>3) Somut isim – Soyut isim</h4>
<table class="tablo">
<tr><th>Somut</th><td>Beş duyu organımızla algılayabildiklerimiz</td><td>masa, koku, ses, su</td></tr>
<tr><th>Soyut</th><td>Duyularımızla algılayamadığımız, var olduğuna inandıklarımız</td><td>sevgi, akıl, rüya, korku</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">İsimleri bulmak için “<b>Kim? Ne? Nereye? Nerede?</b>” sorularını sorabiliriz.</p></div>
`,
oy:[

  kategoriler:["Özel isim","Cins isim"],
  ogeler:[["Sakarya",0],["nehir",1],["öğretmen",1],["Mustafa Kemal Atatürk",0],["kedi",1],["Türkçe",0],["kitap",1],["Harran",0],["şehir",1],["Karadeniz",0]]},

{no:"3.2", b:2, ad:"Sıfatlar (Ön Adlar)",
ic:`
<h4>Sıfat nedir?</h4>
<p>İsimlerin önüne gelerek onları <span class="vurgu">niteleyen ya da belirten</span> kelimelere <b>sıfat (ön ad)</b> denir. Sıfat tek başına kullanılmaz, mutlaka bir ismin önünde bulunur.</p>
<div class="ornek"><p><b>kırmızı</b> kalem &nbsp;•&nbsp; <b>üç</b> çocuk &nbsp;•&nbsp; <b>bu</b> defter &nbsp;•&nbsp; <b>kaç</b> soru?</p></div>
<h4>1) Niteleme sıfatları</h4>
<p>Varlığın <b>nasıl olduğunu</b> anlatır. İsme “<b>nasıl?</b>” sorusunu sorarak buluruz.</p>
<div class="ornek"><p>tatlı elma, uzun yol, çalışkan öğrenci, yumuşak yastık</p></div>
<h4>2) Belirtme sıfatları</h4>
<table class="tablo">
<tr><th>İşaret sıfatı</th><td>Varlığı işaret eder</td><td><b>bu</b> kitap, <b>şu</b> ev, <b>o</b> ağaç</td></tr>
<tr><th>Sayı sıfatı</th><td>Sayısını bildirir</td><td><b>beş</b> kalem, <b>ikinci</b> sıra, <b>yarım</b> ekmek</td></tr>
<tr><th>Belgisiz sıfat</th><td>Sayıyı yaklaşık bildirir</td><td><b>birkaç</b> çocuk, <b>bütün</b> sınıf, <b>bazı</b> günler</td></tr>
<tr><th>Soru sıfatı</th><td>Soru yoluyla belirtir</td><td><b>kaç</b> kitap? <b>hangi</b> yol? <b>nasıl</b> bir gün?</td></tr>
</table>
<h4>Sıfat mı, isim mi?</h4>
<p>Bir kelime tek başına duruyorsa <b>isim</b>, bir ismin önünde onu anlatıyorsa <b>sıfat</b>tır.</p>
<div class="ornek"><p><b>Kırmızıyı</b> çok severim. → isim (renk adı)</p>
<p><b>Kırmızı</b> kalemi ver. → sıfat (kalemi niteliyor)</p></div>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Sıfatı bulmak için isme şu soruları sor: <b>Nasıl? Kaç? Hangi? Ne kadar?</b></p></div>
`,
oy:[
 {tur:"test", ad:"Sıfatı bul", yonerge:"Cümlelerde sıfatları tanıyalım.",
  sorular:[
   {s:"“Bahçedeki yaşlı çınar ağacı gölge yapıyordu.” cümlesinde sıfat olan kelime hangisidir?",o:["bahçedeki","yaşlı","çınar","gölge"],d:1,
    a:"“Yaşlı” kelimesi ağacın nasıl olduğunu anlatır, bu yüzden niteleme sıfatıdır."},
   {s:"“Çantamda üç kitap ve birkaç kalem var.” cümlesindeki sıfatların türü sırasıyla hangisidir?",o:["Niteleme – işaret","Sayı – belgisiz","Belgisiz – soru","İşaret – sayı"],d:1,
    a:"“Üç” kesin sayı bildirir (sayı sıfatı), “birkaç” yaklaşık miktar bildirir (belgisiz sıfat)."},
   {s:"Aşağıdaki cümlelerin hangisinde “yeşil” kelimesi sıfat olarak kullanılmıştır?",o:["Yeşil, doğanın rengidir.","En sevdiğim renk yeşildir.","Yeşil defterimi bulamıyorum.","Yeşile boyadık duvarı."],d:2,
    a:"“Yeşil defter” ifadesinde kelime bir ismin önünde onu nitelediği için sıfattır. Diğerlerinde tek başına isim olarak kullanılmıştır."},
   {s:"“Hangi otobüse bineceğimizi bilmiyorum.” cümlesindeki “hangi” kelimesi için doğru olan nedir?",o:["Niteleme sıfatıdır","Soru sıfatıdır","Sayı sıfatıdır","İsimdir"],d:1,
    a:"“Hangi” kelimesi “otobüs” ismini soru yoluyla belirttiği için soru sıfatıdır."},
   {s:"“Soğuk sularda uzun süre kalmayın.” cümlesinde kaç sıfat vardır?",o:["1","2","3","4"],d:1,
    a:"“Soğuk” (sular) ve “uzun” (süre) olmak üzere 2 sıfat vardır."},
   {s:"Aşağıdaki tamlamalardan hangisinde işaret sıfatı kullanılmıştır?",o:["mavi gömlek","şu ev","beş elma","bazı öğrenciler"],d:1,
    a:"“Şu” kelimesi evi işaret ederek belirttiği için işaret sıfatıdır."}

          ["<b>büyük</b> bahçe",0],["<b>bütün</b> sınıf",3]]}

{no:"3.3", b:2, ad:"Fiiller (Eylemler)",
ic:`
<h4>Fiil nedir?</h4>
<p><span class="vurgu">İş, oluş ya da hareket</span> bildiren kelimelere <b>fiil (eylem)</b> denir.</p>
<table class="tablo">
<tr><th>İş (kılış)</th><td>Bir varlık tarafından yapılır</td><td>yazmak, kırmak, okumak, taşımak</td></tr>
<tr><th>Oluş</th><td>Kendiliğinden gerçekleşir, değişimi anlatır</td><td>büyümek, sararmak, uzamak, olgunlaşmak</td></tr>
<tr><th>Durum / hareket</th><td>Varlığın içinde bulunduğu durum</td><td>koşmak, uyumak, gitmek, oturmak</td></tr>
</table>
<h4>Fiillerde zaman</h4>
<p>Fiiller bize işin <b>ne zaman</b> yapıldığını da söyler.</p>
<table class="tablo">
<tr><th>Zaman</th><th>Eki</th><th>Örnek</th></tr>
<tr><td>Geçmiş zaman</td><td>-dı / -miş</td><td>Kitabı oku<b>du</b>. / Oku<b>muş</b>.</td></tr>
<tr><td>Şimdiki zaman</td><td>-yor</td><td>Kitabı oku<b>yor</b>.</td></tr>
<tr><td>Gelecek zaman</td><td>-acak / -ecek</td><td>Kitabı oku<b>yacak</b>.</td></tr>
<tr><td>Geniş zaman</td><td>-r / -ar / -er</td><td>Her akşam kitap oku<b>r</b>.</td></tr>
</table>
<h4>Fiili nasıl buluruz?</h4>
<p>Kelimenin sonuna <b>“-mek / -mak”</b> getirebiliyorsak o kelime fiildir.</p>
<div class="ornek"><p>koş → koş<b>mak</b> ✓ fiil &nbsp;|&nbsp; kalem → kalem<b>mek</b> ✗ fiil değil</p></div>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Cümlede fiil bulmak için “<b>Ne yaptı? Ne oldu?</b>” sorularını sorarız.</p></div>
`,

{no:"3.4", b:2, ad:"Zamirler (Adıllar)",
ic:`
<h4>Zamir nedir?</h4>
<p>İsmin yerine kullanılan kelimelere <span class="vurgu">zamir (adıl)</span> denir. Zamirler, adını tekrar tekrar söylememek için kullanılır.</p>
<div class="ornek"><p>Ayşe ödevini bitirdi. <b>O</b>, sonra dışarı çıktı. → “O” kelimesi Ayşe'nin yerini tutuyor.</p></div>
<h4>Kişi zamirleri</h4>
<div class="harfler"><span>ben</span><span>sen</span><span>o</span><span>biz</span><span>siz</span><span>onlar</span></div>
<div class="ornek"><p><b>Ben</b> okula yürüyerek gidiyorum. &nbsp;|&nbsp; <b>Onlar</b> bahçede oynuyor.</p></div>
<h4>İşaret zamirleri</h4>
<p>Varlıkları işaret ederek onların yerini tutar: <b>bu, şu, o, bunlar, şunlar, onlar</b></p>
<div class="ornek"><p><b>Şunu</b> bana uzatır mısın? → “Şu” bir varlığın yerini tutuyor.</p></div>
<h4>Zamir mi, sıfat mı?</h4>
<p>Bir kelime <b>ismin önünde</b> ve onu belirtiyorsa <b>sıfat</b>, <b>ismin yerini tutuyorsa</b> <b>zamir</b>dir.</p>
<table class="tablo">
<tr><th>Cümle</th><th>Türü</th><th>Neden?</th></tr>
<tr><td><b>Bu</b> kalem benim.</td><td>Sıfat</td><td>“Kalem” isminin önünde</td></tr>
<tr><td><b>Bu</b> benim.</td><td>Zamir</td><td>Kalemin yerini tutuyor</td></tr>
<tr><td><b>Kaç</b> kitap aldın?</td><td>Sıfat</td><td>“Kitap”ı belirtiyor</td></tr>
<tr><td><b>Kaçını</b> okudun?</td><td>Zamir</td><td>Kitapların yerini tutuyor</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Belgisiz zamirler de vardır: <b>kimse, herkes, bazıları, hepsi, birçoğu</b>. Örnek: <i>Herkes sırasına oturdu.</i></p></div>
`,
oy:[
 {tur:"test", ad:"Zamir mi sıfat mı?", yonerge:"Cümledeki kelimenin görevini bul.",
  sorular:[
   {s:"“Bunu daha önce hiç görmemiştim.” cümlesindeki “bunu” kelimesi ne görevindedir?",o:["Sıfat","Zamir","Fiil","İsim"],d:1,
    a:"Kelime bir ismin önünde değil, doğrudan bir varlığın yerini tutuyor; bu yüzden zamirdir."},
   {s:"Aşağıdaki cümlelerin hangisinde “o” kelimesi sıfat olarak kullanılmıştır?",o:["O, bize her gün yardım eder.","O çocuk çok naziktir.","Onu dün gördüm.","Onlar bahçedeler."],d:1,
    a:"“O çocuk” ifadesinde kelime bir ismin önünde onu belirtiyor; işaret sıfatıdır."},
   {s:"“Sınıftaki herkes etkinliğe katıldı.” cümlesindeki “herkes” kelimesi neyin yerini tutmaktadır?",o:["Sınıfın","Öğrencilerin","Etkinliğin","Öğretmenin"],d:1,
    a:"“Herkes” burada sınıftaki tüm öğrencilerin yerine kullanılmış belgisiz zamirdir."},
   {s:"“Kaç tanesini bitirdin?” sorusunda “kaç tanesini” kelimesi hangi görevdedir?",o:["Soru sıfatı","Soru zamiri","Niteleme sıfatı","Fiil"],d:1,
    a:"Bir ismin önünde değildir; sorulan varlıkların yerini tuttuğu için soru zamiridir."},
   {s:"“Ali kitabı okudu. Sonra onu kardeşine verdi.” cümlesinde “onu” zamiri neyin yerine kullanılmıştır?",o:["Ali'nin","Kardeşin","Kitabın","Okumanın"],d:2,
    a:"Verilen şey kitaptır; “onu” zamiri kitabın yerini tutmaktadır."}
  ]},
 {tur:"siniflandir", ad:"Kelime türü karışık", yonerge:"Koyu yazılan kelimenin türünü seç.",
  kategoriler:["İsim","Sıfat","Fiil","Zamir"],
  ogeler:[["<b>Deniz</b> bugün çok dalgalı.",0],["<b>Mavi</b> bir gömlek aldım.",1],["Bahçede top <b>oynuyorlar</b>.",2],["<b>Biz</b> pikniğe gidiyoruz.",3],
          ["<b>Kitap</b> okumayı severim.",0],["<b>Uzun</b> bir yol yürüdük.",1],["Kuşlar gökyüzünde <b>süzülüyor</b>.",2],["<b>Şunu</b> bana verir misin?",3],
          ["<b>Sevgi</b> en güzel duygudur.",0],["Sınıfta <b>üç</b> pencere var.",1]]}
]},

/* ---------------- BÖLÜM 4 ---------------- */
{no:"4.1", b:3, ad:"Cümle Nedir? Anlamlı ve Kurallı Cümle",
ic:`
<h4>Cümle nedir?</h4>
<p>Bir duyguyu, düşünceyi, isteği ya da olayı <span class="vurgu">tam olarak anlatan kelime ya da kelime dizisine</span> <b>cümle</b> denir.</p>
<p>Cümle <b>büyük harfle başlar</b>, sonuna <b>nokta, soru işareti ya da ünlem</b> konur.</p>
<h4>Anlamlı cümle</h4>
<p>Kelimeler bir araya geldiğinde anlaşılır bir anlam çıkıyorsa cümle <b>anlamlı</b>dır.</p>
<div class="ornek"><p>✓ Kedi bahçede uyuyor. &nbsp;→ anlamlı</p>
<p>✗ Kedi bahçede kitap. &nbsp;→ anlamsız</p></div>
<h4>Kurallı cümle</h4>
<p>Türkçede <b>yüklem (fiil) cümlenin sonunda</b> bulunur. Yüklemi sonda olan cümlelere <b>kurallı cümle</b> denir.</p>
<div class="ornek"><p>✓ Ali sabah erkenden <b>kalktı</b>. → kurallı</p>
<p>✗ <b>Kalktı</b> Ali sabah erkenden. → devrik</p></div>
<h4>Cümle kurarken sıralama</h4>
<p>Karışık verilen kelimelerle cümle kurarken şu yolu izleriz:</p>
<ul>
<li>Önce <b>yüklemi</b> (fiili) buluruz ve sona koyarız.</li>
<li>Sonra “<b>kim/ne</b>” sorusunun cevabını (özneyi) başa alırız.</li>
<li>Diğer kelimeleri anlamlı olacak şekilde araya yerleştiririz.</li>
</ul>
<div class="ornek"><p>Karışık: <i>oynadı / bahçede / çocuklar / top</i></p>
<p>Kurallı cümle: <b>Çocuklar bahçede top oynadı.</b></p></div>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Her kelime grubu cümle değildir. “Bahçedeki kırmızı çiçekler” bir kelime grubudur; yargı bildirmediği için cümle değildir.</p></div>
`,
oy:[
 {tur:"sirala", ad:"Cümleyi kur", yonerge:"Kelimeleri anlamlı ve kurallı bir cümle olacak şekilde sırayla tıkla.",
  setler:[
   {ipucu:"Yüklem en sona gelmeli", diz:["Çocuklar","bahçede","top","oynadı."]},
   {ipucu:"Kim? sorusuyla başla", diz:["Öğretmenimiz","bize","yeni","bir","şiir","öğretti."]},
   {ipucu:"Zaman bildiren kelime başta olabilir", diz:["Dün","akşam","ailemle","birlikte","kitap","okuduk."]},
   {ipucu:"Fiil sonda", diz:["Kardeşim","doğum","gününde","çok","sevindi."]}
  ]},
 {tur:"test", ad:"Cümle mi değil mi?", yonerge:"Doğru seçeneği bul.",
  sorular:[
   {s:"Aşağıdakilerden hangisi bir cümledir?",o:["Bahçedeki sarı güller","Okulun arka kapısı","Yağmur bütün gün yağdı.","Çok güzel ve temiz bir sınıf"],d:2,
    a:"Sadece “Yağmur bütün gün yağdı.” tam bir yargı bildirir ve yüklemi vardır."},
   {s:"“geldi / kuşlar / bahçeye / sabah” kelimeleriyle kurulacak kurallı cümle hangisidir?",o:["Geldi bahçeye kuşlar sabah.","Sabah kuşlar bahçeye geldi.","Kuşlar geldi sabah bahçeye.","Bahçeye geldi sabah kuşlar."],d:1,
    a:"Yüklem (“geldi”) sonda olduğu için yalnızca bu seçenek kuralldır."},
   {s:"Aşağıdaki cümlelerden hangisi devrik cümledir?",o:["Annem bize kek yaptı.","Yollar karla kaplandı.","Anlatsana bana o hikâyeyi.","Kardeşim ödevini bitirdi."],d:2,
    a:"“Anlatsana” yüklemi cümlenin başındadır; bu yüzden devrik cümledir."},
   {s:"“Küçük kedi ______.” cümlesini anlamlı biçimde tamamlayan seçenek hangisidir?",o:["masanın altına saklandı","kırmızı ve büyük","sınıfın penceresi","güzel bir hikâye"],d:0,
    a:"Cümlenin tamamlanması için yargı bildiren bir yükleme ihtiyaç vardır."},
   {s:"Bir kelime grubunun cümle olabilmesi için mutlaka ne olması gerekir?",o:["Beş kelimeden fazla olması","Bir yargı bildirmesi","Sıfat içermesi","Soru sormaması"],d:1,
    a:"Cümlenin temel şartı tam bir yargı (hüküm) bildirmesidir."}
  ]}
]},

{no:"4.2", b:3, ad:"Cümle Çeşitleri",
ic:`
<h4>1) Olumlu ve olumsuz cümleler</h4>
<table class="tablo">
<tr><th>Olumlu cümle</th><td>Bir işin yapıldığını / yapılacağını bildirir</td><td>Bugün okula gittim.</td></tr>
<tr><th>Olumsuz cümle</th><td>Bir işin yapılmadığını bildirir. <b>-ma / -me, değil, yok</b> kelimeleri kullanılır</td><td>Bugün okula gitmedim.</td></tr>
</table>
<h4>2) Soru cümleleri</h4>
<p>Bir şeyi öğrenmek için kurulan cümlelerdir, sonuna <span class="vurgu">soru işareti (?)</span> konur. Soru cümlelerinde genellikle şu kelimeler bulunur: <b>kim, ne, nerede, ne zaman, nasıl, niçin, kaç, mı/mi</b></p>
<div class="ornek"><p>Ödevini bitirdin <b>mi</b>? &nbsp;|&nbsp; <b>Nereye</b> gidiyorsun?</p></div>
<h4>3) Ünlem cümleleri</h4>
<p>Sevinç, korku, şaşkınlık, acı gibi <b>güçlü duyguları</b> anlatan cümlelerdir. Sonuna <span class="vurgu">ünlem işareti (!)</span> konur.</p>
<div class="ornek"><p>Ne kadar güzel bir manzara! &nbsp;|&nbsp; Eyvah, otobüsü kaçırdık!</p></div>
<h4>4) Haber ve dilek cümleleri</h4>
<table class="tablo">
<tr><th>Haber cümlesi</th><td>Bir olayı, durumu haber verir; zaman bildirir</td><td>Yarın tiyatroya gideceğiz.</td></tr>
<tr><th>Dilek cümlesi</th><td>İstek, emir, gereklilik, temenni bildirir</td><td>Kapıyı kapat. / Keşke yağmur yağsa. / Ders çalışmalısın.</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Bazı cümleler soru kelimesi taşısa da soru sormaz: <i>“Nasıl çalıştığını biliyorum.”</i> Bu bir soru cümlesi değildir, sonuna nokta konur.</p></div>
`,

  kategoriler:["Olumlu","Olumsuz","Soru","Ünlem"],
  ogeler:[["Bugün ödevimi tamamladım.",0],["Hiç kimse bahçeye çıkmadı.",1],["Kütüphane hangi kattaydı?",2],["Aman dikkat, düşeceksin!",3],
          ["Kardeşim çorbayı sevmiyor.",1],["Yarın sabah erken kalkacağız.",0],["Sen de bizimle gelir misin?",2],["Ne kadar da güzel bir gün!",3],
          ["Bu kitabı daha önce okumamıştım.",1],["Vay canına, sonunda başardık!",3]]},
 {tur:"test", ad:"Cümle çeşitleri testi", yonerge:"Soruları çöz.",
  sorular:[
   {s:"“Sınıfta kimse kalmamış.” cümlesi için aşağıdakilerden hangisi doğrudur?",o:["Olumlu haber cümlesidir","Olumsuz haber cümlesidir","Soru cümlesidir","Dilek cümlesidir"],d:1,
    a:"“Kalmamış” fiilindeki -ma olumsuzluk ekiyle işin gerçekleşmediği haber verilmiştir."},

   {s:"“Bu soruyu nasıl çözdüğünü hâlâ anlamadım.” cümlesinin sonuna hangi noktalama işareti konmalıdır?",o:["Soru işareti","Nokta","Ünlem","İki nokta"],d:1,

    a:"“-malı/-meli” eki bir işin yapılmasının gerekli olduğunu bildirir."},

  ]}
]},

{no:"4.3", b:3, ad:"Sebep – Sonuç Cümleleri",
ic:`
<h4>Sebep – sonuç ilişkisi nedir?</h4>
<p>Bir cümlede bir işin <span class="vurgu">neden yapıldığı</span> ve <span class="vurgu">sonucunda ne olduğu</span> birlikte anlatılıyorsa bu cümlede sebep–sonuç ilişkisi vardır.</p>
<div class="ornek"><p><b>Yağmur yağdığı için</b> pikniğe gidemedik.</p>
<p style="margin-top:6px">Sebep: yağmurun yağması &nbsp;→&nbsp; Sonuç: pikniğe gidememek</p></div>
<h4>Sebep–sonuç cümlelerinde kullanılan kelimeler</h4>
<div class="harfler"><span>çünkü</span><span>için</span><span>-dığı için</span><span>-den dolayı</span><span>bu yüzden</span><span>bu nedenle</span><span>-diğinden</span></div>
<h4>Örnekler</h4>
<table class="tablo">
<tr><th>Cümle</th><th>Sebep</th><th>Sonuç</th></tr>
<tr><td>Çok çalıştığı için sınavı kazandı.</td><td>Çok çalışması</td><td>Sınavı kazanması</td></tr>
<tr><td>Hasta olduğundan okula gelemedi.</td><td>Hasta olması</td><td>Okula gelememesi</td></tr>
<tr><td>Kar yağdı, bu yüzden yollar kapandı.</td><td>Kar yağması</td><td>Yolların kapanması</td></tr>
</table>
<div class="kutu unutma"><b class="bas">Nasıl bulunur?</b>
<p style="margin:0">Cümleye “<b>Niçin? Neden?</b>” sorularını sorarız. Cevabı olan kısım <b>sebep</b>, geri kalanı <b>sonuç</b>tur.</p></div>
`,
oy:[
 {tur:"test", ad:"Sebebi bul", yonerge:"Cümlelerdeki sebep–sonuç ilişkisini çöz.",
  sorular:[
   {s:"“Otobüsü kaçırdığı için okula geç kaldı.” cümlesinde sonuç hangisidir?",o:["Otobüsü kaçırması","Okula geç kalması","Otobüsün gelmesi","Okulun açılması"],d:1,
    a:"Otobüsü kaçırmak sebep, okula geç kalmak ise bunun sonucudur."},
   {s:"Aşağıdaki cümlelerin hangisinde sebep–sonuç ilişkisi <b>yoktur</b>?",o:["Hava soğuduğu için montumu giydim.","Erken kalktı, bu yüzden yorgun değildi.","Kitabı okudum ve çok beğendim.","Çok yürüdüğümden ayaklarım ağrıdı."],d:2,
    a:"Üçüncü cümlede iki iş sıralanmıştır; biri diğerinin sebebi olarak gösterilmemiştir."},
   {s:"“Sıcaktan bunaldığı için pencereyi açtı.” cümlesine hangi soruyu sorarsak sebebi buluruz?",o:["Ne zaman açtı?","Neden açtı?","Nereyi açtı?","Kim açtı?"],d:1,
    a:"Sebep, “Neden/Niçin?” sorusunun cevabıdır."},
   {s:"“Bahçedeki çiçekler soldu.” cümlesinin sebebi olarak en uygun ifade hangisidir?",o:["çünkü çiçekler çok güzeldi","çünkü uzun süre sulanmadı","çünkü bahçe büyüktü","çünkü herkes onları sevdi"],d:1,
    a:"Solmanın gerçekçi sebebi susuz kalmaktır; diğer seçenekler solma ile ilgili değildir."},
   {s:"“Erken yattığı için sabah dinç uyandı.” cümlesinde altı çizili yapı olan “-dığı için” neyi bildirir?",o:["Zamanı","Sebebi","Şartı","Yeri"],d:1,
    a:"“-dığı için” yapısı bir işin gerekçesini, yani sebebini bildirir."}
  ]},
 {tur:"eslestir", ad:"Sebep ile sonucu birleştir", yonerge:"Sebebi, ona uygun sonuçla eşleştir.",
  ciftler:[["Kar yağdığı için","yollar kapandı."],["Düzenli çalıştığı için","sınavda başarılı oldu."],["Çamura bastığı için","ayakkabıları kirlendi."],["Sesini yükselttiği için","kardeşi korktu."],["Bitkiyi sulamadığı için","yaprakları sarardı."]]}
]},

{no:"4.4", b:3, ad:"5N1K ve Hikâye Unsurları",
ic:`
<h4>5N1K nedir?</h4>
<p>Bir olayı bütün yönleriyle anlamak için sorduğumuz altı soruya <span class="vurgu">5N1K</span> denir.</p>
<table class="tablo">
<tr><th>Ne?</th><td>Olayın kendisi</td><td>Ne oldu?</td></tr>
<tr><th>Nerede?</th><td>Olayın geçtiği yer</td><td>Nerede oldu?</td></tr>
<tr><th>Ne zaman?</th><td>Olayın zamanı</td><td>Ne zaman oldu?</td></tr>
<tr><th>Nasıl?</th><td>Olayın gerçekleşme biçimi</td><td>Nasıl oldu?</td></tr>
<tr><th>Niçin?</th><td>Olayın sebebi</td><td>Neden oldu?</td></tr>
<tr><th>Kim?</th><td>Olaydaki kişiler</td><td>Kim yaptı?</td></tr>
</table>
<h4>Hikâyenin dört temel unsuru</h4>
<table class="tablo">
<tr><th>Olay</th><td>Hikâyede anlatılan başlıca durum</td></tr>
<tr><th>Kişiler (şahıs kadrosu)</th><td>Olayı yaşayan kahramanlar</td></tr>
<tr><th>Yer (mekân)</th><td>Olayın geçtiği çevre</td></tr>
<tr><th>Zaman</th><td>Olayın geçtiği zaman dilimi</td></tr>
</table>
<h4>Örnek metin</h4>
<div class="kutu">
<p style="margin:0"><b>Kayıp Kalem</b></p>
<p style="margin:6px 0 0">Cuma sabahı Elif, sınıfa girdiğinde çantasını karıştırdı. Dedesinin hediye ettiği mavi kalemi yoktu. Teneffüste bütün sınıfı aradı ama bulamadı. Öğretmeni, kalemin okul bahçesindeki bankta bulunduğunu söyleyince Elif sevinçten gülümsedi. Kalemi teneffüste bankta unuttuğunu ancak o zaman hatırladı.</p>
</div>
<div class="ornek">
<p><b>Olay:</b> Elif'in kalemini kaybedip sonra bulması</p>
<p><b>Kişiler:</b> Elif, öğretmeni</p>
<p><b>Yer:</b> Okul (sınıf ve bahçe)</p>
<p><b>Zaman:</b> Cuma sabahı</p>
</div>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Metinde zaman her zaman saatle verilmez. “Sonbaharda, bir cuma sabahı, akşamüzeri” gibi ifadeler de zamanı gösterir.</p></div>
`,
oy:[
 {tur:"test", ad:"Metni oku, soruları çöz", yonerge:"Aşağıdaki metni okuduktan sonra soruları cevapla.",
  metin:`<b>Bahçedeki Misafir</b><br>Bir pazar sabahı Emir, balkondan bahçeye baktığında elma ağacının altında yaralı bir kuş gördü. Hemen aşağı indi. Kuşun kanadı kanıyordu. Emir, kuşu dikkatlice bir kutuya koydu ve annesiyle birlikte mahalledeki veterinere götürdü. Veteriner, kuşun kanadını sardı ve birkaç gün dinlenmesi gerektiğini söyledi. Bir hafta sonra Emir, iyileşen kuşu aynı ağacın altında gökyüzüne bıraktı.`,
  sorular:[

{no:"5.2", b:4, ad:"Noktalama İşaretleri",
ic:`
<h4>Nokta ( . )</h4>
<ul>
<li>Tamamlanmış cümlelerin sonuna konur: <i>Bugün hava güneşliydi.</i></li>
<li>Kısaltmalardan sonra konur: <i>Dr., Prof., cm., sf.</i></li>
<li>Tarihlerde gün, ay, yıl arasına konur: <i>29.10.2026</i></li>
<li>Sıra bildiren sayılardan sonra konur: <i>3. sınıf, 2. kat</i></li>
</ul>
<h4>Virgül ( , )</h4>
<ul>
<li>Eş görevli kelimeleri ayırır: <i>Çantama kalem, silgi, defter koydum.</i></li>
<li>Seslenme sözlerinden sonra konur: <i>Ali, buraya gelir misin?</i></li>

<h4>Soru işareti ( ? ) ve ünlem ( ! )</h4>

<h4>İki nokta ( : )</h4>
<p>Örnek verilecekse ya da açıklama yapılacaksa kullanılır: <i>Sepette şu meyveler vardı: elma, armut, erik.</i></p>
<h4>Üç nokta ( … )</h4>
<p>Sözün tamamlanmadığını gösterir: <i>Bir varmış, bir yokmuş…</i></p>
<h4>Kesme işareti ( ' )</h4>

{no:"5.3", b:4, ad:"Yazım Kuralları: de/da, ki, mi",
ic:`
<h4>1) Bağlaç olan “de / da” ayrı yazılır</h4>
<p>“<b>de / da</b>” <span class="vurgu">“ayrıca, hem de”</span> anlamı katıyorsa bağlaçtır ve <b>ayrı</b> yazılır.</p>
<div class="ornek"><p>Ali <b>de</b> bizimle geldi. (Ali ayrıca geldi)</p>
<p>Kitabı okudum, filmini <b>de</b> izledim.</p></div>
<h4>Bulunma eki olan “-de / -da” bitişik yazılır</h4>
<p>“<b>nerede?</b>” sorusunun cevabıysa ektir ve <b>bitişik</b> yazılır.</p>
<div class="ornek"><p>Kalem çantam<b>da</b>. (Nerede? → çantada)</p>
<p>Ali okul<b>da</b>ydı.</p></div>
<div class="kutu"><b class="bas">Kolay yol</b>
<p style="margin:0">Cümleden “de/da”yı <b>çıkar</b>. Cümlenin anlamı bozulmuyorsa <b>ayrı</b> yazılır; bozuluyorsa <b>bitişik</b> yazılır.</p></div>
<h4>2) Bağlaç olan “ki” ayrı yazılır</h4>
<div class="ornek"><p>Duydum <b>ki</b> yarın gelecekmişsin. → ayrı</p>
<p>Masada<b>ki</b> kitap benim. / Benim<b>ki</b> daha büyük. → bitişik (ek)</p></div>
<h4>3) Soru eki “mi” her zaman ayrı yazılır</h4>
<p>“<b>mı, mi, mu, mü</b>” soru eki, kendinden önceki kelimeden <b>ayrı</b> yazılır. Kendinden sonraki ekler ise bitişik yazılır.</p>
<div class="ornek"><p>Ödevini bitirdin <b>mi</b>? &nbsp;|&nbsp; Sen <b>de mi</b> geliyorsun? &nbsp;|&nbsp; Güzel <b>mi</b> güzel bir gündü.</p></div>
<h4>Sık yanlış yazılan kelimeler</h4>
<table class="tablo">
<tr><th>Doğru</th><th>Yanlış</th><th>Doğru</th><th>Yanlış</th></tr>
<tr><td>yanlış</td><td>yanlız</td><td>herkes</td><td>herkez</td></tr>
<tr><td>yalnız</td><td>yanlız</td><td>sürpriz</td><td>süpriz</td></tr>
<tr><td>eczane</td><td>ecza-hane</td><td>ağabey</td><td>abey</td></tr>
<tr><td>şarj</td><td>şarz</td><td>direkt</td><td>direk</td></tr>
</table>
`,

  sorular:[
   {s:"Aşağıdaki cümlelerin hangisinde “de” yanlış yazılmıştır?",o:["Kardeşim de bizimle gelsin.","Kitabım masada duruyor.","Sen de mi bu filmi izledin?","Bahçe de oynayan çocuklar vardı."],d:3,

{no:"6.1", b:5, ad:"Metin Türleri ve Metnin Bölümleri",
ic:`
<h4>Metin türleri</h4>
<table class="tablo">
<tr><th>Hikâye edici metin</th><td>Bir olayı anlatır. Olay, kişi, yer, zaman vardır.</td><td>hikâye, masal, fabl, anı</td></tr>
<tr><th>Bilgilendirici metin</th><td>Bilgi verir, öğretir. Gerçek bilgiler içerir.</td><td>ansiklopedi yazısı, haber, tanıtım</td></tr>
<tr><th>Şiir</th><td>Duyguları dizeler hâlinde anlatır. Kıta ve dizelerden oluşur.</td><td>şiir</td></tr>
</table>
<h4>Metnin bölümleri</h4>
<table class="tablo">
<tr><th>Giriş</th><td>Olayın başladığı, kişilerin ve yerin tanıtıldığı bölüm</td></tr>
<tr><th>Gelişme</th><td>Olayların geliştiği, en heyecanlı bölüm</td></tr>
<tr><th>Sonuç</th><td>Olayın bittiği, sonuçların anlatıldığı bölüm</td></tr>
</table>
<h4>Konu ve ana fikir</h4>
<table class="tablo">
<tr><th>Konu</th><td>Metnin <b>ne hakkında</b> olduğudur. Kısa bir söz grubuyla belirtilir.</td><td>“Ağaç dikmenin önemi”</td></tr>
<tr><th>Ana fikir</th><td>Yazarın bize <b>vermek istediği mesajdır</b>. Bir cümledir.</td><td>“Doğayı korumak hepimizin görevidir.”</td></tr>
</table>
<h4>Başlık nasıl bulunur?</h4>
<p>Başlık kısa olmalı ve metnin <b>tamamını</b> kapsamalıdır. Metnin küçük bir ayrıntısı başlık olamaz.</p>
<div class="kutu unutma"><b class="bas">Bunu unutma</b>
<p style="margin:0">Şiirlerde satırlara <b>dize (mısra)</b>, dize gruplarına <b>kıta</b> denir. Şiirin ana duygusuna <b>tema</b> denir.</p></div>
`,

  metin:`<b>Küçük Fidan</b><br>Okulumuzun bahçesine geçen sonbahar bir fidan diktik. Öğretmenimiz, her sınıfın fidanı sırayla sulayacağını söyledi. Kimi günler fidanı unutuyorduk, kimi günler ise etrafında toplanıp yapraklarını sayıyorduk. Kışın kar altında kalınca hepimiz onun kuruyacağından korktuk. Ancak bahar gelince küçük fidanın dallarında yeşil yapraklar belirdi. O gün hepimiz, sabırla bakım yapmanın karşılığını gördüğümüzü anladık.`,

/* ============================================================
   DURUM
============================================================ */
const durum = { konu:null, bitenler:new Set(), puan:0 };
const el = id => document.getElementById(id);
const karistir = a => { const d=[...a]; for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];} return d; };
const renk = i => BOLUMLER[i].renk;

function puanEkle(n){ durum.puan += n; el('puanSayi').textContent = durum.puan; }

/* ============================================================
   MENÜ
============================================================ */
function menuyuCiz(){
  durum.konu = null;
  el('geriBtn').style.display = 'none';
  el('ustBaslik').textContent = '3. Sınıf Türkçe';
  el('ustAlt').textContent = 'Konu Anlatımı ve Oyunlar';
  const oran = Math.round(durum.bitenler.size / KONULAR.length * 100);
  let h = `
  <div class="kapak">
    <div class="etiket">Türkiye Yüzyılı Maarif Modeli</div>
    <h2>3. Sınıf Türkçe<br>Konu Anlatımı ve Oyunlar</h2>
    <p>Alfabeden cümleye, deyimlerden noktalama işaretlerine kadar bütün konular; her konunun sonunda kendini deneyebileceğin oyunlarla birlikte.</p>
    <div class="sayilar">
      <div><b>${BOLUMLER.length}</b><span>bölüm</span></div>
      <div><b>${KONULAR.length}</b><span>konu</span></div>
      <div><b>${KONULAR.reduce((t,k)=>t+k.oy.length,0)}</b><span>oyun</span></div>
    </div>
  </div>
  <div class="ilerleme-kutu">
    <div class="ilerleme-ust"><span>Tamamlanan konular</span><span>${durum.bitenler.size} / ${KONULAR.length}</span></div>
    <div class="cubuk"><i style="width:${oran}%"></i></div>
  </div>`;

  BOLUMLER.forEach((b,bi)=>{
    const liste = KONULAR.filter(k=>k.b===bi);
    h += `<div class="bolum">
      <div class="bolum-bas">
        <div class="bolum-no" style="background:${b.renk}">${bi+1}</div>
        <div><h3>${b.ad}</h3><small>${b.alt}</small></div>
      </div>
      <div class="kartlar">`;
    liste.forEach(k=>{
      const i = KONULAR.indexOf(k);
      const bitti = durum.bitenler.has(i) ? ' bitti' : '';
      h += `<button class="konu-kart${bitti}" style="border-left-color:${b.renk}" onclick="konuAc(${i})">
        <span class="kno">${k.no}</span><span class="kad">${k.ad}</span><span class="tik"></span></button>`;
    });
    h += `</div></div>`;
  });
  el('icerik').innerHTML = h;
  window.scrollTo(0,0);
}
function menuyeDon(){ menuyuCiz(); }

/* ============================================================
   KONU SAYFASI
============================================================ */
function konuAc(i){
  durum.konu = i;
  const k = KONULAR[i], r = renk(k.b);
  el('geriBtn').style.display = 'block';
  el('ustBaslik').textContent = k.ad;
  el('ustAlt').textContent = BOLUMLER[k.b].ad;

  let h = `<div class="konu-bas" style="background:${r}">
      <div class="kb-no">KONU ${k.no}</div><h2>${k.ad}</h2></div>
    <div class="anlatim" style="color:var(--murekkep)">${k.ic}</div>`;

  k.oy.forEach((o,oi)=>{
    h += `<div class="oyun" id="oyun${oi}">
      <div class="oyun-bas"><span class="rozet" style="background:${r}">OYUN ${oi+1}</span><h3>${o.ad}</h3></div>
      <p class="yonerge">${o.yonerge}</p>
      ${o.metin ? `<div class="kutu" style="background:#f7fafd">${o.metin}</div>` : ''}
      <div id="alan${oi}"></div>
    </div>`;
  });

  const oncekiVar = i>0, sonrakiVar = i<KONULAR.length-1;
  h += `<div class="gezinme">
    <button onclick="konuAc(${i-1})" ${oncekiVar?'':'disabled'}>‹ Önceki konu</button>
    <button onclick="konuAc(${i+1})" ${sonrakiVar?'':'disabled'}>Sonraki konu ›</button>
  </div>`;

  el('icerik').innerHTML = h;
  k.oy.forEach((o,oi)=>oyunBaslat(o,oi,r));
  window.scrollTo(0,0);
}

function konuTamamla(){
  if(durum.konu!==null && !durum.bitenler.has(durum.konu)){
    durum.bitenler.add(durum.konu);
  }
}

/* ============================================================
   OYUN MOTORLARI
============================================================ */
function oyunBaslat(o, oi, r){
  if(o.tur==='test') testOyun(o,oi,r);
  else if(o.tur==='eslestir') eslestirOyun(o,oi,r);
  else if(o.tur==='siniflandir') siniflandirOyun(o,oi,r);
  else if(o.tur==='sirala') siralaOyun(o,oi,r);
}

/* --- 1. TEST --- */
function testOyun(o, oi, r){
  const alan = el('alan'+oi);
  let sira = 0, dogru = 0;
  const sorular = karistir(o.sorular);

  function ciz(){
    if(sira >= sorular.length){ bitir(); return; }
    const s = sorular[sira];
    const secIndeksler = karistir(s.o.map((_,i)=>i));
    alan.innerHTML = `
      <div class="sayac">Soru ${sira+1} / ${sorular.length} · Doğru: ${dogru}</div>
      <p class="soru">${s.s}</p>
      <div class="secenekler">
        ${secIndeksler.map(idx=>`<button class="sec" data-i="${idx}">${s.o[idx]}</button>`).join('')}
      </div>
      <div class="geribildirim" id="gb${oi}"></div>`;
    alan.querySelectorAll('.sec').forEach(b=>{
      b.onclick = ()=>{
        const secilen = +b.dataset.i;
        const gb = el('gb'+oi);
        alan.querySelectorAll('.sec').forEach(x=>{
          x.disabled = true;
          if(+x.dataset.i === s.d) x.classList.add('dogru');
        });
        if(secilen === s.d){
          dogru++; puanEkle(2);
          gb.className = 'geribildirim gor iyi';
          gb.innerHTML = `<b>Doğru!</b> ${s.a}`;
        } else {
          b.classList.add('yanlis');
          gb.className = 'geribildirim gor kotu';
          gb.innerHTML = `<b>Doğru cevap:</b> ${s.o[s.d]}<br>${s.a}`;
        }
        const ileri = document.createElement('button');
        ileri.className = 'ileri';
        ileri.textContent = (sira === sorular.length-1) ? 'Sonucu gör' : 'Sonraki soru ›';
        ileri.onclick = ()=>{ sira++; ciz(); };
        gb.appendChild(document.createElement('br'));
        gb.appendChild(ileri);
      };
    });
  }
  function bitir(){
    konuTamamla();
    const yildiz = dogru === sorular.length ? '★★★' : dogru >= sorular.length*0.7 ? '★★☆' : dogru >= sorular.length*0.4 ? '★☆☆' : '☆☆☆';
    alan.innerHTML = `<div class="bitis">
      <div class="yildizlar">${yildiz}</div>
      <h3>${dogru} / ${sorular.length} doğru</h3>
      <p>${dogru===sorular.length ? 'Harika! Bu konuyu çok iyi öğrendin.' : dogru>=sorular.length*0.7 ? 'Çok iyi! Birkaç soruyu tekrar gözden geçir.' : 'Konu anlatımını bir kez daha oku, sonra tekrar dene.'}</p>
      <button class="tekrar" onclick="oyunBaslat(KONULAR[${durum.konu}].oy[${oi}],${oi},'${r}')">Yeniden oyna</button>
    </div>`;
  }
  ciz();
}

/* --- 2. EŞLEŞTİRME --- */
function eslestirOyun(o, oi, r){
  const alan = el('alan'+oi);
  const sol = karistir(o.ciftler.map((c,i)=>({t:c[0],i})));
  const sag = karistir(o.ciftler.map((c,i)=>({t:c[1],i})));
  let secili = null, kalan = o.ciftler.length, hata = 0;

  alan.innerHTML = `<div class="sayac" id="es-sayac${oi}">Kalan eşleşme: ${kalan}</div>
    <div class="esles">
      <div style="display:grid;gap:9px">${sol.map(s=>`<button data-taraf="s" data-i="${s.i}">${s.t}</button>`).join('')}</div>
      <div style="display:grid;gap:9px">${sag.map(s=>`<button data-taraf="g" data-i="${s.i}">${s.t}</button>`).join('')}</div>
    </div>
    <div class="geribildirim" id="esgb${oi}"></div>`;

  alan.querySelectorAll('.esles button').forEach(b=>{
    b.onclick = ()=>{
      if(b.classList.contains('tamam')) return;
      if(!secili){
        alan.querySelectorAll('.esles button').forEach(x=>x.classList.remove('secili'));
        b.classList.add('secili'); secili = b; return;
      }
      if(secili === b){ b.classList.remove('secili'); secili = null; return; }
      if(secili.dataset.taraf === b.dataset.taraf){
        alan.querySelectorAll('.esles button').forEach(x=>x.classList.remove('secili'));
        b.classList.add('secili'); secili = b; return;
      }
      if(secili.dataset.i === b.dataset.i){
        secili.classList.remove('secili'); secili.classList.add('tamam'); b.classList.add('tamam');
        secili = null; kalan--; puanEkle(2);
        el('es-sayac'+oi).textContent = 'Kalan eşleşme: ' + kalan;
        if(kalan === 0) bitir();
      } else {
        b.classList.add('hata'); secili.classList.add('hata'); hata++;
        const s2 = secili;
        setTimeout(()=>{ b.classList.remove('hata'); s2.classList.remove('hata','secili'); }, 400);
        secili = null;
      }
    };
  });

  function bitir(){
    konuTamamla();
    const y = hata===0 ? '★★★' : hata<=2 ? '★★☆' : '★☆☆';
    alan.innerHTML = `<div class="bitis"><div class="yildizlar">${y}</div>
      <h3>Bütün eşleşmeleri buldun!</h3>
      <p>${hata===0?'Hiç hata yapmadın, tebrikler.':'Toplam '+hata+' kez yanıldın. Tekrar denemek ister misin?'}</p>
      <button class="tekrar" onclick="oyunBaslat(KONULAR[${durum.konu}].oy[${oi}],${oi},'${r}')">Yeniden oyna</button></div>`;
  }
}

/* --- 3. SINIFLANDIRMA --- */
function siniflandirOyun(o, oi, r){
  const alan = el('alan'+oi);
  const liste = karistir(o.ogeler);
  let sira = 0, dogru = 0;

  function ciz(){
    if(sira >= liste.length){ bitir(); return; }
    const [metin, cevap] = liste[sira];
    alan.innerHTML = `
      <div class="sayac">${sira+1} / ${liste.length} · Doğru: ${dogru}</div>
      <div class="kelime-kart">${metin}</div>
      <div class="kategoriler">
        ${o.kategoriler.map((k,i)=>`<button data-i="${i}">${k}</button>`).join('')}
      </div>
      <div class="geribildirim" id="sgb${oi}"></div>`;
    alan.querySelectorAll('.kategoriler button').forEach(b=>{
      b.onclick = ()=>{
        const gb = el('sgb'+oi);
        alan.querySelectorAll('.kategoriler button').forEach(x=>{
          x.disabled = true;
          if(+x.dataset.i === cevap) x.style.borderColor = 'var(--dogru)';
        });
        if(+b.dataset.i === cevap){
          dogru++; puanEkle(1);
          gb.className = 'geribildirim gor iyi';
          gb.innerHTML = '<b>Doğru!</b>';
        } else {
          gb.className = 'geribildirim gor kotu';
          gb.innerHTML = `<b>Doğru cevap:</b> ${o.kategoriler[cevap]}`;
        }
        setTimeout(()=>{ sira++; ciz(); }, 850);
      };
    });
  }
  function bitir(){
    konuTamamla();
    const y = dogru===liste.length ? '★★★' : dogru>=liste.length*0.7 ? '★★☆' : '★☆☆';
    alan.innerHTML = `<div class="bitis"><div class="yildizlar">${y}</div>
      <h3>${dogru} / ${liste.length} doğru</h3>
      <p>${dogru===liste.length?'Mükemmel bir sonuç!':'Yanıldığın maddeleri konu anlatımından tekrar kontrol et.'}</p>
      <button class="tekrar" onclick="oyunBaslat(KONULAR[${durum.konu}].oy[${oi}],${oi},'${r}')">Yeniden oyna</button></div>`;
  }
  ciz();
}

/* --- 4. SIRALAMA --- */
function siralaOyun(o, oi, r){
  const alan = el('alan'+oi);
  let setNo = 0, hata = 0;

  function ciz(){
    if(setNo >= o.setler.length){ bitir(); return; }
    const set = o.setler[setNo];
    const karisik = karistir(set.diz.map((t,i)=>({t,i})));
    let beklenen = 0;
    alan.innerHTML = `
      <div class="sayac">Bölüm ${setNo+1} / ${o.setler.length} · İpucu: ${set.ipucu}</div>
      <div class="sira-hedef" id="hedef${oi}"></div>
      <div class="sira-havuz" id="havuz${oi}">
        ${karisik.map(p=>`<button class="parca" data-i="${p.i}">${p.t}</button>`).join('')}
      </div>
      <div class="geribildirim" id="qgb${oi}"></div>`;
    const hedef = el('hedef'+oi);
    alan.querySelectorAll('#havuz'+oi+' .parca').forEach(b=>{
      b.onclick = ()=>{
        if(b.classList.contains('yerlesti')) return;
        if(+b.dataset.i === beklenen){
          b.classList.add('yerlesti'); b.disabled = true;
          const kopya = document.createElement('span');
          kopya.className = 'parca yerlesti';
          kopya.textContent = b.textContent;
          hedef.appendChild(kopya);
          b.style.display = 'none';
          beklenen++; puanEkle(1);
          if(beklenen === set.diz.length){
            const gb = el('qgb'+oi);
            gb.className = 'geribildirim gor iyi';
            gb.innerHTML = `<b>Doğru sıralama!</b> ${set.diz.join(' ')}`;
            const ileri = document.createElement('button');
            ileri.className = 'ileri';
            ileri.textContent = (setNo === o.setler.length-1) ? 'Sonucu gör' : 'Sonraki ›';
            ileri.onclick = ()=>{ setNo++; ciz(); };
            gb.appendChild(document.createElement('br'));
            gb.appendChild(ileri);
          }
        } else {
          hata++;
          b.classList.add('hata');
          setTimeout(()=>b.classList.remove('hata'), 400);
        }
      };
    });
  }
  function bitir(){
    konuTamamla();
    const y = hata===0 ? '★★★' : hata<=3 ? '★★☆' : '★☆☆';
    alan.innerHTML = `<div class="bitis"><div class="yildizlar">${y}</div>
      <h3>Bütün sıralamaları tamamladın!</h3>
      <p>${hata===0?'Tek bir hata bile yapmadın.':hata+' kez yanlış sıra seçtin. Yeniden dene, daha iyisini yapabilirsin.'}</p>
      <button class="tekrar" onclick="oyunBaslat(KONULAR[${durum.konu}].oy[${oi}],${oi},'${r}')">Yeniden oyna</button></div>`;
  }
  ciz();
}
