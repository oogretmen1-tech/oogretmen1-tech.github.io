<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo Pasaparola</title>

  <style>
    @import url(
      "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap"
    );

    :root {
      --space: #07172f;
      --space2: #0c2e58;
      --blue: #29caff;
      --blue2: #a9efff;
      --orange: #e86b25;
      --orange2: #ffb16d;
      --gold: #ffd45a;
      --green: #31e08a;
      --red: #ff5268;
      --text: #f6fbff;
      --muted: #abc1d5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(39, 202, 255, .38),
          transparent 38%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(232, 107, 37, .25),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #020611,
          var(--space),
          #030812
        );
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: .32;
      pointer-events: none;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, var(--blue2) 1px, transparent 1.5px);
      background-size: 92px 92px, 145px 145px;
      background-position: 0 0, 45px 70px;
      animation: stars 75s linear infinite;
    }

    @keyframes stars {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(420px);
      }
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 24px 12px 55px;
    }

    .glass {
      border: 1px solid rgba(41, 202, 255, .32);
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(10, 48, 89, .94),
          rgba(3, 13, 31, .97)
        );
      box-shadow:
        0 20px 55px rgba(0, 0, 0, .5),
        inset 0 0 30px rgba(41, 202, 255, .06);
      backdrop-filter: blur(14px);
    }

    .title {
      margin-bottom: 20px;
      text-align: center;
    }

    .title small {
      display: block;
      margin-bottom: 8px;
      color: var(--orange2);
      font-family: "Orbitron", sans-serif;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .title h1 {
      margin: 0;
      color: var(--blue2);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.8rem, 8vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        0 0 14px rgba(41, 202, 255, .8),
        0 0 35px rgba(41, 202, 255, .3);
    }

    .title p {
      margin: 10px 0 0;
      color: #c9ddec;
      font-size: .9rem;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 17px;
    }

    .score {
      padding: 12px 7px;
      border: 1px solid rgba(171, 193, 213, .25);
      border-radius: 13px;
      text-align: center;
      background: rgba(1, 12, 29, .78);
    }

    .score label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-family: "Orbitron", sans-serif;
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .score strong {
      color: var(--blue2);
      font-family: "Orbitron", sans-serif;
      font-size: 1.35rem;
    }

    .score.correct strong {
      color: var(--green);
    }

    .score.wrong strong {
      color: var(--red);
    }

    .score.pass strong {
      color: var(--gold);
    }

    #totalTime.low {
      color: var(--red);
      animation: warning .8s infinite alternate;
    }

    @keyframes warning {
      from {
        text-shadow: 0 0 4px var(--red);
      }

      to {
        text-shadow: 0 0 18px var(--red);
      }
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 19px;
    }

    .btn {
      padding: 12px 17px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-family: "Orbitron", sans-serif;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: 1px;
      transition: .2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn.primary {
      border-color: var(--blue2);
      color: #03192c;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
      );
      box-shadow: 0 0 22px rgba(41, 202, 255, .3);
    }

    .btn.secondary {
      border-color: rgba(232, 107, 37, .7);
      color: white;
      background: linear-gradient(
        135deg,
        var(--orange),
        #642811
      );
    }

    .btn.pass {
      border-color: rgba(255, 212, 90, .8);
      color: #281d00;
      background: linear-gradient(
        135deg,
        #ffe997,
        var(--gold)
      );
    }

    .wheel-area {
      width: 100%;
      min-height: 530px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      padding: 25px 4px;
    }

    .wheel {
      position: relative;
      width: min(91vw, 490px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: visible;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      width: 30%;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border: 5px solid var(--orange2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(
          circle at 35% 25%,
          #fff,
          #ffc68f 35%,
          #b6531d 70%,
          #14294e
        );
      box-shadow:
        0 0 25px var(--orange),
        0 0 55px rgba(232, 107, 37, .5),
        inset 0 0 18px white;
    }

    .center::after {
      position: absolute;
      inset: -14px;
      border: 1px solid rgba(255, 177, 109, .8);
      border-radius: 50%;
      content: "";
      animation: pulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(.92);
        opacity: .3;
      }

      to {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    #centerText {
      color: #351506;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.7rem, 8vw, 3.7rem);
      font-weight: 900;
      text-shadow: 0 1px 0 white;
    }

    .letter {
      position: absolute;
      z-index: 4;
      display: grid;
      width: clamp(29px, 6.7vw, 41px);
      height: clamp(29px, 6.7vw, 41px);
      place-items: center;
      border: 2px solid var(--orange2);
      border-radius: 50%;
      color: white;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(.6rem, 2vw, .78rem);
      font-weight: 900;
      background: linear-gradient(
        145deg,
        #287db1,
        #0b315e
      );
      box-shadow:
        0 4px 12px rgba(0, 0, 0, .5),
        0 0 7px rgba(232, 107, 37, .35);
      transition: .25s ease;
    }

    .letter.active {
      z-index: 8;
      color: #3d1907;
      background: #ffe4c4;
      box-shadow:
        0 0 0 4px var(--gold),
        0 0 25px var(--gold);
      transform: translate(-50%, -50%) scale(1.2) !important;
    }

    .letter.correct {
      color: white;
      background: var(--green);
      border-color: #c7ffe1;
      box-shadow: 0 0 16px rgba(49, 224, 138, .8);
    }

    .letter.wrong {
      color: white;
      background: var(--red);
      border-color: #ffd2d8;
      box-shadow: 0 0 16px rgba(255, 82, 104, .8);
    }

    .letter.skipped {
      color: var(--gold);
      border-color: var(--gold);
      background: #56391e;
    }

    .question-area {
      width: min(730px, 100%);
      padding: 23px;
      margin: 0 auto;
    }

    .waiting {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: #c9ddec;
      text-align: center;
      line-height: 1.7;
    }

    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .question-head small {
      color: var(--orange2);
      font-family: "Orbitron", sans-serif;
      font-size: .64rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .question-letter {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border: 2px solid var(--orange2);
      border-radius: 50%;
      color: #351506;
      font-family: "Orbitron", sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      background: var(--orange2);
      box-shadow: 0 0 17px rgba(232, 107, 37, .6);
    }

    .question-text {
      min-height: 105px;
      padding: 19px;
      border: 1px solid rgba(255, 177, 109, .55);
      border-radius: 14px;
      color: #effaff;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      line-height: 1.6;
      background:
        linear-gradient(
          145deg,
          rgba(17, 77, 126, .65),
          rgba(5, 17, 38, .95)
        );
    }

    .answer-boxes {
      min-height: 48px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 19px 0;
    }

    .answer-cell {
      width: 37px;
      height: 41px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(169, 239, 255, .7);
      border-radius: 8px;
      color: var(--blue2);
      font-family: "Orbitron", sans-serif;
      font-size: .9rem;
      font-weight: 900;
      background: rgba(5, 38, 75, .9);
    }

    .answer-cell.filled {
      color: #06213b;
      background: white;
    }

    .answer-gap {
      width: 11px;
    }

    .answer-row {
      display: flex;
      gap: 9px;
    }

    #answerInput {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 2px solid rgba(41, 202, 255, .65);
      border-radius: 10px;
      outline: none;
      color: white;
      font-family: "Orbitron", sans-serif;
      font-size: .87rem;
      background: rgba(1, 10, 26, .9);
    }

    #answerInput:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 212, 90, .18);
    }

    #answerInput::placeholder {
      color: #7894ad;
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin: 17px 0 7px;
      color: var(--muted);
      font-family: "Orbitron", sans-serif;
      font-size: .63rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .timer-info strong {
      color: var(--orange2);
    }

    .timer-track {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(0, 0, 0, .55);
    }

    #timerBar {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width 1s linear, background .2s;
    }

    .feedback {
      min-height: 27px;
      margin-top: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .feedback.correct {
      color: var(--green);
    }

    .feedback.wrong {
      color: #ffadb7;
    }

    .feedback.pass {
      color: #ffe38b;
    }

    .end-screen {
      display: none;
      width: min(700px, 100%);
      padding: 27px;
      margin: 22px auto 0;
      text-align: center;
    }

    .end-screen h2 {
      margin: 0 0 10px;
      color: var(--orange2);
      font-family: "Orbitron", sans-serif;
    }

    .end-screen p {
      color: #d4e3ef;
      line-height: 1.7;
    }

    .recap {
      max-height: 280px;
      overflow-y: auto;
      margin: 20px 0;
      padding: 9px 14px;
      border-radius: 12px;
      text-align: left;
      background: rgba(0, 7, 22, .78);
    }

    .recap-row {
      display: grid;
      grid-template-columns: 30px 80px 1fr;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(155, 184, 212, .15);
      color: #cfe2f4;
      font-size: .83rem;
    }

    .recap-row strong {
      color: var(--orange2);
      font-family: "Orbitron", sans-serif;
    }

    .recap-row.ok span {
      color: var(--green);
    }

    .recap-row.bad span {
      color: #ff9eaa;
    }

    footer {
      margin-top: 25px;
      color: #87a6c3;
      font-size: .75rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      .scoreboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .wheel-area {
        min-height: 395px;
        padding: 17px 0;
      }

      .wheel {
        width: min(93vw, 395px);
      }

      .question-area {
        padding: 17px;
      }

      .answer-row {
        flex-wrap: wrap;
      }

      .answer-row .btn {
        width: 100%;
      }

      .answer-cell {
        width: 31px;
        height: 36px;
      }

      .recap-row {
        grid-template-columns: 24px 63px 1fr;
        font-size: .75rem;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="title">
      <small>4. SINIF BİLGİ YARIŞMASI</small>
      <h1>NEO PASAPAROLA</h1>
      <p>
        Her harfte soru havuzundan rastgele bir soru seçilir.
      </p>
    </header>

    <section class="scoreboard">
      <div class="score correct">
        <label>DOĞRU</label>
        <strong id="correctCount">0</strong>
      </div>

      <div class="score wrong">
        <label>YANLIŞ</label>
        <strong id="wrongCount">0</strong>
      </div>

      <div class="score pass">
        <label>PAS</label>
        <strong id="passCount">0</strong>
      </div>

      <div class="score">
        <label>TOPLAM SÜRE</label>
        <strong id="totalTime">03:00</strong>
      </div>
    </section>

    <section class="controls">
      <button
        id="startButton"
        class="btn primary"
        type="button"
      >
        OYUNU BAŞLAT
      </button>

      <button
        id="restartButton"
        class="btn secondary"
        type="button"
        disabled
      >
        YENİDEN BAŞLAT
      </button>

      <button
        id="soundButton"
        class="btn secondary"
        type="button"
      >
        🔊 SES AÇIK
      </button>
    </section>

    <section class="wheel-area glass">
      <div id="wheel" class="wheel">
        <div class="center">
          <div id="centerText">4</div>
        </div>
      </div>
    </section>

    <section id="questionArea" class="question-area glass">
      <div class="waiting">
        <div>
          <b>OYUN SİSTEMİ HAZIR</b>
          <br><br>
          Başlamak için
          <b>OYUNU BAŞLAT</b>
          düğmesine bas.
        </div>
      </div>
    </section>

    <section id="endScreen" class="end-screen glass">
      <h2 id="endTitle">OYUN BİTTİ</h2>
      <p id="endSummary"></p>
      <div id="recap" class="recap"></div>

      <button
        id="endRestartButton"
        class="btn primary"
        type="button"
      >
        TEKRAR OYNA
      </button>
    </section>

    <footer>
      Neo Pasaparola · Eğlenerek öğren
    </footer>
  </main>

      ],

      Ö: [
        ["Sınıfta ders anlatan kişi?", "öğretmen"],
        ["Vaklayarak ses çıkaran evcil veya yabani kuş?", "ördek"],
        ["Başarı karşılığında verilen şey?", "ödül"],
        ["Bir nesnenin uzunluğunu veya miktarını belirleme işi?", "ölçü"]
      ],

      P: [
        ["Yön bulmamıza yardımcı olan araç?", "pusula"],
        ["Çocukların oyun oynadığı yeşil alan?", "park"],
        ["Soğuk bölgelerde yaşayan siyah-beyaz kuş?", "penguen"],
        ["Mısır gibi bazı eski yapılarda kullanılan geometrik biçim?", "piramit"]
      ],

      R: [
        ["İnsanlara yardımcı olmak için tasarlanmış makine?", "robot"],
        ["Kâğıt üzerine yapılan çizim veya boyama çalışması?", "resim"],
        ["Havanın hareket etmesiyle oluşan doğa olayı?", "rüzgar"],
        ["Bir yüzeyin veya cismin görünüş özelliği?", "renk"]
      ],

      S: [
        ["Taşların hareket ettirilmesiyle oynanan düşünme oyunu?", "satranç"],
        ["Canlıların içmesi için gerekli sıvı?", "su"],
        ["Fındık ve meşe palamudu yiyebilen küçük hayvan?", "sincap"],
        ["Zamanı gösteren araç?", "saat"]
      ],

      Ş: [
        ["Çaya veya bazı tatlılara konulan beyaz yiyecek?", "şeker"],
        ["Yağmurdan korunmak için kullanılan araç?", "şemsiye"],
        ["İnsanların yaşadığı büyük yerleşim yeri?", "şehir"],
        ["Başımıza takarak kullandığımız giysi?", "şapka"]
      ],

      T: [
        ["Ülkemizin adı?", "türkiye"],
        ["Günleri ve ayları gösteren araç?", "takvim"],
        ["Uzun kulaklı, havuç yemeyi seven hayvan?", "tavşan"],
        ["Bitkilerin çoğalmasını sağlayan küçük yapı?", "tohum"]
      ],

      U: [
        ["İçine hava doldurularak uçurulan oyuncak?", "uçurtma"],
        ["Dünyamızın dışında bulunan sonsuz boşluk?", "uzay"],
        ["Bir ülkenin vatandaşlarının oluşturduğu topluluk?", "ulus"],
        ["Buğdayın öğütülmesiyle elde edilen beyaz madde?", "un"]
      ],

      Ü: [
        ["Salkım hâlinde yetişen küçük meyve?", "üzüm"],
        ["Cümlenin sonunda kullanılan noktalama işaretlerinden biri?", "ünlem"],
        ["Ders kitabındaki konu bölümlerinden her biri?", "ünite"],
        ["Bir iş karşılığında alınan para?", "ücret"]
      ],

      V: [
        ["İnsanın doğup büyüdüğü ülke veya toprak?", "vatan"],
        ["Suda ilerleyen büyük ulaşım aracı?", "vapur"],
        ["Vücudun sağlıklı çalışmasına yardımcı olan besin maddesi?", "vitamin"],
        ["Dağlardan püskürebilen sıcak ve akışkan madde?", "volkan"]
      ],

      Y: [
        ["Gece gökyüzünde ışık saçan gök cismi?", "yıldız"],
        ["Bulutlardan düşen su damlaları?", "yağmur"],
        ["Rüzgârla hareket eden deniz taşıtı?", "yelken"],
        ["Sütten yapılan beyaz besin?", "yoğurt"]
      ],

      Z: [
        ["Uzun boyunlu, sarı benekli hayvan?", "zürafa"],
        ["Sofralarda kullanılan küçük, yeşil veya siyah meyve?", "zeytin"],
        ["Saatlerde veya kapılarda ses çıkarabilen araç?", "zil"],
        ["Olayların gerçekleştiği ve ölçtüğümüz kavram?", "zaman"]
      ]
    };

    const letters = Object.keys(questionBank);

    const state = {
      queue: [],
      questions: {},
      statuses: {},
      correct: 0,
      wrong: 0,
      pass: 0,
      totalSeconds: 180,
      letterSeconds: 35,
      locked: false,
      finished: false,
      totalTimer: null,
      letterTimer: null
    };

    let soundOn = true;
    let audioContext = null;

    function el(id) {
      return document.getElementById(id);
    }

    function normalize(text) {
      return text
        .toLocaleLowerCase("tr-TR")
        .trim()
        .replace(/[.,!?;:'"`]/g, "")
        .replace(/\s+/g, " ");
    }

    function formatTime(seconds) {
      const min = String(
        Math.floor(seconds / 60)
      ).padStart(2, "0");

      const sec = String(
        seconds % 60
      ).padStart(2, "0");

      return min + ":" + sec;
    }

    function randomQuestion(letter) {
      const pool = questionBank[letter];

      return pool[
        Math.floor(Math.random() * pool.length)
      ];
    }

    function buildWheel() {
      const wheel = el("wheel");

      wheel
        .querySelectorAll(".letter")
        .forEach(function (node) {
          node.remove();
        });

      letters.forEach(function (letter) {
        const node = document.createElement("div");

        node.className = "letter";
        node.dataset.letter = letter;
        node.textContent = letter;

        wheel.appendChild(node);
      });

      positionLetters();
    }

    function positionLetters() {
      const wheel = el("wheel");
      const size = wheel.offsetWidth;

      if (!size) {
        return;
      }

      const center = size / 2;
      const radius = size / 2 - 29;

      letters.forEach(function (letter, index) {
        const node = document.querySelector(
          '[data-letter="' + letter + '"]'
        );

        const angle =
          index / letters.length * Math.PI * 2 -
          Math.PI / 2;

        node.style.left =
          center + radius * Math.cos(angle) + "px";

        node.style.top =
          center + radius * Math.sin(angle) + "px";

        node.style.transform =
          "translate(-50%, -50%)";
      });
    }

    function updateWheel() {
      letters.forEach(function (letter) {
        const node = document.querySelector(
          '[data-letter="' + letter + '"]'
        );

        node.className = "letter";

        if (
          letter === state.queue[0] &&
          !state.finished
        ) {
          node.classList.add("active");
        }

        if (state.statuses[letter]) {
          node.classList.add(
            state.statuses[letter]
          );
        }
      });

      el("centerText").textContent =
        state.queue[0] || "4";
    }

    function updateScore() {
      el("correctCount").textContent = state.correct;
      el("wrongCount").textContent = state.wrong;
      el("passCount").textContent = state.pass;
      el("totalTime").textContent =
        formatTime(Math.max(0, state.totalSeconds));

      el("totalTime").classList.toggle(
        "low",
        state.totalSeconds <= 20
      );
    }

    function updateTimer() {
      const percentage =
        state.letterSeconds / 35 * 100;

      let color = "var(--green)";

      if (percentage <= 45) {
        color = "var(--gold)";
      }

      if (percentage <= 20) {
        color = "var(--red)";
      }

      if (el("timerBar")) {
        el("timerBar").style.width =
          percentage + "%";

        el("timerBar").style.background =
          color;
      }

      if (el("letterTimer")) {
        el("letterTimer").textContent =
          state.letterSeconds + " SN";
      }
    }

    function drawAnswerBoxes(value) {
      const area = el("answerBoxes");
      const letter = state.queue[0];

      if (!area || !letter) {
        return;
      }

      const answer = state.questions[letter][1];
      const typed = normalize(value)
        .replace(/\s/g, "")
        .split("");

      let index = 0;
      area.innerHTML = "";

      Array.from(answer).forEach(function (character) {
        if (character === " ") {
          const gap = document.createElement("span");
          gap.className = "answer-gap";
          area.appendChild(gap);
          return;
        }

        const cell = document.createElement("span");
        cell.className = "answer-cell";

        if (typed[index]) {
          cell.textContent =
            typed[index].toLocaleUpperCase("tr-TR");

          cell.classList.add("filled");
        }

        index++;
        area.appendChild(cell);
      });
    }

    function showQuestion() {
      const letter = state.queue[0];

      if (!letter || state.finished) {
        return;
      }

      el("questionArea").innerHTML = `
        <div class="question-head">
          <small>AKTİF HARF // ${letter}</small>
          <div class="question-letter">${letter}</div>
        </div>

        <div class="question-text">
          ${state.questions[letter][0]}
        </div>

        <div id="answerBoxes" class="answer-boxes"></div>

        <div class="answer-row">
          <input
            id="answerInput"
            type="text"
            autocomplete="off"
            placeholder="Cevabını yaz..."
          >

          <button
            id="checkButton"
            class="btn primary"
            type="button"
          >
            KONTROL ET
          </button>
        </div>

        <div class="controls"
          style="justify-content:flex-start;margin:12px 0 0;">
          <button
            id="passButton"
            class="btn pass"
            type="button"
          >
            PAS GEÇ
          </button>
        </div>

        <div class="timer-info">
          <span>HARF SÜRESİ</span>
          <strong id="letterTimer">35 SN</strong>
        </div>

        <div class="timer-track">
          <div id="timerBar"></div>
        </div>

        <div id="feedback" class="feedback"></div>
      `;

      const input = el("answerInput");

      drawAnswerBoxes("");

      input.addEventListener("input", function () {
        drawAnswerBoxes(input.value);
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          submitAnswer();
        }
      });

      el("checkButton").addEventListener(
        "click",
        submitAnswer
      );

      el("passButton").addEventListener(
        "click",
        passQuestion
      );

      updateTimer();

      setTimeout(function () {
        input.focus();
      }, 50);
    }

    function disableQuestion() {
      if (el("answerInput")) {
        el("answerInput").disabled = true;
      }

      if (el("checkButton")) {
        el("checkButton").disabled = true;
      }

      if (el("passButton")) {
        el("passButton").disabled = true;
      }
    }

    function submitAnswer() {
      if (
        state.locked ||
        state.finished ||
        !state.queue.length
      ) {
        return;
      }

      const input = el("answerInput");
      const typed = normalize(input.value);

      if (!typed) {
        el("feedback").textContent =
          "Önce bir cevap yazmalısın.";

        el("feedback").className =
          "feedback wrong";

        return;
      }

      state.locked = true;
      clearInterval(state.letterTimer);

      const letter = state.queue.shift();
      const correctAnswer =
        normalize(state.questions[letter][1]);

      disableQuestion();

      if (typed === correctAnswer) {
        state.correct++;
        state.statuses[letter] = "correct";

        el("feedback").textContent =
          "✓ DOĞRU! Harf tamamlandı.";

        el("feedback").className =
          "feedback correct";

        playCorrect();
      } else {
        state.wrong++;
        state.statuses[letter] = "wrong";

        el("feedback").textContent =
          "✕ Yanlış. Doğru cevap: " +
          state.questions[letter][1]
            .toLocaleUpperCase("tr-TR");

        el("feedback").className =
          "feedback wrong";

        playWrong();
      }

      updateScore();
      updateWheel();

      setTimeout(function () {
        nextQuestion();
      }, 1300);
    }

    function nextQuestion() {
      if (state.queue.length === 0) {
        finishGame("complete");
        return;
      }

      state.locked = false;
      showQuestion();
      updateWheel();
      startLetterTimer();
    }

    function passQuestion() {
      if (
        state.locked ||
        state.finished ||
        !state.queue.length
      ) {
        return;
      }

      state.locked = true;
      clearInterval(state.letterTimer);

      const letter = state.queue.shift();

      state.queue.push(letter);
      state.pass++;
      state.statuses[letter] = "skipped";

      disableQuestion();

      el("feedback").textContent =
        "↻ Soru pas geçildi.";

      el("feedback").className =
        "feedback pass";

      playPass();
      updateScore();
      updateWheel();

      setTimeout(function () {
        state.locked = false;
        showQuestion();
        startLetterTimer();
      }, 800);
    }

    function autoPass() {
      if (
        state.locked ||
        state.finished ||
        !state.queue.length
      ) {
        return;
      }

      state.locked = true;

      const letter = state.queue.shift();

      state.queue.push(letter);
      state.pass++;
      state.statuses[letter] = "skipped";

      disableQuestion();

      el("feedback").textContent =
        "⌛ Süre doldu. Soru pas geçildi.";

      el("feedback").className =
        "feedback pass";

      playPass();
      updateScore();
      updateWheel();

      setTimeout(function () {
        state.locked = false;
        showQuestion();
        startLetterTimer();
      }, 800);
    }

    function startLetterTimer() {
      clearInterval(state.letterTimer);

      state.letterSeconds = 35;
      updateTimer();

      state.letterTimer = setInterval(function () {
        if (state.locked || state.finished) {
          return;
        }

        state.letterSeconds--;
        updateTimer();

        if (state.letterSeconds <= 0) {
          clearInterval(state.letterTimer);
          autoPass();
        }
      }, 1000);
    }

    function startTotalTimer() {
      clearInterval(state.totalTimer);

      state.totalTimer = setInterval(function () {
        if (state.finished) {
          return;
        }

        state.totalSeconds--;
        updateScore();

        if (state.totalSeconds <= 0) {
          finishGame("time");
        }
      }, 1000);
    }

    function createGame() {
      clearInterval(state.totalTimer);
      clearInterval(state.letterTimer);

      state.queue = [...letters];
      state.questions = {};
      state.statuses = {};
      state.correct = 0;
      state.wrong = 0;
      state.pass = 0;
      state.totalSeconds = 180;
      state.letterSeconds = 35;
      state.locked = false;
      state.finished = false;

      letters.forEach(function (letter) {
        /*
          Her harfin dört soruluk havuzundan
          yalnızca biri rastgele seçilir.
        */
        state.questions[letter] =
          randomQuestion(letter);
      });

      el("startButton").disabled = true;
      el("restartButton").disabled = false;
      el("endScreen").style.display = "none";
      el("questionArea").style.display = "block";
      document.querySelector(".wheel-area").style.display =
        "flex";

      buildWheel();
      updateScore();
      updateWheel();
      showQuestion();
      startLetterTimer();
      startTotalTimer();
    }

    function finishGame(reason) {
      if (state.finished) {
        return;
      }

      state.finished = true;

      clearInterval(state.totalTimer);
      clearInterval(state.letterTimer);

      document.querySelector(".wheel-area").style.display =
        "none";

      el("questionArea").style.display = "none";
      el("endScreen").style.display = "block";
      el("startButton").disabled = false;
      el("restartButton").disabled = false;

      el("endTitle").textContent =
        reason === "time"
          ? "SÜRE DOLDU"
          : "OYUN TAMAMLANDI";

      el("endSummary").textContent =
        "Doğru: " +
        state.correct +
        " · Yanlış: " +
        state.wrong +
        " · Pas: " +
        state.pass;

      el("recap").innerHTML = "";

      letters.forEach(function (letter) {
        const row = document.createElement("div");
        const status =
          state.statuses[letter] || "skipped";

        let result = "PAS";

        if (status === "correct") {
          result = "DOĞRU";
        }

        if (status === "wrong") {
          result = "YANLIŞ";
        }

        row.className =
          "recap-row " +
          (status === "correct" ? "ok" : "bad");

        row.innerHTML = `
          <strong>${letter}</strong>
          <span>${result}</span>
          <div>${state.questions[letter][1]}</div>
        `;

        el("recap").appendChild(row);
      });
    }

    function prepareAudio() {
      const AudioClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioClass) {
        return;
      }

      if (!audioContext) {
        audioContext = new AudioClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(
      frequency,
      duration,
      type = "sine",
      volume = .12,
      delay = 0
    ) {
      if (!soundOn || !audioContext) {
        return;
      }

      const start =
        audioContext.currentTime + delay;

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(
        frequency,
        start
      );

      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(
        .001,
        start + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    function playCorrect() {
      playTone(520, .1, "sine", .16, 0);
      playTone(700, .1, "sine", .16, .1);
      playTone(900, .18, "triangle", .15, .2);
    }

    function playWrong() {
      playTone(180, .2, "sawtooth", .12, 0);
      playTone(120, .28, "sawtooth", .1, .12);
    }

    function playPass() {
      playTone(430, .1, "triangle", .12, 0);
      playTone(290, .18, "triangle", .1, .12);
    }

    el("startButton").addEventListener(
      "click",
      function () {
        prepareAudio();
        createGame();
      }
    );

    el("restartButton").addEventListener(
      "click",
      function () {
        prepareAudio();
        createGame();
      }
    );

    el("endRestartButton").addEventListener(
      "click",
      function () {
        prepareAudio();
        createGame();
      }
    );

    el("soundButton").addEventListener(
      "click",
      function () {
        soundOn = !soundOn;

        el("soundButton").textContent =
          soundOn
            ? "🔊 SES AÇIK"
            : "🔇 SES KAPALI";

        if (soundOn) {
          prepareAudio();
          playTone(650, .08, "sine", .12);
        }
      }
    );

    window.addEventListener(
      "resize",
      positionLetters
    );

    buildWheel();
  </script>
</body>
</html>
