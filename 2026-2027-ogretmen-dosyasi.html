<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026-2027 Öğretmen Dosyası</title>

<style>
@page {
    size: A4 portrait;
    margin: 0;
}

:root {
    --ana: #17365d;
    --sekme: #2f75b5;
    --cerceve: #a8bfd6;
    --yazi: #17212b;
    --arka: #edf2f7;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--arka);
    color: var(--yazi);
    font-family: DORakam,Arial, Helvetica, sans-serif;
}

.toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 14px;
    background: var(--ana);
    color: white;
    text-align: center;
    box-shadow: 0 2px 8px #0004;
}

.toolbar h1 {
    margin: 0 0 10px;
    font-size: 23px;
}

button {
    margin: 4px;
    padding: 9px 13px;
    border: 0;
    border-radius: 7px;
    background: white;
    color: var(--ana);
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #dbeafe;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 7px;
    max-width: 1200px;
    margin: 10px auto 0;
}

.controls label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 8px;
    border-radius: 5px;
    background: white;
    color: #17365d;
    font-size: 12px;
    font-weight: bold;
}

.controls input[type="text"] {
    width: 140px;
    padding: 5px;
    border: 1px solid #999;
    border-radius: 4px;
}

.controls input[type="color"] {
    width: 34px;
    height: 25px;
    padding: 0;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    background: #dbe7f3;
}

.tab {
    padding: 8px 11px;
    border: 1px solid #91aac4;
    border-radius: 17px;
    background: white;
    color: #17365d;
    font-size: 12px;
}

.tab.active {
    background: var(--ana);
    color: white;
}

#pages {
    padding: 25px 0;
}

.page {
    --p-ana: var(--ana);
    --p-sekme: var(--sekme);
    --p-cerceve: var(--cerceve);
    --p-yazi: var(--yazi);

    position: relative;
    display: none;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 25px;
    padding: 22mm 19mm;
    overflow: hidden;
    background: white;
    color: var(--p-yazi);
    page-break-after: always;
}

.page.active {
    display: block;
}

.outer-border {
    position: absolute;
    inset: 13mm;
    border: 3px solid var(--p-ana);
    border-radius: 18px;
    pointer-events: none;
}

.inner-border {
    position: absolute;
    inset: 17mm;
    border: 1px solid var(--p-cerceve);
    border-radius: 12px;
    pointer-events: none;
}

.side-tab {
    position: absolute;
    top: 42mm;
    right: 8mm;
    width: 35mm;
    min-height: 18mm;
    padding: 7px 4px;
    border-radius: 12px 0 0 12px;
    background: var(--p-sekme);
    color: white;
    text-align: center;
    font-size: 10px;
    font-weight: bold;
    line-height: 1.2;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
}

.content {
    position: relative;
    z-index: 2;
}

.header {
    margin-top: 7mm;
    text-align: center;
    font-size: 17px;
    line-height: 1.55;
    font-weight: bold;
}

.year {
    margin-top: 12mm;
    color: var(--p-ana);
    text-align: center;
    font-size: 21px;
    line-height: 1.4;
    font-weight: bold;
}

.title {
    width: 82%;
    margin: 25mm auto 15mm;
    padding: 13px;
    border-top: 4px solid var(--p-ana);
    border-bottom: 4px solid var(--p-ana);
    color: var(--p-ana);
    text-align: center;
    font-size: 28px;
    line-height: 1.25;
    font-weight: 900;
    text-transform: uppercase;
}

.subtitle {
    margin: 9mm 0;
    color: var(--p-ana);
    font-size: 19px;
    font-weight: bold;
}

.text {
    margin-top: 12mm;
    white-space: pre-line;
    text-align: justify;
    font-size: 14px;
    line-height: 1.65;
}

.editable {
    outline: none;
}

.editable:focus {
    background: #fafcff;
    box-shadow: 0 0 0 2px var(--p-cerceve);
}

.info {
    margin-top: 30mm;
    font-size: 15px;
    line-height: 2.3;
}

.info div {
    margin: 4px 0;
    border-bottom: 1px solid #777;
}

.table {
    width: 100%;
    margin: 12px 0;
    border-collapse: collapse;
    font-size: 12px;
}

.table th,
.table td {
    min-height: 30px;
    padding: 7px;
    border: 1px solid #687786;
    vertical-align: top;
}

.table th {
    background: var(--p-cerceve);
    text-align: center;
}

.table td {
    height: 34px;
}

.notice {
    padding: 10px;
    border-left: 4px solid var(--p-ana);
    background: #f3f6f9;
    font-size: 12px;
    line-height: 1.55;
}

.legislation {
    margin: 12px 0;
    padding: 12px;
    border: 1px solid var(--p-cerceve);
    border-radius: 8px;
}

.legislation h3 {
    margin: 0 0 6px;
    color: var(--p-ana);
    font-size: 17px;
}

.legislation p {
    margin: 6px 0;
    line-height: 1.5;
    font-size: 13px;
}

.legislation a {
    color: #075985;
    word-break: break-all;
}

.form {
    margin-top: 15mm;
}

.form label {
    display: block;
    margin: 10px 0;
    font-weight: bold;
}

.form input,
.form textarea {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: 1px solid #8996a3;
    border-radius: 4px;
}

.form textarea {
    min-height: 80px;
}

.ataturk-image {
    display: block;
    max-width: 125mm;
    max-height: 160mm;
    margin: 12mm auto;
    object-fit: contain;
}

.image-help {
    text-align: center;
    color: #64748b;
    font-size: 12px;
}

.signatures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 30mm;
    text-align: center;
    font-size: 13px;
}

.signatures div {
    min-height: 45px;
    border-top: 1px solid #555;
    padding-top: 8px;
}

.footer {
    position: absolute;
    right: 0;
    bottom: 20mm;
    left: 0;
    color: #64748b;
    text-align: center;
    font-size: 11px;
}

@media print {
    body {
        background: white;
    }

    .toolbar,
    .tabs,
    .image-help {
        display: none !important;
    }

    #pages {
        padding: 0;
    }

    .page {
        display: none !important;
        width: 210mm;
        min-height: 297mm;
        margin: 0;
    }

    body.print-selected .page.active {
        display: block !important;
    }

    body.print-all .page {
        display: block !important;
    }
}
</style>

items.forEach((item, index) => {
    const tab = document.createElement("button");
    tab.className = "tab" + (index === 0 ? " active" : "");
    tab.textContent = item[0];
    tab.onclick = () => selectPage(index);
    tabs.appendChild(tab);

    const page = document.createElement("section");
    page.className = "page" + (index === 0 ? " active" : "");

    page.innerHTML = `
        <div class="outer-border"></div>
        <div class="inner-border"></div>
        <div class="side-tab">${item[0]}</div>
        <div class="content">${content(item[2], item[1])}</div>
        <div class="footer">2026-2027 Eğitim Öğretim Yılı</div>
    `;

    pages.appendChild(page);
});

function selectPage(index) {
    document.querySelectorAll(".tab").forEach((x, i) => {
        x.classList.toggle("active", i === index);
    });

    document.querySelectorAll(".page").forEach((x, i) => {
        x.classList.toggle("active", i === index);
    });
}

function getColors() {
    return {
        ana: document.getElementById("mainColor").value,
        sekme: document.getElementById("tabColor").value,
        cerceve: document.getElementById("borderColor").value,
        yazi: document.getElementById("textColor").value
    };
}

function applyColors() {
    const c = getColors();

    document.querySelectorAll(".page").forEach(page => {
        page.style.setProperty("--p-ana", c.ana);
        page.style.setProperty("--p-sekme", c.sekme);
        page.style.setProperty("--p-cerceve", c.cerceve);
        page.style.setProperty("--p-yazi", c.yazi);
    });
}

    document.querySelectorAll(".schoolText").forEach(x => x.textContent = school);
    document.querySelectorAll(".teacherText").forEach(x => x.textContent = teacher);

function loadAtaturk(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        document.getElementById("ataturkImage").src = e.target.result;
    };

    reader.readAsDataURL(file);
}

function printSelected() {
    document.body.classList.remove("print-all");
    document.body.classList.add("print-selected");
    window.print();

    setTimeout(() => {
        document.body.classList.remove("print-selected");
    }, 1000);
}

function printAll() {
    document.body.classList.remove("print-selected");
    document.body.classList.add("print-all");
    window.print();

    setTimeout(() => {
        document.body.classList.remove("print-all");
    }, 1000);
}

function downloadHTML() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], {
        type: "text/html;charset=utf-8"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "2026-2027-ogretmen-dosyasi.html";
    link.click();

    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function downloadWord() {
