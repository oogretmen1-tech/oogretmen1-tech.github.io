<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasan Tutus \u2013 \u0130lkokul Materyalleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --s1: #FF6B6B;
      --s2: #FFD93D;
      --s3: #6BCB77;
      --s4: #4D96FF;
      --purple: #C77DFF;
      --pink: #FF9ECD;
      --orange: #FF9F43;
      --teal: #48C9B0;
      --bg: #FFFBF0;
      --dark: #2D2D2D;
      --card-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* \u2500\u2500 DOTS BACKGROUND \u2500\u2500 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #e0d5c0 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .45;
      pointer-events: none;
      z-index: 0;
    }

    /* \u2500\u2500 NAV \u2500\u2500 */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 32px;
      gap: 16px;
    }
    .nav-logo {
      font-family: 'Baloo 2', cursive;
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--s1), var(--s4));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-links a {
      text-decoration: none; font-weight: 700; font-size: .85rem;
      padding: 6px 14px; border-radius: 20px;
      color: var(--dark); transition: all .2s;
    }
    .nav-links a:hover { background: var(--s2); transform: translateY(-2px); }

    /* \u2500\u2500 HERO \u2500\u2500 */
    .hero {
      position: relative; z-index: 1;
      text-align: center;
      padding: 72px 24px 56px;
      overflow: hidden;
    }
    .hero-badge {
      display: inline-block;
      background: var(--s2); color: var(--dark);
      font-weight: 800; font-size: .85rem;
      padding: 6px 18px; border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 3px 3px 0 #e6b800;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .hero h1 {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800; line-height: 1.15;
      animation: slideUp .6s ease both .1s;
    }
    .hero h1 span { color: var(--s1); }
    .hero p {
      font-size: 1.15rem; color: #555; max-width: 520px; margin: 16px auto 32px;
      animation: slideUp .6s ease both .2s;
    }
    .hero-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; animation: slideUp .6s ease both .3s; }
    .btn-hero {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 30px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
      text-decoration: none; border: none; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.15); }
    .btn-primary { background: var(--s1); color: #fff; box-shadow: 4px 4px 0 #c94f4f; }
    .btn-secondary { background: #fff; color: var(--dark); box-shadow: 4px 4px 0 #ccc; border: 2px solid #eee; }

    /* Floating emojis */
    .floaties { pointer-events: none; position: absolute; inset: 0; overflow: hidden; }
    .floaty {
      position: absolute; font-size: 2rem; opacity: .6;
      animation: float linear infinite;
    }

    /* \u2500\u2500 SECTION WRAPPER \u2500\u2500 */
    section { position: relative; z-index: 1; padding: 60px 20px; max-width: 1100px; margin: 0 auto; }
    .section-title {
      font-family: 'Baloo 2', cursive; font-size: 2rem; font-weight: 800;
      text-align: center; margin-bottom: 8px;
    }
    .section-sub { text-align: center; color: #666; margin-bottom: 36px; font-size: 1rem; }
    .divider { width: 60px; height: 5px; border-radius: 3px; margin: 10px auto 32px; }

    /* \u2500\u2500 CLASSES GRID \u2500\u2500 */
    .classes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }
    .class-card {
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: transform .25s, box-shadow .25s;
      cursor: pointer;
    }
    .class-card:hover { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(0,0,0,.13); }
    .class-card-header {
      display: flex; align-items: center; gap: 14px;
      padding: 22px 22px 16px;
      border-bottom: 3px solid #f0f0f0;
    }
    .class-icon {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
    }
    .class-card-header h3 {
      font-family: 'Baloo 2', cursive;
      font-size: 1.3rem; font-weight: 800;
    }
    .class-card-header p { font-size: .82rem; color: #777; margin-top: 2px; }
    .subjects-list { padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 8px; }
    .subject-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .9rem;
      text-decoration: none; color: var(--dark);
      background: #f7f7f7; border: 2px solid transparent;
      transition: all .18s; cursor: pointer;
    }
    .subject-btn:hover { border-color: currentColor; background: #fff; transform: translateX(4px); }
    .subject-btn .arrow { font-size: .75rem; opacity: .5; }

    /* card accent colors */
    .c1 .class-icon { background: #fff0f0; }
    .c1 .class-card-header { border-color: var(--s1); }
    .c1 .subject-btn:hover { color: var(--s1); }
    .c2 .class-icon { background: #fffce0; }
    .c2 .class-card-header { border-color: var(--s2); }
    .c2 .subject-btn:hover { color: #c9a800; }
    .c3 .class-icon { background: #f0fff2; }
    .c3 .class-card-header { border-color: var(--s3); }
    .c3 .subject-btn:hover { color: var(--s3); }
    .c4 .class-icon { background: #f0f6ff; }
    .c4 .class-card-header { border-color: var(--s4); }
    .c4 .subject-btn:hover { color: var(--s4); }

    /* \u2500\u2500 QUICK ACCESS \u2500\u2500 */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }
    .quick-card {
      background: #fff; border-radius: 20px;
      padding: 28px 20px; text-align: center;
      box-shadow: var(--card-shadow);
      text-decoration: none; color: var(--dark);
      transition: transform .22s, box-shadow .22s;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      border-bottom: 5px solid transparent;
    }
    .quick-card:hover { transform: translateY(-5px); box-shadow: 0 14px 30px rgba(0,0,0,.12); }
    .quick-card .qicon { font-size: 2.4rem; }
    .quick-card h4 { font-family: 'Baloo 2', cursive; font-size: 1.05rem; font-weight: 800; }
    .quick-card p { font-size: .8rem; color: #777; line-height: 1.4; }
    .qc1 { border-color: var(--purple); } .qc1:hover { background: #fdf0ff; }
    .qc2 { border-color: var(--orange); } .qc2:hover { background: #fff6ee; }
    .qc3 { border-color: var(--teal); }   .qc3:hover { background: #f0fefa; }
    .qc4 { border-color: var(--pink); }   .qc4:hover { background: #fff0f7; }
    .qc5 { border-color: var(--s3); }     .qc5:hover { background: #f0fff2; }

    /* \u2500\u2500 GAMES \u2500\u2500 */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 22px; padding: 28px 20px;
      color: #fff; text-align: center;
      box-shadow: 0 6px 20px rgba(102,126,234,.4);
      transition: transform .22s;
      cursor: pointer;
      text-decoration: none;
    }
    .game-card:hover { transform: scale(1.04); }
    .game-card .gicon { font-size: 2.8rem; margin-bottom: 10px; }
    .game-card h4 { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 800; }
    .game-card p { font-size: .82rem; opacity: .85; margin-top: 6px; line-height: 1.4; }
    .g1 { background: linear-gradient(135deg, #f7971e, #ffd200); color: #2d2d2d; box-shadow: 0 6px 20px rgba(247,151,30,.35); }
    .g2 { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #1a3a2a; box-shadow: 0 6px 20px rgba(67,233,123,.35); }
    .g3 { background: linear-gradient(135deg, #fa709a, #fee140); color: #2d2d2d; box-shadow: 0 6px 20px rgba(250,112,154,.35); }
    .g4 { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0a2a3a; box-shadow: 0 6px 20px rgba(79,172,254,.35); }

    /* \u2500\u2500 ABOUT \u2500\u2500 */
    .about-box {
      background: #fff; border-radius: 28px;
      box-shadow: var(--card-shadow);
      display: flex; gap: 36px; align-items: center;
      padding: 40px; flex-wrap: wrap;
    }
    .about-avatar {
      width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--s1), var(--s4));
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .about-text h3 {
      font-family: 'Baloo 2', cursive; font-size: 1.6rem; font-weight: 800;
      margin-bottom: 6px;
    }
    .about-text p { color: #555; line-height: 1.7; font-size: .95rem; max-width: 500px; }
    .about-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .about-tag {
      background: #f3f3f3; border-radius: 20px;
      padding: 5px 14px; font-size: .82rem; font-weight: 700;
    }

    /* \u2500\u2500 FOOTER \u2500\u2500 */
    footer {
      position: relative; z-index: 1;
      background: var(--dark); color: #ccc;
      text-align: center; padding: 32px 20px;
      font-size: .88rem; margin-top: 40px;
    }
    footer span { color: var(--s1); font-weight: 800; }

    /* \u2500\u2500 ANIMATIONS \u2500\u2500 */
    @keyframes popIn {
      from { opacity:0; transform: scale(.7); }
      to   { opacity:1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

      0%   { transform: translateY(110vh
