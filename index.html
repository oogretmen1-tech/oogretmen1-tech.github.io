<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Öğretmen - İlkokul Materyalleri</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --s1:#FF6B6B; --s2:#FFD93D; --s3:#6BCB77; --s4:#4D96FF;
  --purple:#C77DFF; --pink:#FF9ECD; --orange:#FF9F43; --teal:#48C9B0;
  --bg:#FAF2E0; --dark:#2D2D2D;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:"Nunito",sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed; inset:0;
  background-image:radial-gradient(circle,#e0d5c0 1px,transparent 1px);
  background-size:28px 28px;
  opacity:.45;
  z-index:0;
}

/* ICON */
.ico{
  width:26px;
  height:26px;
  vertical-align:middle;
}

/* NAV */
nav.navbar{
  position:sticky; top:0;
  z-index:100;
  background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  display:flex;
  justify-content:center;
  padding:12px;
  gap:10px;
}

.nav-btn{
  border-radius:30px;
  padding:8px 16px;
  border:2px solid #E2E8F0;
  background:#fff;
  font-weight:800;
  cursor:pointer;
  display:flex;
  gap:6px;
  align-items:center;
}

/* HERO */
.hero{
  position:relative;
  text-align:center;
  padding:50px 20px;
  background:linear-gradient(135deg,#F5EBD9,#DFC8A3);
}

.floating-emoji{
  position:absolute;
  width:34px;
  height:34px;
  opacity:.7;
  animation:floatUp 8s infinite;
}

@keyframes floatUp{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
}

.hero-badge{
  background:var(--s2);
  padding:6px 14px;
  border-radius:40px;
  font-weight:800;
}

.logo-main{
  font-size:3rem;
  font-weight:800;
}

/* rest unchanged (kısaltma için sadece önemli kısımlar gösterildi) */
</style>
</head>

<body>

<div class="hero">

  <!-- FLOATING ICONS (emoji → svg) -->
  <img class="floating-emoji" style="top:20%;left:8%" src="https://openmoji.org/data/color/svg/1F4DA.svg">
  <img class="floating-emoji" style="top:60%;left:14%" src="https://openmoji.org/data/color/svg/2728.svg">
  <img class="floating-emoji" style="top:30%;right:10%" src="https://openmoji.org/data/color/svg/1F3A8.svg">
  <img class="floating-emoji" style="top:70%;right:18%" src="https://openmoji.org/data/color/svg/1F31F.svg">
  <img class="floating-emoji" style="top:15%;left:48%" src="https://openmoji.org/data/color/svg/1F388.svg">
  <img class="floating-emoji" style="top:80%;left:42%" src="https://openmoji.org/data/color/svg/1F393.svg">

  <div class="hero-inner">

    <div class="hero-badge">
      <img class="ico" src="https://openmoji.org/data/color/svg/270F.svg">
      Eğitim Materyalleri
    </div>

    <h1 class="logo-main">
      Dijital Öğretmen
    </h1>

    <p class="hero-desc">
      1. Sınıftan 4. Sınıfa tüm dersler için materyaller
    </p>

  </div>
</div>

<nav class="navbar">

  <a class="nav-btn">
    <img class="ico" src="https://openmoji.org/data/color/svg/1F3E0.svg">
    Ana Sayfa
  </a>

  <a class="nav-btn">
    <img class="ico" src="https://openmoji.org/data/color/svg/1F464.svg">
    Hakkımda
  </a>

</nav>

<script>
function showPage(id){
  document.querySelectorAll('.page-section').forEach(p=>p.classList.remove('aktif'));
  document.getElementById('page-'+id)?.classList.add('aktif');
}
function showHome(){
  showPage('home');
}
function toggleSinif(){}
</script>

</body>
</html>
