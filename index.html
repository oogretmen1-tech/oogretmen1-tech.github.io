<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Öğretmen - İlkokul Materyalleri</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --s1: #FF6B6B;
            --s2: #FFD93D;
            --s3: #6BCB77;
            --s4: #4D96FF;
            --purple: #C77DFF;
            --pink: #FF9ECD;
            --orange: #FF9F43;
            --teal: #48C9B0;
            --bg: #FAF2E0;
            --dark: #2D2D2D;
        }
        * {
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        body {
            font-family:"Nunito",sans-serif;
            background:var(--bg);
            color:var(--dark);
            min-height:100vh;
            overflow-x:hidden;
        }
        body::before {
            content:'';
            position:fixed;
            inset:0;
            background-image:radial-gradient(circle, #e0d5c0 1px, transparent 1px);
            background-size:28px 28px;
            opacity:.45;
            pointer-events:none;
            z-index:0;
        }
        nav.navbar {
            position:sticky;
            top:0;
            z-index:100;
            background:#fff;
            box-shadow:0 2px 12px rgba(0,0,0,.08);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:12px 20px;
            gap:10px;
            flex-wrap:wrap;
        }
        .nav-btn {
            font-family:"Nunito",sans-serif;
            font-size:14px;
            font-weight:800;
            padding:8px 18px;
            border-radius:30px;
            border:2px solid #E2E8F0;
            background:#fff;
            color:var(--dark);
            text-decoration:none;
            cursor:pointer;
            transition:all .2s;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .nav-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 4px 12px rgba(0,0,0,.1);
        }
        .nav-btn.home {
            border-color:var(--s4);
            color:var(--s4);
        }
        .nav-btn.home:hover {
            background:var(--s4);
            color:#fff;
        }
        .nav-btn.about {
            border-color:var(--purple);
            color:var(--purple);
        }
        .nav-btn.about:hover {
            background:var(--purple);
            color:#fff;
        }
        .hero {
            position:relative;
            text-align:center;
            padding:50px 20px 60px;
            background:linear-gradient(135deg, #F5EBD9 0%, #EFE0C8 35%, #E8D5B7 70%, #DFC8A3 100%);
            overflow:hidden;
        }
        .hero-inner {
            position:relative;
            z-index:2;
        }
        
        /* Arka plandaki uçan nesneleri eğitim ikonlarıyla güncelledik */
        .floating-icon {
            position:absolute;
            font-size:2rem;
            color: var(--dark);
            opacity:.15;
            animation:floatUp 8s ease-in-out infinite;
            z-index:1;
            pointer-events:none;
        }
        .floating-icon:nth-child(1) { top:20%; left:8%; animation-delay:0s; color: var(--s1); }
        .floating-icon:nth-child(2) { top:60%; left:14%; animation-delay:1.5s; color: var(--s4); }
        .floating-icon:nth-child(3) { top:30%; right:10%; animation-delay:0.8s; color: var(--purple); }
        .floating-icon:nth-child(4) { top:70%; right:18%; animation-delay:2.3s; color: var(--s3); }
        .floating-icon:nth-child(5) { top:15%; left:48%; animation-delay:3s; font-size:1.5rem; color: var(--orange); }
        .floating-icon:nth-child(6) { top:80%; left:42%; animation-delay:4s; color: var(--teal); }

        @keyframes floatUp {
            0%, 100% { transform:translateY(0px) rotate(-5deg); }
            50% { transform:translateY(-20px) rotate(5deg); }
        }
        .hero-badge {
            display:inline-block;
            background:var(--s2);
            color:var(--dark);
            font-family:"Nunito",sans-serif;
            font-weight:800;
            font-size:.9rem;
            padding:6px 16px;
            border-radius:50px;
            margin-bottom:14px;
            box-shadow:0 4px 12px rgba(255,217,61,.4);
        }
        .logo-main {
            font-family:"Nunito",sans-serif;
            font-weight:800;
            font-size:clamp(2.2rem, 8vw, 3.5rem);
            line-height:1.1;
            color:var(--dark);
            margin-bottom:8px;
        }
        .logo-main .c1 { color:var(--s4); }
        .logo-main .c2 { color:var(--s1); }
        
        .hero-desc {
            font-size:1rem;
            font-weight:700;
            color:#555;
            margin:14px auto 20px;
            max-width:500px;
        }
        .ataturk {
            display:inline-block;
            background:rgba(255,255,255,.7);
            border-left:4px solid var(--s1);
            border-radius:0 14px 14px 0;
            padding:12px 18px;
            font-size:.82rem;
            font-weight:600;
            color:#444;
            font-style:italic;
            line-height:1.6;
            max-width:520px;
            text-align:left;
            margin-top:16px;
            box-shadow:0 4px 12px rgba(0,0,0,.06);
        }
        .ataturk b {
            color:var(--s1);
            font-style:normal;
            font-size:.74rem;
            display:block;
            margin-top:4px;
        }
        .content-area {
            max-width:920px;
            margin:0 auto;
            padding:32px 16px 60px;
            position:relative;
            z-index:2;
        }
        .bolum-baslik {
            font-family:"Nunito",sans-serif;
            font-weight:800;
            font-size:26px;
            color:var(--dark);
            text-align:center;
            margin-bottom:6px;
        }
        .bolum-baslik i {
            margin-right: 6px;
        }
        .bolum-alt {
            font-size:14px;
            color:#666;
            font-weight:600;
            text-align:center;
            margin-bottom:24px;
        }
        .divider {
            height:5px;
            width:80px;
            background:linear-gradient(90deg, var(--s1), var(--s2), var(--s3), var(--s4));
            border-radius:50px;
            margin:0 auto 30px;
        }
        .hizli-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
            gap:14px;
            margin-bottom:50px;
        }
        .hizli-btn {
            background:#EFE0C8;
            border:3px solid transparent;
            border-radius:22px;
            padding:22px 12px;
            text-align:center;
            cursor:pointer;
            text-decoration:none;
            color:var(--dark);
