<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlem Ölçekleri · 1. Sınıf | Dijital Öğretmen</title>
<meta name="description" content="Türkiye Yüzyılı Maarif Modeli'ne uygun 1. sınıf gözlem formları: Türkçe, Matematik, Hayat Bilgisi. Okul bilgilerini bir kez yazın, öğrenci listesini yapıştırın, puanları girin; formu yazdırın, Word ya da PDF indirin, e-Okul özetini alın.">
<link rel="stylesheet" href="poppinsa.css">
<style>
:root{
  --zemin:#EEF2F6; --kart:#FFFFFF; --cizgi:#D3DCE6; --yazi:#16263A; --soluk:#5B6B7D;
  --ana:#1F3D5C; --ana2:#3E5C7E; --ana-acik:#E6EDF5;
  --turkce:#F4B400; --turkce-k:#3A2A00; --turkce-a:#FFF6D6;
  --matematik:#1E6FD9; --matematik-k:#FFFFFF; --matematik-a:#E3EEFC;
  --hayat:#2E9D4F; --hayat-k:#FFFFFF; --hayat-a:#E2F4E7;
  --ci:#1F8A4C; --ci-a:#DDF3E5; --i:#1E6FD9; --i-a:#E1ECFB; --y:#B7791F; --y-a:#FCF0D5; --g:#C0392B; --g-a:#FBE3E0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--zemin);color:var(--yazi);font-family:'PoppinsA','Poppins',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.kap{max-width:1180px;margin:0 auto;padding:16px}
/* Başlık */
.ust{background:linear-gradient(135deg,#1F3D5C,#3E5C7E);color:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.ust h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:.2px}
.ust p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.ust .sag{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ust select{background:#fff;color:var(--ana);border:0;border-radius:10px;padding:8px 12px;font-weight:600}
.ust .etiket{font-size:.8rem;opacity:.85}
/* Sekmeler */
.sekmeler{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
.sekme{border:2px solid var(--cizgi);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;color:var(--ana)}
.sekme[aria-selected="true"]{background:var(--ana);border-color:var(--ana);color:#fff}
.sekme.d-turkce[aria-selected="true"]{background:var(--turkce);border-color:var(--turkce);color:var(--turkce-k)}
.sekme.d-matematik[aria-selected="true"]{background:var(--matematik);border-color:var(--matematik);color:#fff}
.sekme.d-hayat[aria-selected="true"]{background:var(--hayat);border-color:var(--hayat);color:#fff}
.sekme[aria-selected="true"] .nok{background:#fff !important}
.sekme .nok{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
/* Kartlar */
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.kart h2{margin:0 0 4px;font-size:1.12rem}
.kart .aciklama{margin:0 0 14px;color:var(--soluk);font-size:.9rem}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.izgara .tam{grid-column:1/-1}
@media (max-width:640px){.izgara{grid-template-columns:1fr}}
label.alan{display:block;font-size:.78rem;font-weight:600;color:var(--soluk);letter-spacing:.4px;text-transform:uppercase}
label.alan input,label.alan select{display:block;width:100%;margin-top:5px;border:1.5px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:#FAFCFE;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--yazi)}
label.alan input:focus,label.alan select:focus,textarea:focus{outline:none;border-color:var(--ana2);background:#fff}
textarea{width:100%;min-height:150px;border:1.5px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:#FAFCFE;font-size:1rem;resize:vertical}
.dugmeler{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ana);color:#fff;font-size:.95rem}
.btn.ikincil{background:#fff;color:var(--ana);border:1.5px solid var(--cizgi)}
.btn.word{background:#2B579A}
.btn.pdf{background:#C62828}
.btn.tehlike{background:#fff;color:#B42318;border:1.5px solid #F2C4BE}
.btn.kucuk{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.bilgi{font-size:.85rem;color:var(--soluk);margin:8px 0 0}
.uyari{background:#FFF8E1;border:1px solid #F3D88B;border-radius:12px;padding:12px 14px;font-size:.9rem;color:#5A4300}
/* Sınıflar */
.sinif-listesi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sinif-cip{border:2px solid var(--cizgi);border-radius:12px;padding:8px 14px;background:#fff;cursor:pointer;font-weight:600}
.sinif-cip.secili{border-color:var(--ana);background:var(--ana-acik);color:var(--ana)}
.sinif-cip small{font-weight:500;color:var(--soluk);margin-left:6px}
.ogr-tablo{width:100%;border-collapse:collapse;margin-top:10px}
.ogr-tablo td{border-bottom:1px solid #EDF1F5;padding:7px 6px;font-size:.95rem}
.ogr-tablo td.no{width:46px;color:var(--soluk);text-align:right;padding-right:10px}
.ogr-tablo td.okulno{width:80px;color:var(--soluk);font-size:.85rem}
.ogr-tablo td.sil{width:44px;text-align:right}
.x{border:0;background:#F3F5F8;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#8A97A6;font-size:1.05rem;line-height:1}
.x:hover{background:#FBE3E0;color:#B42318}
.yan{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.yan input{flex:1;min-width:180px;border:1.5px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:#FAFCFE}
/* Tema seçimi */
.temalar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tema{border:2px solid var(--cizgi);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--ana);font-size:.92rem;position:relative}
.tema .dolu{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:#C9D3DE;margin-left:8px;vertical-align:1px}
.tema .dolu.var{background:var(--ci)}
.ders-turkce .tema[aria-selected="true"]{background:var(--turkce);border-color:var(--turkce);color:var(--turkce-k)}
.ders-matematik .tema[aria-selected="true"]{background:var(--matematik);border-color:var(--matematik);color:#fff}
.ders-hayat .tema[aria-selected="true"]{background:var(--hayat);border-color:var(--hayat);color:#fff}
.form-baslik{font-size:1.08rem;font-weight:700;margin:0;line-height:1.35}
.form-alt{color:var(--soluk);font-size:.9rem;margin:4px 0 12px}
.form-alt b{color:var(--ana2)}
/* Gözlem tablosu */
.tablo-kutu{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--cizgi);border-radius:12px;margin-top:14px;background:#fff}
table.gozlem{border-collapse:separate;border-spacing:0;min-width:100%;font-size:.95rem}
table.gozlem th,table.gozlem td{border-bottom:1px solid #E7ECF2;border-right:1px solid #EEF2F6;text-align:center;padding:0}
table.gozlem thead th{background:#F5F8FB;vertical-align:bottom}
table.gozlem th.ogr-bas{position:sticky;left:0;z-index:3;background:#F5F8FB;text-align:left;padding:10px 12px;min-width:190px;font-size:.9rem;color:var(--soluk);vertical-align:middle}
table.gozlem td.ogr{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0;min-width:190px;max-width:240px}
table.gozlem td.ogr button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.gozlem td.ogr button:hover,table.gozlem td.ogr button:focus-visible{background:var(--ana-acik)}
table.gozlem td.ogr .sira{color:#9AA7B5;font-weight:500;margin-right:6px;display:inline-block;min-width:18px}
.dik{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;font-size:.82rem;padding:10px 6px 6px;margin:0 auto;color:var(--yazi);max-height:190px;overflow:hidden;text-overflow:ellipsis}
.kod{display:block;font-size:.66rem;color:var(--ana2);font-weight:600;padding:0 3px 4px;white-space:nowrap}
.olcut-no{display:block;font-size:.72rem;color:#9AA7B5;font-weight:600;padding-top:6px}
.simsek{display:block;margin:4px auto 6px;border:1.5px solid var(--cizgi);background:#fff;border-radius:8px;width:40px;height:30px;cursor:pointer;font-weight:700;font-size:.72rem;color:var(--ana2);line-height:1}
.simsek:hover{border-color:var(--ana2);background:var(--ana-acik)}
table.gozlem td.hucre{min-width:52px;width:52px;height:46px}
table.gozlem td.hucre button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:46px;cursor:pointer;font-weight:700;font-size:1.05rem;color:#B6C2CF}
table.gozlem td.hucre button:focus-visible{outline:3px solid var(--ana2);outline-offset:-3px}
table.gozlem td.hucre button.p{color:var(--yazi)}
table.gozlem td.hucre button.p span{display:inline-flex;width:34px;height:32px;border-radius:9px;align-items:center;justify-content:center}
.p4 span{background:var(--ci-a);color:var(--ci)}
.p3 span{background:var(--i-a);color:var(--i)}
.p2 span{background:var(--y-a);color:var(--y)}
.p1 span{background:var(--g-a);color:var(--g)}
table.gozlem th.ort-bas,table.gozlem td.ort{min-width:64px;font-weight:700;font-size:.9rem}
table.gozlem th.deg-bas,table.gozlem td.deg{min-width:96px;padding:0 6px}
table.gozlem th.ort-bas,table.gozlem th.deg-bas{font-size:.78rem;color:var(--soluk);padding:8px 4px;vertical-align:middle}
.rozet{display:inline-block;border-radius:8px;padding:4px 9px;font-weight:700;font-size:.8rem;white-space:nowrap}
.r-ci{background:var(--ci-a);color:var(--ci)} .r-i{background:var(--i-a);color:var(--i)} .r-y{background:var(--y-a);color:var(--y)} .r-g{background:var(--g-a);color:var(--g)} .r-bos{color:#B6C2CF}
/* Ölçüt listesi */
ol.olcutler{margin:6px 0 0;padding-left:26px}
ol.olcutler li{margin:5px 0;font-size:.92rem}
ol.olcutler li b{font-weight:600}
ol.olcutler li .k{color:var(--ana2);font-size:.8rem;font-weight:600;margin-left:6px;white-space:nowrap}
.anahtar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.85rem}
.ipucu{font-size:.86rem;color:var(--soluk);margin:10px 0 0}
/* Açılır seçici */
.secici{position:fixed;z-index:50;background:#fff;border:1px solid var(--cizgi);border-radius:14px;box-shadow:0 12px 32px rgba(20,40,70,.22);padding:10px;width:290px}
.secici .baslik{font-size:.8rem;color:var(--soluk);font-weight:600;margin:0 2px 8px;line-height:1.3}
.secici .puanlar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.secici .puanlar button{border:0;border-radius:10px;height:50px;font-size:1.25rem;font-weight:700;cursor:pointer}
.secici .puanlar button small{display:block;font-size:.56rem;letter-spacing:-.2px;font-weight:600;margin-top:1px}
.secici .b4{background:var(--ci-a);color:var(--ci)} .secici .b3{background:var(--i-a);color:var(--i)} .secici .b2{background:var(--y-a);color:var(--y)} .secici .b1{background:var(--g-a);color:var(--g)}
.secici .temizle{margin-top:8px;width:100%;border:1.5px solid var(--cizgi);background:#fff;border-radius:10px;padding:8px;cursor:pointer;font-weight:600;color:var(--soluk)}
.perde{position:fixed;inset:0;z-index:49;background:transparent}
/* Pencere (Sayfa Seç) */
.pencere-arka{position:fixed;inset:0;z-index:60;background:rgba(15,30,50,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pencere{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.pencere h3{margin:0 0 4px;font-size:1.1rem}
.pencere .liste label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--cizgi);border-radius:12px;margin:8px 0;cursor:pointer;font-weight:500}
.pencere .liste label input{width:20px;height:20px}
.pencere .liste label small{color:var(--soluk);margin-left:auto;white-space:nowrap}
/* Özet */
.ozet-filtre{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
table.ozet{border-collapse:separate;border-spacing:0;min-width:100%}
table.ozet th,table.ozet td{border-bottom:1px solid #E7ECF2;padding:9px 10px;text-align:center;font-size:.92rem}
table.ozet thead th{background:#F5F8FB;font-size:.82rem;color:var(--soluk);line-height:1.25}
table.ozet thead th b{display:block;color:var(--yazi);font-size:.88rem}
table.ozet th.ogr-bas,table.ozet td.ogr{position:sticky;left:0;background:#fff;text-align:left;min-width:180px;font-weight:600;z-index:2}
table.ozet th.ogr-bas{background:#F5F8FB}
table.ozet td small{display:block;color:#9AA7B5;font-size:.72rem;margin-top:2px}
.bos-durum{text-align:center;padding:30px 12px;color:var(--soluk)}
.bos-durum .btn{margin-top:12px}
.imza{text-align:center;color:#8A97A6;font-size:.82rem;margin:24px 0 8px}
.gizli{display:none !important}
/* Gözlem notu */
table.gozlem td.hucre{position:relative}
.not-isaret{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#7A4FD0;pointer-events:none}
.secici .not-btn{margin-top:6px;width:100%;border:1.5px solid #D9CCF3;background:#F6F2FD;border-radius:10px;padding:8px;cursor:pointer;font-weight:600;color:#5B3BA8}
.secici .not-on{margin-top:6px;font-size:.8rem;color:#5B3BA8;background:#F6F2FD;border-radius:8px;padding:6px 8px;line-height:1.35}
.pencere textarea{min-height:110px;margin-top:8px}
/* Görünüm seçici */
.gorunum{display:inline-flex;border:1.5px solid var(--cizgi);border-radius:12px;overflow:hidden;margin-top:14px}
.gorunum button{border:0;background:#fff;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--ana)}
.gorunum button[aria-pressed="true"]{background:var(--ana);color:#fff}
/* Öğrenci kartı */
.okart{border:1px solid var(--cizgi);border-radius:14px;margin-top:14px;overflow:hidden}
.okart-ust{display:flex;align-items:center;gap:8px;padding:12px;background:#F5F8FB;border-bottom:1px solid var(--cizgi);flex-wrap:wrap}
.okart-ust select{flex:1;min-width:150px;border:1.5px solid var(--cizgi);border-radius:10px;padding:10px;font-weight:700;font-size:1.05rem;background:#fff}
.okart-ust .ilerleme{width:100%;font-size:.82rem;color:var(--soluk)}
.osatir{padding:12px;border-bottom:1px solid #EDF1F5}
.osatir:last-child{border-bottom:0}
.osatir .ad{font-weight:700}
.osatir .ad small{color:var(--ana2);font-weight:600;font-size:.72rem;margin-left:6px}
.osatir .uz{font-size:.84rem;color:var(--soluk);margin:2px 0 8px}
.osatir .secim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.osatir .secim button{border:2px solid transparent;border-radius:10px;height:48px;font-weight:700;font-size:1.15rem;cursor:pointer;background:#F3F5F8;color:#8A97A6;line-height:1}
.osatir .secim button small{display:block;font-size:.58rem;font-weight:600;margin-top:2px}
.osatir .secim button.s4{background:var(--ci-a);color:var(--ci);border-color:var(--ci)}
.osatir .secim button.s3{background:var(--i-a);color:var(--i);border-color:var(--i)}
.osatir .secim button.s2{background:var(--y-a);color:var(--y);border-color:var(--y)}
.osatir .secim button.s1{background:var(--g-a);color:var(--g);border-color:var(--g)}
.osatir .notsatir{display:flex;gap:8px;align-items:center;margin-top:8px}
.osatir .notsatir button{border:1.5px solid #D9CCF3;background:#F6F2FD;color:#5B3BA8;border-radius:9px;padding:6px 10px;font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap}
.osatir .notsatir span{font-size:.84rem;color:#5B3BA8}
.okart-alt{display:flex;align-items:center;gap:10px;padding:12px;background:#F5F8FB;border-top:1px solid var(--cizgi);flex-wrap:wrap}
.okart-alt .btn{margin-left:auto}
/* Tema: bu hafta etiketi */
.tema .bu-hafta{font-size:.62rem;font-weight:700;letter-spacing:.3px;background:var(--ana);color:#fff;border-radius:6px;padding:2px 5px;margin-left:7px;vertical-align:1px}
.tema[aria-selected="true"] .bu-hafta{background:rgba(255,255,255,.9);color:var(--ana)}
/* Destek listesi */
.grup{border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;margin:10px 0}
.grup h3{margin:0 0 2px;font-size:.98rem}
.grup .kk{font-size:.8rem;color:var(--soluk);margin-bottom:8px}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{border-radius:999px;padding:5px 11px;font-size:.86rem;font-weight:600;background:var(--y-a);color:#7A4F0F}
.cip.g{background:var(--g-a);color:var(--g)}
.ders-etiket{display:inline-block;border-radius:7px;padding:2px 8px;font-size:.75rem;font-weight:700;margin-right:6px}
.de-turkce{background:var(--turkce-a);color:#6B4D00}.de-matematik{background:var(--matematik-a);color:#1957AD}.de-hayat{background:var(--hayat-a);color:#1E6B36}
.ogr-destek{border-bottom:1px solid #EDF1F5;padding:10px 0}
.ogr-destek:last-child{border-bottom:0}
.ogr-destek b{font-size:1rem}
.ogr-destek ul{margin:6px 0 0;padding-left:20px}
.ogr-destek li{margin:3px 0;font-size:.9rem}
.ogr-destek li i{color:#5B3BA8;font-style:normal}
/* Veli karnesi */
.karne-ogr{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #EDF1F5;padding:12px 0;flex-wrap:wrap}
.karne-ogr:last-child{border-bottom:0}
.karne-ogr label.sec{display:flex;gap:8px;align-items:center;font-weight:700;min-width:200px;cursor:pointer}
.karne-ogr label.sec input{width:20px;height:20px}
.karne-ogr .duz{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.karne-ogr textarea{min-height:64px;flex:1;min-width:240px}
.karne-ogr .sol{flex:0 0 230px}
@media (max-width:640px){.karne-ogr .sol{flex:1 1 100%}}
/* Karne kâğıdı */
.kagit.dikey{width:794px;height:1118px;padding:46px 54px 38px}
.karne .ust-serit{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1F3D5C;padding-bottom:10px}
.karne .ust-serit h2{margin:0;font-size:21px;color:#1F3D5C;letter-spacing:.3px}
.karne .ust-serit .okl{font-size:11.5px;color:#444;text-align:right;line-height:1.45}
.karne .kimlik{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:13px;margin:14px 0 6px}
.karne .kimlik b{display:inline-block;min-width:66px;color:#1F3D5C}
.karne .giris{font-size:12.5px;line-height:1.55;margin:10px 0 4px;color:#222}
.karne .ders{border:1.5px solid #D3DCE6;border-radius:10px;margin-top:12px;overflow:hidden;break-inside:avoid}
.karne .ders .db{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700;font-size:14px}
.karne .ders.turkce .db{background:#FFF3C4}.karne .ders.matematik .db{background:#DCE9FB}.karne .ders.hayat .db{background:#DDF1E3}
.karne .ders .db span{font-size:12.5px;background:#fff;border-radius:7px;padding:3px 10px}
.karne .ders .govde{padding:8px 14px 10px;font-size:12px;line-height:1.5}
.karne .ders .govde h4{margin:6px 0 2px;font-size:12px;color:#1F3D5C}
.karne .ders .govde ul{margin:0;padding-left:18px}
.karne .ders .govde .ev{margin-top:6px;color:#444;font-style:italic}
.karne .ogretmen-notu{border:1.5px dashed #B9C5D2;border-radius:10px;padding:10px 14px;margin-top:14px;font-size:12.5px;line-height:1.55;min-height:70px}
.karne .ogretmen-notu b{color:#1F3D5C}
.karne .imzalar{margin-top:26px}
/* Destek kâğıdı */
.destek-kagit h2{text-align:center;font-size:15px;margin:10px 0 4px}
.destek-kagit .alt{text-align:center;font-size:11.5px;color:#444;margin-bottom:10px}
.destek-kagit table.resmi td{text-align:left;vertical-align:top;height:auto;padding:4px 6px}
.destek-kagit table.resmi td.no{text-align:center;width:28px}
.bildirim{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16263A;color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
/* Baskı sayfaları (ekranda gizli) */
#baski{display:none}
.kagit{width:1123px;height:790px;overflow:hidden;background:#fff;color:#000;padding:42px 49px 34px;font-family:'PoppinsA','Poppins',Arial,sans-serif;position:relative}
.kagit .kafa{text-align:center;font-weight:700;font-size:13px;line-height:1.45}
.kagit .kafa .baslik2{margin-top:8px;font-size:14px}
.kagit table.resmi{border-collapse:collapse;width:100%;margin-top:14px}
.kagit table.resmi th,.kagit table.resmi td{border:1px solid #333;text-align:center;font-size:11.5px;padding:3px 4px;height:22px}
.kagit table.resmi th{background:#EDEDED;font-weight:700}
.kagit table.resmi td.ad{text-align:left;white-space:nowrap;padding-left:7px}
.kagit table.resmi td.dg{font-weight:600;white-space:nowrap}
.kagit.sik table.resmi th,.kagit.sik table.resmi td{font-size:10px;height:16px;padding:1px 3px}
.kagit.cok-sik table.resmi th,.kagit.cok-sik table.resmi td{font-size:9px;height:13px;padding:0 3px}
.kagit .lejant{margin-top:10px;font-size:10.5px;line-height:1.45;column-count:2;column-gap:28px}
.kagit .lejant div{break-inside:avoid}
.kagit.sik .lejant,.kagit.cok-sik .lejant{font-size:9.5px;margin-top:6px}
.kagit .puan-anahtari{margin-top:6px;font-size:10.5px}
.kagit .imzalar{display:flex;justify-content:space-between;margin-top:22px;font-size:12.5px;text-align:center}
.kagit.sik .imzalar,.kagit.cok-sik .imzalar{margin-top:12px}
.kagit .imzalar div{min-width:220px}
.kagit .imzalar b{display:block;font-size:13px}
.kagit .imzalar .tarih{margin-top:4px}
.kagit .dipnot{position:absolute;left:46px;right:46px;bottom:12px;text-align:center;font-size:8.5px;color:#888}
@media print{
  body{background:#fff}
  .ekran,#do-nav,.do-nav,[id^="do-"],.bildirim,.secici,.perde,.pencere-arka{display:none !important}

  .kagit{width:297mm;height:209mm;min-height:0;overflow:hidden;page-break-after:always;break-after:page;padding:11mm 13mm 9mm}

  .kagit.dikey{width:210mm;height:296mm;padding:12mm 14mm 10mm}
}

var ANAHTAR = "do-gozlem-olcekleri-v1";
var durum;
function yeniId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function bosDurum(){
  var s = { id:yeniId(), duzey:1, sube:"A", ogrenciler:[] };
  return { okul:{ ilce:"", okul:"", yil:"2026-2027", donem:"1", mudur:"", ogretmen:"" },
           siniflar:[s], aktif:s.id, puan:{}, sekme:"okul", tema:{} };
}
function yukle(){
  try { var v = JSON.parse(localStorage.getItem(ANAHTAR)); if (v && v.siniflar && v.siniflar.length) return v; } catch(e){}
  return bosDurum();
}
var kayitZamani = null;
function kaydet(){
  clearTimeout(kayitZamani);
  kayitZamani = setTimeout(function(){
    try { localStorage.setItem(ANAHTAR, JSON.stringify(durum)); }
    catch(e){ bildir("Kaydedilemedi. Tarayıcı belleği dolu ya da gizli sekmedesiniz; lütfen yedeği indirin."); }
  }, 150);
}
durum = yukle();
if (!durum.tema) durum.tema = {};
if (!durum.puan) durum.puan = {};
if (!durum.not) durum.not = {};
if (!durum.karneNot) durum.karneNot = {};

function aktifSinif(){
  for (var i=0;i<durum.siniflar.length;i++) if (durum.siniflar[i].id === durum.aktif) return durum.siniflar[i];
  durum.aktif = durum.siniflar[0].id; return durum.siniflar[0];
}
function sinifAdi(s){ return s.duzey + ". Sınıf / " + (s.sube || "A"); }
function dersler(){ var v = VERI[aktifSinif().duzey]; return v ? v.dersler : []; }
function dersBul(a){ var d = dersler(); for (var i=0;i<d.length;i++) if (d[i].anahtar===a) return d[i]; return null; }
function formAnahtar(ders, tema){ return ders.anahtar + "-" + tema.id; }
function puanlar(ders, tema){
  var s = aktifSinif();
  if (!durum.puan[s.id]) durum.puan[s.id] = {};
  var fa = formAnahtar(ders, tema);
  if (!durum.puan[s.id][fa]) durum.puan[s.id][fa] = {};
  return durum.puan[s.id][fa];
}
function puanOku(ders, tema, ogrId, i){
  var s = aktifSinif(); var p = durum.puan[s.id] && durum.puan[s.id][formAnahtar(ders,tema)];
  return p && p[ogrId] ? (p[ogrId][i] || null) : null;
}
function ortalama(ders, tema, ogrId){
  var t=0,n=0;
  for (var i=0;i<tema.olcutler.length;i++){ var v = puanOku(ders,tema,ogrId,i); if (v){ t+=v; n++; } }
  return n ? t/n : null;
}
function formDoluMu(ders, tema){
  var og = aktifSinif().ogrenciler;
  for (var j=0;j<og.length;j++) if (ortalama(ders,tema,og[j].id) != null) return true;
  return false;
}
function yuzdeDolu(ders, tema){
  var og = aktifSinif().ogrenciler, top = og.length*tema.olcutler.length, n=0;
  if (!top) return 0;
  og.forEach(function(g){ for (var i=0;i<tema.olcutler.length;i++) if (puanOku(ders,tema,g.id,i)) n++; });
  return Math.round(n*100/top);
}

function el(etiket, ozellik, icerik){

    if (k === "class") e.className = ozellik[k];
    else if (k === "text") e.textContent = ozellik[k];
    else if (k === "html") e.innerHTML = ozellik[k];
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), ozellik[k]);
    else e.setAttribute(k, ozellik[k]);
  }
  if (icerik) (Array.isArray(icerik)?icerik:[icerik]).forEach(function(c){ if (c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });

}

function listeyiAyikla(metin){
  var sonuc = [];
  metin.split(/\r?\n/).forEach(function(satir){
    var parca = satir.split(/\t+|\s{2,}|;/).map(function(x){return x.trim();}).filter(Boolean);
    if (!parca.length) return;
    var sayilar = [], adlar = [];
    parca.forEach(function(p){
      if (/^\d+[.)-]?$/.test(p)) sayilar.push(p.replace(/[.)-]/g,""));
      else {
        var m = p.match(/^(\d+)[.)-]?\s+(.*)$/);
        if (m && !adlar.length){ sayilar.push(m[1]); adlar.push(m[2]); }
        else adlar.push(p);
      }
    });
    var ad = adlar.join(" ").replace(/\s+/g," ").trim();
    if (!ad || /^(sıra( no)?|s\.? ?no|okul no|adı( soyadı)?|ad soyad|soyadı|öğrenci( adı( soyadı)?)?)(\s|$)/i.test(ad)) return;

function donemUygun(t, donem){ return donem==="yil" || String(t.donem)===String(donem); }
function dersOrtalama(d, ogrId, donem){

}
function pdfYap(is, ad){

    if (confirm("PDF oluşturulamadı. Yazdırma penceresi açılsın mı? (Yazıcı olarak “PDF olarak kaydet” seçebilirsiniz.)")) yazdir(is);
  });
}

function xk(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function wordForm(d, t, ilk){

function wordOzet(donem){

function wordYap(is, ad){

  var x = '<w:tbl><w:tblPr><w:tblW w:w="'+gen.reduce(function(a,b){return a+b;},0)+'" w:type="dxa"/><w:jc w:val="center"/>'+kenar+'<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+gen.map(function(g){return '<w:gridCol w:w="'+g+'"/>';}).join("")+'</w:tblGrid>';
  x += '<w:tr><w:trPr><w:tblHeader/></w:trPr>'+basliklar.map(function(b,i){ return wHucre(b, gen[i], {zemin:"EDEDED", b:true, sz:sz}); }).join("")+'</w:tr>';
  satirlar.forEach(function(r){ x += '<w:tr><w:trPr><w:cantSplit/></w:trPr>'+r.map(function(c,i){ return wHucre(c, gen[i], {sz:sz, jc: i===0?"center":"left", b: i===1}); }).join("")+'</w:tr>'; });
  return x + '</w:tbl>';
}

/* ---------------- Veli karnesi ---------------- */
var EV_ONERI = {
  turkce: "Evde: Her akşam on dakika birlikte kitap okuyup okuduğunuz hikâyeyi ona anlattırmanız çok işe yarar.",
  matematik: "Evde: Sofrayı kurarken, alışverişte ya da oyun oynarken saydırmak ve karşılaştırma yaptırmak matematiği günlük hayatın parçası yapar.",
  hayat: "Evde: Ona yaşına uygun küçük sorumluluklar verin, çevresinde gördüklerini size anlatmasını isteyin."
};
var karneSecili = {};
function karneNotu(g){ var s = aktifSinif(); return (durum.karneNot[s.id] && durum.karneNot[s.id][g.id]) || ""; }
function karneVerisi(g, donem){
  var sonuc = [];
  dersler().forEach(function(d){
    var ort = dersOrtalama(d, g.id, donem); if (ort == null) return;
    var oz = olcutOzeti(d, g.id, donem).filter(function(h){ return h.ort != null; });
    var guclu = oz.filter(function(h){ return h.ort >= 3; }).sort(function(a,b){ return b.ort - a.ort; }).slice(0,4);
    if (!guclu.length) guclu = oz.slice().sort(function(a,b){ return b.ort - a.ort; }).slice(0,2);
    var gelisen = oz.filter(function(h){ return h.ort < ESIK; }).sort(function(a,b){ return a.ort - b.ort; }).slice(0,3);
    sonuc.push({ders:d, duzey:duzey(ort), guclu:guclu, gelisen:gelisen});
  });
  return sonuc;
}
var KARNE_GIRIS = "Sevgili velimiz, bu rapor çocuğunuzu bu dönem derslerde gözlemlediklerimize dayanıyor. Bir not çizelgesi değil; neleri başardığını ve hangi becerilerde biraz daha desteğe ihtiyacı olduğunu birlikte görmemiz için hazırlandı.";
var KARNE_TAMAM = "Bu dönem bütün becerilerde beklenen düzeyde ilerliyor. Aynı ilgiyle devam edelim.";
function karneSayfasiHTML(g, donem){
  var s = aktifSinif(), ok = durum.okul, veri = karneVerisi(g, donem), not = karneNotu(g);
  var h = '<div class="kagit dikey karne"><div class="ic">';
  h += '<div class="ust-serit"><h2>ÖĞRENCİ GELİŞİM RAPORU</h2><div class="okl">'+(ok.okul?kac(ok.okul)+'<br>':'')+kac((ok.yil||"")+" Eğitim Öğretim Yılı")+'</div></div>';
  h += '<div class="kimlik"><div><b>Öğrenci</b> '+kac(g.ad)+'</div><div><b>Sınıf</b> '+kac(s.duzey+"/"+(s.sube||"A"))+'</div><div><b>Dönem</b> '+kac(donemAdi(donem))+'</div><div><b>Öğretmen</b> '+kac(ok.ogretmen||"")+'</div></div>';
  h += '<p class="giris">'+kac(KARNE_GIRIS)+'</p>';
  if (!veri.length) h += '<p class="giris"><i>Bu dönem için henüz gözlem kaydı yok.</i></p>';
  veri.forEach(function(v){
    h += '<div class="ders '+v.ders.renk+'"><div class="db">'+kac(v.ders.ad)+'<span>'+kac(v.duzey.ad)+'</span></div><div class="govde">';
    h += '<h4>Başarıyla yaptıkları</h4><ul>'+v.guclu.map(function(x){ return '<li>'+kac(x.uzun)+'</li>'; }).join("")+'</ul>';
    if (v.gelisen.length) h += '<h4>Birlikte geliştireceğimiz beceriler</h4><ul>'+v.gelisen.map(function(x){ return '<li>'+kac(x.uzun)+'</li>'; }).join("")+'</ul>';
    else h += '<h4>Genel durum</h4><div>'+kac(KARNE_TAMAM)+'</div>';
    h += '<div class="ev">'+kac(EV_ONERI[v.ders.anahtar]||"")+'</div></div></div>';
  });
  h += '<div class="ogretmen-notu"><b>Öğretmenin notu:</b> '+kac(not)+'</div>';
  h += '<div class="imzalar"><div><b>'+kac(ok.ogretmen||"……………………")+'</b>Sınıf Öğretmeni</div><div><b>……………………</b>Veli</div></div>';
  h += '</div><div class="dipnot">Dijital Öğretmen · Hasan Tutuş</div></div>';
  return h;
}
function wordKarne(g, donem, ilk){
  var s = aktifSinif(), ok = durum.okul, veri = karneVerisi(g, donem), not = karneNotu(g);
  var x = wP("ÖĞRENCİ GELİŞİM RAPORU",{b:true,sz:32,renk:"1F3D5C",sayfaSonu:!ilk});
  if (ok.okul) x += wP(ok.okul,{sz:20,renk:"444444"});
  x += wP((ok.yil||"")+" Eğitim Öğretim Yılı · "+donemAdi(donem),{sz:20,renk:"444444",after:160});
  x += wP([["Öğrenci: ",{b:true,sz:22}],[g.ad+"     ",{sz:22}],["Sınıf: ",{b:true,sz:22}],[s.duzey+"/"+(s.sube||"A")+"     ",{sz:22}],["Öğretmen: ",{b:true,sz:22}],[ok.ogretmen||"",{sz:22}]],{after:160});
  x += wP(KARNE_GIRIS,{sz:21,after:160});
  if (!veri.length) x += wP("Bu dönem için henüz gözlem kaydı yok.",{i:true,sz:21});
  veri.forEach(function(v){
    x += wP([[v.ders.ad+"  ",{b:true,sz:24,renk:"1F3D5C"}],["("+v.duzey.ad+")",{b:true,sz:22}]],{after:40});
    x += wP("Başarıyla yaptıkları",{b:true,sz:20,renk:"1F3D5C"});
    v.guclu.forEach(function(h){ x += wP("•  "+h.uzun,{sz:20}); });
    if (v.gelisen.length){ x += wP("Birlikte geliştireceğimiz beceriler",{b:true,sz:20,renk:"1F3D5C"}); v.gelisen.forEach(function(h){ x += wP("•  "+h.uzun,{sz:20}); }); }
    else x += wP(KARNE_TAMAM,{sz:20});
    x += wP(EV_ONERI[v.ders.anahtar]||"",{i:true,sz:19,renk:"444444",after:160});
  });
  x += wP([["Öğretmenin notu: ",{b:true,sz:21}],[not,{sz:21}]],{after:240});
  var bos = '<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>';
  function hc(a,b){ return '<w:tc><w:tcPr><w:tcW w:w="5190" w:type="dxa"/></w:tcPr>'+wP(a,{b:true,jc:"center",sz:22})+wP(b,{jc:"center",sz:22})+'</w:tc>'; }
  x += '<w:tbl><w:tblPr><w:tblW w:w="10380" w:type="dxa"/>'+bos+'<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="5190"/><w:gridCol w:w="5190"/></w:tblGrid><w:tr>'+hc(ok.ogretmen||"……………………","Sınıf Öğretmeni")+hc("……………………","Veli")+'</w:tr></w:tbl>';
  return x;
}
function isKarne(liste, donem){
  return { yon:"dikey",
    html: liste.map(function(g){ return karneSayfasiHTML(g, donem); }).join(""),
    word: function(){ return liste.map(function(g,i){ return wordKarne(g, donem, i===0); }).join(""); } };
}
function karneCiz(ic){
  var s = aktifSinif();
  var k = el("section",{class:"kart"});
  k.appendChild(el("h2",{text:"Veli Karnesi"}));
  k.appendChild(el("p",{class:"aciklama",text:"Her öğrenci için veliye verilecek, notsuz ve olumlu dille yazılmış tek sayfalık gelişim raporu. Puanlardan kendiliğinden oluşur; isterseniz her öğrenciye kendi notunuzu da ekleyin."}));
  var donem = donemSecici(k);
  ic.appendChild(k);
  if (!s.ogrenciler.length){ k.appendChild(el("div",{class:"bos-durum",text:"Önce öğrenci listesini ekleyin."})); return; }
  s.ogrenciler.forEach(function(g){ if (karneSecili[g.id] === undefined) karneSecili[g.id] = true; });
  function secilenler(){ return s.ogrenciler.filter(function(g){ return karneSecili[g.id]; }); }
  var ad = dosyaAdiYap(s.duzey+"-sinif-"+s.sube+"-veli-karneleri");
  function calis(f){ var l = secilenler(); if (!l.length){ bildir("En az bir öğrenci seçin."); return; } f(l); }
  var db = el("div",{class:"dugmeler",style:"margin:4px 0 0"});
  db.appendChild(el("button",{class:"btn",text:"Seçilenleri yazdır",onclick:function(){ calis(function(l){ yazdir(isKarne(l,donem)); }); }}));
  db.appendChild(el("button",{class:"btn word",text:"Word indir",onclick:function(){ calis(function(l){ wordYap(isKarne(l,donem), ad); }); }}));
  db.appendChild(el("button",{class:"btn pdf",text:"PDF indir",onclick:function(){ calis(function(l){ pdfYap(isKarne(l,donem), ad); }); }}));
  db.appendChild(el("button",{class:"btn ikincil",text:"Hepsini seç",onclick:function(){ s.ogrenciler.forEach(function(g){ karneSecili[g.id]=true; }); ciz(); }}));
  db.appendChild(el("button",{class:"btn ikincil",text:"Seçimi kaldır",onclick:function(){ s.ogrenciler.forEach(function(g){ karneSecili[g.id]=false; }); ciz(); }}));
  k.appendChild(db);

  var k2 = el("section",{class:"kart"});
  k2.appendChild(el("h2",{text:"Öğrenciler"}));
  k2.appendChild(el("p",{class:"aciklama",text:"Karnesi hazırlanacak öğrencileri işaretleyin. Öğretmen notu karnenin altında görünür."}));
  s.ogrenciler.forEach(function(g, j){
    var sat = el("div",{class:"karne-ogr"});
    var sol = el("div",{class:"sol"});
    var cb = el("input",{type:"checkbox"}); cb.checked = !!karneSecili[g.id];
    cb.addEventListener("change", function(){ karneSecili[g.id] = this.checked; });
    sol.appendChild(el("label",{class:"sec"},[cb, (j+1)+". "+g.ad]));
    var duz = el("div",{class:"duz"});
    var varMi = false;
    dersler().forEach(function(d){ var dz = duzey(dersOrtalama(d,g.id,donem)); if (dz){ varMi = true; duz.appendChild(el("span",{class:"rozet r-"+dz.k,text:d.ad+": "+dz.kisa})); } });
    if (!varMi) duz.appendChild(el("span",{class:"bilgi",style:"margin:0",text:"Bu dönem için puan yok"}));
    sol.appendChild(duz);
    var tek = el("div",{class:"dugmeler",style:"margin-top:8px"});
    tek.appendChild(el("button",{class:"btn ikincil kucuk",text:"Yazdır",onclick:function(){ yazdir(isKarne([g],donem)); }}));
    tek.appendChild(el("button",{class:"btn ikincil kucuk",text:"PDF",onclick:function(){ pdfYap(isKarne([g],donem), dosyaAdiYap(g.ad+"-gelisim-raporu")); }}));
    sol.appendChild(tek);
    sat.appendChild(sol);
    var ta = el("textarea",{placeholder:"Öğretmenin notu (isteğe bağlı). Örnek: Bu dönem okumaya çok istekli; akşamları birlikte kitap okumanızı öneririm.","aria-label":g.ad+" için öğretmen notu"});
    ta.value = karneNotu(g);
    ta.addEventListener("input", function(){ if (!durum.karneNot[s.id]) durum.karneNot[s.id] = {}; durum.karneNot[s.id][g.id] = this.value; kaydet(); });
    sat.appendChild(ta);
    k2.appendChild(sat);
  });
  ic.appendChild(k2);
}

temalariHaftayaGoreAc();
ciz();
})();
