<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şekil Dedektifi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --mor: #6848df;
      --koyu: #241448;
      --sari: #ffd34e;
      --turuncu: #ff9348;
      --yesil: #20c486;
      --kirmizi: #f05265;
      --mavi: #42c9e7;
      --krem: #fff9e9;
      --yazi-tipi: "Andika", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--yazi-tipi);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background:
        radial-gradient(circle at 10% 15%, #ffe078 0 5%, transparent 6%),
        radial-gradient(circle at 90% 20%, #8ce4ca 0 6%, transparent 7%),
        linear-gradient(135deg, #4934a1, #9461da 52%, #ffaf65);
    }

    .app {
      width: min(950px, 95%);
      min-height: 700px;
      overflow: hidden;
      border: 6px solid var(--sari);
      border-radius: 34px;
      background: linear-gradient(#332064, #12092d);
      box-shadow: 0 0 35px rgba(255, 211, 78, .4);
      margin: 20px 0;
    }

    .screen {
      display: none;
      min-height: 688px;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* KAPAK */

    #coverScreen {
      position: relative;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 30px 20px 120px;
      text-align: center;
      background:
        linear-gradient(rgba(255,255,255,.12), rgba(20,8,55,.88)),
        linear-gradient(135deg, #73d8e8, #8062d5 55%, #ffad68);
    }

    #coverScreen::before {
      content: "◆   ●   ▲   ■   ★";
      position: absolute;
      top: 25px;
      color: var(--sari);
      font-size: 27px;
      letter-spacing: 13px;
    }

    .cover-icon {
      position: relative;
      z-index: 2;
      font-size: 105px;
      filter: drop-shadow(0 8px 3px rgba(0,0,0,.3));
      animation: sallan 2s infinite ease-in-out;
    }

    @keyframes sallan {
      50% {
        transform: translateY(-10px) rotate(5deg);
      }
    }

    .cover-title {
      position: relative;
      z-index: 2;
      margin: 12px 0;
      color: var(--sari);
      font-size: clamp(38px, 7vw, 68px);
      text-shadow: 4px 5px 0 var(--koyu);
    }

    .cover-text {
      position: relative;
      z-index: 2;
      max-width: 590px;
      font-size: 21px;
      line-height: 1.5;
    }

    .cover-shapes {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      color: rgba(255,255,255,.7);
      font-size: 55px;
      letter-spacing: 75px;
      text-align: center;
    }

    /* BUTONLAR */

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      transition: .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.08);
    }

    .main-button {
      position: relative;
      z-index: 3;
      margin-top: 22px;
      padding: 16px 38px;
      border-radius: 30px;
      color: white;
      background: linear-gradient(135deg, var(--turuncu), var(--kirmizi));
      box-shadow: 0 6px 0 #a72e3e;
      font-size: 23px;
    }

    /* OYUN EKRANI */

    #gameScreen {
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 24px;
      background: rgba(0,0,0,.35);
      border-bottom: 3px solid rgba(255,255,255,.12);
    }

    .game-name {
      color: var(--sari);
      font-size: 24px;
      font-weight: bold;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.15);
      font-size: 17px;
      font-weight: bold;
    }

    .game-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .progress-info {
      width: min(680px, 100%);
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .progress {
      width: min(680px, 100%);
      height: 15px;
      margin-bottom: 25px;
      overflow: hidden;
      border-radius: 20px;
      background: #e4ddff;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc52f, #ff6e80);
      transition: width .4s;
    }

    .question-card {
      width: 100%;
      max-width: 680px;
      padding: 25px;
      border: 3px dashed #efbd4c;
      border-radius: 27px;
      background: rgba(255,250,232,.98);
      color: var(--koyu);
      text-align: center;
    }

    .question-title {
      margin-bottom: 16px;
      color: var(--mor);
      font-size: 28px;
      font-weight: bold;
    }

    .clue {
      margin-bottom: 18px;
      font-size: 19px;
    }

    .shape-display {
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .shape {
      width: 110px;
      height: 110px;
      background: var(--mavi);
      border: 7px solid #197a9e;
      box-shadow: 0 8px 0 rgba(0,0,0,.12);
    }

    .circle {
      border-radius: 50%;
      background: #ffca45;
      border-color: #d49118;
    }

    .square {
      background: #ff7185;
      border-color: #bd3d55;
    }

    .triangle {
      width: 0;
      height: 0;
      background: transparent;
      border: 0;
      border-left: 63px solid transparent;
      border-right: 63px solid transparent;
      border-bottom: 115px solid #7acb5d;
      box-shadow: none;
    }

    .rectangle {
      width: 155px;
      height: 95px;
      background: #9b78e8;
      border-color: #593ba2;
    }

    .oval {
      width: 145px;
      height: 95px;
      border-radius: 50%;
      background: #ff9a50;
      border-color: #c75c1c;
    }

    .diamond {
      width: 90px;
      height: 90px;
      background: #55cddd;
      border-color: #16829a;
      transform: rotate(45deg);
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .answer {
      padding: 16px 10px;
      border: 3px solid #cfc4fa;
      border-radius: 17px;
      color: var(--koyu);
      background: #ebe6ff;
      font-size: 20px;
    }

    .answer:hover:not(:disabled) {
      border-color: var(--mor);
      background: #d9d0ff;
    }

    .answer.correct {
      color: white;
      background: var(--yesil);
      border-color: #118c5f;
    }

    .answer.wrong {
      color: white;
      background: var(--kirmizi);
      border-color: #bd3648;
    }

    .feedback {
      min-height: 32px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .good {
      color: #07935c;
    }

    .bad {
      color: #d1394c;
    }

    .next-button {
      display: none;
      margin: 16px auto 0;
      padding: 13px 25px;
      border-radius: 15px;
      color: white;
      background: var(--turuncu);
      box-shadow: 0 4px 0 #d06e20;
      font-size: 17px;
    }

    /* SONUÇ */

    #resultScreen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      background:
        radial-gradient(circle at center, #60458f, transparent 48%),
        linear-gradient(#2d185d, #10072b);
    }

    .result-icon {
      font-size: 115px;
      animation: buyut 1.4s infinite alternate;
    }

    @keyframes buyut {
      to {
        transform: scale(1.1) rotate(-5deg);
      }
    }

    #resultTitle {
      margin: 10px 0;
      color: var(--sari);
      font-size: clamp(34px, 7vw, 58px);
    }

    #resultDesc {
      max-width: 600px;
      font-size: 22px;
      line-height: 1.5;
    }

    .small-button {
      margin-top: 17px;
      padding: 11px 20px;
      border: 2px solid white;
      border-radius: 20px;
      color: white;
      background: transparent;
      font-size: 16px;
    }

    @media (max-width: 620px) {
      .app {
        width: 97%;
      }

      .top-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }

      .stat {
        font-size: 14px;
      }

      .game-content {
        padding: 15px;
      }

      .question-card {
        padding: 20px 12px;
      }

      .answer {
        padding: 14px 7px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- KAPAK -->
    <section id="coverScreen" class="screen active">
      <div class="cover-icon">🔍</div>

      <h1 class="cover-title">Şekil Dedektifi</h1>

      <p class="cover-text">
        Gizli şekilleri bul, ipuçlarını incele ve
        doğru cevabı seç! Bakalım gerçek bir şekil dedektifi misin? 🕵️
      </p>

      <button class="main-button" onclick="startGame()">
        Araştırmaya Başla 🚀
      </button>

      <div class="cover-shapes">●   ▲   ■   ◆</div>
    </section>

    <!-- OYUN -->
    <section id="gameScreen" class="screen">
      <header class="top-bar">
        <div class="game-name">🔍 Şekil Araştırma Merkezi</div>

        <div class="stats">
          <div class="stat">❤️ <span id="lives">3</span></div>
          <div class="stat">⭐ <span id="score">0</span></div>
        </div>
      </header>

      <div class="game-content">
        <div class="progress-info">
          <span id="questionNumber">1 / 8</span>
          <span>🧠 İpucunu İncele</span>
        </div>

        <div class="progress">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="question-card">
          <div class="question-title" id="questionTitle"></div>
          <div class="clue" id="clue"></div>

          <div class="shape-display">
            <div id="shape" class="shape"></div>
          </div>

          <div id="answers" class="answers"></div>

          <div id="feedback" class="feedback"></div>

          <button id="nextButton" class="next-button" onclick="nextQuestion()">
            Sıradaki İpucu ➜
          </button>
        </div>
      </div>
    </section>

    <!-- SONUÇ -->
    <section id="resultScreen" class="screen">
      <div class="result-icon">🏆</div>
      <h1 id="resultTitle"></h1>
      <p id="resultDesc"></p>

      <button class="main-button" onclick="restartGame()">
        Yeni Araştırma 🔄
      </button>

      <button class="small-button" onclick="showScreen('coverScreen')">
        Ana Menüye Dön
      </button>
    </section>

  </main>

  <script>
    const questions = [
      {
        title: "Bu şekli tanıyor musun?",
        clue: "İpucu: Hiç köşesi ve kenarı yoktur.",
        shape: "circle",
        answers: ["Kare", "Üçgen", "Daire", "Dikdörtgen"],
        correct: "Daire"
      },
      {
        title: "Şeklin adı nedir?",
        clue: "İpucu: 3 kenarı ve 3 köşesi vardır.",
        shape: "triangle",
        answers: ["Üçgen", "Daire", "Kare", "Oval"],
        correct: "Üçgen"
      },
      {
        title: "Doğru şekli seç!",
        clue: "İpucu: 4 eşit kenarı ve 4 köşesi vardır.",
        shape: "square",
        answers: ["Oval", "Kare", "Üçgen", "Daire"],
        correct: "Kare"
      },
      {
        title: "Bu şeklin adı nedir?",
        clue: "İpucu: Karşılıklı kenarları eşittir ve 4 köşesi vardır.",
        shape: "rectangle",
        answers: ["Dikdörtgen", "Kare", "Daire", "Üçgen"],
        correct: "Dikdörtgen"
      },
      {
        title: "Şekil dedektifi, dikkat!",
        clue: "İpucu: Yuvarlak ve uzamış bir şekildir.",
        shape: "oval",
        answers: ["Kare", "Üçgen", "Oval", "Dikdörtgen"],
        correct: "Oval"
      },
      {
        title: "Bu özel şekli bul!",
        clue: "İpucu: 4 kenarı vardır ve elmasa benzer.",
        shape: "diamond",
        answers: ["Daire", "Eşkenar dörtgen", "Üçgen", "Oval"],
        correct: "Eşkenar dörtgen"
      },
      {
        title: "Kaç köşe var?",
        clue: "İpucu: Gösterilen şeklin köşe sayısını düşün.",
        shape: "triangle",
        answers: ["2", "3", "4", "5"],
        correct: "3"
      },
      {
        title: "Son ipucu!",
        clue: "İpucu: Gösterilen şeklin kaç kenarı vardır?",
        shape: "square",
        answers: ["2", "3", "4", "5"],
        correct: "4"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let lives = 3;
    let answered = false;

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");
    }

    function startGame() {
      currentQuestion = 0;
      score = 0;
      lives = 3;
      answered = false;

      showScreen("gameScreen");
      updateTopBar();
      loadQuestion();
    }

    function restartGame() {
      startGame();
    }

    function updateTopBar() {
      document.getElementById("score").textContent = score;
      document.getElementById("lives").textContent = lives;
    }

    function loadQuestion() {
      answered = false;

      const question = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        `${currentQuestion + 1} / ${questions.length}`;

      document.getElementById("progressBar").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      document.getElementById("questionTitle").textContent =
        question.title;

      document.getElementById("clue").textContent =
        question.clue;

      const shape = document.getElementById("shape");
      shape.className = `shape ${question.shape}`;

      const answers = document.getElementById("answers");
      answers.innerHTML = "";

      question.answers.forEach(answerText => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answerText;
        button.onclick = () =>
          checkAnswer(button, answerText);

        answers.appendChild(button);
      });

      const feedback = document.getElementById("feedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      document.getElementById("nextButton").style.display = "none";
    }

    function checkAnswer(button, selectedAnswer) {
      if (answered) return;

      answered = true;

      const question = questions[currentQuestion];
      const allButtons = document.querySelectorAll(".answer");

      allButtons.forEach(answerButton => {
        answerButton.disabled = true;

        if (answerButton.textContent === question.correct) {
          answerButton.classList.add("correct");
        }
      });

      const feedback = document.getElementById("feedback");

      if (selectedAnswer === question.correct) {
        score += 10;
        button.classList.add("correct");

        feedback.textContent = "Harika! İpucunu doğru çözdün! 🎉";
        feedback.classList.add("good");
      } else {
        lives--;
        button.classList.add("wrong");

        feedback.textContent =
          `Bu kez olmadı. Doğru cevap: ${question.correct}`;
        feedback.classList.add("bad");
      }

      updateTopBar();

      if (lives <= 0) {
        setTimeout(() => finishGame(false), 900);
      } else {
        document.getElementById("nextButton").style.display = "block";
      }
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion >= questions.length) {
        finishGame(true);
      } else {
        loadQuestion();
      }
    }

    function finishGame(won) {
      showScreen("resultScreen");

      const resultTitle = document.getElementById("resultTitle");
      const resultDesc = document.getElementById("resultDesc");
      const resultIcon = document.querySelector(".result-icon");

      if (won) {
        resultIcon.textContent = "🏆";
        resultTitle.textContent = "Dosya Çözüldü!";
        resultDesc.textContent =
          `Tebrikler! Tüm şekilleri tanıdın ve ${score} puan kazandın. Gerçek bir şekil dedektifisin!`;
      } else {
        resultIcon.textContent = "🕵️";
        resultTitle.textContent = "Araştırma Bitti";
        resultDesc.textContent =
          "Canların bitti. Yeni Araştırma düğmesine basarak tekrar deneyebilirsin.";
      }
    }
  </script>
</body>
</html>
