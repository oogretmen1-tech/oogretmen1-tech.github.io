<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06110b;
    font-family:DORakam,Poppins,"Segoe UI",Roboto,Arial,sans-serif;color:#eef6f1;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #menu{position:fixed;inset:0;overflow-y:auto;z-index:20;
    background:radial-gradient(130% 80% at 50% -10%,#1d5a3a 0%,#0b2a1b 50%,#04110a 100%);}
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 40px;}
  .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px;}
  .logo .t{font-weight:900;font-size:34px;letter-spacing:2px;line-height:1;}
  .logo .t span{color:#ffd23f;}
  .logo .y{font-size:13px;font-weight:700;color:#0b2a1b;background:#ffd23f;border-radius:6px;padding:3px 8px;}
  .alt{text-align:center;color:#a9c9b6;font-size:14px;margin:4px 0 16px;}
  .adim{display:flex;align-items:center;gap:10px;margin:4px 0 12px;}
  .adim h2{margin:0;font-size:22px;font-weight:800;flex:1;}
  .adim small{display:block;font-size:12px;font-weight:600;color:#8fc4a4;letter-spacing:1px;}
  .geriB{border:0;background:rgba(255,255,255,.1);color:#fff;font:700 15px Poppins,sans-serif;
    padding:10px 16px;border-radius:12px;cursor:pointer;}
  .modlar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:640px){ .modlar{grid-template-columns:1fr;} }
  .mod{border:0;border-radius:20px;padding:20px 16px;text-align:left;cursor:pointer;color:#fff;
    font-family:Poppins,sans-serif;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden;}
  .mod:active{transform:scale(.98);}
  .mod b{font-size:24px;font-weight:900;line-height:1.1;}
  .mod span{font-size:14px;opacity:.92;margin-top:6px;font-weight:600;}
  .mod svg{position:absolute;right:12px;top:12px;opacity:.9;}
  .mod img.ik{position:absolute;right:10px;top:10px;width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));}
  .sahne{position:relative;height:230px;border-radius:20px;overflow:hidden;margin:4px 0 16px;
    background:repeating-linear-gradient(90deg,#2f9a4b 0 70px,#288a42 70px 140px);box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.35);}
  .sahne:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.55);}
  .sahne:after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border:3px solid rgba(255,255,255,.55);border-radius:50%;}
  .sahne img{position:absolute;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  .sahne .sf{left:3%;bottom:4px;height:94%;}
  .sahne .sk{left:50%;top:50%;width:36%;max-height:62%;object-fit:contain;transform:translate(-50%,-50%);}
  .sahne .ss{right:3%;bottom:4px;height:94%;}
  .sahne.kucuk{height:170px;}
  .sahne.kucuk .sk{left:auto;right:4%;top:50%;width:42%;transform:translateY(-50%);}
  @media (max-width:640px){ .sahne{height:180px;} .sahne .sk{width:40%;} }
  .m1{background:linear-gradient(140deg,#1fa85a,#0d6b37);}
  .m2{background:linear-gradient(140deg,#2b7bd8,#1a4a96);}
  .m3{background:linear-gradient(140deg,#e2a91e,#b4700c);}
  .sekme{display:flex;gap:8px;justify-content:center;margin:0 0 12px;}
  .sekme button{flex:1;max-width:260px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
    color:#e6f2ea;font:800 16px Poppins,sans-serif;padding:12px;border-radius:14px;cursor:pointer;}
  .sekme button.on{background:#ffd23f;color:#1b1400;border-color:#ffd23f;}
  .ligler{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px;}
  .ligler button{border:0;background:rgba(255,255,255,.08);color:#dcefe3;font:700 14px Poppins,sans-serif;
    padding:9px 14px;border-radius:20px;cursor:pointer;}
  .ligler button.on{background:#2fbf6b;color:#03200e;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;}
  .tk{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 6px 10px;
    text-align:center;cursor:pointer;font-family:Poppins,sans-serif;color:#fff;}
  .tk:active{transform:scale(.97);}
  .tk.sec{border-color:#ffd23f;background:rgba(255,210,63,.14);}
  .tk.kapali{opacity:.3;pointer-events:none;}
  .tk .nm{font-size:14px;font-weight:700;margin-top:6px;line-height:1.2;}
  .tk .gc{font-size:11px;font-weight:600;color:#9fc8b0;margin-top:2px;}
  .tk img,.vsK img{display:block;margin:0 auto;}
  .rast{display:block;margin:0 auto 14px;border:2px dashed rgba(255,255,255,.3);background:transparent;color:#fff;
    font:800 16px Poppins,sans-serif;padding:12px 22px;border-radius:14px;cursor:pointer;}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 18px;}
  .vsK{text-align:center;background:rgba(255,255,255,.06);border-radius:18px;padding:14px 8px;}
  .vsK .who{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#8fc4a4;margin-bottom:6px;}
  .vsK .nm{font-size:20px;font-weight:800;margin-top:8px;}
  .vsO{font-size:26px;font-weight:900;color:#ffd23f;}
  .turAd{text-align:center;font-size:20px;font-weight:800;color:#ffd23f;margin:-4px 0 14px;}
  .ayarlar{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;margin:0 0 6px;}
  .ayar{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ayar>span{font-size:12px;letter-spacing:1.5px;color:#8fc4a4;font-weight:700;}
  .seg{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:4px;}
  .seg button{border:0;background:transparent;color:#d5ebdd;font:700 15px Poppins,sans-serif;
    padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  .seg button.on{background:#2fbf6b;color:#03200e;}
  .basla{display:block;width:100%;max-width:520px;margin:18px auto 0;padding:18px;border:0;border-radius:18px;
    background:linear-gradient(180deg,#ffd84d,#f0b400);color:#231800;font:900 22px Poppins,sans-serif;letter-spacing:1px;cursor:pointer;
    box-shadow:0 10px 24px rgba(240,180,0,.35);}
  .nasil{margin:22px auto 0;max-width:760px;background:rgba(0,0,0,.25);border-radius:16px;padding:14px 16px;
    font-size:14px;line-height:1.65;color:#cfe3d7;}
  .nasil h3{margin:0 0 6px;font-size:16px;color:#fff;}
  .nasil b{color:#ffd23f;}
  @media (max-height:520px) and (orientation:landscape){
    .wrap{padding:10px 18px 24px;} .logo .t{font-size:26px;} .alt{margin:2px 0 10px;}
    .mod{min-height:104px;padding:14px;} .mod b{font-size:20px;} .mod span{font-size:12.5px;} .mod svg{transform:scale(.75);transform-origin:top right;}
    .modlar{grid-template-columns:repeat(3,1fr);}
    .nasil{font-size:12.5px;padding:10px 14px;} .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
    .sahne{height:150px;margin:2px 0 10px;} .sahne.kucuk{height:120px;}
    .vs{margin:4px 0 10px;} .vsK{padding:8px;} .basla{margin-top:10px;padding:13px;font-size:19px;}
  }
  .imza{margin-top:18px;text-align:center;font-size:13px;font-weight:700;letter-spacing:.5px;color:#2fbf6b;}
  #tur{position:fixed;inset:0;z-index:25;overflow-y:auto;display:none;
    background:radial-gradient(130% 80% at 50% -10%,#1d4a5a 0%,#0b1f2a 50%,#040b11 100%);color:#eef6f1;padding:16px 12px 30px;}
  #tur .tw{max-width:600px;margin:0 auto;}
  #tur h2{margin:0 0 4px;font-size:24px;text-align:center;font-weight:900;}
  #tur .alt2{text-align:center;font-size:14px;color:#9cc0cf;margin:10px 0 8px;font-weight:700;}
  .grp{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px 6px;margin-bottom:10px;}
  .grp h4{margin:0 0 6px;font-size:13px;color:#8fe0ac;letter-spacing:1px;}
  .grp table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .grp th{font-size:11px;color:#86a99a;font-weight:700;text-align:right;padding:2px 3px;}
  .grp th:first-child{text-align:left;}
  .grp td{padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.06);}
  .grp td.n{text-align:right;width:28px;color:#bfe6cf;}
  .grp tr.me td{color:#ffd84d;font-weight:800;}
  .grp tr.up td{background:rgba(47,191,107,.10);}
  .mac{display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:14px;}
  .mac.me{background:rgba(255,210,63,.16);font-weight:700;}
  .mac b{color:#ffd84d;white-space:nowrap;}
  .tkAd{display:inline-flex;align-items:center;gap:7px;}
  .oyna{display:block;width:100%;margin:14px 0 6px;padding:16px;border:0;border-radius:14px;
    background:linear-gradient(180deg,#ffd84d,#f0b400);color:#231800;font:900 18px Poppins,sans-serif;cursor:pointer;}
  .geri{display:block;width:100%;margin:6px 0;padding:12px;border:0;border-radius:12px;
    background:rgba(255,255,255,.1);color:#eef6f1;font:700 15px Poppins,sans-serif;cursor:pointer;}
  .kupa{display:flex;justify-content:center;margin:8px 0;}
  #pause{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,10,6,.84);}
  #pause .box{width:min(340px,86vw);background:#0f2c1c;border-radius:18px;padding:20px;text-align:center;}
  #pause h3{margin:0 0 12px;font-size:21px;}
  #pause button{display:block;width:100%;margin:8px 0;padding:14px;border:0;border-radius:12px;
    font:700 16px Poppins,sans-serif;background:rgba(255,255,255,.1);color:#eef6f1;cursor:pointer;}
  #pause button.main{background:#2fbf6b;color:#03200e;}

/* ============================ YARDIMCILAR ============================ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function rnd(a,b){return a+Math.random()*(b-a);}
function randn(){return (Math.random()+Math.random()+Math.random()-1.5)*1.15;}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function seeded(seed){let a=seed>>>0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRGB(h){if(h.startsWith('rgb')){const m=h.match(/\d+/g);return [+m[0],+m[1],+m[2]];}h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function colDist(a,b){const x=hexRGB(a),y=hexRGB(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);}
const _shC=new Map();
function shade(hex,k){const key=hex+'|'+k; let v=_shC.get(key); if(v) return v; v=_shade(hex,k); if(_shC.size<4000) _shC.set(key,v); return v;}
function _shade(hex,k){const c=hexRGB(hex);const f=v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255);return `rgb(${f(c[0])},${f(c[1])},${f(c[2])})`;}
function isLight(hex){const c=hexRGB(hex);return 0.299*c[0]+0.587*c[1]+0.114*c[2]>160;}

function yildiz(cx,cy,R,r,n,rot){
  let s='';for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n;const rr=i%2?r:R;s+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(2)+' '+(cy+Math.sin(a)*rr).toFixed(2);} return s+'Z';
}

let AC=null, crowdGain=null;
function ensureAC(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){AC=null;}
  return AC;
}
function whistle(n){
  if(!ensureAC()) return; const t0=AC.currentTime;
  for(let k=0;k<(n||1);k++){ const st=t0+k*(n===3?0.32:0.2), len=(n===3&&k===2)?0.6:0.16;
    try{ const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type='sine';o.frequency.value=2650;l.frequency.value=32;lg.gain.value=220;l.connect(lg);lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.09,st+0.02);g.gain.setValueAtTime(0.09,st+len-0.04);g.gain.exponentialRampToValueAtTime(0.0001,st+len);
      o.connect(g);g.connect(AC.destination);l.start(st);o.start(st);o.stop(st+len+0.02);l.stop(st+len+0.02);}catch(e){} }
}
function noiseBurst(dur,freq,vol,q){
  if(!ensureAC()) return;
  try{ const t0=AC.currentTime, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=AC.createBufferSource(); s.buffer=buf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
    const g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0);}catch(e){}
}
function sfxKick(v){ noiseBurst(0.07, 220+v*8, clamp(0.10+v*0.01,0.1,0.5), 0.8); }
function sfxPost(){ if(!ensureAC())return; try{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=880;
  g.gain.setValueAtTime(0.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.5);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.5);}catch(e){} }
function crowdStart(){
  if(!ensureAC()||crowdGain) return;
  try{ const len=AC.sampleRate*3, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); let v=0;
    for(let i=0;i<len;i++){ v=v*0.97+(Math.random()*2-1)*0.03; d[i]=v*6; }
    const s=AC.createBufferSource(); s.buffer=buf; s.loop=true;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700; f.Q.value=0.5;
    crowdGain=AC.createGain(); crowdGain.gain.value=0.0; s.connect(f); f.connect(crowdGain); crowdGain.connect(AC.destination); s.start(); }catch(e){}
}
function crowdLevel(v){ if(crowdGain&&AC) try{crowdGain.gain.setTargetAtTime(v,AC.currentTime,0.4);}catch(e){} }
function crowdCheer(){ if(!ensureAC())return; crowdLevel(0.32); setTimeout(()=>crowdLevel(0.06),3200); noiseBurst(2.6,900,0.5,0.4); }

// 4-3-3 dizilişi: [mevki, ileri (0=kendi kale,1=rakip kale), en (0..1), forma no]
const FORM=[['GK',0.03,0.5,1],['DF',0.22,0.12,2],['DF',0.18,0.37,4],['DF',0.18,0.63,3],['DF',0.22,0.88,5],
  ['MF',0.38,0.30,8],['MF',0.33,0.50,6],['MF',0.38,0.70,10],['FW',0.62,0.15,7],['FW',0.68,0.50,9],['FW',0.62,0.85,11]];
const GK_RENK=['#22c55e','#facc15','#f97316','#a855f7','#111827','#06b6d4','#ec4899'];

function kitOf(def, rakip){
  let k={shirt:def.shirt,alt:def.alt,shorts:def.shorts,socks:def.socks,pat:def.pat};
  if(rakip && (colDist(k.shirt,rakip.shirt)<130 || (colDist(k.shirt,rakip.shirt)<170 && colDist(k.shorts,rakip.shorts)<120))){
    // deplasman forması
    const a = isLight(def.shirt) ? '#1b1f2a' : '#f5f5f5';
    let yeni = colDist(def.alt,rakip.shirt)>150 ? def.alt : a;
    k={shirt:yeni, alt:def.shirt, shorts: isLight(yeni)?'#1b1f2a':'#f5f5f5', socks:yeni, pat:'plain'};
  }
  return k;
}
function buildTeam(def, side, kit, rakipKit){
  const pool = def.lig ? LIG_HAVUZ[def.lig] : (MILLI_HAVUZ[def.id]||'en');
  const t={def, side, dir: side===0?1:-1, kit, name:def.name, code:kisaKod(def), players:[], human:false};
  let gkc=GK_RENK[0], best=-1;
  for(const c of GK_RENK){ const m=Math.min(colDist(c,kit.shirt),colDist(c,rakipKit.shirt)); if(m>best){best=m;gkc=c;} }
  t.gkKit={shirt:gkc,alt:shade(gkc,-0.35),shorts:shade(gkc,-0.45),socks:gkc,pat:'plain',gk:true};
  const R=seeded(hashStr(def.id+def.name+'v2')); const kul=new Set();
  const havuzlar=Object.keys(ADLAR);
  FORM.forEach((f,i)=>{
    const [role,fx,fy,num]=f;
    let nm;
    if(def.id==='TUR' && !def.lig) nm=TR_KADRO[i];
    else { let hv=pool; if(def.lig && R()<0.3) hv=havuzlar[(R()*havuzlar.length)|0];
      const L=ADLAR[hv]; let g=0; do{ nm=L[(R()*L.length)|0]; g++; }while(kul.has(nm)&&g<30); }
    kul.add(nm);
    const ten=TEN_ARALIK[pool]||[0,5];
    const sk=SKINS[ten[0]+((R()*(ten[1]-ten[0]+1))|0)];
    const hair = pool==='jp'||pool==='ma'||pool==='tr' ? HAIRS[(R()*3)|0] : HAIRS[(R()*HAIRS.length)|0];
    t.players.push({team:t, role, fx, fy, num, name:nm, isGK:role==='GK',
      skin:sk, hair, hairStyle:(R()*4)|0, boot:BOOTS[(R()*BOOTS.length)|0], h:1.76+R()*0.14,
      spd:6.0+(def.guc-80)*0.035+R()*0.5, x:0,y:0,vx:0,vy:0,face:0,anim:R()*6, state:'',st:0,
      kickT:0, tackleCd:0, yellow:0, stam:1, decT:R()*0.4, holdT:0, receiving:0, off:false,
      run:{x:0,y:0,t:R()*3}, jz:0, setT:null, gkHold:0, holdHands:false, diveDir:0, slideHit:false});
  });
  return t;
}
function skill(p){ return clamp((p.team.def.guc-68)/26,0.2,0.95); }
function ai(t){ return t.human ? DIFF[1] : DIFF[G.diff]; }
function pMax(p,sprint){
  let s=p.spd*(sprint?1.30:1)*(0.8+0.2*p.stam);
  if(!p.team.human) s*=ai(p.team).spd*(1+G.skillBonus*0.3);
  if(ball.owner===p) s*=0.93;
  return s;
}

function inBoxOf(t,x,y){ return Math.abs(x-ownGoalX(t))<=BOX_D && Math.abs(y-CY)<=BOX_W/2; }
function opp(t){ return G.teams[1-t.side]; }
function gkOf(t){ return t.players.find(p=>p.isGK); }
function busy(p){ return p.state==='fall'||p.state==='slide'||p.state==='dive'||p.state==='stumble'||p.state==='throw'; }

/* ============================ BAŞLAT ============================ */
function startMatch(dA,dB,humans){
  menuEl.style.display='none'; turEl.style.display='none';
  const ka=kitOf(dA,null), kb=kitOf(dB,ka);
  G.teams=[buildTeam(dA,0,ka,kb), buildTeam(dB,1,kb,ka)];
  G.teams[0].human=true; G.teams[1].human=!!humans;
  G.players=G.teams[0].players.concat(G.teams[1].players);
  G.score=[0,0]; G.clock=0; G.half=1; G.banner=null; G.cardShow=null; G.scorer=null; G.endShown=false;
  G.ctrl=[null,null]; G.kickFirst=0;
  G.ref={name:'Hakem', isRef:true, x:CX-8,y:CY+10,vx:0,vy:0,face:0,anim:0,state:'',st:0,skin:'#d9a07a',hair:'#1a1a1a',hairStyle:1,boot:'#111',h:1.8,jz:0,
    kitR:{shirt:'#151515',alt:'#f5d000',shorts:'#151515',socks:'#151515',pat:'ref'}};
  for(const t of G.teams) for(const p of t.players){ p.x=wx(t,p.fx*0.5); p.y=p.fy*FWD; p.face=t.dir>0?0:Math.PI; }
  cam.x=CX; cam.y=CY; cam.zoom=70;
  buildStadium();
  resize();
  crowdStart(); crowdLevel(0.06);
  setupSet('kickoff',0,CX,CY);
  banner('MAÇ BAŞLIYOR', G.teams[0].name+' - '+G.teams[1].name, '#ffd23f', 2.2);
}
function restartMatch(){ startMatch(G.teams[0].def, G.teams[1].def, G.teams[1].human); }

/* ============================ GİRİŞ (dokunma + klavye) ============================ */
const IN=[0,1].map(()=>({ax:0,ay:0,A:false,B:false,C:false,D:false,Ae:false,Be:false,Ce:false,Bup:false,Bt:0,stick:false}));
function clearEdges(){ for(const I of IN){ I.Ae=I.Be=I.Ce=I.Bup=false; } }

function setCtrl(side,p){ if(!G.teams[side]||!G.teams[side].human) return; if(p && p.isGK && ball.owner!==p && !(G.set&&G.set.taker===p)) return; G.ctrl[side]=p; }

/* ============================ TOP FİZİĞİ ============================ */
function integ(s,h){
  if(s.z>0.005||s.vz>0.01){
    s.vz-=GRAV*h; const d=Math.exp(-0.12*h); s.vx*=d; s.vy*=d;
    if(s.spin){ const sp=hyp(s.vx,s.vy)||1; const ax=-s.vy/sp*s.spin, ay=s.vx/sp*s.spin; s.vx+=ax*h; s.vy+=ay*h; s.spin*=Math.exp(-0.6*h); }
  }else{
    s.z=0; s.vz=0; const sp=hyp(s.vx,s.vy);
    if(sp>0){ const ns=Math.max(0,sp-(2.4+0.32*sp)*h); s.vx*=ns/sp; s.vy*=ns/sp; }
  }
  s.x+=s.vx*h; s.y+=s.vy*h; s.z+=s.vz*h;
  if(s.z<0){ s.z=0; if(s.vz<-1.6){ s.vz=-s.vz*0.5; s.vx*=0.86; s.vy*=0.86; } else s.vz=0; }
}
function passDist(v0,ve){ return (v0-ve)/0.32 - 7.5*Math.log((v0+7.5)/(ve+7.5))/0.32; }
function passSpeed(d,ve){ let lo=ve+0.5,hi=34; for(let i=0;i<22;i++){ const m=(lo+hi)/2; if(passDist(m,ve)<d) lo=m; else hi=m; } return (lo+hi)/2; }
function passTime(v0,ve){ return Math.log((v0+7.5)/(ve+7.5))/0.32; }

function predictBall(){
  const s={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz,spin:ball.spin};
  const out=[];
  if(ball.owner){ for(let i=1;i<=30;i++) out.push({x:ball.x+ball.vx*i*0.1,y:ball.y+ball.vy*i*0.1,z:0,t:i*0.1}); ball.path=out; return; }
  for(let i=1;i<=30;i++){ integ(s,0.05); integ(s,0.05); out.push({x:s.x,y:s.y,z:s.z,t:i*0.1}); }
  ball.path=out;
}
function intercept(p){
  const ms=pMax(p,true);
  for(const pt of ball.path){
    if(pt.z>(p.isGK?2.4:1.9)) continue;
    const d=hyp(pt.x-p.x,pt.y-p.y);
    if(d/ms+0.12<=pt.t) return {x:pt.x,y:pt.y,t:pt.t};
  }
  const L=ball.path[ball.path.length-1]||ball;
  return {x:L.x,y:L.y,t:hyp(L.x-p.x,L.y-p.y)/ms+0.12};
}

function ballStep(dt){
  ball.ignoreT-=dt; if(ball.ignoreT<=0) ball.ignore=null;
  if(ball.owner){
    const o=ball.owner;
    if(o.holdHands){ ball.x=o.x+Math.cos(o.face)*0.32; ball.y=o.y+Math.sin(o.face)*0.32; ball.z=1.05; }
    else{
      const sp=hyp(o.vx,o.vy);
      const off=0.5+Math.min(sp,9)*0.045+Math.abs(Math.sin(o.anim*0.5))*0.16*Math.min(1,sp/3);
      ball.x=o.x+Math.cos(o.face)*off; ball.y=o.y+Math.sin(o.face)*off; ball.z=0;
    }
    ball.vx=o.vx; ball.vy=o.vy; ball.vz=0;
    ball.rot+=hyp(o.vx,o.vy)*dt*1.8;
    return;
  }
  ball.freeT+=dt;
  const n=3, h=dt/n;
  for(let i=0;i<n;i++){
    const px=ball.x;
    integ(ball,h);
    // direkler ve üst direk
    if(G.phase!=='goal') for(const gx of [0,FL]){
      if((px-gx)*(ball.x-gx)<=0 && px!==ball.x){
        const dy=Math.abs(ball.y-CY);
        if(Math.abs(dy-GW/2)<0.2 && ball.z<GH+0.1){
          ball.x=px; ball.vx=-ball.vx*0.55; ball.vy+=(ball.y>CY?1:-1)*rnd(1,3)*(dy<GW/2?-1:1);
          sfxPost(); banner('DİREK!','','#ffffff',1.2); ball.isShot=false; break;
        }
        if(dy<GW/2 && Math.abs(ball.z-GH)<0.18){
          ball.x=px; ball.vx=-ball.vx*0.4; ball.vz=-Math.abs(ball.vz)*0.4-1;
          sfxPost(); banner('ÜST DİREK!','','#ffffff',1.2); ball.isShot=false; break;
        }
      }
    }
    // file içi
    if(G.phase==='goal'){
      if(ball.x<-1.9){ ball.x=-1.9; ball.vx*=-0.15; } if(ball.x>FL+1.9){ ball.x=FL+1.9; ball.vx*=-0.15; }
      if(ball.x<0||ball.x>FL){ ball.y=clamp(ball.y,CY-GW/2+0.15,CY+GW/2-0.15); if(ball.z>GH-0.15){ ball.z=GH-0.15; ball.vz=0; } }
    }
  }
  ball.rot+=hyp(ball.vx,ball.vy)*dt*1.8;
}

/* ============================ VURUŞLAR ============================ */
function kick(p,vx,vy,vz,o){
  o=o||{};
  if(ball.owner && ball.owner!==p) {}
  p.holdHands=false;
  ball.owner=null; ball.vx=vx; ball.vy=vy; ball.vz=vz; if(vz>0 && ball.z<0.05) ball.z=0.05;
  ball.lastTouch=p.team.side; ball.lastPlayer=p; ball.ignore=p; ball.ignoreT=o.ign||0.28;
  ball.passTarget=o.target||null; ball.isShot=!!o.shot; ball.spin=o.spin||0; ball.gkTried=null; ball.freeT=0;
  p.kickT=0.32; p.face=Math.atan2(vy,vx);
  if(o.target) o.target.receiving=2.5;
  if(o.pass && G.offside && !G.noOffKick) markOffside(p); else clearOffside();
  G.noOffKick=false;
  sfxKick(hyp(vx,vy,vz));
  if(p.team.human && o.target && !o.target.isGK) setCtrl(p.team.side,o.target);
}
function passErr(p){ return (p.team.human?0.02:0.05)*(1.35-skill(p)); }
function passTo(p,q,through){
  let tx=q.x, ty=q.y;
  const d0=hyp(tx-ball.x,ty-ball.y);
  const ve=through?5.5:4;
  let v0=passSpeed(d0,ve), tt=passTime(v0,ve);
  tx+=q.vx*tt*0.75; ty+=q.vy*tt*0.75;
  if(through){ tx+=q.team.dir*rnd(4,7); }
  tx=clamp(tx,1,FL-1); ty=clamp(ty,1,FWD-1);
  const d=hyp(tx-ball.x,ty-ball.y);
  if(d>34 && !through){ return lobTo(p,tx,ty,q,clamp(d/19,1.0,2.1),true); }
  v0=passSpeed(d,ve);
  const a=Math.atan2(ty-ball.y,tx-ball.x)+randn()*passErr(p);
  kick(p,Math.cos(a)*v0,Math.sin(a)*v0,0,{pass:true,target:q});
}
function lobTo(p,tx,ty,q,T,pass,spin){
  T=T||clamp(hyp(tx-ball.x,ty-ball.y)/18,0.7,2.1);
  const e=1+randn()*passErr(p)*1.5;
  const vx=(tx-ball.x)/T*1.07*e, vy=(ty-ball.y)/T*1.07*e;
  const vz=GRAV*T/2-ball.z/T;
  kick(p,vx,vy,vz,{pass:pass!==false,target:q||null,spin:spin||0});
}
function shotAcc(p){ return p.team.human ? 0.88*(0.75+skill(p)*0.3) : ai(p.team).acc*(0.75+skill(p)*0.3)+G.skillBonus*0.4; }
function doShoot(p,power,aimY,curve){
  const t=p.team, gx=goalXOf(t);
  const d=hyp(gx-ball.x,CY-ball.y);
  const gk=gkOf(opp(t));
  if(aimY==null){ const side= gk ? (gk.y<CY?1:-1) : (Math.random()<0.5?1:-1); aimY=CY+side*rnd(1.9,3.1); }
  const acc=clamp(shotAcc(p),0.3,1);
  let pr=1; for(const o of opp(t).players) if(!o.isGK && hyp(o.x-p.x,o.y-p.y)<1.8) pr=1.35;
  const spread=(0.3+d*0.045)*(1.25-acc*0.8)*pr*(power>0.93?1.5:1);
  const ty=aimY+randn()*spread;
  const v=15+power*15;
  const tt=d/(v*0.96);
  const hz=clamp(0.3+power*1.25+randn()*0.5*Math.min(1.4,spread), 0.05, 4.5);
  let vz=(hz-ball.z+0.5*GRAV*tt*tt)/tt; vz=Math.min(vz,10);
  let hd=Math.atan2(ty-ball.y,gx-ball.x);
  let spin=0;
  if(curve){ spin=(ty>ball.y?-1:1)*t.dir*rnd(3,5); hd-= spin*0.045*t.dir*-1; }
  kick(p,Math.cos(hd)*v,Math.sin(hd)*v,vz,{shot:true,spin});
  p.state='';
}
function crossZone(p){ const t=p.team; return fxOf(t,ball.x)>0.70 && Math.abs(ball.y-CY)>BOX_W/2-6; }
function doCross(p,aimY,corner){
  const t=p.team, gx=goalXOf(t);
  let ty = aimY!=null ? aimY : CY+rnd(-5,5);
  let tx = gx - t.dir*rnd(6,11);
  // ceza sahasındaki en uygun arkadaşa yakın düşür
  let best=null,bd=9;
  for(const q of t.players){ if(q===p||q.isGK) continue; const d=hyp(q.x-tx,q.y-ty); if(Math.abs(q.x-gx)<BOX_D && d<bd){bd=d;best=q;} }
  if(best && aimY==null){ tx=lerp(tx,best.x,0.7); ty=lerp(ty,best.y,0.7); }
  const spin=(ball.y<CY?1:-1)*t.dir*(corner?2.2:1.4);
  lobTo(p,tx,ty,best,corner?1.25:1.05,true,spin);
}
function header(p){
  if(touchBy(p)) return;
  const t=p.team, gx=goalXOf(t);
  const inOpp = Math.abs(gx-p.x)<BOX_D+3 && Math.abs(p.y-CY)<BOX_W/2;
  const humanCtl = G.ctrl[t.side]===p;
  ball.gkTried=null;
  if(inOpp && (humanCtl || Math.random()<0.85)){
    let ty=CY+rnd(-3.2,3.2);
    if(humanCtl){ const I=IN[t.side]; if(Math.abs(I.ay)>0.3) ty=CY-I.ay*3.2; }
    const d=hyp(gx-ball.x,ty-ball.y), v=rnd(13,18), tt=d/v;
    const vz=(rnd(0.2,1.8)-ball.z+0.5*GRAV*tt*tt)/tt;
    const a=Math.atan2(ty-ball.y,gx-ball.x);
    kick(p,Math.cos(a)*v,Math.sin(a)*v,vz,{shot:true,ign:0.35});
  }else if(inBoxOf(t,p.x,p.y) || fxOf(t,p.x)<0.25){
    const a=(t.dir>0?0:Math.PI)+rnd(-0.8,0.8);
    kick(p,Math.cos(a)*rnd(12,16),Math.sin(a)*rnd(12,16),rnd(5,8),{ign:0.35});
  }else{
    let best=null,bd=16; for(const q of t.players){ if(q===p||q.isGK)continue; const d=hyp(q.x-p.x,q.y-p.y); if(d<bd&&d>3){bd=d;best=q;} }
    if(best){ const a=Math.atan2(best.y-ball.y,best.x-ball.x), v=clamp(bd*0.7+5,7,13); kick(p,Math.cos(a)*v,Math.sin(a)*v,0.8,{pass:true,target:best,ign:0.35}); }
    else { const a=t.dir>0?0:Math.PI; kick(p,Math.cos(a)*9,Math.sin(a)*9,1,{ign:0.35}); }
  }
  noiseBurst(0.06,500,0.18,1);
}

/* ============================ OFSAYT ============================ */
function markOffside(p){
  const t=p.team, o=opp(t);
  const fs=o.players.map(q=>fxOf(t,q.x)).sort((a,b)=>b-a);
  const line=Math.max(fs[1]||0, fxOf(t,ball.x), 0.5);
  for(const q of t.players) q.off = q!==p && fxOf(t,q.x)>line+0.005;
  for(const q of o.players) q.off=false;
}
function clearOffside(){ for(const p of G.players) p.off=false; }
function touchBy(q){
  if(G.offside && q.off && G.phase==='play'){
    q.off=false; whistle(1);
    banner('OFSAYT', q.name+' ofsayt pozisyonunda', '#ffd23f', 1.8);
    setupSet('frikik', 1-q.team.side, q.x, q.y, {indirect:true});
    return true;
  }
  if(q.team.side!==ball.lastTouch || ball.passTarget!==q) clearOffside();
  else clearOffside();
  return false;
}

/* ============================ TOPLA TEMAS ============================ */
function gain(p){
  if(touchBy(p)) return;
  ball.owner=p; ball.passTarget=null; ball.isShot=false; ball.spin=0; ball.gkTried=null;
  ball.lastTouch=p.team.side; ball.lastPlayer=p; ball.z=0; ball.vz=0;
  p.holdT=0; p.decT=(p.team.human?0.25:ai(p.team).dec)*rnd(0.5,1.1); p.receiving=0;
  if(p.team.human && !p.isGK) setCtrl(p.team.side,p);
}
function deflect(p,sp){
  if(touchBy(p)) return;
  const a=Math.atan2(ball.vy,ball.vx)+rnd(-1.3,1.3)+(Math.random()<0.3?Math.PI:0);
  const v=sp*rnd(0.25,0.5);
  ball.vx=Math.cos(a)*v; ball.vy=Math.sin(a)*v; ball.vz=rnd(0,2.5); if(ball.vz>0) ball.z=Math.max(ball.z,0.05);
  ball.lastTouch=p.team.side; ball.lastPlayer=p; ball.isShot=false; ball.passTarget=null; ball.ignore=p; ball.ignoreT=0.35;
  noiseBurst(0.05,300,0.15,1);
}
function gkHandle(p,d,sp){
  const t=p.team;
  if(!inBoxOf(t,ball.x,ball.y)) return false;
  const diving=p.state==='dive';
  const reach=diving?2.2:1.15, maxZ=diving?2.3:2.75;
  if(d>reach || ball.z>maxZ || ball.gkTried===p) return false;
  ball.gkTried=p;
  if(ball.lastTouch===t.side && !ball.isShot){ gain(p); return true; }     // geri pas: ayakla oynar
  const sk=clamp(0.6+skill(p)*0.3+(t.human?0.04:ai(t).gk)+(t.human?0:G.skillBonus),0.35,0.97);
  const catchP = sp<13 ? 0.97 : clamp(1.05-(sp-13)/16+(sk-0.75),0.2,0.92)*(diving?0.7:1);
  const wasShot=ball.isShot && sp>12;
  if(Math.random()<catchP){
    if(touchBy(p)) return true;
    gain(p); p.holdHands=true; p.gkHold=0; p.vx*=0.3; p.vy*=0.3;
    if(wasShot) banner('KURTARIŞ!', p.name, '#7ee0ff', 1.2);
    return true;
  }
  const saveP=clamp(sk+(diving?0:0.1)-(sp>27?0.15:0),0.25,0.95);
  if(Math.random()<saveP){
    if(touchBy(p)) return true;
    const side=(ball.y>=p.y?1:-1);
    if(Math.random()<0.38){ ball.vx=-t.dir*rnd(1.5,4); ball.vy=side*rnd(6,11); }      // kale çizgisine doğru çeler → korner
    else { ball.vx=t.dir*rnd(3,8); ball.vy=side*rnd(3,9); }
    ball.vz=rnd(1.2,4.5); ball.z=Math.max(ball.z,0.2);
    ball.lastTouch=t.side; ball.lastPlayer=p; ball.isShot=false; ball.passTarget=null; ball.ignore=p; ball.ignoreT=0.5;
    banner('ÇELDİ!', p.name, '#7ee0ff', 1.2); noiseBurst(0.08,260,0.3,1);
    return true;
  }
  return false;
}
function ballTouches(){
  if(ball.owner || G.phase!=='play') return;
  const sp=hyp(ball.vx,ball.vy);
  const cands=[];
  for(const p of G.players){
    if(p===ball.ignore||p.state==='fall'||p.state==='stumble') continue;
    const d=hyp(p.x-ball.x,p.y-ball.y);
    if(d<2.6) cands.push([d+(Math.random()*0.15),p]);
  }
  cands.sort((a,b)=>a[0]-b[0]);
  for(const [d,p] of cands){
    if(p.isGK && gkHandle(p,d,sp)) return;
    if(p.state==='slide') continue;
    const insan=p.team.human && !p.isGK;
    const reach=0.72+(ball.passTarget===p?0.28:0)+(p.state==='tackle'?0.3:0)+(insan?0.35:0);
    if(d>reach) continue;
    if(ball.z<1.0){
      const intended = ball.passTarget===p || (ball.passTarget && ball.passTarget.team===p.team);
      const ctl = insan ? (sp<18 || (intended&&sp<27) || Math.random()<0.6) : (sp<12.5 || (intended&&sp<21) || Math.random()<0.3);
      if(ctl) gain(p); else deflect(p,sp);
      return;
    }
    const top=1.85+p.jz;
    if(ball.z<=top+0.15 && ball.z>1.0){ header(p); return; }
  }
}
function airDuel(){
  if(ball.owner || ball.z<1.2 || G.phase!=='play') return;
  for(const p of G.players){
    if(p.state || p.isGK && inBoxOf(p.team,ball.x,ball.y)) continue;
    const d=hyp(p.x-ball.x,p.y-ball.y);
    if(d<1.3 && ball.z<2.7 && ball.vz<0.5){ p.state='jump'; p.st=0.6; p.stMax=0.6; }
  }
}

/* ============================ FAUL / KART ============================ */
function foul(f,v,sev){
  if(G.phase!=='play') return;
  whistle(2);
  v.state='fall'; v.st=1.6; v.stMax=1.6; v.vx*=0.4; v.vy*=0.4;
  const pen=inBoxOf(f.team,v.x,v.y);
  let card=null; const r=Math.random();
  const pY=[0.14,0.42,0.68][sev], pR=[0,0.03,0.09][sev];
  if(r<pR) card='red';
  else if(r<pR+pY){ f.yellow++; card=f.yellow>=2?'red2':'yellow'; }
  banner(pen?'PENALTI!':'FAUL', f.name+' ('+f.team.name+')', pen?'#ff5d5d':'#ffd23f', 2.0);
  if(card){ G.cardShow={type:card,p:f,t:3.0}; if(card!=='yellow') f.sendOff=true; }
  if(G.ref){ G.ref.cardT = card?2.6:0; G.ref.card=card; }
  if(pen) setupSet('penalti', v.team.side, 0,0, {taker:v, prep:2.4});
  else setupSet('frikik', v.team.side, clamp(v.x,0.5,FL-0.5), clamp(v.y,0.5,FWD-0.5), {prep:2.2});
}
function processSendOffs(){
  for(const t of G.teams){
    const out=t.players.filter(p=>p.sendOff);
    for(const p of out){
      if(t.players.length<=7) { p.sendOff=false; continue; }
      t.players.splice(t.players.indexOf(p),1);
      G.players.splice(G.players.indexOf(p),1);
      if(G.ctrl[t.side]===p) G.ctrl[t.side]=null;
      if(G.set && G.set.taker===p){ G.set.taker = t.players.filter(q=>!q.isGK).sort((a,b)=>hyp(a.x-G.set.x,a.y-G.set.y)-hyp(b.x-G.set.x,b.y-G.set.y))[0]; }
    }
  }
}
function standTackle(p,oto){
  const insan=p.team.human;
  p.state='tackle'; p.st=0.4; p.stMax=0.4; p.tackleCd=insan?0.55:0.9;
  const o=ball.owner;
  if(insan){ const dx=ball.x-p.x, dy=ball.y-p.y, dd=hyp(dx,dy)||1; if(dd<3){ p.face=Math.atan2(dy,dx); p.vx+=dx/dd*3; p.vy+=dy/dd*3; } }   // topa doğru atıl
  if(o && o.team!==p.team && hyp(ball.x-p.x,ball.y-p.y)<(insan?2.2:1.6)){
    const tx=p.x-o.x, ty=p.y-o.y, dd=hyp(tx,ty)||1;
    const behind=(Math.cos(o.face)*tx+Math.sin(o.face)*ty)/dd < -0.35;
    let ps=0.48+skill(p)*0.3-skill(o)*0.25+(p.team.human?0.26:ai(p.team).tack*0.12+G.skillBonus);
    if(o.holdHands) return;
    if(behind) ps-=0.3;
    if(Math.random()<ps){
      o.state='stumble'; o.st=0.45; o.stMax=0.45;
      if(Math.random()<(insan?0.85:0.55)){ ball.owner=null; gain(p); }
      else { ball.owner=null; const a=p.face+rnd(-0.6,0.6); ball.vx=Math.cos(a)*rnd(3,6); ball.vy=Math.sin(a)*rnd(3,6);
        ball.lastTouch=p.team.side; ball.lastPlayer=p; ball.ignore=p; ball.ignoreT=0.15; ball.passTarget=null; clearOffside(); }
      noiseBurst(0.05,280,0.2,1);
    }else if(oto) {}
    else if(behind && Math.random()<0.6) foul(p,o,0);
    else if(Math.random()<(insan?0.10:0.16)) foul(p,o,0);
  }else if(!ball.owner && ball.z<0.8 && hyp(ball.x-p.x,ball.y-p.y)<(insan?2.1:1.4)){ gain(p); }
}
function slideTackle(p){
  p.state='slide'; p.st=0.8; p.stMax=0.8; p.slideHit=false; p.tackleCd=1.4;
  const v=Math.max(7.5,hyp(p.vx,p.vy)+2);
  p.vx=Math.cos(p.face)*v; p.vy=Math.sin(p.face)*v;
}
function slideUpdate(p){
  if(p.slideHit || p.st<0.12) return;
  const fx=p.x+Math.cos(p.face)*0.75, fy=p.y+Math.sin(p.face)*0.75;
  if(ball.z<0.5 && ball.owner!==p && hyp(ball.x-fx,ball.y-fy)<0.95 && !(ball.owner&&ball.owner.holdHands)){
    p.slideHit=true; const o=ball.owner;
    if(o && o.team!==p.team){ o.state='stumble'; o.st=0.5; o.stMax=0.5; }
    ball.owner=null;
    if(touchBy(p)) return;
    const a=p.face+rnd(-0.5,0.5);
    ball.vx=Math.cos(a)*rnd(4,9); ball.vy=Math.sin(a)*rnd(4,9); ball.vz=rnd(0,1.5); ball.z=Math.max(ball.z,0.02);
    ball.lastTouch=p.team.side; ball.lastPlayer=p; ball.ignore=p; ball.ignoreT=0.5; ball.passTarget=null; ball.isShot=false;
    noiseBurst(0.06,260,0.22,1);
    return;
  }
  for(const o of opp(p.team).players){
    if(o.state==='fall'||o.isGK&&o.holdHands) continue;
    if(hyp(o.x-fx,o.y-fy)<0.8){
      const tx=p.x-o.x, ty=p.y-o.y, dd=hyp(tx,ty)||1;
      const behind=(Math.cos(o.face)*tx+Math.sin(o.face)*ty)/dd < -0.3;
      p.slideHit=true; foul(p,o,behind?2:1); return;
    }
  }
}

/* ============================ YAPAY ZEKÂ ============================ */
const TC=[{},{}];
function teamCtx(){
  const poss = ball.owner ? ball.owner.team.side : (ball.passTarget ? ball.passTarget.team.side : -1);
  for(const t of G.teams){
    const C={att:poss===t.side, loose:poss===-1, chaser:null, press1:null, press2:null};
    if(poss===-1 || (poss!==t.side && !ball.owner)){
      let best=null,bt=1e9;
      for(const p of t.players){
        if(busy(p)) continue;
        if(p.isGK && !inBoxOf(t,ball.x,ball.y)) continue;
        const ic=intercept(p); p.ic=ic;
        if(ic.t<bt){bt=ic.t;best=p;}
      }
      const hc=G.ctrl[t.side];
      if(!(t.human && best===hc)) C.chaser=best;
      if(t.human && best===hc){ // ikinci adam
        C.chaser=null;
      }
    }else if(poss===t.side && ball.passTarget && ball.passTarget.team===t){
      C.chaser=ball.passTarget; ball.passTarget.ic=intercept(ball.passTarget);
    }
    if(ball.owner && ball.owner.team!==t){
      const o=ball.owner;
      const list=t.players.filter(p=>!p.isGK && !busy(p) && p!==G.ctrl[t.side]).sort((a,b)=>hyp(a.x-o.x,a.y-o.y)-hyp(b.x-o.x,b.y-o.y));
      const hc=G.ctrl[t.side];
      if(t.human){
        if(G.pressCall[t.side] || !hc || hyp(hc.x-o.x,hc.y-o.y)>14) C.press1=list[0]||null;
      }else{
        C.press1=list[0]||null;
        if(fxOf(t,o.x)<0.42 || G.diff===2) C.press2=list[1]||null;
      }
    }
    TC[t.side]=C;
  }
}
function offLine(t){ const fs=opp(t).players.map(q=>fxOf(t,q.x)).sort((a,b)=>b-a); return Math.max(fs[1]||0.5, fxOf(t,ball.x), 0.5); }
function shapeTarget(p,att){
  const t=p.team, bf=fxOf(t,ball.x), by=ball.y/FWD;
  if(p.isGK) return {x:wx(t,0.012), y:clamp(CY+(ball.y-CY)*0.08,CY-2.5,CY+2.5)};
  let fx=p.fx+(bf-0.5)*0.62+(att?0.08:-0.05);
  if(p.role==='DF') fx=clamp(fx,0.06,att?0.58:0.42);
  else if(p.role==='MF') fx=clamp(fx,0.14,att?0.8:0.6);
  else fx=clamp(fx,0.3,0.92);
  if(!att && p.role!=='FW') fx=Math.min(fx,Math.max(0.06,bf-(p.role==='DF'?0.06:0.0)));
  let fy=p.fy+(by-0.5)*(att?0.22:0.42);
  if(att){ fx+=p.run.x; fy+=p.run.y; }
  if(att && p.role!=='DF'){ const ol=offLine(t); fx=Math.min(fx,ol-0.008); }
  return {x:wx(t,clamp(fx,0.03,0.97)), y:clamp(fy,0.04,0.96)*FWD};
}
function nearestOppDist(p){ let b=1e9; for(const o of opp(p.team).players){ const d=hyp(o.x-p.x,o.y-p.y); if(d<b)b=d; } return b; }
function laneMin(ax,ay,bx,by,list){
  let m=1e9; const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy||1;
  for(const o of list){ let u=((o.x-ax)*dx+(o.y-ay)*dy)/L; u=clamp(u,0,1); const d=hyp(ax+dx*u-o.x,ay+dy*u-o.y); if(d<m)m=d; }
  return m;
}
function bestPass(p,maxD){
  const t=p.team, os=opp(t).players; let best=null,bs=-1e9;
  for(const q of t.players){
    if(q===p||busy(q)) continue;
    const d=hyp(q.x-p.x,q.y-p.y); if(d<5||d>(maxD||36)) continue;
    const lane=laneMin(ball.x,ball.y,q.x,q.y,os); if(lane<1.4) continue;
    const prog=(fxOf(t,q.x)-fxOf(t,p.x))*FL;
    let open=1e9; for(const o of os){ const e=hyp(o.x-q.x,o.y-q.y); if(e<open)open=e; }
    let s=prog*0.85+Math.min(open,9)*1.3+Math.min(lane,6)*1.1-d*0.1;
    if(q.isGK) s-=38;
    if(G.offside && fxOf(t,q.x)>offLine(t)) s-=40;
    let through=false;
    if((q.role==='FW'||q.role==='MF') && prog>4){
      const ax=q.x+t.dir*6, ay=q.y; let free=1e9; for(const o of os){ const e=hyp(o.x-ax,o.y-ay); if(e<free)free=e; }
      if(free>4.5 && fxOf(t,ax)<0.97){ through=true; s+=4; }
    }
    if(s>bs){bs=s;best={q,s,through};}
  }
  return best;
}
function mateInDir(p,ang,maxD){
  let best=null,bs=1e9;
  for(const q of p.team.players){
    if(q===p||busy(q)) continue;
    const dx=q.x-ball.x, dy=q.y-ball.y, d=hyp(dx,dy); if(d<2||d>(maxD||45)) continue;
    const ad=Math.abs(angDiff(Math.atan2(dy,dx),ang)); if(ad>1.0) continue;
    const s=ad*22+d*0.35+(q.isGK?30:0);
    if(s<bs){bs=s;best=q;}
  }
  return best;
}
function aiCarrier(p,dt){
  const t=p.team, gx=goalXOf(t);
  const dG=hyp(gx-p.x,CY-p.y), pr=nearestOppDist(p);
  p.holdT+=dt; p.decT-=dt;
  if(p.decT<=0){
    p.decT=ai(t).dec*rnd(0.7,1.3);
    if(dG<32 && Math.abs(p.y-CY)<22){
      const gk=gkOf(opp(t));
      const lane=laneMin(ball.x,ball.y,gx,CY,opp(t).players.filter(o=>o!==gk));
      let ps=dG<16?0.95:dG<22?0.72:dG<28?0.38:0.14; if(lane<1.2) ps*=0.5;
      if(Math.random()<ps){ doShoot(p,clamp(0.55+dG/40,0.55,0.95),null); return; }
    }
    // kendi yarısında sıkışınca uzaklaştır
    if(fxOf(t,p.x)<0.33 && pr<2.8 && Math.random()<0.5){ const a=(t.dir>0?0:Math.PI)+(p.y<CY?-1:1)*rnd(0.6,1.25); const v=rnd(16,22); kick(p,Math.cos(a)*v,Math.sin(a)*v,rnd(5,8),{}); return; }
    if(crossZone(p) && Math.random()<0.5){ doCross(p,null,false); return; }
    const bp=bestPass(p);
    const want= pr<3 ? 0.7 : (p.holdT>2.6?0.6:0.16);
    if(fxOf(t,p.x)>0.72 && pr>2.2 && Math.random()<0.5){ p.decT*=0.6; }
    else
    if(bp && (bp.s>3 || pr<2.4) && Math.random()<want){ passTo(p,bp.q,bp.through); return; }
  }
  // sür
  let tx=gx-t.dir*9, ty=lerp(p.y,CY,0.3);
  let ax=tx-p.x, ay=ty-p.y; const L=hyp(ax,ay)||1; ax/=L; ay/=L;
  for(const o of opp(t).players){ const dx=p.x-o.x, dy=p.y-o.y, d=hyp(dx,dy); if(d<6 && d>0.01){ const k=(6-d)/6*1.4; ax+=dx/d*k; ay+=dy/d*k; } }
  if(p.y<4) ay+=0.8; if(p.y>FWD-4) ay-=0.8;
  if(ax*t.dir<0.15) ax=0.15*t.dir;
  const m=hyp(ax,ay)||1; const sp=pMax(p,pr>5);
  accel(p,ax/m*sp,ay/m*sp,dt);
}
function pressBall(p,dt){
  const o=ball.owner, t=p.team, gx=ownGoalX(t);
  const dx=gx-o.x, dy=CY-o.y, d=hyp(dx,dy)||1;
  const tx=o.x+dx/d*0.9, ty=o.y+dy/d*0.9;
  steer(p,tx,ty,pMax(p,true),dt,false);
  const dd=hyp(o.x-p.x,o.y-p.y);
  if(p.tackleCd>0 || o.holdHands) return;
  const rate=(t.human?0.55:ai(t).tack)*(1+G.skillBonus);
  if(dd<1.5 && Math.random()<rate*0.95*dt) standTackle(p);
  else if(dd>1.8 && dd<3.6 && Math.random()<rate*0.22*dt*(inBoxOf(t,o.x,o.y)?0.15:1) && fxOf(t,o.x)<0.6) { p.face=Math.atan2(o.y-p.y,o.x-p.x); slideTackle(p); }
}
function defendTarget(p){
  let T=shapeTarget(p,false);
  if(p.role==='FW') return T;
  const t=p.team, gx=ownGoalX(t);
  let best=null,bd=9;
  for(const o of opp(t).players){ if(o.isGK) continue; const d=hyp(o.x-T.x,o.y-T.y); if(d<bd){bd=d;best=o;} }
  if(best){ const dx=gx-best.x, dy=CY-best.y, d=hyp(dx,dy)||1; T={x:lerp(T.x,best.x+dx/d*1.6,0.7), y:lerp(T.y,best.y+dy/d*1.6,0.7)}; }
  return T;
}
function aiStep(p,dt){
  if(busy(p)) return;
  if(p.isGK) return aiGK(p,dt);
  if(ball.owner===p) return aiCarrier(p,dt);
  const t=p.team, C=TC[t.side];
  if(C.chaser===p){ const ic=p.ic||intercept(p); steer(p,ic.x,ic.y,pMax(p,true),dt,false); return; }
  if(ball.owner && ball.owner.team!==t && (C.press1===p||C.press2===p)){ pressBall(p,dt); return; }
  const T = C.att ? shapeTarget(p,true) : defendTarget(p);
  const d=hyp(T.x-p.x,T.y-p.y);
  steer(p,T.x,T.y,pMax(p,d>8),dt,true);
}
function aiGK(p,dt){
  const t=p.team, gx=ownGoalX(t), dir=t.dir;
  if(ball.owner===p){
    p.gkHold+=dt; p.vx*=0.85; p.vy*=0.85; p.face=dir>0?0:Math.PI;
    if(p.gkHold>0.9) gkDistribute(p);
    return;
  }
  if(!ball.owner && ball.vx*dir<-2){
    const tc=(gx-ball.x)/ball.vx;
    if(tc>0 && tc<1.4){
      const yc=ball.y+ball.vy*tc;
      if(Math.abs(yc-CY)<GW/2+1.2){
        const ty=clamp(yc,CY-GW/2-0.2,CY+GW/2+0.2);
        if(Math.abs(ty-p.y)>1.1 && tc<0.6 && ball.isShot){ startDive(p,ty,tc); return; }
        steer(p,gx+dir*0.6,ty,pMax(p,true)*1.1,dt,true); return;
      }
    }
  }
  if(!ball.owner && inBoxOf(t,ball.x,ball.y) && TC[t.side].chaser===p && ball.z<2.4){ const ic=p.ic||intercept(p); steer(p,ic.x,ic.y,pMax(p,true),dt,false); return; }
  const dB=hyp(ball.x-gx,ball.y-CY), k=clamp(dB*0.07,0.6,4.5), ang=Math.atan2(ball.y-CY,ball.x-gx);
  const tx=gx+Math.cos(ang)*k, ty=clamp(CY+Math.sin(ang)*k*0.9,CY-GW/2+0.3,CY+GW/2-0.3);
  steer(p,tx,ty,pMax(p,false),dt,true);
}
function startDive(p,ty,tc){
  p.state='dive'; p.st=0.95; p.stMax=0.95; p.diveDir=Math.sign(ty-p.y)||1;
  const v=clamp(Math.abs(ty-p.y)/Math.max(tc,0.28),3,7.5);
  p.vx=0; p.vy=p.diveDir*v; p.face=p.team.dir>0?0:Math.PI;
}
function gkDistribute(p){
  p.holdHands=false; p.gkHold=0;
  const t=p.team;
  const bp=bestPass(p,32);
  if(bp && bp.s>-2 && Math.random()<0.8){ passTo(p,bp.q,false); return; }
  let tgt=null,bs=-1e9;
  for(const q of t.players){ if(q.isGK) continue; const s=fxOf(t,q.x)*30+Math.min(nearestOppDist(q),8)*2; if(s>bs){bs=s;tgt=q;} }
  if(tgt) lobTo(p,tgt.x+t.dir*3,tgt.y,tgt,2.1,true);
}

/* ============================ HAREKET ============================ */
function accel(p,dvx,dvy,dt){ const k=Math.min(1,dt*7); p.vx+=(dvx-p.vx)*k; p.vy+=(dvy-p.vy)*k; }
function steer(p,tx,ty,maxSp,dt,arrive){
  const dx=tx-p.x, dy=ty-p.y, d=hyp(dx,dy);
  let sp=maxSp; if(arrive && d<2.5) sp=maxSp*d/2.5;
  accel(p, d>0.05?dx/d*sp:0, d>0.05?dy/d*sp:0, dt);
}
function movePlayer(p,dt){
  if(p.state==='slide'||p.state==='dive'){ const k=Math.pow(p.state==='slide'?0.25:0.4,dt); p.vx*=k; p.vy*=k; }
  if(p.state==='fall'||p.state==='stumble'||p.state==='throw'){ const k=Math.pow(0.02,dt); p.vx*=k; p.vy*=k; }
  if(p.holdHands){ p.vx*=0.9; p.vy*=0.9; }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const s=hyp(p.vx,p.vy);
  if(p.state===''||p.state==='jump'||p.state==='celebrate'){
    let fa=null;
    if(s>0.5) fa=Math.atan2(p.vy,p.vx);
    else if(!p.isRef && ball.owner!==p) fa=Math.atan2(ball.y-p.y,ball.x-p.x);
    if(fa!=null) p.face+=angDiff(fa,p.face)*Math.min(1,dt*(s>0.5?9:4));
  }
  p.anim+=dt*(s*1.25+(s>0.4?2.2:0));
  p.x=clamp(p.x,-3,FL+3); p.y=clamp(p.y,-3,FWD+3);
  if(p.state==='jump'){ const k=1-p.st/(p.stMax||0.6); p.jz=Math.sin(Math.PI*clamp(k,0,1))*0.55; } else p.jz=0;
}
function separate(){
  const all=G.players;
  for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j]; if(a.state==='fall'||b.state==='fall') continue;
    let dx=b.x-a.x, dy=b.y-a.y; const d=hyp(dx,dy);
    if(d<0.7 && d>0.001){ const o=(0.7-d)/2; dx/=d; dy/=d; a.x-=dx*o; a.y-=dy*o; b.x+=dx*o; b.y+=dy*o; }
  }
}
function timers(p,dt){
  p.kickT=Math.max(0,p.kickT-dt); p.tackleCd=Math.max(0,p.tackleCd-dt); p.receiving=Math.max(0,p.receiving-dt);
  if(p.state){ p.st-=dt; if(p.state==='slide') slideUpdate(p); if(p.st<=0){ p.state=''; p.jz=0; } }
  p.run.t-=dt; if(p.run.t<=0){ p.run.t=rnd(2,4.5); p.run.x=(p.role==='FW'?rnd(-0.02,0.07):rnd(-0.03,0.04)); p.run.y=rnd(-0.06,0.06); }
}

/* ============================ İNSAN KONTROLÜ ============================ */
function humanStep(side,dt){
  const t=G.teams[side], I=IN[side];
  let p=G.ctrl[side];
  if(!p){ autoSwitch(side,true); p=G.ctrl[side]; if(!p) return; }
  const mag=hyp(I.ax,I.ay); const wxs=I.ax, wys=-I.ay;
  const hasBall=ball.owner===p;
  if(!busy(p)){
    if(mag>0.12){
      const sprint=I.D && p.stam>0.05; const sp=pMax(p,sprint)*Math.min(1,mag*1.15);
      accel(p,wxs/mag*sp,wys/mag*sp,dt);
      if(sprint) p.stam=Math.max(0,p.stam-dt*0.11);
    }else if(ball.passTarget===p){ const ic=intercept(p); steer(p,ic.x,ic.y,pMax(p,true),dt,false); }
    else if(!ball.owner && ball.z<1.2 && hyp(ball.x-p.x,ball.y-p.y)<7){ const ic=intercept(p); steer(p,ic.x,ic.y,pMax(p,false),dt,false); }   // boştaki topa kendiliğinden git
    else accel(p,0,0,dt);
    // mıknatıs: boştaki top çok yakındaysa oyuncuyu topa doğru çek
    if(!ball.owner && ball.z<1 && !p.isGK){ const dx=ball.x-p.x, dy=ball.y-p.y, dd=hyp(dx,dy); if(dd>0.2 && dd<2.2){ p.vx+=dx/dd*dt*14; p.vy+=dy/dd*dt*14; } }
  }
  if(p.isGK && hasBall){ if(I.Ae||I.Ce||I.Be||p.gkHold>2.5) gkDistribute(p); else p.gkHold+=dt; return; }
  const dirA = mag>0.3 ? Math.atan2(wys,wxs) : p.face;
  if(hasBall){
    if(I.Ae){ const q=mateInDir(p,dirA,40); if(q){ const thr = (q.role!=='DF') && fxOf(t,q.x)>fxOf(t,p.x)+0.05; passTo(p,q,false&&thr); } else { const v=passSpeed(16,3); kick(p,Math.cos(dirA)*v,Math.sin(dirA)*v,0,{pass:true}); } return; }
    if(I.Ce){
      if(crossZone(p)) { doCross(p, Math.abs(I.ay)>0.35 ? CY-I.ay*8 : null, false); }
      else { const q=mateInDir(p,dirA,48)||bestPass(p,48)?.q; if(q) passTo(p,q,true); else { const v=passSpeed(24,5); kick(p,Math.cos(dirA)*v,Math.sin(dirA)*v,0,{pass:true}); } }
      return;
    }
    if(I.B){ I.Bt+=dt; p.charge=Math.min(1,I.Bt/0.9); if(I.Bt>1.0){ I.B=false; I.Bup=true; } }
    if(I.Bup){ const pw=clamp(0.45+I.Bt*0.6,0.45,1); I.Bt=0; p.charge=0;
      const aimY = Math.abs(I.ay)>0.3 ? CY-clamp(I.ay,-1,1)*3.2 : null;
      doShoot(p,pw,aimY); return; }
  }else{
    p.charge=0;
    if(I.Ae){ switchPlayer(side); return; }
    if(I.Be){
      if(!ball.owner && ball.z>1.0 && hyp(ball.x-p.x,ball.y-p.y)<2.5){ if(!p.state){ p.state='jump'; p.st=0.6; p.stMax=0.6; } }
      else if(p.tackleCd<=0){ if(I.D) slideTackle(p); else standTackle(p); }
    }
    // otomatik top kapma: rakibin önündeysen ve çok yakınsan tuşa basmadan da dener (faul çıkmaz)
    const o=ball.owner;
    if(o && o.team!==t && !o.isGK && !busy(p) && p.tackleCd<=0 && hyp(o.x-p.x,o.y-p.y)<1.25){
      const tx=p.x-o.x, ty=p.y-o.y, dd=hyp(tx,ty)||1;
      if((Math.cos(o.face)*tx+Math.sin(o.face)*ty)/dd > -0.2){ standTackle(p,true); p.tackleCd=1.1; }
    }
    G.pressCall[side]=I.C;
  }
}
function switchPlayer(side){
  const t=G.teams[side], cur=G.ctrl[side];
  const tgt=ball.owner?{x:ball.owner.x,y:ball.owner.y}:ball;
  const list=t.players.filter(p=>!p.isGK && p!==cur && !busy(p)).sort((a,b)=>hyp(a.x-tgt.x,a.y-tgt.y)-hyp(b.x-tgt.x,b.y-tgt.y));
  if(list[0]) G.ctrl[side]=list[0];
}
function autoSwitch(side,force){
  const t=G.teams[side]; const cur=G.ctrl[side];
  if(ball.owner && ball.owner.team===t){ if(!ball.owner.isGK) G.ctrl[side]=ball.owner; return; }
  if(ball.passTarget && ball.passTarget.team===t && !ball.passTarget.isGK){ G.ctrl[side]=ball.passTarget; return; }
  const tgt=ball.owner?ball.owner:ball;
  let best=null,bd=1e9;
  for(const p of t.players){ if(p.isGK||busy(p)) continue; const d=hyp(p.x-tgt.x,p.y-tgt.y); if(d<bd){bd=d;best=p;} }
  if(!best) return;
  if(force || !cur || (cur!==best && hyp(cur.x-tgt.x,cur.y-tgt.y)>bd+6)) G.ctrl[side]=best;
}

/* ============================ KURALLAR ============================ */
function rules(){
  if(G.phase!=='play') return;
  const bx=ball.x, by=ball.y;
  if(bx<0 || bx>FL){
    const gl=bx<0?0:FL; const def=G.teams.find(t=>ownGoalX(t)===gl);
    if(Math.abs(by-CY)<GW/2 && ball.z<GH && !ball.owner){ scoreGoal(1-def.side); return; }
    if(bx<-0.15 || bx>FL+0.15 || ball.owner){
      if(ball.owner){ ball.lastTouch=ball.owner.team.side; ball.owner=null; }
      if(Math.abs(by-CY)<GW/2 && ball.z<GH){ scoreGoal(1-def.side); return; }
      const cy=by<CY?0.4:FWD-0.4;
      if(ball.lastTouch===def.side){ whistle(1); banner('KÖŞE VURUŞU', opp(def).name, '#ffffff', 1.6); setupSet('korner',1-def.side,gl===0?0.4:FL-0.4,cy); }
      else { whistle(1); banner('KALE VURUŞU', def.name, '#ffffff', 1.4); setupSet('kale',def.side,gl===0?SIX_D:FL-SIX_D,by<CY?CY-4.5:CY+4.5); }
      return;
    }
  }
  if(by<-0.15 || by>FWD+0.15){
    if(ball.owner){ ball.lastTouch=ball.owner.team.side; ball.owner=null; }
    const side=1-ball.lastTouch;
    whistle(1); banner('TAÇ', G.teams[side].name, '#ffffff', 1.2);
    setupSet('tac',side,clamp(bx,1,FL-1),by<0?0:FWD);
  }
}
function scoreGoal(side){
  G.score[side]++; G.phase='goal'; G.goalT=4.6;
  const sc=ball.lastPlayer; const own=sc && sc.team.side!==side;
  G.scorer={p:sc&&!own?sc:null, own, side, min:oyunDakika(), name:sc?sc.name:''};
  ball.owner=null;
  banner('GOL!', (own?'Kendi kalesine · ':'')+(sc?sc.name:'')+'  '+oyunDakika()+"'", G.teams[side].kit.shirt, 4.0, true);
  if(sc && !own){ sc.state='celebrate'; sc.st=4.6; sc.stMax=4.6; }
  crowdCheer(); whistle(1);
  for(const p of G.players) p.off=false;
}
function oyunDakika(){ return Math.min(90,Math.floor(G.clock/G.matchLen*90)+1); }

/* ============================ DURAN TOPLAR ============================ */
function setupSet(type,side,x,y,extra){
  extra=extra||{};
  const A=G.teams[side], D=opp(A);
  const gx=goalXOf(A);
  if(type==='penalti'){ x=gx-A.dir*PEN_D; y=CY; }
  const S={type,side,x,y,t:0,prep:extra.prep||(type==='kickoff'?1.4:1.6),taker:null,wait:0,snapped:false,indirect:!!extra.indirect,gkChoice:0,aim:0};
  G.set=S; G.phase='set';
  ball.owner=null; ball.x=x; ball.y=y; ball.z=0; ball.vx=ball.vy=ball.vz=0; ball.passTarget=null; ball.isShot=false; ball.spin=0; ball.ignore=null; ball.gkTried=null;
  clearOffside();
  processSendOffs();
  // vuruşu kullanan
  let tk=null; const field=A.players.filter(p=>!p.isGK);
  const near=(px,py)=>field.slice().sort((a,b)=>hyp(a.x-px,a.y-py)-hyp(b.x-px,b.y-py))[0];
  if(type==='kale') tk=gkOf(A);
  else if(type==='penalti') tk=A.players.find(p=>p.num===9)||A.players.find(p=>p.num===10)||field[field.length-1];
  else if(type==='kickoff') tk=A.players.find(p=>p.num===9)||field[field.length-1];
  else if(type==='frikik' && Math.hypot(gx-x,CY-y)<32) tk=A.players.find(p=>p.num===10)||near(x,y);
  else if(type==='korner') tk=A.players.find(p=>p.num===(y<CY===(A.dir>0)?11:7))||near(x,y);
  else tk=near(x,y);
  if(!tk || tk.sendOff) tk=near(x,y);
  S.taker=tk;
  // konumlar
  for(const p of G.players) p.setT=shapeTarget(p,p.team===A);
  const aimG={x:gx,y:CY};
  const awayFrom=(p,r)=>{ const dx=p.setT.x-x, dy=p.setT.y-y, d=hyp(dx,dy); if(d<r){ const a=d>0.01?Math.atan2(dy,dx):(p.team===A?Math.PI:0); p.setT={x:x+Math.cos(a)*r, y:y+Math.sin(a)*r}; } };
  if(type==='kickoff'){
    for(const p of G.players){ const t=p.team; let f=fxOf(t,p.setT.x); f=Math.min(f,0.48); p.setT={x:wx(t,f),y:p.setT.y}; if(t!==A) awayFrom(p,CIRC+0.5); }
    const mate=A.players.find(p=>p.num===10); if(mate) mate.setT={x:CX-A.dir*1.2,y:CY-7};
  }
  if(type==='korner'||(type==='frikik' && Math.abs(gx-x)<40 && hyp(gx-x,CY-y)>20)){
    const spots=[[6,-2.5],[7.5,3],[11,0.5],[9,-6.5],[13,5.5],[17,-1]];
    const side2 = y<CY?-1:1; // köşe tarafı
    const atk=A.players.filter(p=>!p.isGK && p!==tk).sort((a,b)=>({FW:0,MF:1,DF:2}[a.role]-{FW:0,MF:1,DF:2}[b.role]));
    const inBox=atk.slice(0, type==='korner'?6:5);
    inBox.forEach((p,i)=>{ const s=spots[i]; p.setT={x:gx-A.dir*s[0], y:CY+s[1]*side2*-1+rnd(-0.8,0.8)}; });
    atk.slice(inBox.length).forEach((p,i)=>{ p.setT={x:i<2? CX-A.dir*rnd(0,6) : gx-A.dir*24, y: i<2? CY+(i?10:-10): CY+rnd(-6,6)}; });
    const defs=D.players.filter(p=>!p.isGK);
    const used=new Set();
    for(const a of inBox){ let b=null,bd=1e9; for(const d of defs){ if(used.has(d))continue; const e=hyp(d.x-a.setT.x,d.y-a.setT.y); if(e<bd){bd=e;b=d;} }
      if(b){ used.add(b); const dx=gx-a.setT.x, dy=CY-a.setT.y, dd=hyp(dx,dy)||1; b.setT={x:a.setT.x+dx/dd*1.0, y:a.setT.y+dy/dd*1.0}; } }
    const rest=defs.filter(d=>!used.has(d));
    rest.forEach((d,i)=>{ if(i===0 && type==='korner') d.setT={x:gx-A.dir*0.7,y:CY+side2*3.2};
      else if(i===rest.length-1) d.setT={x:CX-A.dir*2,y:CY+rnd(-8,8)};
      else d.setT={x:gx-A.dir*rnd(10,15),y:CY+rnd(-9,9)}; });
  }
  if(type==='frikik'){
    const dG=hyp(gx-x,CY-y);
    if(dG<34){
      const n=dG<22?4:3; const ux=(gx-x)/dG, uy=(CY-y)/dG;
      const wcx=x+ux*CIRC, wcy=y+uy*CIRC;
      const defs=D.players.filter(p=>!p.isGK).sort((a,b)=>hyp(a.x-wcx,a.y-wcy)-hyp(b.x-wcx,b.y-wcy)).slice(0,n);
      defs.forEach((p,i)=>{ const o=(i-(n-1)/2)*0.62 + (y<CY?0.6:-0.6)*A.dir*0; p.setT={x:wcx-uy*o, y:wcy+ux*o}; p.wall=true; });
    }
    if(dG<40){ // ceza sahasına hazırlık (savunma kaleye çekilir)
      for(const p of D.players){ if(p.isGK||p.wall) continue; if(p.setT && Math.abs(p.setT.x-gx)>20){ p.setT={x:gx-A.dir*rnd(8,16),y:CY+rnd(-10,10)}; } }
    }
  }
  if(type==='penalti'){
    let i=0;
    for(const p of G.players){ if(p===tk||p.isGK&&p.team===D) continue;
      if(p.isGK){ p.setT={x:ownGoalX(p.team)+p.team.dir*2,y:CY}; continue; }
      const k=i++; p.setT={x:gx-A.dir*(BOX_D+2.5+(k%3)*2), y:CY+((k*7)%26)-13}; }
  }
  if(type==='kale'){
    for(const p of D.players){ if(Math.abs(p.setT.x-ownGoalX(A))<BOX_D+1) p.setT={x:ownGoalX(A)+A.dir*(BOX_D+rnd(2,6)),y:p.setT.y}; }
  }
  if(type==='tac'){
    const inward=y<CY?1:-1;
    const mates=A.players.filter(p=>!p.isGK&&p!==tk).sort((a,b)=>hyp(a.x-x,a.y-y)-hyp(b.x-x,b.y-y)).slice(0,2);
    if(mates[0]) mates[0].setT={x:clamp(x+A.dir*7,2,FL-2),y:y+inward*9};
    if(mates[1]) mates[1].setT={x:clamp(x-A.dir*5,2,FL-2),y:y+inward*6};
  }

    if(p.team===D && type!=='tac') awayFrom(p, CIRC);
    else if(p.team===D) awayFrom(p,2.5);
    p.setT.x=clamp(p.setT.x,-1,FL+1); p.setT.y=clamp(p.setT.y,0.5,FWD-0.5);
  }
  // vuruşçu topun arkasında
  let back=0.9;
  if(type==='tac') back=0.05;
  let ang = type==='penalti'||type==='frikik' ? Math.atan2(CY-y,gx-x) : Math.atan2(CY-y, lerp(x,gx,0.25)-x);
  if(type==='korner') ang=Math.atan2(CY-y,(gx-A.dir*11)-x);
  if(type==='kickoff') ang=A.dir>0?Math.PI*0.9:Math.PI*0.1-0;
  if(type==='kickoff') ang = Math.atan2(-7, -A.dir*1.2);
  S.ang=ang;
  tk.setT={x:x-Math.cos(ang)*(type==='penalti'?1.6:back), y:y-Math.sin(ang)*(type==='penalti'?1.6:back)};
  if(type==='tac') tk.setT={x:x,y:y<CY?-0.3:FWD+0.3};
  if(type==='penalti'){ const gk=gkOf(D); if(gk) gk.setT={x:gx-A.dir*0.2,y:CY}; }
  for(const p of G.players){ if(p.state!=='fall'){ p.state=''; } p.wall=p.wall&&type==='frikik'; }
  // kontrol
  for(const t of G.teams){ if(!t.human) continue;
    if(t===A) G.ctrl[t.side]=tk.isGK? (type==='kale'?tk:G.ctrl[t.side]) : tk;
    else { let b=null,bd=1e9; for(const p of t.players){ if(p.isGK)continue; const d=hyp(p.setT.x-x,p.setT.y-y); if(d<bd){bd=d;b=p;} } G.ctrl[t.side]=b; }
  }
  if(type==='kale' && A.human) G.ctrl[A.side]=tk;
}
function setStep(dt){
  const S=G.set; S.t+=dt;
  const A=G.teams[S.side], D=opp(A);
  for(const p of G.players){
    if(!p.setT) continue;
    if(p.state==='fall'){ continue; }
    const d=hyp(p.setT.x-p.x,p.setT.y-p.y);
    steer(p,p.setT.x,p.setT.y,S.snapped?2:Math.max(5,Math.min(11,d/Math.max(0.3,S.prep-S.t))),dt,true);
    movePlayer(p,dt);
    if(S.snapped){ if(p===S.taker) p.face=S.ang; else if(!p.isGK || true) p.face+=angDiff(Math.atan2(ball.y-p.y,ball.x-p.x),p.face)*Math.min(1,dt*5); }
  }
  ball.x=S.x; ball.y=S.y; ball.z=0; ball.vx=ball.vy=ball.vz=0;
  if(S.type==='tac' && S.taker){ const p=S.taker; ball.x=p.x+Math.cos(S.ang)*0.15; ball.y=p.y+Math.sin(S.ang)*0.15; ball.z=2.15; p.state='throw'; p.st=99; }
  if(S.t>=S.prep && !S.snapped){
    S.snapped=true;
    for(const p of G.players){ if(p.setT && p.state!=='fall' && hyp(p.setT.x-p.x,p.setT.y-p.y)>1.2){ p.x=p.setT.x; p.y=p.setT.y; } p.vx=p.vy=0; }
    if(S.taker) S.taker.face=S.ang;
  }
  if(!S.snapped) return;
  S.wait+=dt;
  const gkSideHuman=D.human && S.type==='penalti';
  if(gkSideHuman){ const I=IN[D.side]; if(Math.abs(I.ay)>0.3) S.gkChoice=I.ay<0?1:-1; else if(Math.abs(I.ax)<0.3) S.gkChoice=S.gkChoice; }
  if(A.human){
    const I=IN[A.side];
    S.aim = Math.abs(I.ay)>0.25 ? -I.ay : 0;
    S.aimX=I.ax; S.aimY=I.ay;
    let act=null;
    if(I.Ae) act='pas'; else if(I.Ce) act='orta'; else if(I.Be) act='sut';
    if(!act && S.wait>14) act=aiSetChoice(S);
    if(act) execSet(act);
  }else if(S.wait>(S.type==='penalti'?1.8:(S.type==='kickoff'?0.6:1.0))){
    execSet(aiSetChoice(S));
  }
}
function aiSetChoice(S){
  const A=G.teams[S.side], gx=goalXOf(A), dG=hyp(gx-S.x,CY-S.y);
  switch(S.type){
    case 'korner': return Math.random()<0.85?'orta':'pas';
    case 'kale': return Math.random()<0.5?'orta':'pas';
    case 'frikik': if(!S.indirect && dG<30 && Math.abs(S.y-CY)<16 && Math.random()<0.7) return 'sut'; return dG<44?'orta':'pas';
    case 'penalti': return 'sut';
    default: return 'pas';
  }
}
function execSet(act){
  const S=G.set, p=S.taker, A=p.team, D=opp(A), gx=goalXOf(A);
  const I=A.human?IN[A.side]:null;
  const stickA = I && hyp(I.ax,I.ay)>0.3 ? Math.atan2(-I.ay,I.ax) : null;
  const aimS = I && Math.abs(I.ay)>0.25 ? clamp(-I.ay,-1,1) : null;
  G.phase='play'; G.set=null;
  if(p.state==='throw'){ p.state='throw'; p.st=0.35; p.stMax=0.35; }
  ball.owner=null; ball.x=S.x; ball.y=S.y; ball.z=S.type==='tac'?2.15:0;
  if(['tac','korner','kale'].includes(S.type)) G.noOffKick=true;
  const fallback=()=>{ const bp=bestPass(p,40); if(bp) passTo(p,bp.q,false); else { const a=S.ang; kick(p,Math.cos(a)*14,Math.sin(a)*14,0,{pass:true}); } };
  switch(S.type){
    case 'kickoff': { const q=stickA!=null?mateInDir(p,stickA,30):null; const m=q||A.players.find(x=>x.num===10)||A.players.find(x=>x.role==='MF'); passTo(p,m,false); break; }
    case 'tac': {
      let q=stickA!=null?mateInDir(p,stickA,act==='pas'?20:28):null;
      if(!q){ let best=null,bs=-1e9; for(const m of A.players){ if(m===p||m.isGK)continue; const d=hyp(m.x-p.x,m.y-p.y); if(d<4||d>(act==='pas'?18:26))continue; const s=Math.min(nearestOppDist(m),6)*2-d*0.2+fxOf(A,m.x)*6; if(s>bs){bs=s;best=m;} } q=best; }
      if(q) lobTo(p,q.x+q.vx*0.5,q.y+q.vy*0.5,q,act==='pas'?0.75:1.0,true);
      else { const a=Math.atan2((S.y<CY?8:-8),A.dir*6); lobTo(p,p.x+Math.cos(a)*10,p.y+Math.sin(a)*10,null,0.9,true); }
      break; }
    case 'korner':
      if(act==='pas'){ const q=A.players.filter(m=>m!==p&&!m.isGK).sort((a,b)=>hyp(a.x-p.x,a.y-p.y)-hyp(b.x-p.x,b.y-p.y))[0]; if(q && hyp(q.x-p.x,q.y-p.y)<20) passTo(p,q,false); else doCross(p,null,true); }
      else doCross(p, aimS!=null ? CY+aimS*7 : null, true);
      break;
    case 'kale':
      if(act==='pas'){ const q=A.players.filter(m=>m.role==='DF').sort((a,b)=>Math.min(nearestOppDist(b),10)-Math.min(nearestOppDist(a),10))[0]; if(q) passTo(p,q,false); else fallback(); }
      else { let q=stickA!=null?mateInDir(p,stickA,70):null; if(!q){ let bs=-1e9; for(const m of A.players){ if(m.isGK)continue; const s=fxOf(A,m.x)*20+Math.min(nearestOppDist(m),8)*2+(m.role==='FW'?4:0); if(s>bs){bs=s;q=m;} } }
        lobTo(p,q.x+A.dir*2,q.y,q,clamp(hyp(q.x-p.x,q.y-p.y)/22,1.4,2.4),true); }
      break;
    case 'frikik': {
      const dG=hyp(gx-S.x,CY-S.y);
      if(act==='sut' && !S.indirect && dG<40) doShoot(p,0.82,aimS!=null?CY+aimS*3.2:null,true);
      else if(act==='orta' || act==='sut') { if(dG<45) doCross(p,aimS!=null?CY+aimS*7:null,false); else { const q=stickA!=null?mateInDir(p,stickA,55):bestPass(p,55)?.q; if(q) lobTo(p,q.x,q.y,q,null,true); else fallback(); } }
      else { const q=stickA!=null?mateInDir(p,stickA,35):null; if(q) passTo(p,q,false); else fallback(); }
      break; }
    case 'penalti': {
      const gk=gkOf(D);
      let y = aimS!=null ? CY+aimS*3.1 : (Math.random()<0.12?CY+rnd(-0.5,0.5):CY+(Math.random()<0.5?-1:1)*rnd(1.7,3.1));
      const acc=clamp(shotAcc(p),0.3,1), sp=0.3*(1.25-acc*0.8);
      const ty=y+randn()*sp, v=rnd(19,24), d=hyp(gx-ball.x,ty-ball.y), tt=d/v;
      const hz=clamp(rnd(0.15,1.9)+randn()*0.25*(1.2-acc),0.05,3.2);
      const vz=(hz+0.5*GRAV*tt*tt)/tt, a=Math.atan2(ty-ball.y,gx-ball.x);
      kick(p,Math.cos(a)*v,Math.sin(a)*v,vz,{shot:true});
      if(gk){
        let g;
        if(D.human) g=S.gkChoice;
        else { const r=Math.random(); const smart=0.22+(ai(D).gk+G.skillBonus)*1.2; g = r<smart ? Math.sign(ty-CY) : (r<smart+0.08?0:(Math.random()<0.5?-1:1)); }
        if(g) startDive(gk,CY+g*2.9,0.45);
      }
      break; }
  }
  G.noOffKick=false;
  ball.ignore=p; ball.ignoreT=0.45;
  if(A.human && ball.passTarget) setCtrl(A.side,ball.passTarget);
}

/* ============================ HAKEM ============================ */
function refStep(dt){
  const r=G.ref; if(!r) return;
  let tx=ball.x-7, ty=clamp(ball.y+9,4,FWD-3);
  if(G.set){ tx=G.set.x+(G.set.x<CX?6:-6); ty=clamp(G.set.y+8,4,FWD-3); }
  const d=hyp(tx-r.x,ty-r.y);
  steer(r,tx,ty,d>10?7.5:5,dt,true);
  movePlayer(r,dt);
  if(r.cardT>0) r.cardT-=dt;
}

/* ============================ KAMERA ============================ */
function updateCam(dt){
  let tx=ball.x+ball.vx*0.3, ty=ball.y, tz=G.mode===2?58:47;
  if(G.phase==='set'&&G.set){ const t=G.set.type; if(t==='korner') tz=42; else if(t==='penalti') tz=34; else if(t==='frikik') tz=46;
    if(t==='penalti'||t==='frikik'){ const A=G.teams[G.set.side]; tx=lerp(G.set.x,goalXOf(A),0.45); } }
  if(G.phase==='goal' && G.scorer && G.scorer.p){ tx=G.scorer.p.x; ty=G.scorer.p.y; tz=26; }
  if(G.phase==='half'||G.phase==='end'){ tx=CX; ty=CY; tz=78; }
  tz*=clamp(W/1280,0.74,1);   // küçük ekranda (telefon) futbolcular daha yakından
  if(YAKIN && G.phase!=='half' && G.phase!=='end') tz*=0.6;   // yakın çekim
  cam.zoom+=(tz-cam.zoom)*Math.min(1,dt*1.4);
  const half=cam.zoom*0.4;

/* ============================ OYUN DÖNGÜSÜ ============================ */
function step(dt){
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0) G.banner=null; }
  if(G.cardShow){ G.cardShow.t-=dt; if(G.cardShow.t<=0) G.cardShow=null; }
  for(const p of G.players) timers(p,dt);
  if(G.phase==='set'){ setStep(dt); refStep(dt); updateCam(dt); clearEdges(); return; }
  if(G.phase==='goal'){ goalStep(dt); refStep(dt); updateCam(dt); clearEdges(); return; }
  if(G.phase==='half'){ G.halfT-=dt; for(const p of G.players){ accel(p,0,0,dt); movePlayer(p,dt);} updateCam(dt);
    if(G.halfT<=0){ for(const t of G.teams) t.dir*=-1; G.half=2; G.clock=G.matchLen/2; setupSet('kickoff',1-G.kickFirst,CX,CY); banner('İKİNCİ YARI','', '#ffd23f',1.8); }
    clearEdges(); return; }
  if(G.phase==='end'){ for(const p of G.players){ accel(p,0,0,dt); movePlayer(p,dt);} updateCam(dt); clearEdges(); return; }
  // oyun
  G.clock+=dt;
  if(G.half===1 && G.clock>=G.matchLen/2){ G.phase='half'; G.halfT=3.6; whistle(2); banner('İLK YARI SONA ERDİ', G.score[0]+' - '+G.score[1], '#ffd23f', 3.4); clearEdges(); return; }
  if(G.half===2 && G.clock>=G.matchLen){ G.phase='end'; whistle(3); crowdLevel(0.12); clearEdges(); return; }
  if(ball.owner && ball.owner.isGK){ const g=ball.owner; g.gkHold+=0; if((g._own=(g._own||0)+dt)>3.2){ g._own=0; gkDistribute(g); } } else if(G.players) for(const p of G.players) p._own=0;
  predictBall();
  for(const s of [0,1]) if(G.teams[s].human){ if(ball.owner&&ball.owner.team.side===s&&!ball.owner.isGK) G.ctrl[s]=ball.owner; else autoSwitch(s,false); }
  teamCtx();
  for(const s of [0,1]) if(G.teams[s].human){ humanStep(s,dt); if(G.phase!=='play'){ clearEdges(); return; } }
  for(const p of G.players.slice()){
    if(G.teams[p.team.side].human && G.ctrl[p.team.side]===p && !(p.isGK && ball.owner!==p)) continue;
    aiStep(p,dt);
    if(G.phase!=='play'){ clearEdges(); return; }
  }
  for(const p of G.players){ movePlayer(p,dt); if(hyp(p.vx,p.vy)<pMax(p,false)*0.8) p.stam=Math.min(1,p.stam+dt*0.05); }
  separate();
  ballStep(dt);
  airDuel();
  ballTouches();
  rules();
  refStep(dt);
  updateCam(dt);
  // tribün coşkusu: kaleye yaklaşınca
  const nearGoal=Math.min(ball.x,FL-ball.x)<22;
  crowdLevel(nearGoal?0.11:0.06);
  clearEdges();
}
function goalStep(dt){
  G.goalT-=dt;
  ballStep(dt);
  const sc=G.scorer&&G.scorer.p;
  for(const p of G.players){
    if(p===sc){ const fx=goalXOf(p.team)-p.team.dir*2, fy=p.y<CY?1.5:FWD-1.5; steer(p,fx,fy,pMax(p,true)*0.9,dt,true); }
    else if(sc && p.team===sc.team && !p.isGK){ steer(p,sc.x-p.team.dir*1.5,sc.y+(p.num%3-1)*1.2,pMax(p,true)*0.85,dt,true); if(hyp(p.x-sc.x,p.y-sc.y)<3 && !p.state){ p.state='celebrate'; p.st=3; p.stMax=3; } }
    else { const T=shapeTarget(p,false); steer(p,T.x,T.y,2.2,dt,true); }
    movePlayer(p,dt);
  }
  separate();
  if(G.goalT<=0){ for(const p of G.players) if(p.state==='celebrate') p.state='';
    if(G.phase==='goal') setupSet('kickoff',1-G.scorer.side,CX,CY); }
}
function banner(txt,sub,col,t,big){ if(G.banner && G.banner.big && !big && G.phase==='goal') return; G.banner={txt,sub,col:col||'#fff',t:t||1.5,T:t||1.5,big:!!big}; }

(function(){ const L=hyp(CAM_BACK,CAM_HGT); VW.fy=CAM_BACK/L; VW.fz=-CAM_HGT/L; VW.uy=CAM_HGT/L; VW.uz=CAM_BACK/L; VW.D=L; })();
function setupView(){

function P(x,y,z){

function poseJoints(p){
  const sp=Math.min(1,hyp(p.vx,p.vy)/7.5), ph=p.anim;
  const k=p.stMax?clamp(1-p.st/p.stMax,0,1):0;
  const H=p.h/1.8;
  let hipZ=(0.95+Math.abs(Math.sin(ph))*0.05*sp)*H;
  let lean=0.13*sp;
  const st=p.state;
  if(p.isGK && st==='' && ball.owner!==p && hyp(ball.x-p.x,ball.y-p.y)<30 && sp<0.4){ hipZ-=0.12; lean=0.1; }
  const J={};
  J.hipL=[0,0.11,hipZ]; J.hipR=[0,-0.11,hipZ];
  J.shL=[lean,0.2,hipZ+0.5*H]; J.shR=[lean,-0.2,hipZ+0.5*H];
  J.neck=[lean*1.1,0,hipZ+0.57*H]; J.head=[lean*1.15+0.02,0,hipZ+0.73*H];
  const legs=[['L',1,ph],['R',-1,ph+Math.PI]];
  for(const [n,sg,q] of legs){
    let th=Math.sin(q)*(0.12+0.78*sp);
    let bend=0.08+sp*(0.2+1.05*Math.max(0,Math.cos(q)));
    if(st==='tackle' && n==='R'){ th=1.0; bend=0.05; }
    if((p.kickT>0) && n==='R'){ const kk=1-p.kickT/0.32; th=lerp(-0.7,1.25,clamp(kk*1.6,0,1)); bend=kk<0.4?0.9:0.1; }
    if(st==='slide'){ th=n==='R'?1.45:1.1; bend=n==='R'?0:0.9; }
    if(st==='jump'){ th=n==='R'?0.2:-0.1; bend=0.6; }
    if(st==='throw'){ th=n==='R'?-0.25:0.2; bend=0.15; }
    const hip=J['hip'+n];
    const L1=0.46*H, L2=0.46*H;
    const knee=[hip[0]+Math.sin(th)*L1,hip[1],hip[2]-Math.cos(th)*L1];
    const ph2=th-bend;
    const ank=[knee[0]+Math.sin(ph2)*L2,knee[1],knee[2]-Math.cos(ph2)*L2];
    const toe=[ank[0]+0.17*Math.cos(ph2*0.4),ank[1],ank[2]-0.03];

  }

function press(pl,key,down){

}
function updateStick(id,x,y){
  const t=touches.get(id); if(!t||t.type!=='stick') return;
  let dx=x-t.ox, dy=y-t.oy; const m=hyp(dx,dy), r=t.s.r; const k=m>r?r/m:1;
  t.kx=dx*k; t.ky=dy*k;
  const n=Math.min(1,m/(r*0.8));
  IN[t.s.pl].ax=m>0?dx/m*n:0; IN[t.s.pl].ay=m>0?dy/m*n:0;
}

/* klavye: 1. oyuncu WASD + J(PAS) K(ŞUT) L(ARA PAS) Shift(KOŞ) · 2. oyuncu oklar + 1 2 3 0 */
const keys={};
const KMAP={KeyJ:[0,'A'],KeyK:[0,'B'],KeyL:[0,'C'],ShiftLeft:[0,'D'],Space:[0,'D'],
  Numpad1:[1,'A'],Numpad2:[1,'B'],Numpad3:[1,'C'],Numpad0:[1,'D'],Comma:[1,'A'],Period:[1,'B'],Slash:[1,'C'],ShiftRight:[1,'D']};
addEventListener('keydown',e=>{ if(keys[e.code]) return; keys[e.code]=true; const m=KMAP[e.code]; if(m){ e.preventDefault(); press(m[0],m[1],true);} if(e.code==='Escape'||e.code==='KeyP') pauseGame(); if(e.code==='KeyV' && G.phase!=='menu') kameraDegis(); });
addEventListener('keyup',e=>{ keys[e.code]=false; const m=KMAP[e.code]; if(m) press(m[0],m[1],false); });
function readKeys(){
  const k=keys;
  const ax=(k.KeyD?1:0)-(k.KeyA?1:0), ay=(k.KeyS?1:0)-(k.KeyW?1:0);
  let st0=false; for(const t of touches.values()) if(t.type==='stick'&&t.s.pl===0) st0=true;
  if(!st0){ const m=hyp(ax,ay)||1; IN[0].ax=ax/m*(ax||ay?1:0); IN[0].ay=ay/m*(ax||ay?1:0); }
  const bx=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0), by=(k.ArrowDown?1:0)-(k.ArrowUp?1:0);
  let st1=false; for(const t of touches.values()) if(t.type==='stick'&&t.s.pl===1) st1=true;
  if(!st1 && G.teams[1] && G.teams[1].human){ const m=hyp(bx,by)||1; IN[1].ax=bx/m*(bx||by?1:0); IN[1].ay=by/m*(bx||by?1:0); }
}

let DPR_TAVAN=1.5; let HAFIF=false; let yavasSay=0;
function ekranOlc(){
  const vv=window.visualViewport;
  let w=innerWidth, h=innerHeight;
  if(vv && vv.width>50 && vv.height>50){ w=Math.round(vv.width*(vv.scale||1)); h=Math.round(vv.height*(vv.scale||1)); }
  return [w,h];
}
function resize(){
  DPR=Math.min(DPR_TAVAN,window.devicePixelRatio||1);
  const [sw,sh]=ekranOlc(); SW=sw; SH=sh;
  // Telefon dikey tutuluyorsa (iPhone'da ekran döndürme kilidi açık olsa bile) oyun alanını kendimiz yan çeviriyoruz
  let dokunmatik=false; try{ dokunmatik=matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window); }catch(e){}
  ROT = dokunmatik && sh>sw*1.05;
  if(ROT){
    W=sh; H=sw;
    cv.style.position='fixed'; cv.style.left='0'; cv.style.top='0';
    cv.style.width=sh+'px'; cv.style.height=sw+'px';
    cv.style.transformOrigin='0 0'; cv.style.transform='translate('+sw+'px,0) rotate(90deg)';
  } else {
    W=sw; H=sh;
    cv.style.position=''; cv.style.left=''; cv.style.top='';
    cv.style.width=''; cv.style.height=''; cv.style.transformOrigin=''; cv.style.transform='';
  }
  UI=clamp(Math.min(W/1100,H/680),0.58,1);
  SAFE = (W>H && H<520) ? 22 : 0;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  computeLayout();
  if(crowdCv) crowdPat=ctx.createPattern(crowdCv,'repeat');
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>{ setTimeout(resize,120); setTimeout(resize,400); setTimeout(resize,900); });

setInterval(()=>{ const [w,h]=ekranOlc(); if(w!==SW||h!==SH) resize(); },700);
function tamEkranYatay(){
  try{
    if(!matchMedia('(pointer:coarse)').matches) return;
    const el=document.documentElement;
    const kilit=()=>{ try{ const o=screen.orientation; if(o&&o.lock) o.lock('landscape').catch(()=>{}); }catch(e){} };
    if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'}).then(kilit).catch(()=>{});
    else if(el.webkitRequestFullscreen && !document.webkitFullscreenElement){ el.webkitRequestFullscreen(); }
    else kilit();
  }catch(e){}
}
let last=performance.now();
let FPSort=16, FPSt=0;
function loop(now){
  const ham=(now-last)/1000;
  const dt=Math.min(0.033,ham); last=now;
  if(G.phase==='play' && ham<0.25){ FPSort+= (ham*1000-FPSort)*0.05; FPSt+=ham;
    if(FPSt>2.5){ FPSt=0; if(FPSort>24 && DPR_TAVAN>1){ DPR_TAVAN=Math.max(1,DPR_TAVAN-0.25); resize(); } else if(FPSort>24 && !HAFIF){ HAFIF=true; } else if(FPSort>30 && HAFIF && DPR_TAVAN>0.8){ DPR_TAVAN=0.8; resize(); } } }

    if(M.step==='takim'){ M.ben=t; M.step = M.mod==='tur' ? 'hazir' : 'rakip'; if(M.rakip===t) M.rakip=null; }
