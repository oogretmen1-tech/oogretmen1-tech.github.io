    renderMenu();
  });
  const r=document.getElementById('mRast'); if(r) r.onclick=()=>{ const L=havuz().filter(t=>t!==M.ben); M.rakip=L[(Math.random()*L.length)|0]; M.step='hazir'; renderMenu(); };
  const seg=(id,fn)=>{ const e=document.getElementById(id); if(e) e.querySelectorAll('button').forEach(b=>b.onclick=()=>{ fn(b.dataset.v); renderMenu(); }); };
  seg('sSure',v=>M.sure=+v); seg('sZor',v=>M.diff=+v); seg('sOff',v=>M.off=v==='1');
  const bs=document.getElementById('mBasla'); if(bs) bs.onclick=()=>{
    ensureAC(); tamEkranYatay();
    G.matchLen=M.sure; G.offside=M.off; G.diff=M.mod==='iki'?1:M.diff; G.mode=M.mod==='iki'?2:1; G.skillBonus=0;
    if(M.mod==='tur') turnuvaBaslat(); else startMatch(M.ben,M.rakip,M.mod==='iki');
  };
}
function backToMenu(){ G.phase='menu'; G.skillBonus=0; turEl.style.display='none'; menuEl.style.display='block'; renderMenu(); }
function onEndTap(){
  if(TUR.on){ turMacBitti(); return; }
  M.step='hazir'; backToMenu();
}

/* ======================= TURNUVA ======================= */
const TURNUVALAR=[
  {id:'dk', ad:'Dünya Kupası', not:'16 millî takım', havuz:()=>TEAMS.slice(0,16)},
  {id:'sl', ad:'Şampiyonlar Ligi', not:'Avrupa’nın en güçlü 16 kulübü', havuz:()=>KULUPLER.filter(t=>t.lig!=='BRZ').slice().sort((a,b)=>b.guc-a.guc).slice(0,16)},
  {id:'kk', ad:'Dünya Kulüpler Kupası', not:'Her ligden 2 kulüp', havuz:()=>LIGLER.reduce((a,l)=>a.concat(l.teams.slice().sort((x,y)=>y.guc-x.guc).slice(0,2)),[])}
];
const TUR={on:false,ad:'',pool:[],my:0,gruplar:[],ist:[],tur:0,asama:'grup',esler:{cf:[],yf:[],fin:null},sampiyon:null,benim:null,sonuclar:[],elendi:false,penSon:null};
const GRUP_AD=['A GRUBU','B GRUBU','C GRUBU','D GRUBU'];
const TUR_PAT=[[[0,1],[2,3]],[[0,2],[3,1]],[[0,3],[1,2]]];
const ASAMA_AD={cf:'ÇEYREK FİNAL',yf:'YARI FİNAL',fin:'FİNAL'};
function karistir(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function golUret(g1,g2){ const lam=clamp(1.3+(g1-g2)/13,0.3,3.6); let g=0; for(let i=0;i<6;i++) if(Math.random()<lam/6*1.75) g++; return g; }
function simMac(a,b){ const A=TUR.pool[a],B=TUR.pool[b]; return [golUret(A.guc,B.guc),golUret(B.guc,A.guc)]; }
function penalti(a,b){ const A=TUR.pool[a].guc,B=TUR.pool[b].guc; const pA=0.5+(A-B)/60;
  let x=3+((Math.random()*3)|0), y=3+((Math.random()*3)|0); if(x===y)(Math.random()<pA?x++:y++); if((x>y)!==(Math.random()<pA)){const t=x;x=y;y=t;} return [x,y]; }
function turnuvaBaslat(){
  const T=turnuvaIcin(M.ben);
  let pool=T.havuz().slice(); const me=M.ben;
  if(!pool.includes(me)) pool[pool.length-1]=me;
  karistir(pool);
  Object.assign(TUR,{on:true,ad:T.ad,pool,my:pool.indexOf(me),ist:pool.map(()=>({o:0,g:0,b:0,m:0,ag:0,yg:0,p:0})),tur:0,asama:'grup',esler:{cf:[],yf:[],fin:null},sampiyon:null,elendi:false,sonuclar:[]});
  const sira=pool.map((_,i)=>i); sira.splice(sira.indexOf(TUR.my),1); sira.unshift(TUR.my);
  TUR.gruplar=[sira.slice(0,4),sira.slice(4,8),sira.slice(8,12),sira.slice(12,16)];
  G.mode=1; siradakiMac();
}
function benimGrup(){ return TUR.gruplar.findIndex(g=>g.indexOf(TUR.my)>=0); }
function siradakiMac(){ const g=TUR.gruplar[benimGrup()]; for(const [x,y] of TUR_PAT[TUR.tur]){ if(g[x]===TUR.my){TUR.benim={a:TUR.my,b:g[y]};break;} if(g[y]===TUR.my){TUR.benim={a:TUR.my,b:g[x]};break;} } turEkran(); }
function grupTablo(gi){ return TUR.gruplar[gi].slice().sort((x,y)=>{const A=TUR.ist[x],B=TUR.ist[y]; return B.p-A.p||(B.ag-B.yg)-(A.ag-A.yg)||B.ag-A.ag;}); }
function turMacSonucIsle(a,b,ga,gb){ const A=TUR.ist[a],B=TUR.ist[b]; A.o++;B.o++;A.ag+=ga;A.yg+=gb;B.ag+=gb;B.yg+=ga;
  if(ga>gb){A.g++;B.m++;A.p+=3;} else if(gb>ga){B.g++;A.m++;B.p+=3;} else {A.b++;B.b++;A.p++;B.p++;} TUR.sonuclar.push({a,b,ga,gb}); }
function turMacBitti(){
  const skor=G.score.slice(); TUR.penSon=null;
  if(TUR.asama==='grup'){
    TUR.sonuclar=[]; turMacSonucIsle(TUR.benim.a,TUR.benim.b,skor[0],skor[1]);
    TUR.gruplar.forEach(g=>{ for(const [x,y] of TUR_PAT[TUR.tur]){ const a=g[x],b=g[y]; if([a,b].includes(TUR.benim.a)||[a,b].includes(TUR.benim.b)) continue; const [ga,gb]=simMac(a,b); turMacSonucIsle(a,b,ga,gb); } });
    TUR.tur++; if(TUR.tur<3) siradakiMac(); else grupBitti();
  }else{
    let pen=null; if(skor[0]===skor[1]){ pen=penalti(TUR.benim.a,TUR.benim.b); TUR.penSon=pen; }
    koSonuc(TUR.benim.a,TUR.benim.b,skor[0],skor[1],pen);
  }
}
function grupBitti(){ const ilk2=[]; for(let gi=0;gi<4;gi++){ const t=grupTablo(gi); ilk2.push([t[0],t[1]]); }
  TUR.esler.cf=[{a:ilk2[0][0],b:ilk2[1][1]},{a:ilk2[1][0],b:ilk2[0][1]},{a:ilk2[2][0],b:ilk2[3][1]},{a:ilk2[3][0],b:ilk2[2][1]}];
  TUR.asama='cf'; TUR.sonuclar=[]; TUR.elendi=!TUR.esler.cf.some(e=>e.a===TUR.my||e.b===TUR.my); koSirada(); }
function koSirada(){ const liste=TUR.asama==='fin'?[TUR.esler.fin]:TUR.esler[TUR.asama]; const e=liste.find(e=>e&&(e.a===TUR.my||e.b===TUR.my));
  if(!e){ TUR.elendi=true; kalaniOyna(); return; } TUR.benim={a:TUR.my,b:e.a===TUR.my?e.b:e.a}; turEkran(); }
function koSonuc(a,b,ga,gb,pen){
  const kaz=pen?(pen[0]>pen[1]?a:b):(ga>gb?a:b);
  const liste=TUR.asama==='fin'?[TUR.esler.fin]:TUR.esler[TUR.asama];
  const es=liste.find(e=>e&&((e.a===a&&e.b===b)||(e.a===b&&e.b===a)));
  if(es){ es.ga=es.a===a?ga:gb; es.gb=es.a===a?gb:ga; es.pen=pen?(es.a===a?pen:[pen[1],pen[0]]):null; es.kaz=kaz; }
  for(const e of liste){ if(!e||e.kaz!==undefined) continue; let [x,y]=simMac(e.a,e.b), pn=null; if(x===y) pn=penalti(e.a,e.b); e.ga=x;e.gb=y;e.pen=pn;e.kaz=pn?(pn[0]>pn[1]?e.a:e.b):(x>y?e.a:e.b); }
  sonrakiAsama();
}
function sonrakiAsama(){
  if(TUR.asama==='cf'){ const k=TUR.esler.cf.map(e=>e.kaz); TUR.esler.yf=[{a:k[0],b:k[1]},{a:k[2],b:k[3]}]; TUR.asama='yf'; }
  else if(TUR.asama==='yf'){ const k=TUR.esler.yf.map(e=>e.kaz); TUR.esler.fin={a:k[0],b:k[1]}; TUR.asama='fin'; }
  else { TUR.sampiyon=TUR.esler.fin.kaz; TUR.asama='bitti'; turEkran(); return; }
  TUR.elendi=TUR.elendi||!(TUR.asama==='fin'?(TUR.esler.fin.a===TUR.my||TUR.esler.fin.b===TUR.my):TUR.esler[TUR.asama].some(e=>e.a===TUR.my||e.b===TUR.my));
  if(TUR.elendi) kalaniOyna(); else koSirada();
}
function kalaniOyna(){ let g=0; while(TUR.asama!=='bitti'&&g++<10){ const liste=TUR.asama==='fin'?[TUR.esler.fin]:TUR.esler[TUR.asama];
  for(const e of liste){ if(!e||e.kaz!==undefined) continue; let [x,y]=simMac(e.a,e.b),pn=null; if(x===y)pn=penalti(e.a,e.b); e.ga=x;e.gb=y;e.pen=pn;e.kaz=pn?(pn[0]>pn[1]?e.a:e.b):(x>y?e.a:e.b); }
  sonrakiAsama(); if(TUR.asama==='bitti') break; } turEkran(); }
function ad(i){ const t=TUR.pool[i]; return `<span class="tkAd">${armaImgHTML(t,22)}${t.name}</span>`; }
function turEkran(){
  G.phase='menu'; menuEl.style.display='none'; turEl.style.display='block';
  const ic=document.getElementById('turIc');
  let h=`<h2>${TUR.ad}</h2><div class="alt2">Takımın: <span style="color:#ffd84d">${ad(TUR.my)}</span></div>`;
  if(TUR.penSon) h+=`<div class="alt2" style="color:#ffd84d">Maç berabere bitti, penaltılar: ${TUR.penSon[0]} - ${TUR.penSon[1]}</div>`;
  if(TUR.asama==='grup'){
    for(let gi=0;gi<4;gi++){
      h+=`<div class="grp"><h4>${GRUP_AD[gi]}</h4><table><tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr>`;
      grupTablo(gi).forEach((idx,s)=>{ const st=TUR.ist[idx];
        h+=`<tr class="${idx===TUR.my?'me':''} ${s<2?'up':''}"><td>${s+1}. ${ad(idx)}</td><td class="n">${st.o}</td><td class="n">${st.g}</td><td class="n">${st.b}</td><td class="n">${st.m}</td><td class="n">${st.ag-st.yg>0?'+':''}${st.ag-st.yg}</td><td class="n"><b>${st.p}</b></td></tr>`; });
      h+=`</table></div>`;
    }
    if(TUR.sonuclar.length){ h+=`<div class="alt2">${TUR.tur}. TUR SONUÇLARI</div>`; for(const r of TUR.sonuclar) h+=`<div class="mac"><span>${ad(r.a)}</span><b>${r.ga} - ${r.gb}</b><span>${ad(r.b)}</span></div>`; }
    h+=`<div class="alt2">${TUR.tur+1}. TUR · SENİN MAÇIN</div><div class="mac me"><span>${ad(TUR.benim.a)}</span><b>VS</b><span>${ad(TUR.benim.b)}</span></div>`;
    h+=`<button class="oyna" id="turOyna">MAÇI OYNA</button>`;
  }else if(TUR.asama==='bitti'){
    h+=`<div class="kupa">${IKON.kupa}</div><h2 style="color:#ffd84d">${ad(TUR.sampiyon)}</h2>`;
    h+=`<div class="alt2">${TUR.sampiyon===TUR.my?'ŞAMPİYON SENSİN! Kupa senin!':'turnuvanın şampiyonu oldu.'}</div>`+turBracket();
    h+=`<button class="oyna" id="turYeni">YENİ TURNUVA</button>`;
  }else{
    h+=turBracket();
    if(TUR.elendi) h+=`<div class="alt2">Turnuvadan elendin. Kalan maçları bilgisayar oynadı.</div>`;
    else h+=`<div class="alt2">${ASAMA_AD[TUR.asama]} · SENİN MAÇIN</div><div class="mac me"><span>${ad(TUR.benim.a)}</span><b>VS</b><span>${ad(TUR.benim.b)}</span></div><button class="oyna" id="turOyna">MAÇI OYNA</button>`;
  }
  h+=`<button class="geri" id="turMenu">Ana menüye dön</button><div class="imza">Dijital Öğretmen · Hasan Tutuş · dijitalogretmen.org</div>`;
  ic.innerHTML=h;
  const ob=document.getElementById('turOyna'); if(ob) ob.onclick=()=>{ tamEkranYatay(); turEl.style.display='none'; G.skillBonus=TUR.asama==='grup'?0.02:(TUR.asama==='cf'?0.05:(TUR.asama==='yf'?0.08:0.11)); startMatch(TUR.pool[TUR.benim.a],TUR.pool[TUR.benim.b],false); };
  const yb=document.getElementById('turYeni'); if(yb) yb.onclick=()=>{ TUR.on=false; M.step='home'; backToMenu(); };
  document.getElementById('turMenu').onclick=()=>{ TUR.on=false; M.step='home'; backToMenu(); };
  turEl.scrollTop=0;
}
function turBracket(){
  let h=''; const bl=[['cf',TUR.esler.cf],['yf',TUR.esler.yf],['fin',TUR.esler.fin?[TUR.esler.fin]:[]]];
  for(const [k,L] of bl){ if(!L||!L.length) continue; h+=`<div class="alt2">${ASAMA_AD[k]}</div>`;
    for(const e of L){ const s=e.kaz!==undefined?`${e.ga} - ${e.gb}`+(e.pen?` <small>(pen. ${e.pen[0]}-${e.pen[1]})</small>`:''):'VS';
      h+=`<div class="mac${(e.a===TUR.my||e.b===TUR.my)?' me':''}"><span>${ad(e.a)}</span><b>${s}</b><span>${ad(e.b)}</span></div>`; } }
  return h;
}

renderMenu();
resize();
requestAnimationFrame(loop);
