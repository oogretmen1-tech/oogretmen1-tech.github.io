<title>Masa Hokeyi</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;
  --p1:#ff2e88;
  --p2:#00ffcc;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;padding:0;
  background:var(--bg);
  color:#fff;
  font-family:DORakam,'Andika','Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
  touch-action:none;
}

/* ---------- Menü ---------- */
.menu-container{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  padding:24px;border-radius:20px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 30px rgba(0,255,204,.2);
  text-align:center;max-width:430px;width:92%;
  max-height:96vh;overflow-y:auto;
}
h1{font-size:2rem;margin:0 0 18px;text-shadow:0 0 15px var(--p2);}
.setting-box{margin-bottom:18px;text-align:left;}
.setting-title{font-size:.95rem;color:#cbd5e1;margin-bottom:8px;font-weight:bold;}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;}
.btn-option{
  background:rgba(255,255,255,.08);border:2px solid transparent;color:#fff;
  padding:10px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:.9rem;
  transition:all .2s;font-family:inherit;
}
.btn-option.selected{border-color:var(--p2);background:rgba(0,255,204,.2);box-shadow:0 0 12px var(--p2);}
.btn-option:focus-visible{outline:3px solid #fff;outline-offset:2px;}
.start-btn{
  background:linear-gradient(45deg,var(--p1),var(--p2));border:none;color:#000;
  font-size:1.2rem;font-weight:bold;padding:14px;border-radius:30px;cursor:pointer;
  width:100%;margin-top:6px;box-shadow:0 0 20px var(--p2);transition:transform .2s;
  font-family:inherit;
}
.start-btn:active{transform:scale(.98);}

.sign{
  margin-top:14px;font-size:.8rem;color:rgba(255,255,255,.45);
  letter-spacing:.4px;text-align:center;
}
.overlay .sign{margin-top:4px;font-size:.75rem;}

/* ---------- Oyun ---------- */
.game-wrapper{display:none;flex-direction:column;align-items:center;width:100%;height:100%;justify-content:center;gap:8px;padding:6px;}
.scoreboard{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:460px;padding:8px 16px;
  background:rgba(255,255,255,.05);border-radius:12px;
  font-size:1rem;font-weight:bold;
}
.tag{padding:4px 10px;border-radius:8px;font-size:.85rem;}
.tag.t1{color:var(--p1);border:1.5px solid var(--p1);}
.tag.t2{color:var(--p2);border:1.5px solid var(--p2);}
.score{font-size:1.7rem;}
.score.s1{color:var(--p1);text-shadow:0 0 10px var(--p1);}
.score.s2{color:var(--p2);text-shadow:0 0 10px var(--p2);}
.canvas-holder{position:relative;line-height:0;}
canvas{
  background:#070a12;border:3px solid rgba(255,255,255,.75);border-radius:18px;
  box-shadow:0 0 25px rgba(255,255,255,.15);display:block;touch-action:none;
}
.overlay{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(7,10,18,.88);border-radius:18px;text-align:center;padding:20px;
}
.overlay h2{margin:0;font-size:1.6rem;}
.overlay .start-btn{width:auto;padding:12px 26px;font-size:1rem;}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.small-btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.6);color:#fff;
  padding:8px 18px;border-radius:15px;cursor:pointer;font-weight:bold;font-family:inherit;font-size:.9rem;
}
.small-btn:active{transform:scale(.97);}

/* ---------- TAM EKRAN: saha bütün ekranı kaplar ---------- */
body.fs{justify-content:flex-start;}
body.fs .game-wrapper{padding:0;gap:0;height:100vh;width:100vw;justify-content:center;}
body.fs .scoreboard{display:none;}                 /* skor sahanın içine çizilir */
body.fs .canvas-holder{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
body.fs canvas{border:none;border-radius:0;box-shadow:none;}
body.fs .overlay{border-radius:0;}
body.fs .controls{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:6px;
  gap:6px;z-index:20;flex-wrap:nowrap;
}
body.fs .small-btn{padding:5px 11px;font-size:.78rem;opacity:.72;background:rgba(0,0,0,.35);}

<body>

<div id="menu" class="menu-container">
  <h1>🏒 Masa Hokeyi</h1>

  <div class="setting-box">
    <div class="setting-title">Oyun modu</div>
    <div class="btn-grid" id="modeGrid">
      <button class="btn-option selected" data-mode="1">🤖 1 Kişilik</button>
      <button class="btn-option" data-mode="2">👥 2 Kişilik</button>
    </div>
  </div>

  <div class="setting-box" id="aiDifficultyBox">
    <div class="setting-title">Bilgisayarın zorluğu</div>
    <div class="btn-grid" id="diffGrid">
      <button class="btn-option" data-diff="easy">Kolay</button>
      <button class="btn-option selected" data-diff="medium">Orta</button>
      <button class="btn-option" data-diff="hard">Zor</button>
    </div>
  </div>

  <div class="setting-box">
    <div class="setting-title">Kazanan gol sayısı</div>
    <div class="btn-grid" id="goalGrid">
      <button class="btn-option" data-goals="3">3 Gol</button>
      <button class="btn-option selected" data-goals="5">5 Gol</button>
      <button class="btn-option" data-goals="7">7 Gol</button>
      <button class="btn-option" data-goals="10">10 Gol</button>
    </div>
  </div>

  <button class="start-btn" onclick="initGame()">Oyuna başla 🚀</button>

  <div class="sign">Dijital Öğretmen · Hasan Tutuş</div>
</div>

<div id="gameWrapper" class="game-wrapper">
  <div class="scoreboard">
    <div class="tag t1" id="nameP1">Oyuncu 1</div>
    <div><span class="score s1" id="scoreP1">0</span> : <span class="score s2" id="scoreP2">0</span></div>
    <div class="tag t2" id="nameP2">Oyuncu 2</div>
  </div>

  <div class="canvas-holder">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayText">Bitti</h2>
      <button class="start-btn" onclick="restartGame()">Tekrar oyna 🔄</button>
      <button class="small-btn" onclick="quitGame()">Menüye dön</button>
      <div class="sign">Dijital Öğretmen · Hasan Tutuş</div>
    </div>
  </div>

  <div class="controls">
    <button class="small-btn" onclick="toggleFullscreen()" id="fsBtn">⛶ Tam ekran</button>
    <button class="small-btn" onclick="togglePause()" id="pauseBtn">⏸ Duraklat</button>
    <button class="small-btn" onclick="quitGame()">← Menü</button>
  </div>
</div>

<script>
/* ================= Ayarlar ================= */
let gameMode = 1;
let aiDifficulty = 'medium';
let targetGoals = 5;

/* ================= Saha (artık dinamik) ================= */
let W = 400, H = 650;                    // mantıksal ölçüler (W ekrana göre değişir)
let GOAL_W = 150, GOAL_L = 125, GOAL_R = 275;
const MAX_SPEED = 15;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

const puck = {x:W/2, y:H/2, vx:0, vy:0, r:14};
const p1 = {x:W/2, y:H-80, px:W/2, py:H-80, vx:0, vy:0, r:26, color:'#ff2e88'};
const p2 = {x:W/2, y:80,   px:W/2, py:80,   vx:0, vy:0, r:26, color:'#00ffcc'};

let scoreP1 = 0, scoreP2 = 0;
let isRunning = false, isPaused = false, gameOver = false;
let goalPause = 0;
let flash = {side:null, t:0};
let hintTimer = 0;
let isFsMode = false;          // tam ekran (gerçek veya sahte)

/* --- sıkışma (köşe) takibi --- */
let stallTick = 0, stallCount = 0, rescueMsg = 0;
const lastPuckPos = {x:0, y:0};

/* ================= Ölçekleme / Tam ekran ================= */
function computeField(availW, availH){
  const oldW = W;
  H = 650;
  let ratio = availW / availH;
  ratio = Math.max(0.42, Math.min(1.35, ratio));   // aşırı ince/geniş ekranlarda saha bozulmasın
  W = Math.round(H * ratio);

  GOAL_W = Math.round(Math.min(W * 0.42, 195));
  GOAL_L = (W - GOAL_W) / 2;
  GOAL_R = GOAL_L + GOAL_W;

  // Saha genişliği değiştiyse mevcut konumları oranla taşı
  if(oldW !== W){
    const sx = W / oldW;
    puck.x *= sx; p1.x *= sx; p1.px *= sx; p2.x *= sx; p2.px *= sx;
    puck.x = Math.max(puck.r, Math.min(W - puck.r, puck.x));
    p1.x   = Math.max(p1.r,   Math.min(W - p1.r,   p1.x));
    p2.x   = Math.max(p2.r,   Math.min(W - p2.r,   p2.x));
    lastPuckPos.x *= sx;
  }
}

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let availW, availH;

  if(isFsMode){
    availW = window.innerWidth;
    availH = window.innerHeight;
  }else{
    availW = Math.min(window.innerWidth - 16, 470);
    availH = Math.max(240, window.innerHeight - 150);   // skor + butonlar için pay
  }

  computeField(availW, availH);

  const scale = Math.min(availW / W, availH / H);
  const cssW = W * scale, cssH = H * scale;

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  if(!isRunning) draw();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,250));

function syncFsState(){
  const realFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if(!pseudoFs) isFsMode = realFs;
  document.body.classList.toggle('fs', isFsMode);
  updateFsLabel();
  setTimeout(resizeCanvas, 60);
}
document.addEventListener('fullscreenchange', syncFsState);
document.addEventListener('webkitfullscreenchange', syncFsState);

let pseudoFs = false;   // Fullscreen API'yi desteklemeyen tarayıcılar (iPhone Safari) için
function toggleFullscreen(){
  const el = document.documentElement;
  const realFs = !!(document.fullscreenElement || document.webkitFullscreenElement);

  if(!isFsMode){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req){
      pseudoFs = false;
      isFsMode = true;
      document.body.classList.add('fs');
      req.call(el).then(()=>{
        if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
      }).catch(()=>{ pseudoFs = true; });   // izin verilmezse sahte tam ekranda kal
    }else{
      pseudoFs = true; isFsMode = true;
      document.body.classList.add('fs');
      window.scrollTo(0,1);
    }
  }else{
    if(realFs){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document).catch(()=>{});
    }
    pseudoFs = false;
    isFsMode = false;
    document.body.classList.remove('fs');
  }
  updateFsLabel();
  setTimeout(resizeCanvas, 120);
  setTimeout(resizeCanvas, 400);   // adres çubuğu kapanınca ölçü tazelensin
}
function updateFsLabel(){
  document.getElementById('fsBtn').textContent = isFsMode ? '⤢ Küçült' : '⛶ Tam ekran';
}

/* ================= Ses ================= */
let audioCtx = null;
function playSound(freq, type, duration, vol){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = vol || 0.18;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

/* ================= Oyun kurulumu ================= */
function initGame(){
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameWrapper').style.display = 'flex';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('nameP2').textContent = gameMode===1 ? 'Bilgisayar' : 'Oyuncu 2';
  playSound(600,'sine',0.1);
  resizeCanvas();
  restartGame();
}

function restartGame(){
  document.getElementById('overlay').style.display = 'none';
  scoreP1 = 0; scoreP2 = 0;
  gameOver = false; isPaused = false;
  document.getElementById('pauseBtn').textContent = '⏸ Duraklat';
  updateScoreUI();
  resetPositions(Math.random() > .5 ? 1 : -1);
  hintTimer = 150;
  if(!isRunning){ isRunning = true; requestAnimationFrame(gameLoop); }
}

function resetPositions(dir){
  puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0;
  p1.x = W/2; p1.y = H-80; p1.px = p1.x; p1.py = p1.y; p1.vx = 0; p1.vy = 0;
  p2.x = W/2; p2.y = 80;   p2.px = p2.x; p2.py = p2.y; p2.vx = 0; p2.vy = 0;
  goalPause = 45;
  puck._dir = dir || (Math.random() > .5 ? 1 : -1);
  stallTick = 0; stallCount = 0;
  lastPuckPos.x = puck.x; lastPuckPos.y = puck.y;
}

/* ================= Kontroller ================= */
function pointerPos(t){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) * (W / rect.width),
    y: (t.clientY - rect.top)  * (H / rect.height)
  };
}
function handleMove(e){
  if(!isRunning || isPaused || gameOver) return;
  e.preventDefault();
  const list = e.touches ? e.touches : [e];
  for(let i=0;i<list.length;i++){
    const pos = pointerPos(list[i]);
    if(pos.y > H/2){
      p1.x = Math.max(p1.r, Math.min(W-p1.r, pos.x));
      p1.y = Math.max(H/2 + p1.r, Math.min(H-p1.r, pos.y));
    }else if(gameMode === 2){
      p2.x = Math.max(p2.r, Math.min(W-p2.r, pos.x));
      p2.y = Math.max(p2.r, Math.min(H/2 - p2.r, pos.y));
    }
  }
  hintTimer = 0;
}
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchmove', handleMove, {passive:false});
canvas.addEventListener('touchstart', handleMove, {passive:false});
canvas.addEventListener('pointerdown', ()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); });

function togglePause(){
  if(gameOver) return;
  isPaused = !isPaused;
  document.getElementById('pauseBtn').textContent = isPaused ? '▶ Devam et' : '⏸ Duraklat';
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && isRunning && !gameOver){
    isPaused = true;
    document.getElementById('pauseBtn').textContent = '▶ Devam et';
  }
});

/* ================= Döngü ================= */
function gameLoop(){
  if(!isRunning) return;
  if(!isPaused && !gameOver){
    if(goalPause > 0){
      goalPause--;
      if(goalPause === 0){
        const d = puck._dir || 1;
        puck.vx = (Math.random()-0.5)*3;
        puck.vy = d * 5;
      }
    }else{
      updateAI();
      updatePhysics();
      checkStall();
    }
    updateMalletVelocity();
    if(flash.t > 0) flash.t--;
    if(hintTimer > 0) hintTimer--;
    if(rescueMsg > 0) rescueMsg--;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function updateMalletVelocity(){
  p1.vx = p1.x - p1.px; p1.vy = p1.y - p1.py;
  p2.vx = p2.x - p2.px; p2.vy = p2.y - p2.py;
  p1.px = p1.x; p1.py = p1.y;
  p2.px = p2.x; p2.py = p2.y;
}

/* ================= Sıkışma çözümü ================= */
function checkStall(){
  if(goalPause > 0) return;
  stallTick++;
  if(stallTick < 45) return;              // ~0,75 saniyede bir bak
  stallTick = 0;

  const moved = Math.hypot(puck.x - lastPuckPos.x, puck.y - lastPuckPos.y);
  lastPuckPos.x = puck.x; lastPuckPos.y = puck.y;

  if(moved < 42){                          // disk neredeyse hiç yol almadı
    stallCount++;
    if(stallCount >= 4){ centerServe(); stallCount = 0; }   // ~3 sn → ortadan servis
    else if(stallCount >= 2){ nudgePuck(); }                // ~1,5 sn → merkeze doğru itme
  }else{
    stallCount = 0;
  }
}

function pushOutOfMallets(){
  [p1,p2].forEach(p=>{
    const dx = puck.x - p.x, dy = puck.y - p.y;
    const d = Math.hypot(dx,dy);
    const min = puck.r + p.r + 1;
    if(d < min){
      const nx = d ? dx/d : 0, ny = d ? dy/d : (p === p2 ? 1 : -1);
      puck.x = p.x + nx*min;
      puck.y = p.y + ny*min;
      puck.x = Math.max(puck.r, Math.min(W-puck.r, puck.x));
      puck.y = Math.max(puck.r, Math.min(H-puck.r, puck.y));
    }
  });
}

function nudgePuck(){
  pushOutOfMallets();
  const dx = W/2 - puck.x, dy = H/2 - puck.y;
  const d = Math.hypot(dx,dy) || 1;
  const power = 7;
  puck.vx = (dx/d)*power + (Math.random()-0.5)*2;
  puck.vy = (dy/d)*power + (Math.random()-0.5)*2;
  rescueMsg = 45;
  playSound(520,'sine',0.12,0.12);
}

function centerServe(){
  puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0;
  puck._dir = Math.random() > .5 ? 1 : -1;
  goalPause = 30;
  rescueMsg = 70;
  playSound(700,'triangle',0.18,0.15);
}

/* ================= Yapay zekâ ================= */
function updateAI(){
  if(gameMode !== 1) return;
  let maxStep = 3.2, aggression = 0.55;
  if(aiDifficulty === 'medium'){ maxStep = 5.0; aggression = 0.75; }
  if(aiDifficulty === 'hard'){   maxStep = 7.5; aggression = 0.95; }

  const slow = Math.hypot(puck.vx, puck.vy) < 2;
  let tx, ty;

  if(puck.y < H/2){
    if(slow && (puck.y < p2.r + puck.r + 6 || puck.x < 55 || puck.x > W-55)){
      // Disk duvara/köşeye yapışmış: arkasına geçip sahanın ortasına doğru it
      const cx = W/2 - puck.x, cy = (H*0.40) - puck.y;
      const d = Math.hypot(cx,cy) || 1;
      tx = puck.x - (cx/d) * (puck.r + p2.r) * 0.95;
      ty = puck.y - (cy/d) * (puck.r + p2.r) * 0.95;
    }else{
      // Disk kendi sahasında: vurmaya git
      tx = puck.x;
      ty = Math.min(puck.y + puck.r + p2.r*0.6, H/2 - p2.r);
      tx = p2.x + (tx - p2.x) * aggression;
    }
  }else{
    // Savunma pozisyonu: kaleyi kapat
    tx = W/2 + (puck.x - W/2) * 0.45;
    ty = 80;
  }
  const dx = tx - p2.x, dy = ty - p2.y;
  const d = Math.hypot(dx, dy) || 1;
  const step = Math.min(maxStep, d);
  p2.x += (dx/d) * step;
  p2.y += (dy/d) * step;
  p2.x = Math.max(p2.r, Math.min(W-p2.r, p2.x));
  p2.y = Math.max(p2.r, Math.min(H/2 - p2.r, p2.y));
}

/* ================= Fizik ================= */
function updatePhysics(){
  const sp = Math.hypot(puck.vx, puck.vy);
  if(sp > MAX_SPEED){ puck.vx = puck.vx/sp*MAX_SPEED; puck.vy = puck.vy/sp*MAX_SPEED; }

  const steps = Math.max(1, Math.ceil(sp / (puck.r * 0.6)));
  for(let i=0;i<steps;i++){
    puck.x += puck.vx / steps;
    puck.y += puck.vy / steps;

    // Yan duvarlar
    if(puck.x - puck.r <= 0){ puck.x = puck.r; puck.vx = Math.abs(puck.vx)*0.92; wallSound(); }
    else if(puck.x + puck.r >= W){ puck.x = W - puck.r; puck.vx = -Math.abs(puck.vx)*0.92; wallSound(); }

    const inGoalX = puck.x > GOAL_L && puck.x < GOAL_R;

    if(!inGoalX){
      if(puck.y - puck.r <= 0){ puck.y = puck.r; puck.vy = Math.abs(puck.vy)*0.92; wallSound(); }
      else if(puck.y + puck.r >= H){ puck.y = H - puck.r; puck.vy = -Math.abs(puck.vy)*0.92; wallSound(); }
    }else{
      // Gol: diskin merkezi çizgiyi geçtiğinde sayılır (kale ağzında asılı kalmaz)
      if(puck.y < 0){ goal(1); return; }
      if(puck.y > H){ goal(2); return; }
    }

    hitMallet(p1);
    hitMallet(p2);
  }

  puck.vx *= 0.996;
  puck.vy *= 0.996;
  if(Math.abs(puck.vx) < 0.02) puck.vx = 0;
  if(Math.abs(puck.vy) < 0.02) puck.vy = 0;
}

let wallSoundCooldown = 0;
function wallSound(){
  if(wallSoundCooldown > 0) return;
  wallSoundCooldown = 6;
  playSound(300,'sine',0.05,0.12);
  setTimeout(()=>{ wallSoundCooldown = 0; }, 90);
}

function hitMallet(p){
  const dx = puck.x - p.x, dy = puck.y - p.y;
  const dist = Math.hypot(dx, dy);
  const minDist = puck.r + p.r;
  if(dist >= minDist || dist === 0) return;

  const nx = dx/dist, ny = dy/dist;

  puck.x = p.x + nx * minDist;
  puck.y = p.y + ny * minDist;

  const rvx = puck.vx - p.vx, rvy = puck.vy - p.vy;
  const vn = rvx*nx + rvy*ny;
  if(vn < 0){
    const j = -(1 + 0.92) * vn;
    puck.vx += j * nx;
    puck.vy += j * ny;
  }
  puck.vx += p.vx * 0.75;
  puck.vy += p.vy * 0.75;

  let s = Math.hypot(puck.vx, puck.vy);
  if(s < 3.5){
    puck.vx = nx * 3.5;
    puck.vy = ny * 3.5;
    s = 3.5;
  }
  if(s > MAX_SPEED){ puck.vx = puck.vx/s*MAX_SPEED; puck.vy = puck.vy/s*MAX_SPEED; }

  relieveWallPin(p);   // disk tokaç ile duvar arasında kilitlenmesin

  playSound(420 + Math.min(s*25, 300), 'square', 0.08, 0.15);
}

/* Disk duvara/köşeye bastırılıyorsa duvar boyunca kaçır */
function relieveWallPin(p){
  const minDist = puck.r + p.r;
  const inGoalX = puck.x > GOAL_L && puck.x < GOAL_R;
  let vWall = false, hWall = false;

  if(puck.x < puck.r){ puck.x = puck.r; vWall = true; }
  else if(puck.x > W - puck.r){ puck.x = W - puck.r; vWall = true; }
  if(!inGoalX){
    if(puck.y < puck.r){ puck.y = puck.r; hWall = true; }
    else if(puck.y > H - puck.r){ puck.y = H - puck.r; hWall = true; }
  }
  if(!vWall && !hWall) return;

  const dx = puck.x - p.x, dy = puck.y - p.y;
  if(Math.hypot(dx, dy) >= minDist - 0.5) return;   // sıkışma yok

  if(vWall && hWall){
    // Köşe: doğrudan sahanın ortasına doğru fırlat
    const cx = W/2 - puck.x, cy = H/2 - puck.y;
    const d = Math.hypot(cx,cy) || 1;
    puck.x = p.x + (cx/d)*minDist;
    puck.y = p.y + (cy/d)*minDist;
    puck.vx = (cx/d)*6.5;
    puck.vy = (cy/d)*6.5;
  }else if(vWall){
    const dir = dy >= 0 ? 1 : -1;                     // yan duvar boyunca yukarı/aşağı
    const need = Math.sqrt(Math.max(minDist*minDist - dx*dx, 1));
    puck.y = p.y + dir*need;
    puck.vy = dir * Math.max(Math.abs(puck.vy), 5);
  }else{
    const dir = dx >= 0 ? 1 : -1;                     // dip duvar boyunca sağa/sola
    const need = Math.sqrt(Math.max(minDist*minDist - dy*dy, 1));
    puck.x = p.x + dir*need;
    puck.vx = dir * Math.max(Math.abs(puck.vx), 5);
  }

  puck.x = Math.max(puck.r, Math.min(W - puck.r, puck.x));
  if(!(puck.x > GOAL_L && puck.x < GOAL_R)){
    puck.y = Math.max(puck.r, Math.min(H - puck.r, puck.y));
  }
}

function goal(scorer){
  if(scorer === 1){ scoreP1++; flash.side = 'top'; }
  else { scoreP2++; flash.side = 'bottom'; }
  flash.t = 30;
  playSound(880,'triangle',0.35,0.2);
  setTimeout(()=>playSound(1180,'triangle',0.3,0.2), 130);
  updateScoreUI();

  if(scoreP1 >= targetGoals || scoreP2 >= targetGoals){
    endGame();
  }else{
    resetPositions(scorer === 1 ? 1 : -1);
  }
}

function endGame(){
  gameOver = true;
  let txt;
  if(scoreP1 >= targetGoals) txt = '🏆 1. oyuncu kazandı!';
  else txt = gameMode === 1 ? '🤖 Bilgisayar kazandı!' : '🏆 2. oyuncu kazandı!';
  document.getElementById('overlayText').textContent = `${txt}  (${scoreP1} - ${scoreP2})`;
  document.getElementById('overlay').style.display = 'flex';
}

function updateScoreUI(){
  document.getElementById('scoreP1').textContent = scoreP1;
  document.getElementById('scoreP2').textContent = scoreP2;
}

/* ================= Çizim ================= */
function draw(){
  ctx.clearRect(0,0,W,H);

  const gTop = ctx.createLinearGradient(0,0,0,H/2);
  gTop.addColorStop(0,'rgba(0,255,204,0.20)');
  gTop.addColorStop(1,'rgba(0,255,204,0.03)');
  ctx.fillStyle = gTop;
  ctx.fillRect(0,0,W,H/2);

  const gBot = ctx.createLinearGradient(0,H,0,H/2);
  gBot.addColorStop(0,'rgba(255,46,136,0.22)');
  gBot.addColorStop(1,'rgba(255,46,136,0.03)');
  ctx.fillStyle = gBot;
  ctx.fillRect(0,H/2,W,H/2);

  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,255,204,0.55)';
  ctx.strokeRect(3,3,W-6,H/2-6);
  ctx.strokeStyle = 'rgba(255,46,136,0.55)';
  ctx.strokeRect(3,H/2+3,W-6,H/2-6);

  ctx.setLineDash([12,10]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W/2,H/2,52,0,Math.PI*2); ctx.stroke();

  // Saha ortasındaki soluk imza (oyunu etkilemez, sadece zemin yazısı)
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.font = 'bold 12px DORakam,Andika, sans-serif';
  ctx.fillText('Dijital Öğretmen', W/2, H/2 - 4);
  ctx.fillText('Hasan Tutuş', W/2, H/2 + 12);

  ctx.font = 'bold 15px DORakam,Andika, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,255,204,0.7)';
  ctx.fillText(gameMode === 1 ? 'Bilgisayar alanı' : '2. oyuncu alanı', W/2, H/2 - 22);
  ctx.fillStyle = 'rgba(255,46,136,0.7)';
  ctx.fillText('1. oyuncu alanı', W/2, H/2 + 34);

  drawGoal(true);
  drawGoal(false);

  // Tam ekranda skor sahanın içinde
  if(isFsMode){
    ctx.textAlign = 'left';
    ctx.font = 'bold 40px DORakam,Andika, sans-serif';
    ctx.fillStyle = 'rgba(0,255,204,0.45)';
    ctx.fillText(scoreP2, 16, H/2 - 24);
    ctx.fillStyle = 'rgba(255,46,136,0.45)';
    ctx.fillText(scoreP1, 16, H/2 + 60);
    ctx.textAlign = 'center';
  }

  if(flash.t > 0){
    const a = flash.t / 30;
    ctx.fillStyle = flash.side === 'top' ? `rgba(255,46,136,${a*0.35})` : `rgba(0,255,204,${a*0.35})`;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = 'bold 46px DORakam,Andika, sans-serif';
    ctx.fillText('GOL!', W/2, H/2 + 16);
  }

  drawMallet(p2);
  drawMallet(p1);

  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = '#ffffff';
  ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#ff3b3b'; ctx.stroke();
  ctx.restore();

  if(rescueMsg > 0 && !gameOver){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(rescueMsg/30,1)*0.8})`;
    ctx.font = 'bold 16px DORakam,Andika, sans-serif';
    ctx.fillText('Disk serbest bırakıldı 🔄', W/2, H/2 - 70);
  }

  if(hintTimer > 0 && !gameOver){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(hintTimer/60,1)*0.85})`;
    ctx.font = 'bold 15px DORakam,Andika, sans-serif';
    ctx.fillText('Alt alanda parmağını kaydır', W/2, H - 24);
  }

  if(isPaused && !gameOver){
    ctx.fillStyle = 'rgba(7,10,18,0.75)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px DORakam,Andika, sans-serif';
    ctx.fillText('Duraklatıldı', W/2, H/2);
  }
}

function drawGoal(top){
  const y = top ? 0 : H;
  const color = top ? '#00ffcc' : '#ff2e88';
  ctx.save();
  ctx.shadowBlur = 20; ctx.shadowColor = color;
  ctx.strokeStyle = color; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(GOAL_L, top ? y+4 : y-4);
  ctx.lineTo(GOAL_R, top ? y+4 : y-4);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(W/2, y, GOAL_W*0.62, top ? 0 : Math.PI, top ? Math.PI : Math.PI*2);
  ctx.stroke();
}

function drawMallet(p){
  ctx.save();
  ctx.shadowBlur = 22; ctx.shadowColor = p.color;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
  ctx.fillStyle = p.color; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r*0.45, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.stroke();
}

/* ================= Çıkış ================= */
function quitGame(){
  isRunning = false; isPaused = false; gameOver = false;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
  document.getElementById('gameWrapper').style.display = 'none';
}

updateFsLabel();
resizeCanvas();
</script>

<script data-goatcounter="https://dijitalogretmen.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script id="indir-sayac">(function(){var son={};function say(yol,baslik){var k=yol;if(son[k]&&Date.now()-son[k]<2000)return;son[k]=Date.now();var n=0;(function dene(){if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:yol,title:baslik,event:true});}else if(n++<20){setTimeout(dene,500);}})();}
function dosyaAdi(a){var d=a.getAttribute('download');if(d)return d;try{var u=new URL(a.href,location.href);if(u.protocol==='blob:'||u.protocol==='data:')return '';return decodeURIComponent(u.pathname.split('/').pop());}catch(e){return '';}}
function bak(a){if(!a||!a.href)return;var ad=dosyaAdi(a);var dl=a.hasAttribute('download');if(!ad&&dl)ad='dosya';if(!/\.(pdf|docx?|pptx?|xlsx?|zip)$/i.test(ad)&&!dl)return;var sayfa=location.pathname.split('/').pop()||'index.html';say('indir/'+(ad||sayfa),'İndirme: '+(ad||sayfa)+' ('+sayfa+')');}
document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;bak(a);},true);
var kc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(!this.isConnected)bak(this);return kc.apply(this,arguments);};
var kd=EventTarget.prototype.dispatchEvent;EventTarget.prototype.dispatchEvent=function(ev){if(this instanceof HTMLAnchorElement&&!this.isConnected&&ev&&ev.type==='click')bak(this);return kd.apply(this,arguments);};
window.addEventListener('beforeprint',function(){var sayfa=location.pathname.split('/').pop()||'index.html';say('yazdir/'+sayfa,'Yazdırma: '+sayfa);});})();</script>
