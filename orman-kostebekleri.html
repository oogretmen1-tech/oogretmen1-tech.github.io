* {
    box-sizing: border-box;
    font-family: DORakam,'PoppinsA', 'Segoe UI', Arial, sans-serif;
}

body {
    margin: 0;
    background: #123d29;
    color: white;
    user-select: none;
}

/* ---------------- AYAR EKRANI ---------------- */

#ayarEkrani {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        linear-gradient(rgba(10, 50, 30, .45), rgba(5, 35, 20, .75)),
        linear-gradient(135deg, #2d9656, #0d4229);
}

.ayarKutusu {
    width: min(94%, 520px);
    padding: 30px;
    color: #263d2c;
    background: rgba(255, 255, 255, .97);
    border-radius: 24px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, .4);
}

.ayarKutusu h1 {
    margin: 0;
    color: #19713b;
    text-align: center;
    font-size: 32px;
}

.ayarKutusu p {
    margin: 10px 0 25px;
    text-align: center;
    color: #607565;
}

label {
    display: block;
    margin-top: 16px;
    font-weight: bold;
}

button,
input,
select,
option,
textarea,
input::placeholder {
    font-family: DORakam,'PoppinsA', 'Segoe UI', Arial, sans-serif;
}

input,
select {
    width: 100%;
    margin-top: 7px;
    padding: 13px;
    border: 2px solid #c4dfca;
    border-radius: 10px;
    outline: none;
    font-size: 17px;
}

input:focus,
select:focus {
    border-color: #238c4b;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
}

#baslat {
    width: 100%;
    margin-top: 25px;
    color: white;
    background: linear-gradient(135deg, #31aa55, #087331);
}

/* ---------------- OYUN EKRANI ---------------- */

#oyunEkrani {
    display: none;
    min-height: 100vh;
    overflow: hidden;
    background: #5dbb47;
}

.gokyuzu {
    position: relative;
    height: 130px;
    overflow: hidden;
    background: linear-gradient(#5ec3ed, #bdeaf8);
}

.gunes {
    position: absolute;
    top: 15px;
    right: 8%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #ffe66b;
    box-shadow: 0 0 30px #fff4a8;
}

.bulut {
    position: absolute;
    width: 125px;
    height: 28px;
    border-radius: 30px;
    background: rgba(255, 255, 255, .85);
}

.bulut::before,
.bulut::after {
    content: "";
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .85);
}

.bulut::before { left: 20px; width: 46px; height: 46px; }
.bulut::after { left: 57px; width: 58px; height: 58px; }

.bulut1 { top: 30px; left: 12%; }
.bulut2 { top: 70px; left: 47%; transform: scale(.65); }

.kus {
    position: absolute;
    top: 42px;
    left: 30%;
    color: #37556b;
    font-size: 15px;
    opacity: .55;
}
.kus.iki { top: 62px; left: 68%; font-size: 12px; }

.agac {
    position: absolute;
    bottom: -18px;
    z-index: 2;
    font-size: 80px;
    line-height: 1;
}

.agac1 { left: 2%; }
.agac2 { right: 2%; transform: scale(1.1); }
.agac3 { left: 24%; font-size: 58px; opacity: .9; }
.agac4 { right: 26%; font-size: 62px; opacity: .9; }

.ustBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px clamp(12px, 4vw, 50px);
    background: rgba(5, 70, 31, .92);
    flex-wrap: wrap;
    position: relative;
    z-index: 10;
}

.logo {
    font-size: clamp(20px, 4vw, 26px);
    font-weight: bold;
}

.bilgiler { display: flex; gap: 9px; }

.bilgiKutusu {
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .16);
    font-size: 18px;
    font-weight: bold;
}

#ayarlarButton {
    color: white;
    background: #b6342e;
    padding: 9px 14px;
}

.hedefAlani {
    padding: 14px 10px 6px;
    text-align: center;
}

.hedefAlani small {
    display: block;
    margin-bottom: 4px;
    font-size: 16px;
    color: #123d29;
    font-weight: bold;
}

#hedefYazisi {
    display: inline-block;
    padding: 6px 24px;
    color: #4a2f00;
    background: #ffeb7a;
    border-radius: 14px;
    box-shadow: 0 4px 0 #c79c16;
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 400;
}

.cimAlani {
    position: relative;
    width: min(94%, 860px);
    margin: 10px auto 20px;
    padding: 35px 25px 25px;
    border: 6px solid rgba(25, 121, 35, .4);
    border-radius: 34px;
    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.14) 0 3px, transparent 4px),
        radial-gradient(circle at 80% 70%, rgba(0,90,25,.13) 0 4px, transparent 5px),
        linear-gradient(145deg, #6fd253, #35a43b);
    box-shadow:
        inset 0 -16px 20px rgba(13, 87, 25, .25),
        0 13px 27px rgba(0, 70, 20, .35);
}

.cimAlani::before {
    content: "🌿   🍀   🌱   🌿   🍀   🌱";
    position: absolute;
    top: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 18px;
    opacity: .85;
}

.cimAlani::after {
    content: "🌼   🌾   🍄   🌾   🌼";
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 17px;
    opacity: .8;
}

.delikIzgarasi {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px 36px;
    max-width: 1100px;
    margin: 0 auto;
}

.delik {
    position: relative;
    height: clamp(120px, 17vh, 200px);
    min-width: 0;
    overflow: hidden;
    border-radius: 50% / 30%;
    background: radial-gradient(ellipse at center, #1b0e07 0%, #361c0e 60%, #522d17 100%);
    box-shadow:
        inset 0 10px 12px rgba(0,0,0,0.8),
        0 4px 0 rgba(75, 43, 22, 0.8),
        0 8px 12px rgba(0,0,0,0.3);
}

.delik::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 5px solid #5a351d;
    border-radius: 50% / 30%;
    pointer-events: none;
}

.kostebek-container {
    position: absolute;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    height: 100%;
    cursor: pointer;
    transition: bottom 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 3;
}

.kostebek-container.yukari { bottom: 0; }

.kostebek-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3));
}

.tabela {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: #fff8d6;
    border: 4px solid #8c5828;
    border-radius: 14px;
    padding: 2px 16px;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1.1;
    font-weight: 400;
    color: #2b1800;
    box-shadow: 0 3px 5px rgba(0,0,0,0.3);
    white-space: nowrap;
    max-width: 96%;
    overflow: hidden;
    text-align: center;
    pointer-events: none;
}

.kostebek-container.dogru .tabela {
    background: #4ade80;
    color: #052e16;
    border-color: #166534;
}

.kostebek-container.yanlis .tabela {
    background: #f87171;
    color: #450a0a;
    border-color: #991b1b;
}

#mesaj {
    position: fixed;
    z-index: 100;
    top: 45%;
    left: 50%;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: bold;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

#mesaj.goster { animation: mesajAnimasyonu .75s ease-out; }

@keyframes mesajAnimasyonu {
    0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
}

#sonucPenceresi {
    position: fixed;
    z-index: 200;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 35, 15, .75);
}

.sonucKutusu {
    width: min(90%, 410px);
    padding: 30px;
    border-radius: 22px;
    color: #23432d;
    background: white;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

.sonucKutusu h2 { margin-top: 0; color: #19723d; }

#yenidenBasla {
    width: 100%;
    margin-top: 15px;
    color: white;
    background: #187c3e;
}

/* İmza */
.imza {
    padding: 14px 10px 22px;
    text-align: center;
    font-size: 14px;
    color: #0f3d24;
    background: rgba(255, 255, 255, .35);
}
.imza b { color: #0a2e1a; }

#ayarEkrani .imzaKutu {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: #7d8f83;
}

@media (max-width: 650px) {
    .gokyuzu { height: 100px; }
    .cimAlani { padding: 30px 12px 20px; }
    .delikIzgarasi { grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
    .delik { height: clamp(110px, 17vh, 150px); }
    .tabela { font-size: clamp(30px, 9vw, 42px); padding: 0 8px; border-width: 3px; border-radius: 10px; }
    .agac { font-size: 60px; }
    .agac3, .agac4 { display: none; }
}

/* Seçim düğmeleri: tabletin kendi yazı tipi (çengelli a) devreye girmesin diye açılır listeler yerine */
.secimSakli { display: none !important; }
.secimGrubu { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.secimGrubu button {
    flex: 1 1 auto;
    padding: 11px 14px;
    background: #eef6f0;
    color: #23452e;
    border: 2px solid #c4dfca;
    font-weight: 600;
    font-size: 17px;
}
.secimGrubu button.secili {
    background: #238c4b;
    border-color: #238c4b;
    color: #fff;
}

function yazimUygula(metin) {
    const secim = document.getElementById("yazimSecimi").value;
    if (secim === "buyuk") return metin.toLocaleUpperCase("tr-TR");
    if (secim === "karisik" && Math.random() < 0.5) return metin.toLocaleUpperCase("tr-TR");
    return metin;
}

function kucult(metin) {
    return metin.trim().toLocaleLowerCase("tr-TR");
}

sureSecimi.addEventListener("change", () => {
    ozelSure.style.display = (sureSecimi.value === "ozel") ? "block" : "none";
});

baslat.addEventListener("click", oyunuBaslat);
ayarlarButton.addEventListener("click", ayarlaraDon);
yenidenBasla.addEventListener("click", () => {
    sonucPenceresi.style.display = "none";
    ayarlaraDon();
});

function oyunuBaslat() {
    hedef = kucult(hedefInput.value);

    if (hedef === "") {
        alert("Lütfen bir hedef yaz.");
        hedefInput.focus();
        return;
    }

    if (sureSecimi.value === "ozel") {
        kalanSure = Number(ozelSure.value);

        if (!kalanSure || kalanSure < 5) {
            alert("Özel süre en az 5 saniye olmalıdır.");
            return;
        }
    } else {
        kalanSure = Number(sureSecimi.value);
    }

    window.scrollTo(0, 0);
    puan = 0;
    oyunAktif = true;
    ustUsteYanlis = 0;
    ustUsteHedef = 0;
    sonYanlis = "";

    hedefYazisi.textContent = (document.getElementById("yazimSecimi").value === "kucuk")
        ? hedef
        : (document.getElementById("yazimSecimi").value === "buyuk")
            ? hedef.toLocaleUpperCase("tr-TR")
            : hedef.toLocaleUpperCase("tr-TR") + " " + hedef;
    puanYazisi.textContent = puan;
    sureYazisi.textContent = kalanSure;

    ayarEkrani.style.display = "none";
    oyunEkrani.style.display = "block";
    sonucPenceresi.style.display = "none";

    delikleriTemizle();

    clearInterval(sureSayaci);
    clearTimeout(sonrakiKostebek);
    clearTimeout(kaybolmaSayaci);

    kostebekCikar();

    sureSayaci = setInterval(() => {
        kalanSure--;
        sureYazisi.textContent = kalanSure;

        if (kalanSure <= 0) {
            oyunuBitir();
        }
    }, 1000);
}

function havuzSec() {
    if (turSecimi.value === "harf") return alfabe;
    if (turSecimi.value === "hece") return heceler;
    if (turSecimi.value === "kelime") return kelimeler;
    if (turSecimi.value === "sayi") return sayilar;

    if (/^[0-9]+$/.test(hedef)) return sayilar;
    if (hedef.length === 1) return alfabe;
    if (hedef.length <= 3) return heceler;
    return kelimeler;
}

/* Hedef ne sıklıkla çıksın? Yaklaşık her iki köstebekten biri hedef olur.
   Arka arkaya en fazla 2 yanlış, en fazla 2 doğru gelir (şansa bırakılmaz). */
const HEDEF_ORANI = 0.5;
let ustUsteYanlis = 0;
let ustUsteHedef = 0;
let sonYanlis = "";

function yanlisSec() {
    const havuz = havuzSec().filter(item => kucult(item) !== hedef && item !== sonYanlis);

    /* Hedefe benzeyenleri (aynı harfle başlayan / aynı uzunlukta) biraz öne al */
    const benzer = havuz.filter(item =>
        hedef.length > 1 && (item[0] === hedef[0] || item[item.length - 1] === hedef[hedef.length - 1])
    );
    const kaynak = (benzer.length >= 3 && Math.random() < 0.5) ? benzer : havuz;

    sonYanlis = kaynak[Math.floor(Math.random() * kaynak.length)];
    return sonYanlis;
}

function icerikSec() {
    let hedefGelsin = Math.random() < HEDEF_ORANI;

    if (ustUsteYanlis >= 2) hedefGelsin = true;
    if (ustUsteHedef >= 2) hedefGelsin = false;

    if (hedefGelsin) {
        ustUsteHedef++;
        ustUsteYanlis = 0;
        return hedef;
    }

    ustUsteYanlis++;
    ustUsteHedef = 0;
    return yanlisSec();
}

function kostebekCikar() {
    if (!oyunAktif) return;
    delikleriTemizle();
    const rastgeleDelik = delikler[Math.floor(Math.random() * delikler.length)];
    const icerik = yazimUygula(icerikSec());
    const alan = rastgeleDelik.querySelector(".kostebekAlani");
    const container = document.createElement("div");
    container.className = "kostebek-container";
    container.innerHTML = '<img class="kostebekResim" alt="" src="' + KOSTEBEK + '">';
    const tabela = document.createElement("div");
    tabela.className = "tabela";
    tabela.textContent = icerik;
    const vur = document.createElement("div");
    vur.className = "vurAlani";
    container.dataset.deger = icerik;
    container.dataset.vuruldu = "hayir";
    const gizle = () => {
        container.classList.remove("yukari");
        tabela.classList.remove("gorunur");
        vur.remove();
        setTimeout(() => { container.remove(); tabela.remove(); }, 260);
    };
    const vuruldu = (event) => {
        event.stopPropagation();
        event.preventDefault();
        if (!oyunAktif || container.dataset.vuruldu === "evet") return;
        container.dataset.vuruldu = "evet";
        if (kucult(container.dataset.deger) === hedef) {
            puan += 10;
            tabela.classList.add("dogru");
            mesajGoster("Doğru! +10", "#86efac");
        } else {
            puan -= 5;
            tabela.classList.add("yanlis");
            mesajGoster("Yanlış! -5", "#fca5a5");
        }
        puanYazisi.textContent = puan;
        setTimeout(gizle, 350);
    };
    vur.addEventListener("pointerdown", vuruldu);
    tabela.addEventListener("pointerdown", vuruldu);
    alan.appendChild(container);
    rastgeleDelik.appendChild(tabela);
    rastgeleDelik.appendChild(vur);
    setTimeout(() => {
        container.classList.add("yukari");
        tabela.classList.add("gorunur");
    }, 20);
    kaybolmaSayaci = setTimeout(() => {
        if (container.dataset.vuruldu !== "evet") gizle();
    }, 1800);
    sonrakiKostebek = setTimeout(() => {
        kostebekCikar();
    }, 2200);
}
/* Uzun kelimeler kesilmesin: yazı tabelaya sığana kadar küçültülür */
function tabelaSigdir(tabela) {
    return; /* yazılar küçültülmez, tabela genişler */
    if (!tabela) return;
    tabela.style.fontSize = "";
    tabela.style.paddingLeft = "";
    tabela.style.paddingRight = "";
    let boyut = parseFloat(getComputedStyle(tabela).fontSize);
    if (tabela.scrollWidth > tabela.clientWidth) {
        tabela.style.paddingLeft = "6px";
        tabela.style.paddingRight = "6px";
    }
    while (tabela.scrollWidth > tabela.clientWidth && boyut > 12) {
        boyut -= 1;
        tabela.style.fontSize = boyut + "px";
    }
}

window.addEventListener("resize", () => {
    document.querySelectorAll(".tabela").forEach(tabelaSigdir);
});

function delikleriTemizle() {
    document.querySelectorAll(".kostebek-container, .tabela, .vurAlani").forEach(el => el.remove());
}

function mesajGoster(yazi, renk) {
    mesaj.textContent = yazi;
    mesaj.style.color = renk;
    mesaj.classList.remove("goster");
    void mesaj.offsetWidth;
    mesaj.classList.add("goster");
}

function oyunuBitir() {
    oyunAktif = false;

    clearInterval(sureSayaci);
    clearTimeout(sonrakiKostebek);
    clearTimeout(kaybolmaSayaci);

    delikleriTemizle();

    sonucMetni.innerHTML =
        `Toplam puanın:<br>
         <strong style="font-size: 42px; color: #19713b;">${puan}</strong>`;

    sonucPenceresi.style.display = "flex";
}

function ayarlaraDon() {
    oyunAktif = false;

    clearInterval(sureSayaci);
    clearTimeout(sonrakiKostebek);
    clearTimeout(kaybolmaSayaci);

    delikleriTemizle();

    oyunEkrani.style.display = "none";
    ayarEkrani.style.display = "flex";
    sonucPenceresi.style.display = "none";
}
</script>

    });
    sel.insertAdjacentElement('afterend',grup);
  });
