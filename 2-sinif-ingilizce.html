<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2. Sınıf İngilizce · Dijital Öğretmen</title>
<meta name="description" content="Türkiye Yüzyılı Maarif Modeli 2. sınıf İngilizce dersi: 6 tema, sesli kelime kartları, cümle kalıpları, oyunlar ve testler.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF5EA; --card:#FFFFFF; --ink:#33302C; --soft:#6B635A;
  --red:#C8443A; --red-d:#A8352C; --amber:#E9A13B; --green:#4FA96B;
  --blue:#3E86C8; --purple:#8A5FBF; --line:#EADFCB; --shadow:0 4px 0 #EADFCB;
}
body{font-family:'Andika','Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(160deg,#C8443A,#E4644F 55%,#E9A13B);color:#fff;
  padding-block:26px 54px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -74px -40px;height:110px;
  background:var(--bg);border-radius:50% 50% 0 0}
.hero .wrap{position:relative;z-index:2;text-align:center}
.badge{display:inline-block;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);
  padding:5px 16px;border-radius:999px;font-weight:700;font-size:15px;margin-bottom:10px}
.hero h1{font-size:clamp(26px,6vw,40px);font-weight:700;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.hero p{font-size:clamp(14px,3.4vw,17px);opacity:.95;margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 10px;scrollbar-width:none;
  max-width:1100px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:10px 14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--soft);
  cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab .n{background:var(--line);color:var(--soft);width:24px;height:24px;border-radius:8px;
  display:grid;place-items:center;font-size:13px}
.tab.on{background:var(--red);border-color:var(--red-d);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.tab.on .n{background:rgba(255,255,255,.28);color:#fff}
section.blk{background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
h2.sec{font-size:clamp(18px,4.5vw,23px);font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px}
h2.sec .dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
h3.grp{font-size:16px;font-weight:700;color:var(--red-d);margin:16px 0 10px;padding-left:10px;
  border-left:5px solid var(--amber);border-radius:2px}
.scene{width:100%;display:block;border-radius:18px;border:2px solid var(--line);background:#EAF4FB}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#FFF6E6;border:2px solid #F3DFB8;color:#8A6520;border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px 10px;
  text-align:center;cursor:pointer;transition:transform .12s;box-shadow:var(--shadow)}
.wc:active{transform:translateY(3px);box-shadow:none}
.wc svg,.wc img{width:64px;height:64px;display:block;margin:0 auto 6px}
.wc .en{font-weight:700;font-size:17px;color:var(--ink);line-height:1.2}
.wc .tr{font-size:13px;color:var(--soft);margin-top:3px}
.wc .sp{margin-top:6px;font-size:15px;opacity:.55}
.wc.play{border-color:var(--green);background:#F1FBF4}
.chunks{display:grid;gap:10px}
.ch{background:#F7FAFF;border:2px solid #DCE8F7;border-radius:16px;padding:12px 14px;cursor:pointer}
.ch .q{font-weight:700;font-size:16px;color:#26517E}
.ch .a{font-size:16px;color:#1F6B45;margin-top:2px}
.ch .t{font-size:13px;color:var(--soft);margin-top:5px}
.game{background:#FFFDF7;border:2px dashed #E6D3AE;border-radius:20px;padding:14px;margin-top:14px}
.game h4{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.game .hint{font-size:13px;color:var(--soft);margin-bottom:12px}
.btn{font-family:inherit;font-weight:700;font-size:15px;border:none;border-radius:14px;
  padding:11px 18px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.g{background:var(--green);box-shadow:0 4px 0 #3B8252}
.btn.b{background:var(--blue);box-shadow:0 4px 0 #2F6A9F}
.btn.sm{font-size:14px;padding:8px 14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mc{aspect-ratio:1;border:2px solid var(--line);border-radius:16px;background:#fff;display:grid;
  place-items:center;cursor:pointer;padding:6px;text-align:center;font-weight:700;font-size:14px}
.mc svg,.mc img{width:48px;height:48px}
.mc.sel{border-color:var(--blue);background:#EDF5FD}
.mc.ok{border-color:var(--green);background:#EFFAF2;opacity:.55;pointer-events:none}
.mc.no{border-color:var(--red);background:#FDEEEC;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.opt{border:2px solid var(--line);border-radius:16px;background:#fff;padding:10px 8px;cursor:pointer;
  text-align:center;font-weight:700;font-size:15px}
.opt svg,.opt img{width:52px;height:52px;display:block;margin:0 auto 4px}
.opt.ok{border-color:var(--green);background:#EFFAF2}
.opt.no{border-color:var(--red);background:#FDEEEC}
.score{font-weight:700;font-size:15px;color:var(--soft);margin-top:10px}
.qz{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.qz .qq{font-weight:700;font-size:16px;margin-bottom:10px}
.qz .qo{display:grid;gap:8px}
.qz button{font-family:inherit;text-align:left;font-size:15px;font-weight:700;background:#FBF7EE;
  border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.qz button.ok{background:#EFFAF2;border-color:var(--green)}
.qz button.no{background:#FDEEEC;border-color:var(--red)}
.teach{background:#F4F9F5;border:2px solid #CFE7D6;border-radius:20px;padding:16px}
.teach h2{color:#2E6B45}
.teach li{margin:0 0 9px 20px;font-size:15px;line-height:1.5}
.pron{display:flex;flex-wrap:wrap;gap:10px}
.pr{background:#F6F1FB;border:2px solid #DFCFF0;border-radius:16px;padding:10px 14px;cursor:pointer;
  font-weight:700;color:#5C3C86;font-size:15px}
footer{text-align:center;padding:26px 16px 34px;color:var(--soft);font-size:14px;font-weight:700}
footer .brand{color:var(--red-d)}
@media(max-width:420px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
  .wc svg,.wc img{width:54px;height:54px}
}
</style>
</head>

  var t=DATA.t[T], h='';
  document.querySelectorAll('.tab').forEach(function(b,i){ b.classList.toggle('on', i===T); });

  h+='<section class="blk"><h2 class="sec"><span class="dot" style="background:#FDEDE9">'+t.emo+'</span>'+
     'Tema '+(T+1)+': '+esc(t.tr)+'</h2>'+
     '<div style="font-size:15px;color:var(--soft);margin:-6px 0 12px">'+esc(t.en)+'</div>'+
     t.scene+
     '<div class="subs">'+t.sub.map(function(s){return '<span class="chip">'+esc(s)+'</span>'}).join('')+'</div></section>';

  h+='<section class="blk"><h2 class="sec"><span class="dot" style="background:#FFF3DA">🗣️</span>Kelimelerimiz</h2>'+
     '<div style="font-size:14px;color:var(--soft);margin:-8px 0 6px">Karta dokun, kelimeyi dinle.</div>';
  t.g.forEach(function(g,gi){
    h+='<h3 class="grp">'+esc(g.t)+'</h3><div class="cards">';
    g.w.forEach(function(w,wi){
      h+='<div class="wc" data-say="'+esc(w[0])+'">'+ic(w[2])+
         '<div class="en">'+esc(w[0])+'</div><div class="tr">'+esc(w[1])+'</div><div class="sp">🔊</div></div>';
    });
    h+='</div>';
  });
  h+='</section>';

  h+='<section class="blk"><h2 class="sec"><span class="dot" style="background:#E7F1FD">💬</span>Cümle Kalıpları</h2><div class="chunks">';
  t.ch.forEach(function(c){
    h+='<div class="ch" data-say="'+esc(c[0]+' '+c[1])+'"><div class="q">❓ '+esc(c[0])+'</div>'+
       '<div class="a">✅ '+esc(c[1])+'</div><div class="t">'+esc(c[2])+' 🔊</div></div>';
  });
  h+='</div>';
  if(t.pr&&t.pr.length){
    h+='<h3 class="grp">Sesler · Pronunciation</h3><div class="pron">'+
       t.pr.map(function(p){return '<div class="pr" data-say="'+esc(p[1])+'">'+esc(p[0])+' → '+esc(p[1])+' 🔊</div>'}).join('')+'</div>';
  }
  h+='</section>';

  h+='<section class="blk"><h2 class="sec"><span class="dot" style="background:#EDF7EF">🎮</span>Oyunlar</h2>'+
     '<div class="game"><h4>🧩 Eşleştir</h4><div class="hint">Resmi Türkçesiyle eşleştir.</div><div id="g1"></div></div>'+
     '<div class="game"><h4>👂 Dinle ve Bul</h4><div class="hint">Duyduğun kelimenin resmine dokun.</div><div id="g2"></div></div>'+
     '<div class="game"><h4>🃏 Hafıza Oyunu</h4><div class="hint">Aynı kelimenin resmini ve yazısını bul.</div><div id="g3"></div></div>'+
     '</section>';

  h+='<section class="blk"><h2 class="sec"><span class="dot" style="background:#FDEDE9">📝</span>Mini Test</h2><div id="qz"></div></section>';

  h+='<section class="blk teach"><h2 class="sec"><span class="dot" style="background:#DCEFE2">🍎</span>Öğretmen Köşesi</h2>'+
     '<div style="font-size:14px;color:var(--soft);margin:-8px 0 10px">Sınıfta gerçek materyallerle yapılabilecek etkinlikler:</div><ul>'+
     t.tk.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>';

  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-say]').forEach(function(el){
    el.addEventListener('click',function(){ say(el.dataset.say);
      el.classList.add('play'); setTimeout(function(){el.classList.remove('play')},600); });
  });
  gMatch(); gListen(); gMemo(); gQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

function gMatch(){
  var w=sh(allWords(DATA.t[T])).slice(0,6), box=document.getElementById('g1'), sel=null, done=0;
  var left=sh(w), right=sh(w);
  box.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
    '<div id="ml" class="mgrid" style="grid-template-columns:1fr"></div>'+
    '<div id="mr" class="mgrid" style="grid-template-columns:1fr"></div></div>'+
    '<div class="score" id="ms">0 / 6</div>';
  var L=document.getElementById('ml'), R=document.getElementById('mr');
  L.innerHTML=left.map(function(x){return '<div class="mc" style="aspect-ratio:auto;padding:10px" data-k="'+x[0]+'">'+ic(x[2])+'</div>'}).join('');
  R.innerHTML=right.map(function(x){return '<div class="mc" style="aspect-ratio:auto;padding:10px;font-size:14px" data-k="'+x[0]+'">'+esc(x[1])+'</div>'}).join('');
  function click(e){ var el=e.currentTarget;
    if(!sel){ sel=el; el.classList.add('sel'); say(el.dataset.k); return; }
    if(sel===el){ el.classList.remove('sel'); sel=null; return; }
    if(sel.parentNode===el.parentNode){ sel.classList.remove('sel'); sel=el; el.classList.add('sel'); return; }
    if(sel.dataset.k===el.dataset.k){ sel.classList.add('ok'); el.classList.add('ok');
      sel.classList.remove('sel'); sel=null; done++; document.getElementById('ms').textContent=done+' / 6';
      if(done===6) document.getElementById('ms').textContent='🎉 Harika! 6 / 6';
    } else { el.classList.add('no'); var s=sel; setTimeout(function(){el.classList.remove('no');s.classList.remove('sel')},350); sel=null; }
  }
  box.querySelectorAll('.mc').forEach(function(el){ el.addEventListener('click',click) });
}

function gListen(){
  var all=allWords(DATA.t[T]), box=document.getElementById('g2'), score=0, n=0, cur=null;
  function round(){
    var pick=sh(all).slice(0,4); cur=pick[Math.random()*4|0];
    box.innerHTML='<button class="btn b sm" id="lp">🔊 Tekrar dinle</button>'+
      '<div class="opts">'+pick.map(function(x){return '<div class="opt" data-k="'+esc(x[0])+'">'+ic(x[2])+esc(x[1])+'</div>'}).join('')+'</div>'+
      '<div class="score">Puan: '+score+' / '+n+'</div>';
    document.getElementById('lp').onclick=function(){ say(cur[0]) };
    setTimeout(function(){say(cur[0])},250);
    box.querySelectorAll('.opt').forEach(function(el){ el.onclick=function(){
      n++; if(el.dataset.k===cur[0]){ el.classList.add('ok'); score++; } else { el.classList.add('no');
        box.querySelectorAll('.opt').forEach(function(o){ if(o.dataset.k===cur[0]) o.classList.add('ok') }); }
      box.querySelectorAll('.opt').forEach(function(o){o.onclick=null});
      setTimeout(round,1100); } });
  }
  round();
}

function gMemo(){
  var w=sh(allWords(DATA.t[T])).slice(0,6), box=document.getElementById('g3'), open=[], found=0;
  var deck=sh(w.map(function(x){return {k:x[0],t:'i',x:x}}).concat(w.map(function(x){return {k:x[0],t:'w',x:x}})));
  box.innerHTML='<div class="mgrid" id="mm">'+deck.map(function(c,i){
      return '<div class="mc" data-i="'+i+'" data-k="'+esc(c.k)+'"><span style="font-size:26px">❔</span></div>' }).join('')+
    '</div><div class="score" id="mss">0 / 6 çift</div>';
  box.querySelectorAll('.mc').forEach(function(el){
    el.onclick=function(){
      if(open.length>=2||el.classList.contains('ok')||el.classList.contains('sel')) return;
      var c=deck[+el.dataset.i];
      el.innerHTML = c.t==='i' ? ic(c.x[2]) : '<span style="font-size:14px">'+esc(c.x[0])+'</span>';
      el.classList.add('sel'); say(c.x[0]); open.push(el);
      if(open.length===2){
        var a=open[0],b=open[1];
        if(a.dataset.k===b.dataset.k && a!==b){ a.classList.add('ok'); b.classList.add('ok');
          a.classList.remove('sel'); b.classList.remove('sel'); open=[]; found++;
          document.getElementById('mss').textContent = found===6?'🎉 Tebrikler! 6 / 6 çift':found+' / 6 çift';
        } else { setTimeout(function(){ [a,b].forEach(function(z){ z.classList.remove('sel');
            z.innerHTML='<span style="font-size:26px">❔</span>' }); open=[]; },850); }
      }
    };
  });
}

function gQuiz(){
  var q=DATA.t[T].qz, box=document.getElementById('qz'), sc=0, ans=0;
  box.innerHTML=q.map(function(x,i){
    return '<div class="qz"><div class="qq">'+(i+1)+'. '+esc(x[0])+'</div><div class="qo">'+
      sh(x[1].map(function(o,j){return [o,j===x[2]]})).map(function(p){
        return '<button data-ok="'+(p[1]?1:0)+'">'+esc(p[0])+'</button>' }).join('')+'</div></div>';
  }).join('')+'<div class="score" id="qs">0 / '+q.length+'</div>';
  box.querySelectorAll('.qz').forEach(function(card){
    card.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        if(card.dataset.done) return; card.dataset.done=1; ans++;
        if(b.dataset.ok==='1'){ b.classList.add('ok'); sc++; }
        else { b.classList.add('no'); card.querySelectorAll('button').forEach(function(z){ if(z.dataset.ok==='1') z.classList.add('ok') }); }
        document.getElementById('qs').textContent = sc+' / '+q.length + (ans===q.length? (sc===q.length?'  🎉 Mükemmel!':'  👍 Tekrar dene!') :'');
      };
    });
  });
}

document.querySelectorAll('.tab').forEach(function(b,i){ b.onclick=function(){ T=i; render(); } });
render();
</script>
