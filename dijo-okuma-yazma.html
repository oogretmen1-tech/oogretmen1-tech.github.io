:root{--ink:#16324f;--sari:#ffc21a;--sari2:#ff9f0a;--mavi:#1f7bf2;--mavi2:#0b55c4;--yesil:#19b46b;--mor:#8a4be0;--pembe:#f0447e;--kirmizi:#e5352f;--kart:#fff;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Dijo','Poppins',Arial,sans-serif;font-weight:500;color:var(--ink);background:linear-gradient(#49b6ff 0%,#8fd6ff 45%,#d9f3ff 75%,#b9ec8a 75.2%,#7fd058 100%) fixed;min-height:100%;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 90px}
.scr{display:none}.scr.on{display:block}
svg{display:block;width:100%;height:100%}
.ic{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em}

/* kapak */
#kapak{text-align:center;padding-top:4vh}
.bulut{position:absolute;background:#fff;border-radius:60px;height:44px;opacity:.9;animation:kay 38s linear infinite}
.bulut:before,.bulut:after{content:"";position:absolute;background:#fff;border-radius:50%}
.bulut:before{width:54px;height:54px;top:-24px;left:18px}.bulut:after{width:40px;height:40px;top:-16px;right:20px}
@keyframes kay{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
.gok{position:fixed;inset:0 0 auto 0;height:40vh;pointer-events:none;z-index:0;overflow:hidden}
.wrap{position:relative;z-index:1}
.dijo{width:min(44vw,210px);filter:drop-shadow(0 10px 0 rgba(0,40,90,.18));animation:salla 3s ease-in-out infinite}
@keyframes salla{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.baslik{margin:6px 0 2px;font-weight:700;line-height:1.05;font-size:clamp(46px,13vw,84px);color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 var(--mavi2),0 8px 0 rgba(0,40,90,.25)}
.baslik span{color:var(--sari)}
.alt{display:inline-block;background:#fff;border:4px solid var(--mavi2);border-radius:999px;padding:6px 20px;font-weight:700;font-size:clamp(18px,5vw,28px);color:var(--mavi2)}
.harfler-serit{display:flex;justify-content:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.harfler-serit b{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:30px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--sari);color:#3a2500;font-weight:700;border-radius:999px;padding:14px 34px;font-size:26px;border:4px solid #fff;box-shadow:0 7px 0 var(--sari2),0 12px 18px rgba(0,0,0,.2)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sari2)}
#kapak .btn{font-size:32px;padding:16px 54px;margin-top:16px}
.not{margin-top:14px;font-size:15px;color:#0d3b66}

/* üst çubuk */
.ust{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.yuv{width:54px;height:54px;border-radius:50%;background:#fff;border:4px solid var(--mavi2);box-shadow:0 5px 0 var(--mavi2);padding:9px;flex:none}
.yuv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mavi2)}
.ust h2{flex:1;margin:0;font-size:clamp(20px,5.4vw,30px);font-weight:700;color:#fff;text-shadow:0 3px 0 var(--mavi2)}
.yildiz{display:flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--sari2);border-radius:999px;padding:5px 14px 5px 8px;font-weight:700;font-size:22px}
.yildiz i{width:30px;height:30px}

/* menü */
.dijoSoz{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--mavi2);border-radius:var(--r);padding:8px 14px;margin-bottom:14px;font-size:18px}
.dijoSoz img{width:54px;flex:none}
.dijoSoz b{color:var(--mavi2)}
.bolum{margin:16px 0 8px;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,40,90,.45)}
.gruplar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grup{background:#fff;border:4px solid #c9d8ea;border-radius:16px;padding:6px 2px;font-weight:700;font-size:15px;line-height:1.15;color:#6b7f95}
.grup small{display:block;font-size:17px;letter-spacing:1px;color:var(--ink)}
.grup.on{background:var(--sari);border-color:var(--sari2);color:#3a2500;box-shadow:0 5px 0 var(--sari2);transform:translateY(-3px)}
.kutular{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.kutular{grid-template-columns:repeat(4,1fr)}}
.kutu{border-radius:var(--r);color:#fff;padding:14px 8px 12px;text-align:center;font-weight:700;font-size:20px;border:4px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.kutu:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.kutu i{display:block;width:64px;height:64px;margin:0 auto 6px;background:#fff;border-radius:18px;padding:9px}
.kutu small{display:block;font-weight:500;font-size:13px;opacity:.95}
.t1{background:#ffb400;color:#3a2500}.t2{background:#ff8a1f}.t3{background:#f0582a}.t4{background:#e5352f}
.m1{background:#27a3ff}.m2{background:#1f7bf2}.m3{background:#0b55c4}
.o1{background:#8a4be0}.o2{background:#c13fd0}.o3{background:#f0447e}.d1{background:#19b46b}

/* sahne */
.kart{background:var(--kart);border:5px solid var(--mavi2);border-radius:28px;padding:16px 14px 20px;box-shadow:0 9px 0 rgba(0,40,90,.25);text-align:center;min-height:56vh}
.yonerge{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(17px,4.6vw,22px);font-weight:700;margin:0 0 12px}
.ses{width:46px;height:46px;border-radius:50%;background:var(--mavi);padding:9px;box-shadow:0 4px 0 var(--mavi2);flex:none}
.ses:active{transform:translateY(3px);box-shadow:none}
.secenek{display:flex;justify-content:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.secenek button{border:3px solid #c9d8ea;border-radius:999px;padding:5px 16px;font-weight:700;font-size:16px;background:#f3f8ff}
.secenek button.on{background:var(--mavi);border-color:var(--mavi2);color:#fff}
.resim{width:min(42vw,170px);height:min(42vw,170px);margin:0 auto 10px;background:#eef7ff;border-radius:26px;padding:16px;border:4px solid #cfe6ff}
.model{font-size:clamp(54px,16vw,92px);font-weight:700;line-height:1;margin:4px 0 10px}
.sira{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.slot{min-width:58px;height:70px;border:4px dashed #9db7d6;border-radius:16px;background:#f3f8ff;display:grid;place-items:center;padding:0 4px}
.slot.full{border-style:solid;border-color:var(--yesil);background:#e9fbf1}
.havuz{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px;min-height:76px}
.tile{touch-action:none;min-width:58px;height:62px;padding:0 14px;border-radius:16px;font-size:34px;font-weight:700;background:#fff;border:4px solid var(--mavi);color:var(--mavi2);box-shadow:0 5px 0 var(--mavi2);position:relative;z-index:2;line-height:1}
.tile.unlu{border-color:var(--kirmizi);color:var(--kirmizi);box-shadow:0 5px 0 #a81f1b}
.tile.hece{background:var(--sari);border-color:var(--sari2);color:#3a2500;box-shadow:0 5px 0 #c97800}
.tile.soz{background:#19b46b;border-color:#0f8a50;color:#fff;box-shadow:0 5px 0 #0b6b3e;font-size:28px}
.tile.sayi{background:var(--mavi);border-color:var(--mavi2);color:#fff}
.tile.drag{z-index:50;box-shadow:0 14px 18px rgba(0,0,0,.3);transition:none}
.tile.done{box-shadow:none;height:54px;min-width:46px}
.salla{animation:hayir .4s}
@keyframes hayir{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.sonuc{font-size:clamp(34px,10vw,56px);font-weight:700;color:var(--yesil);min-height:1.2em;margin-top:8px}
.unl{color:var(--kirmizi)}.uns{color:var(--mavi2)}

/* harfler */
.hgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.hgrid button{aspect-ratio:1;border-radius:14px;padding:0;white-space:nowrap;font-size:clamp(17px,5vw,32px);font-weight:700;background:#f3f8ff;border:4px solid var(--mavi);color:var(--mavi2)}
.hgrid button.unlu{border-color:var(--kirmizi);color:var(--kirmizi)}
.hgrid button.sec{background:var(--sari);transform:scale(1.08)}
.hgrid button.kilit{opacity:.35}
.hdetay{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.hbuyuk{font-size:clamp(84px,24vw,140px);font-weight:700;line-height:1}
.hkelime{font-size:clamp(30px,8vw,44px);font-weight:700}

/* seçmeli */
.uclu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.sec{background:#f3f8ff;border:4px solid #cfe6ff;border-radius:22px;padding:12px;aspect-ratio:1}
.sec.dogru{border-color:var(--yesil);background:#e9fbf1}
.sec span{display:block;font-weight:700;font-size:20px}
.rakamlar{display:flex;justify-content:center;gap:12px;margin-top:18px}
.rakam{width:78px;height:78px;border-radius:22px;background:var(--mavi);color:#fff;font-size:40px;font-weight:700;border:4px solid #fff;box-shadow:0 6px 0 var(--mavi2)}
.rakam:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mavi2)}
.onluk{display:inline-grid;grid-template-columns:repeat(5,1fr);gap:4px;border:4px solid var(--mavi2);border-radius:14px;padding:5px;margin:4px;background:#eef7ff;vertical-align:top}
.onluk i{width:clamp(34px,10.5vw,52px);height:clamp(34px,10.5vw,52px);border-radius:8px;background:#fff;padding:4px;display:block}
.onluk i.sil{opacity:.28;position:relative}
.onluk i.sil:after{content:"";position:absolute;left:8%;right:8%;top:46%;height:5px;background:var(--kirmizi);transform:rotate(-40deg);border-radius:3px}
.onluk.b{border-color:var(--sari2);background:#fff6dc}
.islem{display:flex;justify-content:center;align-items:center;gap:10px;font-size:46px;font-weight:700;margin-top:12px}

/* balon + hafıza */
.balonlar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:6px}
.balon{position:relative;aspect-ratio:.82;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;color:#fff;font-size:clamp(30px,9vw,46px);font-weight:700;animation:zipla 2.4s ease-in-out infinite;box-shadow:inset -8px -10px 0 rgba(0,0,0,.14)}
.balon:after{content:"";position:absolute;left:50%;bottom:-16px;width:3px;height:16px;background:#8aa}
.balon.pat{animation:pat .3s forwards}
@keyframes pat{to{transform:scale(1.5);opacity:0}}
.hafiza{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hk{aspect-ratio:.86;border-radius:16px;background:var(--mor);border:4px solid #fff;box-shadow:0 5px 0 #5a2aa3;font-weight:700;font-size:clamp(15px,4.4vw,22px);color:var(--ink);padding:8px;display:grid;place-items:center;overflow:hidden}
.hk>*{visibility:hidden}.hk.ac,.hk.tam{background:#fff;border-color:var(--mor)}.hk.ac>*,.hk.tam>*{visibility:visible}.hk.tam{border-color:var(--yesil);box-shadow:none}
.dav{display:flex;justify-content:center;gap:18px;margin-top:18px}
.dav button{width:110px;border-radius:24px;padding:12px;font-weight:700;font-size:17px;border:4px solid #fff;color:#fff}
.dav button i{display:block;width:60px;height:60px;margin:0 auto 4px}
.dav .e{background:var(--yesil);box-shadow:0 6px 0 #0f8a50}.dav .h{background:var(--kirmizi);box-shadow:0 6px 0 #a81f1b}
.cumle{font-size:clamp(24px,7vw,36px);font-weight:700;margin:8px 0}


/* harf yazma */
.defter{position:relative;max-width:520px;margin:0 auto;border:4px solid var(--mavi2);border-radius:18px;background:#fff;overflow:hidden;touch-action:none}
.defter svg{display:block}.defter canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.anlat{font-size:clamp(16px,4.4vw,21px);font-weight:500;min-height:3.2em;margin:10px 4px 0}
.anlat b{color:var(--mavi2)}
.ybtn{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.ybtn button{border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;color:#fff;background:var(--mavi);box-shadow:0 4px 0 var(--mavi2)}
.ybtn button.s{background:var(--sari);color:#3a2500;box-shadow:0 4px 0 #c97800}.ybtn button.g{background:var(--yesil);box-shadow:0 4px 0 #0f8a50}
.hserit{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px}
.hserit button{flex:none;width:46px;height:46px;border-radius:12px;font-size:24px;font-weight:700;background:#f3f8ff;border:3px solid var(--mavi);color:var(--mavi2)}
.hserit button.unlu{border-color:var(--kirmizi);color:var(--kirmizi)}.hserit button.sec{background:var(--sari)}
/* Dijo alkış */
#alkis{position:fixed;left:0;right:0;bottom:0;z-index:99;display:none;pointer-events:none;text-align:center;padding-bottom:10px;background:linear-gradient(transparent,rgba(255,255,255,.92) 45%)}
#alkis.on{display:block}
#alkis .s{display:flex;justify-content:center;align-items:flex-end;gap:4px}
#alkis img{width:120px;animation:hop .5s ease-in-out infinite alternate}
#alkis i{width:58px;height:58px;animation:cak .25s ease-in-out infinite alternate}
#alkis i:last-child{animation-delay:.12s;transform:scaleX(-1)}
@keyframes hop{to{transform:translateY(-26px) rotate(4deg)}}
@keyframes cak{to{transform:scale(1.3) rotate(-14deg)}}
#alkis b{display:block;font-size:34px;color:var(--mavi2)}
.konfeti{position:fixed;top:-20px;width:12px;height:18px;z-index:98;border-radius:3px;animation:dus 1.5s linear forwards;pointer-events:none}
@keyframes dus{to{transform:translateY(105vh) rotate(540deg)}}
footer{text-align:center;font-size:13px;color:#134b12;padding:18px 10px 8px;position:relative;z-index:1}
footer b{font-size:15px}
</style>
</head>

  const bitir=e=>{if(!on)return;on=false;b.classList.remove('drag');b.style.transform='';let s;
