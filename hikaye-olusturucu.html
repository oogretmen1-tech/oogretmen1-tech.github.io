    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli Hikâye Çarkı 🎡</title>
    <style>
        :root { 
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card: rgba(255, 255, 255, 0.1);
            --accent: #ffd700;
            --text: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg);
            color: var(--text);
            font-family: DORakam,'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 3em; margin: 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { text-align: center; font-size: 1.2em; margin-bottom: 40px; opacity: 0.9; }
        
        .wheels-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        
        .wheel-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.18);
            transition: transform 0.3s;
        }
        .wheel-card:hover { transform: translateY(-5px); }
        
        .wheel-card h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .wheel-display {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 30px 20px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            border: 2px solid var(--accent);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
        }
        
        .spinning {
            animation: spin 0.5s linear;
        }
        
        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255,215,0,0.6);
        }
        
        .wheel-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 30px;
            font-size: 1em;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        #storyOutput {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            margin-top: 50px;
            line-height: 2;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: none;
        }
        
        #storyOutput h2 {
            color: var(--accent);
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .story-text {
            text-align: justify;
            text-indent: 2em;
            margin-bottom: 20px;
        }
        
        .story-meta {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,215,0,0.3);
            font-style: italic;
            opacity: 0.8;
            text-align: center;
        }
    </style>

<script>

    // Hikaye şablonları - Her kombinasyon için özel hikaye
    const storyTemplates = {
        default: function(k, m, z, o) {
            return `

                <p class="story-text">

                    kimsenin bulamadığı o efsanevi yere ulaştı.
                </p>

                <p class="story-text">
                    Karşısında duran kapıyı açtığında ${k.name}, gördükleriyle şaşkına döndü. İçeride sadece altınlar ve mücevherler 
                    yoktu. Orada, tüm dünyayı değiştirebilecek bir güç ve bilgi saklıydı. Ama bu gücü kullanmak, büyük bir sorumluluk

                    Yıllar sonra, ${k.name}'in hikâyesi nesiller boyu anlatıldı. İnsanlar ona "Efsane ${k.text.split(' ')[1]}" demeye 
                    başladılar. Çünkü o, sıradan biri olmasına rağmen, olağanüstü bir şey başarmıştı: korkularını yenmişti.
                </p>

                <div class="story-meta">
                    🎭 Kahraman: ${k.text} • 📍 Mekan: ${m.text} • ⏰ Zaman: ${z.text} • ⚡ Olay: ${o.text}
                </div>
            `;
        }
    };

    // Çarkları oluştur
    const container = document.getElementById('wheelsContainer');
    Object.keys(wheelData).forEach(category => {
        container.innerHTML += `
            <div class="wheel-card">
                <h3>${category}</h3>
                <div class="wheel-display" id="display-${category}">?</div>
                <button class="btn wheel-btn" onclick="spinWheel('${category}')">🎲 Çevir</button>
            </div>
        `;
    });

    // Çark çevirme fonksiyonu
    function spinWheel(category) {
        const display = document.getElementById(`display-${category}`);
        display.classList.add('spinning');
        
        setTimeout(() => {
            const items = wheelData[category];
            const selected = items[Math.floor(Math.random() * items.length)];
            display.textContent = selected.text;
            display.dataset.id = selected.id;
            display.dataset.full = JSON.stringify(selected);
            display.classList.remove('spinning');
            checkAllSpun();
        }, 500);
    }

    // Tüm çarkları çevir
    function spinAll() {
        Object.keys(wheelData).forEach((category, index) => {
            setTimeout(() => spinWheel(category), index * 200);
        });
    }

    // Tüm çarklar çevrildi mi kontrol et
    function checkAllSpun() {
        const allDisplays = document.querySelectorAll('.wheel-display');
        const allSpun = Array.from(allDisplays).every(d => d.dataset.id);
        if (allSpun) {
            document.getElementById('generateBtn').style.display = 'inline-block';
        }
    }

    // Hikaye oluştur
    function createStory() {
        const k = JSON.parse(document.getElementById('display-Karakter').dataset.full);
        const m = JSON.parse(document.getElementById('display-Mekan').dataset.full);
        const z = JSON.parse(document.getElementById('display-Zaman').dataset.full);
        const o = JSON.parse(document.getElementById('display-Olay').dataset.full);

        const output = document.getElementById('storyOutput');
        output.innerHTML = storyTemplates.default(k, m, z, o);
        output.style.display = 'block';
        
        setTimeout(() => {
            output.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }
</script>

<script data-goatcounter="https://dijitalogretmen.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script id="indir-sayac">(function(){var son={};function say(yol,baslik){var k=yol;if(son[k]&&Date.now()-son[k]<2000)return;son[k]=Date.now();var n=0;(function dene(){if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:yol,title:baslik,event:true});}else if(n++<20){setTimeout(dene,500);}})();}
function dosyaAdi(a){var d=a.getAttribute('download');if(d)return d;try{var u=new URL(a.href,location.href);if(u.protocol==='blob:'||u.protocol==='data:')return '';return decodeURIComponent(u.pathname.split('/').pop());}catch(e){return '';}}
function bak(a){if(!a||!a.href)return;var ad=dosyaAdi(a);var dl=a.hasAttribute('download');if(!ad&&dl)ad='dosya';if(!/\.(pdf|docx?|pptx?|xlsx?|zip)$/i.test(ad)&&!dl)return;var sayfa=location.pathname.split('/').pop()||'index.html';say('indir/'+(ad||sayfa),'İndirme: '+(ad||sayfa)+' ('+sayfa+')');}
document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;bak(a);},true);
var kc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(!this.isConnected)bak(this);return kc.apply(this,arguments);};
var kd=EventTarget.prototype.dispatchEvent;EventTarget.prototype.dispatchEvent=function(ev){if(this instanceof HTMLAnchorElement&&!this.isConnected&&ev&&ev.type==='click')bak(this);return kd.apply(this,arguments);};
window.addEventListener('beforeprint',function(){var sayfa=location.pathname.split('/').pop()||'index.html';say('yazdir/'+sayfa,'Yazdırma: '+sayfa);});})();</script>
