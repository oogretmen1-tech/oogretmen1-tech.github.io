<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mevsimlere Göre Giydirme Oyunu</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e8407a; --pink-d:#b8265a; --pink-l:#ffe4ef;
  --purple:#6a3fa0; --blue:#1668c1; --green:#2e7d32; --orange:#e2650a;
  --ink:#3b2b3a; --paper:#fff6fb; --card:#ffffff; --line:#f3c9dd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);font-family:'Andika',sans-serif;color:var(--ink);padding-bottom:30px}

/* ÜST BAŞLIK */
.top{background:linear-gradient(135deg,#e8407a,#8e44ad);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700;letter-spacing:.2px}
.puan{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);border-radius:30px;padding:5px 16px;font-size:16px;font-weight:700}

/* GÖREV ÇUBUĞU */
.gorev{background:#fff;border-bottom:3px solid var(--line);padding:10px 14px;position:sticky;top:0;z-index:40}
.gorev-yazi{font-size:16px;font-weight:700;color:var(--pink);text-align:center;margin-bottom:8px}
.mevsimler{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.mv{background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:6px 13px;font-family:'Andika',sans-serif;font-weight:700;font-size:13px;color:#9c5b7c;cursor:pointer;transition:.15s}
.mv:active{transform:scale(.94)}
.mv.on{color:#fff;border-color:transparent}
.mv[data-s="kis"].on{background:#1668c1}
.mv[data-s="yaz"].on{background:#e2650a}
.mv[data-s="ilkbahar"].on{background:#2e9e4b}
.mv[data-s="sonbahar"].on{background:#c1620a}
.mv[data-s="okul"].on{background:#6a3fa0}
.araclar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:20px;padding:7px 15px;font-family:'Andika',sans-serif;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:var(--pink)}
.btn.gri{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn.yesil{background:#2e7d32}
.btn:active{transform:scale(.95)}

/* OYUN ALANI */
.oyun{max-width:1080px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media(max-width:860px){.oyun{grid-template-columns:1fr;padding:10px;gap:10px}}

/* SAHNE */
.sahne{position:sticky;top:150px;z-index:30}
.sahne-kart{background:linear-gradient(180deg,#eaf6ff,#f6ecff);border:3px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
.dekor{position:absolute;inset:0;pointer-events:none;font-size:26px}
.dekor span{position:absolute;opacity:.55;animation:sallan 4s ease-in-out infinite}
@keyframes sallan{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bebek{display:block;margin:0 auto;width:auto;height:min(44vh,390px);max-width:100%}
.giyilenler{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#fff;border-top:3px solid var(--line);min-height:44px}
.cip{background:var(--pink-l);border:2px solid var(--line);border-radius:16px;padding:4px 8px 4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.cip button{border:none;background:#e8407a;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1}
.bos{color:#c39ab0;font-size:12.5px;font-weight:700;padding:6px}

/* GARDIROP */
.gardirop{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px}
.sekmeler{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:2px dashed var(--line);margin-bottom:10px;scrollbar-width:none}
.sekmeler::-webkit-scrollbar{display:none}
.sk{flex:0 0 auto;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:7px 13px;font-weight:700;font-size:13px;color:#9c5b7c;cursor:pointer;white-space:nowrap;font-family:'Andika',sans-serif}
.sk.on{background:var(--pink);border-color:var(--pink);color:#fff}
.izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:400px){.izgara{grid-template-columns:repeat(2,minmax(0,1fr))}}
.esya{background:#fff;border:2.5px solid #f6dce8;border-radius:16px;padding:6px 4px 7px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.esya:active{transform:scale(.95)}
.esya.giyili{border-color:var(--pink);background:var(--pink-l);box-shadow:0 0 0 3px #ffd9e8 inset}
.esya.aktif::after{content:'🎨';position:absolute;top:3px;right:5px;font-size:12px}
.esya svg{display:block;width:100%;height:74px}
.ad{font-size:11.5px;font-weight:700;margin-top:3px;line-height:1.2}
.mvs{font-size:10px;letter-spacing:1px;height:13px}
.renkler{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.renk{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.renk.on{box-shadow:0 0 0 3px var(--pink)}
.baslikcik{font-size:14px;font-weight:700;color:var(--purple);margin:10px 0 2px;text-align:center}
.palet{background:#fffafd;border:2px dashed var(--line);border-radius:16px;padding:4px 6px 8px;margin-top:10px}

/* REHBER */
.rehber{max-width:1080px;margin:0 auto;padding:0 14px}
.rehber-kart{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px}
.rehber-kart h3{color:var(--purple);font-size:16px;margin-bottom:6px}
.rehber-kart p{font-size:13.5px;font-weight:400;line-height:1.7}
.rehber-kart b{color:var(--pink-d)}

/* İMZA */
.imza{max-width:1080px;margin:14px auto 0;padding:10px 14px;text-align:center;font-size:13.5px;font-weight:700;color:var(--purple);border-top:2px dashed var(--line)}

/* BİLDİRİM */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2b3a;color:#fff;border-radius:24px;padding:11px 22px;font-weight:700;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.gor{opacity:1}
.toast.ok{background:#2e7d32}.toast.hata{background:#c62828}.toast.bilgi{background:#1668c1}
.pop{position:fixed;font-size:34px;font-weight:700;z-index:98;pointer-events:none;animation:ucus 1.1s ease forwards}
@keyframes ucus{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.4)}}
.konfeti{position:fixed;width:10px;height:14px;border-radius:2px;z-index:97;pointer-events:none;animation:dus 2.2s linear forwards}
@keyframes dus{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(102vh) rotate(720deg);opacity:.2}}
</style>

<body>

<div class="top">
  <h1>👗 Mevsimlere Göre Giydirme Oyunu</h1>
  <div class="puan">⭐ <span id="puan">0</span> puan &nbsp;|&nbsp; 🏆 <span id="rekor">0</span></div>
</div>

<div class="gorev">

    <button class="mv" data-s="kis" onclick="mevsimSec('kis')">❄️ Kış</button>
    <button class="mv" data-s="ilkbahar" onclick="mevsimSec('ilkbahar')">🌸 İlkbahar</button>

    <button class="mv" data-s="sonbahar" onclick="mevsimSec('sonbahar')">🍂 Sonbahar</button>

  </div>
  <div class="araclar">
    <button class="btn" onclick="kontrolEt()">✅ Kontrol Et</button>
    <button class="btn yesil" onclick="yeniOyuncu()">🔄 Yeni Oyuncu</button>
    <button class="btn gri" onclick="hepsiniCikar()">🧺 Kıyafetleri Çıkar</button>
    <button class="btn gri" onclick="rastgele()">🎲 Rastgele</button>
    <button class="btn gri" id="ipucuBtn" onclick="ipucuAcKapa()">💡 İpucu: Kapalı</button>
  </div>
</div>

<div class="oyun">
  <div class="sahne">
    <div class="sahne-kart" id="sahneKart">
      <div class="dekor" id="dekor"></div>
      <svg class="bebek" id="bebek" viewBox="0 0 240 470" xmlns="http://www.w3.org/2000/svg"></svg>

</div>

<div class="rehber">
  <div class="rehber-kart">
    <h3 id="rehberBaslik">💡 Mevsim Rehberi</h3>
    <p id="rehberYazi">Bir mevsim seçtiğinde o mevsime uygun kıyafetler burada yazacak.</p>
  </div>
</div>

<div class="imza">Dijital Öğretmen · Hasan Tutuş</div>

<div class="toast" id="toast"></div>

<script>
/* ============ SES ============ */
var _ac=null;
function _a(){if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();return _ac;}
function _ses(fr,du,tp,vl){try{var c=_a(),t=c.currentTime,o=0;fr.forEach(function(f,i){var os=c.createOscillator(),g=c.createGain();os.connect(g);g.connect(c.destination);os.type=tp||'sine';os.frequency.value=f;var d=du[i]||.12;g.gain.setValueAtTime(vl||.3,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+d);os.start(t+o);os.stop(t+o+d);o+=d;});}catch(e){}}
function sDogru(){_ses([523,659,784],[.09,.09,.16],'sine',.3);}
function sYanlis(){_ses([300,220,165],[.1,.11,.2],'triangle',.22);}
function sKazan(){_ses([523,659,784,1047,880,1175],[.1,.1,.1,.16,.1,.3],'sine',.35);}
function sTik(){_ses([420,520],[.05,.07],'sine',.18);}

/* ============ RENK YARDIMCILARI ============ */
function _hx(c){c=c.replace('#','');if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)];}
function _rgb(a){return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return ('0'+v.toString(16)).slice(-2);}).join('');}
/* koyu ton */
function koy(c,m){m=(m===undefined)?.24:m;return _rgb(_hx(c).map(function(v){return v*(1-m);}));}
/* açık ton */
function ac(c,m){m=(m===undefined)?.5:m;return _rgb(_hx(c).map(function(v){return v+(255-v)*m;}));}

/* ============ DURUM ============ */
var S={ten:'#FBD3B8',sac:'uzun',sacRenk:'#6D4C41',mevsim:null,giy:{},aks:{},renk:{},aktif:{},puan:0,rekor:0,ipucu:false,sekme:'ust'};
var MEV={kis:'❄️',yaz:'☀️',ilkbahar:'🌸',sonbahar:'🍂',okul:'🎒'};
var MEVAD={kis:'Kış',yaz:'Yaz',ilkbahar:'İlkbahar',sonbahar:'Sonbahar',okul:'Okul'};

/* ============ ÇİZİM YARDIMCILARI ============ */
function P(d,f,ek){return '<path d="'+d+'" fill="'+f+'"'+(ek||'')+'/>';}
function ayna(s){return '<g transform="translate(240,0) scale(-1,1)">'+s+'</g>';}
function iki(s){return s+ayna(s);}
function yaka(){return '<ellipse cx="120" cy="160" rx="15" ry="7" fill="'+S.ten+'"/>';}
function govde(c,etek){etek=etek||244;return P('M86,164 Q120,150 154,164 L151,'+etek+' Q120,'+(etek+10)+' 89,'+etek+' Z',c)+yaka();}
function govdeKolsuz(c,etek){etek=etek||242;return P('M96,170 Q120,160 144,170 L142,'+etek+' Q120,'+(etek+10)+' 98,'+etek+' Z',c);}
function kolK(c){return iki(P('M88,163 C74,175 66,190 63,206 Q78,216 93,211 C96,194 101,178 108,168 Z',c));}
function kolU(c){return iki(P('M88,163 C70,183 59,215 59,249 Q71,257 82,249 C82,221 90,193 101,174 Z',c));}
function etekCiz(c,hemY,hw){return P('M92,236 L'+(120-hw)+','+hemY+' Q120,'+(hemY+14)+' '+(120+hw)+','+hemY+' L148,236 Q120,246 92,236 Z',c);}
function pant(c,hemY,dar){
  var a=dar?5:0, wl=90+a, wr=150-a, bl=88+a, br=152-a, k=(hemY>320?296:hemY-8);
  return P('M'+wl+',236 Q120,248 '+wr+',236 L'+br+','+hemY+' Q'+br+','+(hemY+8)+' '+(br-14)+','+(hemY+8)+' L124,'+(hemY+4)+' L120,'+k+' L116,'+(hemY+4)+' L'+(bl+14)+','+(hemY+8)+' Q'+bl+','+(hemY+8)+' '+bl+','+hemY+' Z',c);
}
function elbise(c,hemY,hw){return govde(c,238)+P('M92,232 L'+(120-hw)+','+hemY+' Q120,'+(hemY+16)+' '+(120+hw)+','+hemY+' L148,232 Q120,244 92,232 Z',c);}
function kaban(c,koyu,hemY){
  return P('M82,160 Q120,144 158,160 L155,'+hemY+' Q120,'+(hemY+12)+' 85,'+hemY+' Z',c)+kolU(c)
    +P('M100,154 Q120,146 140,154 L131,178 Q120,167 109,178 Z',koyu)
    +'<line x1="120" y1="168" x2="120" y2="'+hemY+'" stroke="'+koyu+'" stroke-width="3.5"/>';
}
function acikKaban(c,koyu,hemY,kolsuz){
  var p=P('M83,161 Q101,150 116,157 L114,'+hemY+' L86,'+(hemY-2)+' Z',c);
  var ck='<line x1="114" y1="160" x2="112" y2="'+hemY+'" stroke="'+koyu+'" stroke-width="2.5"/>';
  return p+ayna(p)+(kolsuz?'':kolU(c))+ck+ayna(ck);
}
function ayk(c,taban){return iki(P('M84,390 Q102,379 118,390 L119,406 Q102,414 84,409 Z',c)+P('M82,403 Q102,412 120,403 L120,413 Q102,420 82,412 Z',taban));}
function bot(c,taban,ustY){return iki(P('M86,'+ustY+' L84,404 Q102,414 119,406 L118,'+ustY+' Z',c)+P('M82,403 Q102,413 120,403 L120,414 Q102,421 82,413 Z',taban));}

/* ============ SAÇ ============ */
var kahkul='M62,74 C68,30 96,18 120,18 C146,18 176,30 178,76 C167,52 146,42 120,46 C95,50 75,60 62,74 Z';
var SACLAR={
  uzun:{ad:'Uzun Saç',
    arka:function(c){return P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,154 182,204 176,244 L150,242 C158,192 160,140 158,100 L82,100 C80,140 82,192 90,242 L64,244 C58,204 56,154 56,92 Z',c);},
    on:function(c){var y=P('M62,78 C55,126 57,186 66,232 L88,228 C79,182 77,124 81,88 Z',c);return P(kahkul,c)+y+ayna(y);}},
  kisa:{ad:'Kısa Saç',
    arka:function(c){return P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,116 182,132 178,146 L62,146 C58,132 56,116 56,92 Z',c);},
    on:function(c){var y=P('M62,78 C57,104 58,126 63,144 L84,140 C78,120 77,100 81,88 Z',c);return P(kahkul,c)+y+ayna(y);}},
  dalgali:{ad:'Dalgalı Saç',
    arka:function(c){return P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,150 190,200 178,246 Q166,236 156,246 Q146,236 152,206 C158,166 158,128 158,100 L82,100 C82,128 82,166 88,206 Q94,236 84,246 Q74,236 62,246 C50,200 56,150 56,92 Z',c);},
    on:function(c){var y=P('M62,78 C54,124 56,184 64,230 L86,226 C78,180 76,124 81,88 Z',c);return P(kahkul,c)+y+ayna(y);}},
  kuyruk:{ad:'At Kuyruğu',
    arka:function(c){return P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,118 182,136 178,150 L62,150 C58,136 56,118 56,92 Z',c)+P('M168,72 C204,80 218,128 204,180 C199,198 176,204 172,192 C188,156 194,116 164,96 Z',c);},
    on:function(c){return P(kahkul,c)+'<ellipse cx="172" cy="76" rx="11" ry="9" fill="#FF7BAC"/>';}},
  topuz:{ad:'Topuz',
    arka:function(c){return '<circle cx="120" cy="10" r="30" fill="'+c+'"/>'+P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,118 182,136 178,150 L62,150 C58,136 56,118 56,92 Z',c);},
    on:function(c){return P(kahkul,c)+'<rect x="96" y="24" width="48" height="12" rx="6" fill="#FF7BAC"/>';}},
  orgu:{ad:'İki Örgü',
    arka:function(c){return P('M56,92 C56,34 86,14 120,14 C154,14 184,34 184,92 C184,120 182,140 178,156 L62,156 C58,140 56,120 56,92 Z',c);},
    on:function(c){var b='';for(var i=0;i<6;i++){b+='<ellipse cx="'+(62+i*0.6)+'" cy="'+(116+i*22)+'" rx="'+(15-i*1.2)+'" ry="13" fill="'+c+'"/>';}b+=P('M54,248 L74,248 L64,264 Z','#FF7BAC');return P(kahkul,c)+b+ayna(b);}}
};
var SAC_RENK=[{n:'Kahve',c:'#6D4C41'},{n:'Siyah',c:'#2E2A2C'},{n:'Sarı',c:'#E3B24C'},{n:'Kızıl',c:'#B85426'},{n:'Açık Kahve',c:'#A1785B'},{n:'Gri',c:'#9E9E9E'}];
var TEN_RENK=[{n:'Açık',c:'#FBD3B8'},{n:'Buğday',c:'#E5AC85'},{n:'Esmer',c:'#C1875C'},{n:'Koyu',c:'#96603C'}];

/* ============ RENK PALETİ ============ */
var PALET=[
 {n:'Pembe',c:'#FF6FA5'},{n:'Fuşya',c:'#E8407A'},{n:'Bordo',c:'#B71C1C'},{n:'Kırmızı',c:'#E53935'},
 {n:'Turuncu',c:'#FF7043'},{n:'Sarı',c:'#FFD75E'},{n:'Hardal',c:'#F9B233'},{n:'Açık Yeşil',c:'#66BB6A'},
 {n:'Koyu Yeşil',c:'#2E7D32'},{n:'Turkuaz',c:'#26A69A'},{n:'Açık Mavi',c:'#64B5F6'},{n:'Mavi',c:'#1668C1'},
 {n:'Lacivert',c:'#283593'},{n:'Mor',c:'#7E57C2'},{n:'Lila',c:'#CE93D8'},{n:'Kahve',c:'#8D6E63'},
 {n:'Beyaz',c:'#FFFFFF'},{n:'Gri',c:'#B0BEC5'},{n:'Siyah',c:'#2E2A2C'},{n:'Krem',c:'#F1E1C6'}
];

/* ============ TEMEL BEDEN ============ */
function beden(){
  var t=S.ten;
  var bacak=P('M96,244 C90,300 88,350 90,392 Q90,401 103,401 Q116,401 116,392 C116,350 117,300 119,248 Z',t);
  var kol=P('M88,164 C72,182 62,214 62,248 Q72,256 82,248 C82,220 90,192 100,176 Z',t)+'<ellipse cx="71" cy="256" rx="13" ry="14" fill="'+t+'"/>';
  return bacak+ayna(bacak)
    +'<ellipse cx="102" cy="402" rx="17" ry="11" fill="'+t+'"/><ellipse cx="138" cy="402" rx="17" ry="11" fill="'+t+'"/>'
    +P('M88,166 Q120,152 152,166 L148,244 Q120,254 92,244 Z',t)
    +'<rect x="106" y="126" width="28" height="42" rx="12" fill="'+t+'"/>'
    +kol+ayna(kol)
    +P('M96,168 Q120,158 144,168 L142,238 Q120,246 98,238 Z','#FFE9F2')
    +P('M97,236 Q120,244 143,236 L141,272 Q131,279 125,272 L120,260 L115,272 Q109,279 99,272 Z','#F4DCEF');
}
function yuz(){
  var t=S.ten;

var SEKME=[{k:'ust',ad:'👕 Üst'},{k:'alt',ad:'👖 Alt'},{k:'elbise',ad:'👗 Elbise'},{k:'dis',ad:'🧥 Dış Giyim'},{k:'ayakkabi',ad:'👟 Ayakkabı'},{k:'aksesuar',ad:'🎀 Aksesuar'},{k:'sac',ad:'💇 Saç & Ten'}];
var KUTU={ust:'52 140 136 122',alt:'58 224 124 196',elbise:'48 140 144 214',dis:'44 138 152 160',ayakkabi:'76 306 88 120',bas:'28 0 184 100',yuz:'70 74 100 52',boyun:'72 130 96 116',el:'34 46 210 220',sirt:'30 150 180 148'};

function bul(kat,id){var a=K[kat]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function renkAl(it){return S.renk[it.id]||it.c;}
function ciz1(kat,id){var it=bul(kat,id);return it?it.f(renkAl(it)):'';}

/* ============ ÇİZ ============ */
function ciz(){
  var h=SACLAR[S.sac],s='';
  s+=h.arka(S.sacRenk);
  s+=beden();
  s+=yuz();
  if(S.giy.alt)s+=ciz1('alt',S.giy.alt);
  if(S.giy.ust)s+=ciz1('ust',S.giy.ust);
  if(S.giy.elbise)s+=ciz1('elbise',S.giy.elbise);
  if(S.giy.dis)s+=ciz1('dis',S.giy.dis);
  if(S.giy.ayakkabi)s+=ciz1('ayakkabi',S.giy.ayakkabi);
  s+=h.on(S.sacRenk);
  ['boyun','el','sirt','yuz','bas'].forEach(function(y){
    if(S.aks[y])s+=ciz1('aksesuar',S.aks[y]);
  });
  document.getElementById('bebek').innerHTML=s;
  cipleriYaz();
}

/* ============ GARDIROP ============ */
function sekmeleriYaz(){
  var h='';
  SEKME.forEach(function(t){h+='<button class="sk'+(S.sekme===t.k?' on':'')+'" onclick="sekmeSec(\''+t.k+'\')">'+t.ad+'</button>';});
  document.getElementById('sekmeler').innerHTML=h;
}
function sekmeSec(k){S.sekme=k;sTik();sekmeleriYaz();dolabiYaz();}

function mvsRozet(it){
  if(!S.ipucu)return '';
  return it.s.map(function(m){return MEV[m];}).join('');
}
function kartHtml(kat,it){
  var kutu=kat==='aksesuar'?KUTU[it.y]:KUTU[kat];
  var giyili=(kat==='aksesuar')?(S.aks[it.y]===it.id):(S.giy[kat]===it.id);
  var aktif=(S.aktif[kat]===it.id);
  return '<div class="esya'+(giyili?' giyili':'')+(aktif?' aktif':'')+'" onclick="sec(\''+kat+'\',\''+it.id+'\')">'
    +'<svg viewBox="'+kutu+'" xmlns="http://www.w3.org/2000/svg">'+it.f(renkAl(it))+'</svg>'
    +'<div class="ad">'+it.n+'</div><div class="mvs">'+mvsRozet(it)+'</div></div>';
}
function paletHtml(kat){
  var id=S.aktif[kat], it=id?bul(kat,id):null;
  var h='<div class="palet"><div class="baslikcik">🎨 '+(it?it.n+' rengini seç':'Renk için önce bir kıyafete dokun')+'</div><div class="renkler">';
  PALET.forEach(function(r){
    var secili=it&&renkAl(it)===r.c;
    h+='<div class="renk'+(secili?' on':'')+'" style="background:'+r.c+'" title="'+r.n+'" onclick="renkVer(\''+kat+'\',\''+r.c+'\')"></div>';
  });
  h+='</div><div style="text-align:center"><button class="btn gri" style="font-size:12px;padding:5px 12px" onclick="renkSifirla(\''+kat+'\')">↺ İlk Renk</button></div></div>';
  return h;
}
function dolabiYaz(){
  var c=document.getElementById('dolapIcerik');
  if(S.sekme==='sac'){
    var h='<div class="baslikcik">Saç Modeli</div><div class="izgara">';
    Object.keys(SACLAR).forEach(function(k){
      h+='<div class="esya'+(S.sac===k?' giyili':'')+'" onclick="sacSec(\''+k+'\')"><svg viewBox="40 0 160 260" xmlns="http://www.w3.org/2000/svg">'+SACLAR[k].arka(S.sacRenk)+yuz()+SACLAR[k].on(S.sacRenk)+'</svg><div class="ad">'+SACLAR[k].ad+'</div><div class="mvs"></div></div>';
    });
    h+='</div><div class="baslikcik">Saç Rengi</div><div class="renkler">';
    SAC_RENK.forEach(function(r){h+='<div class="renk'+(S.sacRenk===r.c?' on':'')+'" style="background:'+r.c+'" title="'+r.n+'" onclick="sacRenk(\''+r.c+'\')"></div>';});
    h+='</div><div class="baslikcik">Ten Rengi</div><div class="renkler">';
    TEN_RENK.forEach(function(r){h+='<div class="renk'+(S.ten===r.c?' on':'')+'" style="background:'+r.c+'" title="'+r.n+'" onclick="tenRenk(\''+r.c+'\')"></div>';});
    h+='</div>';
    c.innerHTML=h;return;
  }
  var g='<div class="izgara">';
  K[S.sekme].forEach(function(it){g+=kartHtml(S.sekme,it);});
  c.innerHTML=g+'</div>'+paletHtml(S.sekme);
}
function sacSec(k){S.sac=k;sTik();ciz();dolabiYaz();}
function sacRenk(c){S.sacRenk=c;sTik();ciz();dolabiYaz();}
function tenRenk(c){S.ten=c;sTik();ciz();dolabiYaz();}

/* ============ RENK VER ============ */
function renkVer(kat,c){
  var id=S.aktif[kat];
  if(!id){bildir('Önce bir kıyafete dokun, sonra rengini seç.','bilgi');sTik();return;}
  S.renk[id]=c;sTik();ciz();dolabiYaz();
}
function renkSifirla(kat){
  var id=S.aktif[kat];
  if(!id){bildir('Önce bir kıyafete dokun.','bilgi');return;}
  delete S.renk[id];sTik();ciz();dolabiYaz();
}

/* ============ SEÇ / ÇIKAR ============ */
function sec(kat,id){
  var it=bul(kat,id);
  S.aktif[kat]=id;
  if(kat==='aksesuar'){
    if(S.aks[it.y]===id){delete S.aks[it.y];sTik();ciz();dolabiYaz();return;}
    S.aks[it.y]=id;
  }else{
    if(S.giy[kat]===id){delete S.giy[kat];sTik();ciz();dolabiYaz();return;}
    S.giy[kat]=id;
    if(kat==='elbise'){delete S.giy.ust;delete S.giy.alt;}
    if(kat==='ust'||kat==='alt')delete S.giy.elbise;
  }
  if(S.mevsim){
    if(it.s.indexOf(S.mevsim)>-1){sDogru();bildir('✅ '+it.n+' '+MEVAD[S.mevsim].toLowerCase()+' için uygun!','ok');}
    else{sYanlis();bildir('🤔 '+it.n+' '+MEVAD[S.mevsim].toLowerCase()+' için uygun değil.','hata');}
  }else{sTik();}
  ciz();dolabiYaz();
}
function cipleriYaz(){
  var el=document.getElementById('giyilenler'),h='';
  var adlar={ust:'Üst',alt:'Alt',elbise:'Elbise',dis:'Dış',ayakkabi:'Ayakkabı'};
  Object.keys(adlar).forEach(function(k){
    if(S.giy[k]){var it=bul(k,S.giy[k]);h+='<div class="cip">'+it.n+'<button onclick="cikar(\''+k+'\')">✕</button></div>';}
  });
  Object.keys(S.aks).forEach(function(y){
    var it=bul('aksesuar',S.aks[y]);if(it)h+='<div class="cip">'+it.n+'<button onclick="aksCikar(\''+y+'\')">✕</button></div>';
  });
  el.innerHTML=h||'<div class="bos">Henüz kıyafet seçilmedi. Gardıroptan bir kıyafete dokun!</div>';
}
function cikar(k){delete S.giy[k];sTik();ciz();dolabiYaz();}
function aksCikar(y){delete S.aks[y];sTik();ciz();dolabiYaz();}
function hepsiniCikar(){S.giy={};S.aks={};sTik();ciz();dolabiYaz();}

function rastgele(){
  S.giy={};S.aks={};
  function r(a){return a[Math.floor(Math.random()*a.length)];}
  if(Math.random()<.4){S.giy.elbise=r(K.elbise).id;}
  else{S.giy.ust=r(K.ust).id;S.giy.alt=r(K.alt).id;}
  S.giy.ayakkabi=r(K.ayakkabi).id;
  if(Math.random()<.5){var a=r(K.aksesuar);S.aks[a.y]=a.id;}
  if(Math.random()<.5){var b=r(K.aksesuar);S.aks[b.y]=b.id;}
  sTik();ciz();dolabiYaz();
  bildir('🎲 Rastgele kıyafet giydi. Mevsime uygun mu?','bilgi');
}

/* ============ MEVSİM ============ */
var SAHNE={
  kis:{bg:'linear-gradient(180deg,#d6ecff,#f2f8ff)',dek:['❄️','🌨️','⛄','❄️']},
  yaz:{bg:'linear-gradient(180deg,#fff4c9,#e9fbe7)',dek:['☀️','🌻','🦋','🍉']},
  ilkbahar:{bg:'linear-gradient(180deg,#ffe9f4,#e8f8ea)',dek:['🌸','🌷','🦋','🌦️']},
  sonbahar:{bg:'linear-gradient(180deg,#ffeccd,#fce6d6)',dek:['🍂','🍁','🌰','🌧️']},
  okul:{bg:'linear-gradient(180deg,#eae7ff,#f7ecff)',dek:['🎒','📚','✏️','🔔']}
};
function mevsimSec(m){
  S.mevsim=m;
  document.querySelectorAll('.mv').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===m);});
  document.getElementById('gorevYazi').textContent='🎯 Görev: '+MEV[m]+' '+MEVAD[m]+' mevsimine uygun giydir!';
  var sc=SAHNE[m];
  document.getElementById('sahneKart').style.background=sc.bg;
  var yer=[[6,8],[80,6],[8,72],[84,66]],d='';
  sc.dek.forEach(function(e,i){d+='<span style="left:'+yer[i][0]+'%;top:'+yer[i][1]+'%;animation-delay:'+(i*.4)+'s">'+e+'</span>';});
  document.getElementById('dekor').innerHTML=d;
  rehberYaz(m);sTik();
  bildir('🎯 '+MEVAD[m]+' için giydirme zamanı!','bilgi');
}
function rehberYaz(m){
  var adlar={ust:'Üst giyim',alt:'Alt giyim',elbise:'Elbise',dis:'Dış giyim',ayakkabi:'Ayakkabı',aksesuar:'Aksesuar'};
  var p='';
  Object.keys(adlar).forEach(function(k){
    var l=K[k].filter(function(it){return it.s.indexOf(m)>-1;}).map(function(it){return it.n;});
    if(l.length)p+='<b>'+adlar[k]+':</b> '+l.join(', ')+'<br>';
  });
  document.getElementById('rehberBaslik').textContent='💡 '+MEV[m]+' '+MEVAD[m]+' Rehberi';
  document.getElementById('rehberYazi').innerHTML=p;
}
function ipucuAcKapa(){
  S.ipucu=!S.ipucu;
  document.getElementById('ipucuBtn').textContent='💡 İpucu: '+(S.ipucu?'Açık':'Kapalı');
  sTik();dolabiYaz();
}

/* ============ PUANLAMA ============ */
function kontrolEt(){
  if(!S.mevsim){bildir('Önce yukarıdan bir mevsim seç!','bilgi');return;}
  var hepsi=[];
  ['ust','alt','elbise','dis','ayakkabi'].forEach(function(k){if(S.giy[k])hepsi.push(bul(k,S.giy[k]));});
  Object.keys(S.aks).forEach(function(y){hepsi.push(bul('aksesuar',S.aks[y]));});
  if(!hepsi.length){bildir('Hiç kıyafet giydirmedin!','hata');sYanlis();return;}
  var d=0,y=0,yanlislar=[];
  hepsi.forEach(function(it){if(it.s.indexOf(S.mevsim)>-1)d++;else{y++;yanlislar.push(it.n);}});
  var tam=(S.giy.elbise||(S.giy.ust&&S.giy.alt))&&S.giy.ayakkabi;
  var p=d*10-y*5+((tam&&y===0)?20:0);
  if(p<0)p=0;
  S.puan+=p;if(S.puan>S.rekor)S.rekor=S.puan;
  document.getElementById('puan').textContent=S.puan;
  document.getElementById('rekor').textContent=S.rekor;
  if(y===0&&tam){sKazan();bildir('🎉 Harika! Kıyafetin tamamen uygun. +'+p+' puan','ok');pop('+'+p,'#2e7d32');konfeti();}
  else if(y===0){sDogru();bildir('👍 Doğru seçimler! Kıyafeti tamamla (üst+alt veya elbise ve ayakkabı). +'+p+' puan','ok');pop('+'+p,'#1668c1');}
  else{sYanlis();bildir('⚠️ '+d+' doğru, '+y+' yanlış: '+yanlislar.join(', ')+'. +'+p+' puan','hata');pop('+'+p,'#e2650a');}
}

/* ============ YENİ OYUNCU (PUAN SIFIRLA) ============ */
function yeniOyuncu(){
  S.puan=0;
  S.giy={};S.aks={};S.renk={};S.aktif={};
  document.getElementById('puan').textContent='0';
  document.getElementById('rekor').textContent=S.rekor;
  sTik();ciz();dolabiYaz();
  bildir('🔄 Puan sıfırlandı. Sıra yeni oyuncuda!','bilgi');
}

/* ============ EFEKTLER ============ */
function bildir(m,t){
  var el=document.getElementById('toast');
  el.textContent=m;el.className='toast gor '+(t||'');
  clearTimeout(el._t);el._t=setTimeout(function(){el.className='toast';},2600);
}
function pop(t,c){
  var el=document.createElement('div');el.className='pop';el.textContent=t;el.style.color=c;
  el.style.left='50%';el.style.top='42%';document.body.appendChild(el);
  setTimeout(function(){el.remove();},1100);
}
function konfeti(){
  var r=['#ff6fa5','#ffd75e','#7e57c2','#42a5f5','#66bb6a','#ff7043'];
  for(var i=0;i<34;i++){(function(i){setTimeout(function(){
    var el=document.createElement('div');el.className='konfeti';
    el.style.left=Math.random()*100+'vw';el.style.top='-20px';
    el.style.background=r[Math.floor(Math.random()*r.length)];
    el.style.animationDuration=(1.6+Math.random())+'s';
    document.body.appendChild(el);setTimeout(function(){el.remove();},3000);
  },i*55);})(i);}
}

/* ============ BAŞLAT ============ */
sekmeleriYaz();dolabiYaz();ciz();
</script>
