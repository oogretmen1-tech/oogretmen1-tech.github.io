:root{
  --pink:#e8407a; --pink-d:#b8265a; --pink-l:#ffe4ef;
  --purple:#6a3fa0; --ink:#3b2b3a; --paper:#fff6fb; --line:#f3c9dd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);font-family:'PoppinsA','Poppins',sans-serif;color:var(--ink);padding-bottom:30px}
button{font-family:inherit}

/* ÜST BAŞLIK */
.top{background:linear-gradient(135deg,#e8407a,#8e44ad);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700}
.puan{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);border-radius:30px;padding:5px 16px;font-size:15px;font-weight:700}

/* GÖREV ÇUBUĞU */
.gorev{background:#fff;border-bottom:3px solid var(--line);padding:10px 14px;position:sticky;top:0;z-index:40}
.gorev-yazi{font-size:15px;font-weight:700;color:var(--pink);text-align:center;margin-bottom:8px}
.mevsimler{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.mv{background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:6px 13px;font-weight:600;font-size:13px;color:#9c5b7c;cursor:pointer;transition:.15s}
.mv:active{transform:scale(.94)}
.mv.on{color:#fff;border-color:transparent}
.mv[data-s="kis"].on{background:#1668c1}
.mv[data-s="yaz"].on{background:#e2650a}
.mv[data-s="ilkbahar"].on{background:#2e9e4b}
.mv[data-s="sonbahar"].on{background:#c1620a}
.mv[data-s="okul"].on{background:#6a3fa0}
.araclar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:20px;padding:7px 15px;font-weight:600;font-size:13px;cursor:pointer;color:#fff;background:var(--pink)}
.btn.gri{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn.yesil{background:#2e7d32}
.btn:active{transform:scale(.95)}

/* OYUN ALANI */
.oyun{max-width:1120px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:16px;align-items:start}

/* SAHNE */
.sahne{position:sticky;top:150px;z-index:30}
.sahne-kart{background:linear-gradient(180deg,#eaf6ff,#f6ecff);border:3px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
.dekor{position:absolute;inset:0;pointer-events:none;font-size:26px}
.dekor span{position:absolute;opacity:.55;animation:sallan 4s ease-in-out infinite}
@keyframes sallan{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bebek{display:block;margin:0 auto;width:auto;height:min(62vh,560px);max-width:100%}
.zemin{position:absolute;left:18%;right:18%;bottom:10px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,60,110,.22),transparent)}
.giyilenler{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#fff;border-top:3px solid var(--line);min-height:44px}
.cip{background:var(--pink-l);border:2px solid var(--line);border-radius:16px;padding:4px 8px 4px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.cip button{border:none;background:#e8407a;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1}
.bos{color:#c39ab0;font-size:12.5px;font-weight:600;padding:6px}

/* Elif üzerindeki kıyafetler */
#bebek .gy{filter:drop-shadow(0 1.5px 1.2px rgba(70,30,60,.22))}
.gy *:not([stroke]){vector-effect:non-scaling-stroke}

/* ============ GARDIROP (camlı, ışıklı dolap) ============ */
.dolap{position:relative;background:linear-gradient(160deg,#ffc6de 0%,#f59cc3 50%,#e5779f 100%);border-radius:30px 30px 18px 18px;padding:10px 12px 0;box-shadow:0 14px 28px rgba(176,38,98,.28),inset 0 3px 0 rgba(255,255,255,.65),inset 0 -5px 0 rgba(150,30,80,.16)}
.dolap::before{content:'';position:absolute;left:22px;right:22px;top:-9px;height:16px;border-radius:14px 14px 4px 4px;background:linear-gradient(#ffd3e6,#ef8fb8);box-shadow:0 3px 0 rgba(150,30,80,.15)}
.tabela{position:relative;display:block;margin:0 auto 9px;width:max-content;max-width:100%;background:linear-gradient(#fffdf6,#ffe8f2);border:2px solid #d4699a;border-radius:16px;padding:3px 18px;font-weight:700;color:#b8265a;font-size:14.5px;box-shadow:0 2px 0 #c45786}
.sekmeler{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 9px;scrollbar-width:none}
.sekmeler::-webkit-scrollbar{display:none}
.sk{flex:0 0 auto;background:linear-gradient(#fff,#fff0f6);border:2px solid #e791b6;border-radius:14px;padding:6px 12px;font-weight:600;font-size:13px;color:#a8456f;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 #d97aa3}
.sk.on{background:linear-gradient(#ff5d97,#d63a73);border-color:#b8265a;color:#fff;box-shadow:0 2px 0 #8e1a47}

.vitrin{position:relative;border-radius:18px;padding:22px 10px 12px;min-height:320px;overflow:hidden;
  background:
   radial-gradient(150px 210px at 17% -10px,rgba(255,246,206,.95),rgba(255,246,206,0) 72%),
   radial-gradient(150px 210px at 50% -10px,rgba(255,246,206,.95),rgba(255,246,206,0) 72%),
   radial-gradient(150px 210px at 83% -10px,rgba(255,246,206,.95),rgba(255,246,206,0) 72%),
   linear-gradient(180deg,#fff4f9 0%,#fde3ee 60%,#f8cfe0 100%);
  border:6px solid #d5679a;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),inset 0 12px 22px rgba(255,255,255,.55),inset 0 -16px 28px rgba(185,50,110,.18)}
.led{position:absolute;top:0;left:8px;right:8px;height:8px;border-radius:0 0 7px 7px;background:#fffdf2;box-shadow:0 0 10px 3px #fff0a0,0 3px 26px 10px rgba(255,232,160,.5);z-index:2}
.led i{position:absolute;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 6px 3px #fff3b0,0 0 18px 8px rgba(255,236,170,.75);animation:pirilti 3s ease-in-out infinite}
.led i:nth-child(1){left:calc(17% - 4px)}.led i:nth-child(2){left:calc(50% - 4px);animation-delay:1s}.led i:nth-child(3){left:calc(83% - 4px);animation-delay:2s}
@keyframes pirilti{0%,100%{opacity:1}50%{opacity:.75}}
.vitrin::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(112deg,rgba(255,255,255,0) 0 20%,rgba(255,255,255,.42) 22%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 57%,rgba(255,255,255,.24) 59%,rgba(255,255,255,0) 64%)}
.cam-cerceve{position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}

.izgara{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:0;row-gap:14px}
.esya{position:relative;text-align:center;cursor:pointer;padding:0 3px 2px}
.esya svg{display:block;width:100%;overflow:visible}
.ad{display:inline-block;font-size:11.5px;font-weight:600;line-height:1.2;margin-top:4px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.85);border:1.5px solid #f0bcd3;color:#7a3a5a}
.mvs{font-size:10px;letter-spacing:1px;min-height:13px}
.esya.giyili .ad{background:#e8407a;border-color:#e8407a;color:#fff}
.esya .rozet{position:absolute;top:16px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #e8407a;font-size:12px;line-height:18px;z-index:3}

/* Askılık: her satırın üstünde altın renkli çubuk */
.askida .esya{padding-top:12px}
.askida .esya::before{content:'';position:absolute;top:3px;left:0;right:0;height:7px;background:linear-gradient(#fff6cf,#e2b33c 55%,#a8761a);box-shadow:0 2px 3px rgba(120,60,0,.28);z-index:0}
.askida .esya:nth-child(3n+1)::before{left:-4px;border-radius:4px 0 0 4px}
.askida .esya:nth-child(3n)::before{right:-4px;border-radius:0 4px 4px 0}
.askida .gorsel{transform-origin:50% 0;transition:transform .25s}
.askida .esya:active .gorsel{transform:rotate(-4deg)}
.askida .esya.giyili .gorsel{animation:sallanAski 1.2s ease}
@keyframes sallanAski{0%{transform:rotate(0)}25%{transform:rotate(5deg)}50%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.askida svg{height:auto;max-height:190px}

/* Raf: eşya rafın üstünde durur */
.rafta .gorsel{position:relative;padding-bottom:12px}
.rafta .gorsel::after{content:'';position:absolute;left:-4px;right:-4px;bottom:0;height:12px;background:linear-gradient(#fffafc,#f6cfe0 45%,#d98db0);box-shadow:0 5px 6px rgba(150,40,90,.22);z-index:0}
.rafta svg{position:relative;z-index:1;height:88px}
.rafta.sac svg{height:104px}
.vitrin .ten{fill:#fbe6ef}
.esya.giyili svg{filter:drop-shadow(0 0 5px #ff4f9a) drop-shadow(0 0 2px #fff)}

.renkler{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.renk{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9a9c5;cursor:pointer}
.renk.on{box-shadow:0 0 0 3px #b8265a}
.baslikcik{font-size:13.5px;font-weight:700;color:#8e1a47;margin:6px 0 2px;text-align:center}
.palet{background:linear-gradient(#fff7fb,#ffe9f2);border:2px solid #f1b3cf;border-radius:16px;padding:4px 6px 8px;margin:10px 0 0}

.cekmeceler{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 4px 12px}
.cekmece{height:30px;border-radius:9px;background:linear-gradient(#f9b3d1,#ec8db6);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(150,30,80,.2);position:relative}
.cekmece::after{content:'';position:absolute;left:50%;top:50%;width:26px;height:8px;margin:-4px 0 0 -13px;border-radius:5px;background:linear-gradient(#fff3c4,#d9a634);box-shadow:0 1px 2px rgba(120,60,0,.35)}

/* REHBER */
.rehber{max-width:1120px;margin:0 auto;padding:0 14px}
.rehber-kart{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px}
.rehber-kart h3{color:var(--purple);font-size:16px;margin-bottom:6px}
.rehber-kart p{font-size:13.5px;line-height:1.7}
.rehber-kart b{color:var(--pink-d)}

.imza{max-width:1120px;margin:14px auto 0;padding:10px 14px;text-align:center;font-size:13.5px;font-weight:600;color:var(--purple);border-top:2px dashed var(--line)}

/* BİLDİRİM */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2b3a;color:#fff;border-radius:24px;padding:11px 22px;font-weight:600;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.gor{opacity:1}
.toast.ok{background:#2e7d32}.toast.hata{background:#c62828}.toast.bilgi{background:#1668c1}
.pop{position:fixed;font-size:34px;font-weight:700;z-index:98;pointer-events:none;animation:ucus 1.1s ease forwards}
@keyframes ucus{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.4)}}
.konfeti{position:fixed;width:10px;height:14px;border-radius:2px;z-index:97;pointer-events:none;animation:dus 2.2s linear forwards}
@keyframes dus{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(102vh) rotate(720deg);opacity:.2}}

/* TELEFON: Elif solda sabit, gardırop sağda */
@media(max-width:860px){
  .oyun{grid-template-columns:38% minmax(0,1fr);padding:8px;gap:8px}
  .sahne{top:8px}
  .bebek{width:100%;height:auto;max-height:78vh}
  .giyilenler{display:none}
  .izgara{grid-template-columns:repeat(2,minmax(0,1fr))}
  .askida .esya:nth-child(3n+1)::before,.askida .esya:nth-child(3n)::before{left:0;right:0;border-radius:0}
  .askida .esya:nth-child(2n+1)::before{left:-4px;border-radius:4px 0 0 4px}
  .askida .esya:nth-child(2n)::before{right:-4px;border-radius:0 4px 4px 0}
  .rafta svg{height:70px}
  .gorev{position:static}
  .dolap{padding:8px 7px 0;border-radius:22px 22px 14px 14px}
  .vitrin{padding:18px 5px 10px;border-width:4px}
  .top h1{font-size:16px}
  .gorev{padding:8px}
  .mv{padding:5px 10px;font-size:12px}
  .btn{padding:6px 11px;font-size:12px}
}

/* ============ AYAKKABI (Elif'in ayak ölçüsünde) ============ */
var AY_SOL=[[600,113,171],[620,117,169],[640,117,166],[660,115,166],[680,115,167],[700,116,165],[720,118,163],[740,121,160],[755,123,159],[767,123,158],[776,118,159],[785,111,161],[794,101,161],[800,94,157],[806,87,151]];
var AY_ALT=[[82,818],[86,824],[94,828],[102,830],[110,831],[118,830],[126,826],[134,819],[142,811],[150,805],[157,800]];
function satir(y){
  for(var i=0;i<AY_SOL.length-1;i++){var a=AY_SOL[i],b=AY_SOL[i+1];
    if(y>=a[0]&&y<=b[0]){var t=(y-a[0])/(b[0]-a[0]);return [y,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}}
  return AY_SOL[0];
}
function nk(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}
function ayakYol(T,p){
  var L=[],R=[],ilk=satir(T);
  L.push([ilk[1]-p,T]);R.push([ilk[2]+p,T]);
  AY_SOL.forEach(function(r){if(r[0]>T){L.push([r[1]-p,r[0]]);if(r[0]<=794)R.push([r[2]+p,r[0]]);}});
  var alt=AY_ALT.map(function(q){return [q[0]-p*.6,q[1]+p];});
  return 'M'+L.concat(alt).concat(R.reverse()).map(nk).join(' L')+' Z';
}
function tabanYol(p,k){
  k=k||9;var a=AY_ALT.map(function(q){return [q[0]-p*.6,q[1]+p];});
  var b=AY_ALT.map(function(q){return [q[0]+1,q[1]+p-k];}).reverse();
  return 'M'+a.concat(b).map(nk).join(' L')+' Z';
}
function ayk(c,taban,T){return iki2(P(ayakYol(T||786,3),c)+P(tabanYol(3),taban));}
function bot(c,taban,T){return iki2(P(ayakYol(T,4),c)+P(tabanYol(4),taban));}

/* Her kategorinin çizim alanı ve dolaptaki görünümü */
var ALAN={ust:GOVDE,alt:GOVDE,elbise:GOVDE,dis:GOVDE,boyun:GOVDE,bas:BAS,yuz:BAS,ayakkabi:'',el:'',sirt:''};

function bul(kat,id){var a=K[kat]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function renkAl(it){return S.renk[it.id]||it.c;}
function alanAl(kat,it){return kat==='aksesuar'?ALAN[it.y]:ALAN[kat];}
function sar(alan,c,ic){return '<g class="gy" stroke="'+koy(c,.5)+'" stroke-width="1.6" stroke-linejoin="round"'+(alan?' transform="'+alan+'"':'')+'>'+ic+'</g>';}
function ciz1(kat,id){var it=bul(kat,id);if(!it)return '';var c=renkAl(it);return sar(alanAl(kat,it),c,it.f(c));}

/* Askı ve mandal (dolaptaki kıyafetler için) */

/* ============ ÇİZ ============ */
function ciz(){
  var sa=sacBul(S.sac),s='';
  if(S.aks.sirt){var si=bul('aksesuar',S.aks.sirt);if(si&&si.arka){var sc=renkAl(si);s+=sar('',sc,si.arka(sc));}}
  s+=resim(sa.img);
  if(S.giy.alt)s+=ciz1('alt',S.giy.alt);
  if(S.giy.ust)s+=ciz1('ust',S.giy.ust);
  if(S.giy.elbise)s+=ciz1('elbise',S.giy.elbise);
  if(S.giy.dis)s+=ciz1('dis',S.giy.dis);
  if(S.giy.ayakkabi)s+=ciz1('ayakkabi',S.giy.ayakkabi);
  if(sa.on)s+=resim(sa.on);
  ['boyun','el','sirt','yuz','bas'].forEach(function(y){
    if(S.aks[y])s+=ciz1('aksesuar',S.aks[y]);
  });
  document.getElementById('bebek').innerHTML=s;
  cipleriYaz();
}

/* ============ GARDIROP ============ */
function sekmeleriYaz(){
  var h='';
  SEKME.forEach(function(t){h+='<button class="sk'+(S.sekme===t.k?' on':'')+'" onclick="sekmeSec(\''+t.k+'\')">'+t.ad+'</button>';});
  document.getElementById('sekmeler').innerHTML=h;
}
function sekmeSec(k){S.sekme=k;sTik();sekmeleriYaz();dolabiYaz();}

function mvsRozet(it){
  if(!S.ipucu)return '';
  return it.s.map(function(m){return MEV[m];}).join('');
}
function kartHtml(kat,it){
  var c=renkAl(it);
  var kutu=it.kutu||(kat==='aksesuar'?KUTU[it.y]:KUTU[kat]);
  var giyili=(kat==='aksesuar')?(S.aks[it.y]===it.id):(S.giy[kat]===it.id);
  var aktif=(S.aktif[kat]===it.id);
  var askili=(kat==='ust'||kat==='elbise'||kat==='dis'||kat==='alt');
  var ic='';
  if(kat==='alt')ic+=askiAlt();else if(askili)ic+=askiUst();
  if(it.arka)ic+=sar('',c,it.arka(c));
  ic+=sar(alanAl(kat,it),c,it.f(c));
  var hiza=askili?'xMidYMin meet':'xMidYMax meet';
  return '<div class="esya'+(giyili?' giyili':'')+'" onclick="sec(\''+kat+'\',\''+it.id+'\')">'
    +(aktif?'<span class="rozet">🎨</span>':'')
    +'<div class="gorsel"><svg viewBox="'+kutu+'" preserveAspectRatio="'+hiza+'" xmlns="http://www.w3.org/2000/svg">'+ic+'</svg></div>'
    +'<div class="ad">'+it.n+'</div><div class="mvs">'+mvsRozet(it)+'</div></div>';
}
function paletHtml(kat){
  var id=S.aktif[kat], it=id?bul(kat,id):null;
  var h='<div class="palet"><div class="baslikcik">🎨 '+(it?it.n+' rengini seç':'Renk için önce bir kıyafete dokun')+'</div><div class="renkler">';
  PALET.forEach(function(r){
    var secili=it&&renkAl(it)===r.c;
    h+='<div class="renk'+(secili?' on':'')+'" style="background:'+r.c+'" title="'+r.n+'" onclick="renkVer(\''+kat+'\',\''+r.c+'\')"></div>';
  });
  h+='</div><div style="text-align:center"><button class="btn gri" style="font-size:12px;padding:5px 12px" onclick="renkSifirla(\''+kat+'\')">↺ İlk Renk</button></div></div>';
  return h;
}
function dolabiYaz(){
  var c=document.getElementById('dolapIcerik'), pa=document.getElementById('paletAlan');
  if(S.sekme==='sac'){
    var h='<div class="izgara rafta sac">';
    SAC.forEach(function(sa){
      h+='<div class="esya'+(S.sac===sa.k?' giyili':'')+'" onclick="sacSec(\''+sa.k+'\')"><div class="gorsel"><svg viewBox="62 -6 242 300" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">'+resim(sa.img)+'</svg></div><div class="ad">'+sa.ad+'</div><div class="mvs"></div></div>';
    });
    c.innerHTML=h+'</div>';pa.innerHTML='';return;
  }
  var tur=(S.sekme==='ayakkabi'||S.sekme==='aksesuar')?'rafta':('askida'+(S.sekme==='elbise'?' uzun':''));
  var g='<div class="izgara '+tur+'">';
  K[S.sekme].forEach(function(it){g+=kartHtml(S.sekme,it);});
  c.innerHTML=g+'</div>';
  pa.innerHTML=paletHtml(S.sekme);
}
function sacSec(k){S.sac=k;sTik();ciz();dolabiYaz();}

/* ============ RENK VER ============ */
function renkVer(kat,c){
  var id=S.aktif[kat];
  if(!id){bildir('Önce bir kıyafete dokun, sonra rengini seç.','bilgi');sTik();return;}
  S.renk[id]=c;sTik();ciz();dolabiYaz();
}
function renkSifirla(kat){
  var id=S.aktif[kat];
  if(!id){bildir('Önce bir kıyafete dokun.','bilgi');return;}
  delete S.renk[id];sTik();ciz();dolabiYaz();
}

/* ============ SEÇ / ÇIKAR ============ */
function sec(kat,id){
  var it=bul(kat,id);
  S.aktif[kat]=id;
  if(kat==='aksesuar'){
    if(S.aks[it.y]===id){delete S.aks[it.y];sTik();ciz();dolabiYaz();return;}
    S.aks[it.y]=id;
  }else{
    if(S.giy[kat]===id){delete S.giy[kat];sTik();ciz();dolabiYaz();return;}
    S.giy[kat]=id;
    if(kat==='elbise'){delete S.giy.ust;delete S.giy.alt;}
    if(kat==='ust'||kat==='alt')delete S.giy.elbise;
  }
  if(S.mevsim){
    if(it.s.indexOf(S.mevsim)>-1){sDogru();bildir('✅ '+it.n+' '+MEVAD[S.mevsim].toLowerCase()+' için uygun!','ok');}
    else{sYanlis();bildir('🤔 '+it.n+' '+MEVAD[S.mevsim].toLowerCase()+' için uygun değil.','hata');}
  }else{sTik();}
  ciz();dolabiYaz();
}
function cipleriYaz(){
  var el=document.getElementById('giyilenler'),h='';
  var adlar={ust:'Üst',alt:'Alt',elbise:'Elbise',dis:'Dış',ayakkabi:'Ayakkabı'};
  Object.keys(adlar).forEach(function(k){
    if(S.giy[k]){var it=bul(k,S.giy[k]);h+='<div class="cip">'+it.n+'<button onclick="cikar(\''+k+'\')">✕</button></div>';}
  });
  Object.keys(S.aks).forEach(function(y){
    var it=bul('aksesuar',S.aks[y]);if(it)h+='<div class="cip">'+it.n+'<button onclick="aksCikar(\''+y+'\')">✕</button></div>';
  });
  el.innerHTML=h||'<div class="bos">Henüz kıyafet seçilmedi. Gardıroptan bir kıyafete dokun!</div>';
}
function cikar(k){delete S.giy[k];sTik();ciz();dolabiYaz();}
function aksCikar(y){delete S.aks[y];sTik();ciz();dolabiYaz();}
function hepsiniCikar(){S.giy={};S.aks={};sTik();ciz();dolabiYaz();}

function rastgele(){
  S.giy={};S.aks={};
  function r(a){return a[Math.floor(Math.random()*a.length)];}
  if(Math.random()<.4){S.giy.elbise=r(K.elbise).id;}
  else{S.giy.ust=r(K.ust).id;S.giy.alt=r(K.alt).id;}
  S.giy.ayakkabi=r(K.ayakkabi).id;
  if(Math.random()<.5){var a=r(K.aksesuar);S.aks[a.y]=a.id;}
  if(Math.random()<.5){var b=r(K.aksesuar);S.aks[b.y]=b.id;}
  sTik();ciz();dolabiYaz();
  bildir('🎲 Rastgele kıyafet giydi. Mevsime uygun mu?','bilgi');
}

/* ============ MEVSİM ============ */
var SAHNE={
  kis:{bg:'linear-gradient(180deg,#d6ecff,#f2f8ff)',dek:['❄️','🌨️','⛄','❄️']},
  yaz:{bg:'linear-gradient(180deg,#fff4c9,#e9fbe7)',dek:['☀️','🌻','🦋','🍉']},
  ilkbahar:{bg:'linear-gradient(180deg,#ffe9f4,#e8f8ea)',dek:['🌸','🌷','🦋','🌦️']},
  sonbahar:{bg:'linear-gradient(180deg,#ffeccd,#fce6d6)',dek:['🍂','🍁','🌰','🌧️']},
  okul:{bg:'linear-gradient(180deg,#eae7ff,#f7ecff)',dek:['🎒','📚','✏️','🔔']}
};
function mevsimSec(m){
  S.mevsim=m;
  document.querySelectorAll('.mv').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===m);});
  document.getElementById('gorevYazi').textContent='🎯 Görev: '+MEV[m]+' '+MEVAD[m]+' için Elif\'i giydir!';
  var sc=SAHNE[m];
  document.getElementById('sahneKart').style.background=sc.bg;
  var yer=[[5,6],[82,5],[6,70],[84,64]],d='';
  sc.dek.forEach(function(e,i){d+='<span style="left:'+yer[i][0]+'%;top:'+yer[i][1]+'%;animation-delay:'+(i*.4)+'s">'+e+'</span>';});
  document.getElementById('dekor').innerHTML=d;
  rehberYaz(m);sTik();
  bildir('🎯 '+MEVAD[m]+' için giydirme zamanı!','bilgi');
}
function rehberYaz(m){
  var adlar={ust:'Üst giyim',alt:'Alt giyim',elbise:'Elbise',dis:'Dış giyim',ayakkabi:'Ayakkabı',aksesuar:'Aksesuar'};
  var p='';
  Object.keys(adlar).forEach(function(k){
    var l=K[k].filter(function(it){return it.s.indexOf(m)>-1;}).map(function(it){return it.n;});
    if(l.length)p+='<b>'+adlar[k]+':</b> '+l.join(', ')+'<br>';
  });
  document.getElementById('rehberBaslik').textContent='💡 '+MEV[m]+' '+MEVAD[m]+' Rehberi';
  document.getElementById('rehberYazi').innerHTML=p;
}
function ipucuAcKapa(){
  S.ipucu=!S.ipucu;
  document.getElementById('ipucuBtn').textContent='💡 İpucu: '+(S.ipucu?'Açık':'Kapalı');
  sTik();dolabiYaz();
}

/* ============ PUANLAMA ============ */
function kontrolEt(){
  if(!S.mevsim){bildir('Önce yukarıdan bir mevsim seç!','bilgi');return;}
  var hepsi=[];
  ['ust','alt','elbise','dis','ayakkabi'].forEach(function(k){if(S.giy[k])hepsi.push(bul(k,S.giy[k]));});
  Object.keys(S.aks).forEach(function(y){hepsi.push(bul('aksesuar',S.aks[y]));});
  if(!hepsi.length){bildir('Hiç kıyafet giydirmedin!','hata');sYanlis();return;}
  var d=0,y=0,yanlislar=[];
  hepsi.forEach(function(it){if(it.s.indexOf(S.mevsim)>-1)d++;else{y++;yanlislar.push(it.n);}});
  var tam=(S.giy.elbise||(S.giy.ust&&S.giy.alt))&&S.giy.ayakkabi;
  var p=d*10-y*5+((tam&&y===0)?20:0);
  if(p<0)p=0;
  S.puan+=p;if(S.puan>S.rekor)S.rekor=S.puan;
  document.getElementById('puan').textContent=S.puan;
  document.getElementById('rekor').textContent=S.rekor;
  if(y===0&&tam){sKazan();bildir('🎉 Harika! Kıyafetin tamamen uygun. +'+p+' puan','ok');pop('+'+p,'#2e7d32');konfeti();}
  else if(y===0){sDogru();bildir('👍 Doğru seçimler! Kıyafeti tamamla (üst+alt veya elbise ve ayakkabı). +'+p+' puan','ok');pop('+'+p,'#1668c1');}
  else{sYanlis();bildir('⚠️ '+d+' doğru, '+y+' yanlış: '+yanlislar.join(', ')+'. +'+p+' puan','hata');pop('+'+p,'#e2650a');}
}

/* ============ YENİ OYUNCU (PUAN SIFIRLA) ============ */
function yeniOyuncu(){
  S.puan=0;
  S.giy={};S.aks={};S.renk={};S.aktif={};
  document.getElementById('puan').textContent='0';
  document.getElementById('rekor').textContent=S.rekor;
  sTik();ciz();dolabiYaz();
  bildir('🔄 Puan sıfırlandı. Sıra yeni oyuncuda!','bilgi');
}

/* ============ EFEKTLER ============ */
function bildir(m,t){
  var el=document.getElementById('toast');
  el.textContent=m;el.className='toast gor '+(t||'');
  clearTimeout(el._t);el._t=setTimeout(function(){el.className='toast';},2600);
}
function pop(t,c){
  var el=document.createElement('div');el.className='pop';el.textContent=t;el.style.color=c;
  el.style.left='50%';el.style.top='42%';document.body.appendChild(el);
  setTimeout(function(){el.remove();},1100);
}
function konfeti(){
  var r=['#ff6fa5','#ffd75e','#7e57c2','#42a5f5','#66bb6a','#ff7043'];
  for(var i=0;i<34;i++){(function(i){setTimeout(function(){
    var el=document.createElement('div');el.className='konfeti';
    el.style.left=Math.random()*100+'vw';el.style.top='-20px';
    el.style.background=r[Math.floor(Math.random()*r.length)];
    el.style.animationDuration=(1.6+Math.random())+'s';
    document.body.appendChild(el);setTimeout(function(){el.remove();},3000);
  },i*55);})(i);}
}

/* ============ BAŞLAT ============ */
sekmeleriYaz();dolabiYaz();ciz();
</script>

function dosyaAdi(a){var d=a.getAttribute('download');if(d)return d;try{var u=new URL(a.href,location.href);if(u.protocol==='blob:'||u.protocol==='data:')return '';return decodeURIComponent(u.pathname.split('/').pop());}catch(e){return '';}}
function bak(a){if(!a||!a.href)return;var ad=dosyaAdi(a);var dl=a.hasAttribute('download');if(!ad&&dl)ad='dosya';if(!/\.(pdf|docx?|pptx?|xlsx?|zip)$/i.test(ad)&&!dl)return;var sayfa=location.pathname.split('/').pop()||'index.html';say('indir/'+(ad||sayfa),'İndirme: '+(ad||sayfa)+' ('+sayfa+')');}
document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;bak(a);},true);
var kc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(!this.isConnected)bak(this);return kc.apply(this,arguments);};
var kd=EventTarget.prototype.dispatchEvent;EventTarget.prototype.dispatchEvent=function(ev){if(this instanceof HTMLAnchorElement&&!this.isConnected&&ev&&ev.type==='click')bak(this);return kd.apply(this,arguments);};
window.addEventListener('beforeprint',function(){var sayfa=location.pathname.split('/').pop()||'index.html';say('yazdir/'+sayfa,'Yazdırma: '+sayfa);});})();</script>
