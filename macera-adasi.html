:root{
  --murekkep:#12324a; --deniz:#0b8fb3; --deniz-koyu:#066a8a; --kum:#fff3cf; --mercan:#ff6b4f; --yaprak:#1f9a5c; --altin:#ffc93c;
  --yazi:DORakam,'PoppinsA','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font-family:var(--yazi);color:var(--murekkep);
  background:linear-gradient(180deg,#38c6e0 0%,#0b8fb3 55%,#066a8a 100%);}
button{font-family:var(--yazi);}
.sarma{max-width:1180px;margin:0 auto;padding:16px 14px 26px;}

/* üst bölüm */
.ust{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:#fffdf4;border-radius:24px;padding:14px 20px;box-shadow:0 8px 0 rgba(3,70,95,.22);}
.ust h1{margin:0;font-size:clamp(26px,3.4vw,36px);line-height:1.1;}
.ust p{margin:4px 0 0;color:#3d6f7d;font-size:16px;}
.ilerleme{min-width:230px;flex:0 1 300px;}
.ilerleme-ust{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:#28606f;margin-bottom:6px;}
.ilerleme-yol{height:16px;border-radius:99px;background:#d9eef1;overflow:hidden;}
.ilerleme-dolu{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd45d,#ff8a55);transition:width .45s;}
.seviye{display:flex;gap:8px;flex-wrap:wrap;}
.seviye button{border:3px solid #cfe7ec;background:#fff;color:var(--murekkep);border-radius:14px;padding:8px 16px;font-size:17px;font-weight:700;cursor:pointer;}
.seviye button.secili{background:var(--yaprak);border-color:var(--yaprak);color:#fff;}

/* harita */
.harita{position:relative;margin-top:16px;border-radius:28px;overflow:hidden;border:5px solid rgba(255,255,255,.75);
  box-shadow:0 10px 0 rgba(3,70,95,.25);aspect-ratio:2576/1120;container-type:inline-size;max-width:max(560px,calc((100vh - 470px)*2.3));margin-left:auto;margin-right:auto;}
.harita img.zemin{position:absolute;inset:0;width:100%;height:100%;display:block;}
.durak{position:absolute;transform:translate(-50%,-50%);width:7.4%;height:11.5%;border-radius:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#5b3a12;
  font-size:clamp(11px,1.9cqw,26px);line-height:1;}
.durak.aktif{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--altin);animation:parla 1.4s ease-in-out infinite;}
.durak.bitti{background:rgba(31,154,92,.92);color:#fff;}
.durak.kilitli{background:rgba(18,50,74,.55);color:#fff;font-size:clamp(9px,1.35cqw,18px);}
@keyframes parla{50%{box-shadow:0 0 0 4px #fff,0 0 0 15px rgba(255,201,60,.45);}}
.ad{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:#fffdf4;color:var(--murekkep);
  border:3px solid #fff;border-radius:99px;padding:.25em .9em;font-weight:700;font-size:clamp(11px,1.75cqw,24px);
  box-shadow:0 4px 0 rgba(3,70,95,.25);}
.ad.kapali{background:#d7e3e6;color:#5d7682;}
.ad.aktif{background:var(--altin);}

/* görev */
.gorev{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:18px;}
.kart{background:#fffdf4;border-radius:26px;padding:20px 22px;box-shadow:0 10px 0 rgba(3,70,95,.22);}
.kart-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.etiket{display:inline-block;background:#e0f6ea;color:#18744a;font-weight:700;border-radius:99px;padding:5px 14px;font-size:16px;}
.sayac{font-weight:700;color:#4d7f8b;font-size:16px;}
.soru{margin:18px 0 6px;font-size:clamp(48px,7vw,84px);font-weight:700;text-align:center;letter-spacing:.5px;line-height:1.15;}
.soru .bos{display:inline-block;min-width:1.9em;padding:0 .2em;border-bottom:6px solid var(--mercan);color:var(--mercan);}
.bilgi{text-align:center;color:#4d7f8b;font-size:18px;min-height:27px;margin:4px 0 0;}
.geri-bildirim{margin-top:12px;text-align:center;font-weight:700;font-size:20px;border-radius:16px;padding:10px;min-height:48px;}
.geri-bildirim.dogru{background:#dcf5e5;color:#177043;}
.geri-bildirim.yanlis{background:#ffe2da;color:#a3392a;}

.tuslar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tuslar button{font-size:32px;font-weight:700;padding:12px 0;border:0;border-radius:16px;background:#e6f6f9;color:var(--murekkep);
  box-shadow:0 5px 0 #b3d9e0;cursor:pointer;}
.tuslar button:active{transform:translateY(4px);box-shadow:0 1px 0 #b3d9e0;}
.tuslar .sil{background:#ffe7c2;box-shadow:0 5px 0 #ecc37f;font-size:22px;}
.tuslar .kontrol{grid-column:1/-1;background:var(--mercan);color:#fff;box-shadow:0 5px 0 #c4472f;font-size:24px;}

.kutlama{display:none;text-align:center;}
.kutlama.goster{display:block;animation:yuksel .5s ease both;}
.kutlama img{width:150px;height:auto;border-radius:22px;box-shadow:0 0 0 5px #fff,0 0 0 11px var(--altin);margin:8px auto 14px;display:block;}
.kutlama h2{margin:0 0 6px;font-size:30px;}
.kutlama p{margin:0 0 16px;color:#3d6f7d;font-size:18px;}
.kutlama button{border:0;border-radius:16px;background:var(--mercan);color:#fff;font-size:20px;font-weight:700;padding:13px 26px;box-shadow:0 5px 0 #c4472f;cursor:pointer;}
@keyframes yuksel{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

.imza{text-align:center;color:#fff;margin-top:22px;font-size:15px;}
.imza b{color:#fff6c9;}
@media (max-width:820px){
  .gorev{grid-template-columns:1fr;}
  .tuslar button{padding:10px 0;font-size:28px;}
}

<script>
const ADALAR = {
  1: ["Toplama Koyu", "Çıkarma Sahili", "Sayı Burnu", "Hazine Adası"],
  2: ["Toplama Koyu", "Çıkarma Sahili", "Çarpma Burnu", "Hazine Adası"],
  3: ["Toplama Koyu", "Çıkarma Sahili", "Çarpma Burnu", "Hazine Adası"]
};
const GEREKEN = [5, 5, 5, 3];
const TOPLAM = GEREKEN.reduce((a, b) => a + b, 0);
const BOS = '<span class="bos">__CEVAP__</span>';
let seviye = 1, ada = 0, cozulen = [0, 0, 0, 0], soru = null, cevap = "", bitti = false, kilit = false;

const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const SEC = d => d[Math.floor(Math.random() * d.length)];
const $ = id => document.getElementById(id);

function toplama(sv){
  let a, b;
  if (sv === 1) { a = R(1, 12); b = R(1, Math.min(9, 20 - a)); }
  else if (sv === 2) { a = R(12, 78); b = R(5, Math.min(60, 99 - a)); }
  else { a = R(105, 689); b = R(48, Math.min(399, 998 - a)); }
  return { parca: [a, "+", b, "=", null], cevap: a + b };
}
function cikarma(sv){
  let a, b;
  if (sv === 1) { a = R(5, 20); b = R(1, Math.min(9, a - 1)); }
  else if (sv === 2) { a = R(25, 99); b = R(4, a - 8); }
  else { a = R(240, 985); b = R(65, a - 30); }
  return { parca: [a, "−", b, "=", null], cevap: a - b };
}
function carpma(sv){
  let a, b;
  if (sv === 2) { a = SEC([2, 3, 4, 5, 10]); b = R(1, a === 10 ? 5 : 10); if (a * b > 50) b = Math.floor(50 / a); }
  else { a = R(2, 10); b = R(2, 10); }
  if (Math.random() < .5) { const t = a; a = b; b = t; }
  return { parca: [a, "×", b, "=", null], cevap: a * b };
}
function bolme(){
  const b = R(2, 10), s = R(2, 10);
  return { parca: [b * s, "÷", b, "=", null], cevap: s };
}
function sayiBurnu(){
  const t = R(1, 3);
  if (t === 1) { const n = R(1, 19); return { parca: [n, ",", null], cevap: n + 1, bilgi: "Sonra gelen sayıyı yaz." }; }
  if (t === 2) { const n = R(2, 20); return { parca: [null, ",", n], cevap: n - 1, bilgi: "Önce gelen sayıyı yaz." }; }
  const x = toplama(1); return { parca: [x.parca[0], "+", null, "=", x.cevap], cevap: x.parca[2], bilgi: "Eksik sayıyı bul." };
}
function soruUret(){
  const sv = seviye;
  if (ada === 0) return toplama(sv);
  if (ada === 1) return cikarma(sv);
  if (ada === 2) return sv === 1 ? sayiBurnu() : carpma(sv);
  if (sv === 1) return SEC([toplama, cikarma, sayiBurnu])(1);
  if (sv === 2) return SEC([toplama, cikarma, carpma])(2);
  return SEC([carpma, bolme, toplama, cikarma])(3);
}
function soruCiz(){
  $("soru").innerHTML = soru.parca.map(p => p === null ? BOS.replace("__CEVAP__", cevap || "&nbsp;") : p).join(" ").replace(" ,", ",");
}
function yeniSoru(){
  soru = soruUret(); cevap = ""; kilit = false;
  $("adaAdi").textContent = ADALAR[seviye][ada];
  $("sayac").textContent = "Soru " + (cozulen[ada] + 1) + " / " + GEREKEN[ada];
  $("bilgi").textContent = soru.bilgi || (ada === 3 ? "Son ada. Dikkatle çöz, hazine yakında." : "Cevabı tuşlarla yaz, sonra Kontrol et düğmesine bas.");
  $("geriBildirim").textContent = ""; $("geriBildirim").className = "geri-bildirim";
  soruCiz();
}
function haritaCiz(){
  const ad = ADALAR[seviye];
  for (let i = 0; i < 4; i++) {
    const d = $("durak" + i), e = $("ad" + i);
    e.textContent = ad[i];
    d.className = "durak"; e.className = "ad";
    if (cozulen[i] >= GEREKEN[i]) { d.classList.add("bitti"); d.textContent = "✓"; }
    else if (i > ada) { d.classList.add("kilitli"); d.textContent = "Kilitli"; e.classList.add("kapali"); }
    else { d.textContent = cozulen[i] + " / " + GEREKEN[i]; if (!bitti) { d.classList.add("aktif"); e.classList.add("aktif"); } }
  }
  const t = cozulen.reduce((a, b) => a + b, 0);
  $("ilerlemeYazi").textContent = t + " / " + TOPLAM;
  $("ilerlemeDolu").style.width = (t / TOPLAM * 100) + "%";
}
function kontrol(){
  if (bitti || kilit) return;
  const gb = $("geriBildirim");
  if (cevap === "") { gb.textContent = "Önce cevabını yaz."; gb.className = "geri-bildirim yanlis"; return; }
  if (Number(cevap) === soru.cevap) {
    kilit = true; cozulen[ada]++;
    gb.className = "geri-bildirim dogru";
    if (cozulen[ada] >= GEREKEN[ada]) {
      if (ada === 3) { gb.textContent = "Harika, hazine senin."; bitti = true; haritaCiz(); setTimeout(bitir, 500); return; }
      gb.textContent = "Ada tamam. Yeni ada açıldı.";
      ada++; haritaCiz(); setTimeout(yeniSoru, 900);
    } else {
      gb.textContent = SEC(["Doğru.", "Çok güzel.", "Aferin, devam."]);
      haritaCiz(); setTimeout(yeniSoru, 700);
    }
  } else {
    gb.textContent = "Olmadı, bir daha dene.";
    gb.className = "geri-bildirim yanlis";
    cevap = ""; soruCiz();
  }
}
function bitir(){
  $("soru").style.display = "none"; $("bilgi").style.display = "none"; $("geriBildirim").style.display = "none";
  $("sayac").textContent = ""; $("kutlama").classList.add("goster");
}
function basla(){
  ada = 0; cozulen = [0, 0, 0, 0]; bitti = false;
  $("soru").style.display = ""; $("bilgi").style.display = ""; $("geriBildirim").style.display = "";
  $("kutlama").classList.remove("goster");
  document.querySelectorAll("#seviye button").forEach(b => b.classList.toggle("secili", +b.dataset.s === seviye));
  haritaCiz(); yeniSoru();
}
function tusa(t){
  if (bitti || kilit) return;
  if (t === "kontrol") return kontrol();
  if (t === "sil") cevap = cevap.slice(0, -1);
  else if (t === "temizle") cevap = "";
  else if (cevap.length < 4) cevap = (cevap === "0" ? "" : cevap) + t;
  soruCiz();
}
$("tuslar").addEventListener("click", e => { const b = e.target.closest("button"); if (b) tusa(b.dataset.t || b.textContent); });
document.addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) tusa(e.key);
  else if (e.key === "Backspace") tusa("sil");
  else if (e.key === "Enter") tusa("kontrol");
});
$("seviye").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; seviye = +b.dataset.s; basla(); });
$("yeniden").addEventListener("click", basla);
basla();
</script>
