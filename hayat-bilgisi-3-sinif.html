<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Sınıf Hayat Bilgisi | Dijital Öğretmen</title>
<style>
  :root{
    --coral:#FF7B54;
    --coral-dark:#E85D3D;
    --turkuaz:#17A2A0;
    --turkuaz-dark:#0E8482;
    --gold:#FFC93C;
    --cream:#FFF8F0;
    --ink:#2D2A32;
    --ok:#2ECC71;
    --bad:#FF5C5C;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Verdana, Tahoma, sans-serif;
    background:linear-gradient(180deg,#FFF3E6 0%, #E9FBFA 55%, #FFF8F0 100%);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    position:relative;
    overflow:hidden;
    background:linear-gradient(120deg,var(--coral) 0%, var(--coral-dark) 55%, var(--turkuaz) 130%);
    color:white;
    text-align:center;
    padding:38px 18px 46px;
  }
  header h1{
    margin:6px 0 6px;
    font-size:2rem;
    text-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  header p{margin:0;font-size:1.05rem;opacity:.95;}
  .float-emoji{
    position:absolute;
    font-size:2rem;
    opacity:.35;
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-16px) rotate(8deg);}
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:20px 14px 0;
    max-width:900px;
    margin:0 auto;
  }
  .tab-btn{
    border:none;
    cursor:pointer;
    padding:12px 16px;
    border-radius:999px;
    font-size:.95rem;
    font-weight:700;
    background:white;
    color:var(--ink);
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.2s;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab-btn:hover{transform:translateY(-2px);}
  .tab-btn.active{
    background:var(--turkuaz);
    color:white;
    box-shadow:0 6px 16px rgba(23,162,160,.4);
  }
  main{max-width:820px;margin:0 auto;padding:24px 16px;}
  .unit{display:none;animation:fadein .35s ease;}
  .unit.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .unit-hero{
    background:white;
    border-radius:var(--radius);
    padding:22px 22px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.06);
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .unit-hero .big-icon{
    font-size:3rem;
    background:var(--accent-bg,#FFEEDD);
    border-radius:50%;
    width:74px;height:74px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .unit-hero h2{margin:0 0 4px;font-size:1.4rem;color:var(--accent,var(--coral-dark));}
  .unit-hero p{margin:0;color:#666;font-size:.92rem;}

  section.block{
    background:white;
    border-radius:var(--radius);
    padding:20px 20px 22px;
    margin-bottom:20px;
    box-shadow:0 6px 18px rgba(0,0,0,.05);
  }
  section.block h3{
    margin:0 0 14px;
    font-size:1.1rem;
    display:flex;align-items:center;gap:8px;
    color:var(--accent,var(--coral-dark));
  }
  .intro p{
    line-height:1.65;
    font-size:.98rem;
    margin:0 0 12px;
    color:#3a3a3a;
  }
  .intro p:last-child{margin-bottom:0;}

  /* Düşünelim accordion */
  .think-item{
    border:2px solid #F0F0F0;
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .think-q{
    padding:13px 16px;
    cursor:pointer;
    font-weight:600;
    font-size:.94rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#FAFAFA;
    transition:.2s;
  }
  .think-q:hover{background:#F3F3F3;}
  .think-q .arrow{transition:.25s;flex-shrink:0;}
  .think-item.open .arrow{transform:rotate(180deg);}
  .think-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    padding:0 16px;
    font-size:.92rem;
    line-height:1.6;
    color:#444;
    background:#FFFDF7;
  }
  .think-item.open .think-a{
    max-height:300px;
    padding:12px 16px 16px;
  }

  /* Quiz */
  .quiz-progress{
    font-size:.85rem;
    color:#888;
    margin-bottom:10px;
    font-weight:600;
  }
  .quiz-q{font-weight:700;margin-bottom:12px;font-size:.98rem;}
  .quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .quiz-opt{
    text-align:left;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid #E8E8E8;
    background:white;
    cursor:pointer;
    font-size:.92rem;
    transition:.15s;
  }
  .quiz-opt:hover{border-color:var(--turkuaz);}
  .quiz-opt.correct{background:#E9FAF0;border-color:var(--ok);font-weight:700;}
  .quiz-opt.wrong{background:#FFEDED;border-color:var(--bad);}
  .quiz-explain{
    background:#FFF8E6;
    border-radius:12px;
    padding:12px 14px;
    font-size:.88rem;
    color:#6b5400;
    margin-bottom:14px;
    display:none;
  }
  .quiz-nav{display:flex;justify-content:space-between;align-items:center;}
  .btn{
    border:none;
    padding:10px 18px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    font-size:.9rem;
    background:var(--turkuaz);
    color:white;
    transition:.2s;
  }
  .btn:hover{background:var(--turkuaz-dark);}
  .btn:disabled{opacity:.4;cursor:default;}
  .quiz-score{font-weight:700;font-size:.9rem;color:var(--coral-dark);}
  .quiz-done{
    text-align:center;
    padding:16px;
  }
  .quiz-done .emoji{font-size:2.6rem;}

  /* Sort game */
  .sort-instruction{font-size:.9rem;color:#666;margin-bottom:14px;}
  .sort-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
    min-height:40px;
  }
  .sort-chip{
    padding:9px 14px;
    background:#F0F4FF;
    border:2px solid #D8E0FF;
    border-radius:999px;
    font-size:.88rem;
    cursor:pointer;
    transition:.15s;
    font-weight:600;
  }
  .sort-chip:hover{transform:translateY(-2px);border-color:var(--turkuaz);}
  .sort-chip.selected{background:var(--gold);border-color:#E0A800;}
  .sort-buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sort-bucket{
    border:2px dashed #ccc;
    border-radius:16px;
    padding:12px;
    min-height:120px;
    background:#FAFAFA;
    cursor:pointer;
    transition:.15s;
  }
  .sort-bucket:hover{border-color:var(--turkuaz);}
  .sort-bucket h4{margin:0 0 8px;font-size:.92rem;text-align:center;}
  .sort-bucket .items{display:flex;flex-wrap:wrap;gap:6px;}
  .placed{
    padding:6px 10px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
  }
  .placed.ok{background:#DFF7E7;color:#1E7A44;}
  .placed.bad{background:#FFE3E3;color:#B33636;}
  .sort-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .sort-score{font-weight:700;color:var(--coral-dark);font-size:.9rem;}

  footer{
    text-align:center;
    font-size:.8rem;
    color:#999;
    padding:20px;
  }
</style>

/* ============ RENDER ============ */
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

UNITS.forEach((u,idx)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
  btn.innerHTML = `${u.icon} ${u.title}`;
  btn.onclick = ()=> switchUnit(u.id);
  btn.id = 'tabbtn-'+u.id;
  tabsEl.appendChild(btn);

  const sec = document.createElement('div');
  sec.className = 'unit' + (idx===0 ? ' active' : '');
  sec.id = 'unit-'+u.id;
  sec.style.setProperty('--accent', u.accent);
  sec.style.setProperty('--accent-bg', u.accentBg);

  sec.innerHTML = `
    <div class="unit-hero">
      <div class="big-icon">${u.icon}</div>
      <div>
        <h2>${u.title}</h2>
        <p>${u.desc}</p>
      </div>
    </div>

    <section class="block intro">
      <h3>📖 Konu Anlatımı</h3>
      ${u.intro.map(p=>`<p>${p}</p>`).join('')}
    </section>

    <section class="block">
      <h3>🤔 Hadi Düşünelim</h3>
      <div class="think-list">
        ${u.think.map((t,i)=>`
          <div class="think-item" id="think-${u.id}-${i}">
            <div class="think-q" onclick="toggleThink('${u.id}',${i})">
              <span>${t.q}</span>
              <span class="arrow">▼</span>
            </div>
            <div class="think-a">${t.a}</div>
          </div>
        `).join('')}
      </div>
    </section>

    <section class="block">
      <h3>🏆 Bilgi Yarışması</h3>
      <div id="quiz-${u.id}"></div>
    </section>

    <section class="block">
      <h3>🎮 Sınıflandırma Oyunu</h3>
      <p class="sort-instruction">${u.game.instruction}</p>
      <div id="game-${u.id}"></div>
    </section>
  `;
  mainEl.appendChild(sec);

  initQuiz(u);
  initGame(u);
});

function switchUnit(id){
  document.querySelectorAll('.unit').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('unit-'+id).classList.add('active');
  document.getElementById('tabbtn-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function toggleThink(uid, i){
  const el = document.getElementById(`think-${uid}-${i}`);
  el.classList.toggle('open');
}

/* ---- QUIZ ENGINE ---- */
function initQuiz(u){
  const state = {i:0, score:0, answered:false};
  const container = document.getElementById('quiz-'+u.id);

  function render(){
    if(state.i >= u.quiz.length){
      const pct = Math.round((state.score/u.quiz.length)*100);
      let emoji = pct>=80?'🌟':pct>=50?'👍':'💪';
      container.innerHTML = `
        <div class="quiz-done">
          <div class="emoji">${emoji}</div>
          <p style="font-weight:700;font-size:1.05rem;">${u.quiz.length} sorudan ${state.score} doğru!</p>
          <button class="btn" onclick="restartQuiz_${u.id}()">Tekrar Dene</button>
        </div>`;
      return;
    }
    const q = u.quiz[state.i];
    container.innerHTML = `
      <div class="quiz-progress">Soru ${state.i+1} / ${u.quiz.length} &nbsp;·&nbsp; <span class="quiz-score">✅ ${state.score} doğru</span></div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">
        ${q.opts.map((o,idx)=>`<button class="quiz-opt" data-idx="${idx}">${o}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="explain-${u.id}">${q.explain}</div>
      <div class="quiz-nav">
        <span></span>
        <button class="btn" id="next-${u.id}" disabled>Sonraki Soru →</button>
      </div>
    `;
    const opts = container.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.onclick = ()=>{
        if(state.answered) return;
        state.answered = true;
        const idx = parseInt(btn.dataset.idx);
        opts.forEach(b=>b.style.pointerEvents='none');
        if(idx === q.correct){
          btn.classList.add('correct');
          state.score++;
        } else {
          btn.classList.add('wrong');
          opts[q.correct].classList.add('correct');
        }
        document.getElementById('explain-'+u.id).style.display='block';
        document.getElementById('next-'+u.id).disabled = false;
      };
    });
    document.getElementById('next-'+u.id).onclick = ()=>{
      state.i++; state.answered=false; render();
    };
  }
  window['restartQuiz_'+u.id] = ()=>{ state.i=0; state.score=0; state.answered=false; render(); };
  render();
}

/* ---- SORT GAME ENGINE ---- */
function initGame(u){
  const g = u.game;
  const container = document.getElementById('game-'+u.id);
  let selected = null;
  let placed = {}; // text -> true
  let correctCount = 0;

  function render(){
    const pool = g.items.filter(it=>!placed[it.t]);
    container.innerHTML = `
      <div class="sort-pool">
        ${pool.map(it=>`<div class="sort-chip" data-t="${it.t}">${it.t}</div>`).join('')}
        ${pool.length===0 ? '<span style="color:#999;font-size:.85rem;">Tüm öğeler yerleştirildi! 🎉</span>' : ''}
      </div>
      <div class="sort-buckets">
        <div class="sort-bucket" data-k="${g.cat1.key}">
          <h4>${g.cat1.label}</h4>
          <div class="items" id="bucket1-${u.id}"></div>
        </div>
        <div class="sort-bucket" data-k="${g.cat2.key}">
          <h4>${g.cat2.label}</h4>
          <div class="items" id="bucket2-${u.id}"></div>
        </div>
      </div>
      <div class="sort-footer">
        <span class="sort-score">✅ ${correctCount} doğru yerleşim</span>
        <button class="btn" id="reset-${u.id}">Baştan Başla</button>
      </div>
    `;
    // restore placed items visually
    Object.keys(placed).forEach(t=>{
      const item = g.items.find(it=>it.t===t);
      const isOk = item.k === (item._placedIn);
      const b = item._placedIn === g.cat1.key ? document.getElementById('bucket1-'+u.id) : document.getElementById('bucket2-'+u.id);
      const chip = document.createElement('div');
      chip.className = 'placed ' + (isOk ? 'ok':'bad');
      chip.textContent = t + (isOk ? ' ✓' : ' ✗');
      b.appendChild(chip);
    });

    container.querySelectorAll('.sort-chip').forEach(c=>{
      c.onclick = ()=>{
        container.querySelectorAll('.sort-chip').forEach(x=>x.classList.remove('selected'));
        c.classList.add('selected');
        selected = c.dataset.t;
      };
    });
    container.querySelectorAll('.sort-bucket').forEach(b=>{
      b.onclick = ()=>{
        if(!selected) return;
        const item = g.items.find(it=>it.t===selected);
        item._placedIn = b.dataset.k;
        placed[selected] = true;
        if(item.k === b.dataset.k) correctCount++;
        selected = null;
        render();
      };
    });
    document.getElementById('reset-'+u.id).onclick = ()=>{
      placed = {}; correctCount=0; selected=null;
      g.items.forEach(it=>delete it._placedIn);
      render();
    };
  }
  render();
}
</script>
