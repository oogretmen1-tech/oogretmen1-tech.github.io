<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaşadığım Çevre - Etkileşimli Etkinlik</title>
<style>
  :root {
    --green: #2E7D5B;
    --green-dark: #1F3B2E;
    --green-light: #EAF4EE;
    --orange: #E08E45;
    --orange-light: #FDF1E4;
    --blue: #3E7CB1;
    --red: #D9534F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(180deg, #EAF4EE 0%, #FFFFFF 40%);
    color: var(--green-dark);
    min-height: 100vh;
  }
  header {
    background: var(--green);
    color: white;
    padding: 24px 16px 30px;
    text-align: center;
    border-radius: 0 0 30px 30px;
  }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 6px 0 0; opacity: 0.9; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 20px;
    margin-bottom: 24px;
  }
  .card h2 {
    color: var(--green);
    font-size: 20px;
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
    color: white;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 15px;
    flex-shrink: 0;
  }

  /* Drag and drop sorting */
  .pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px;
    background: #F4F4F4;
    border-radius: 12px;
    min-height: 60px;
    margin-bottom: 16px;
  }
  .item {
    background: white;
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: grab;
    font-size: 16px;
    user-select: none;
    touch-action: none;
  }
  .item.dragging { opacity: 0.4; }
  .drop-zones { display: flex; gap: 16px; flex-wrap: wrap; }
  .zone {
    flex: 1;
    min-width: 260px;
    min-height: 140px;
    border-radius: 14px;
    padding: 14px;
    border: 3px dashed #bbb;
  }
  .zone.natural { background: var(--green-light); border-color: var(--green); }
  .zone.artificial { background: var(--orange-light); border-color: var(--orange); }
  .zone h3 { margin: 0 0 10px; font-size: 17px; }
  .zone .item { border-color: transparent; }
  .zone-items { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }

  /* Quiz */
  .question { margin-bottom: 18px; }
  .question p { font-weight: 600; margin-bottom: 8px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: #F7F7F7;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.15s;
  }
  .option:hover { background: #EFEFEF; }
  .option.correct { background: #DFF3E4; border-color: var(--green); }
  .option.incorrect { background: #FBE4E4; border-color: var(--red); }
  .option.disabled { pointer-events: none; }

  button.check {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 24px;
    padding: 10px 22px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.check:hover { background: #256A4E; }
  button.reset {
    background: transparent;
    color: var(--green);
    border: 2px solid var(--green);
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }

  .feedback { margin-top: 10px; font-weight: 600; min-height: 22px; }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }

  #score-panel {
    text-align: center;
    background: var(--green);
    color: white;
    border-radius: 18px;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
  }
  .emoji { font-size: 20px; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <h1>🌍 Yaşadığım Çevre</h1>
  <p>3. Sınıf Fen Bilimleri — Etkileşimli Etkinlik</p>
</header>

<div class="container">

  <div class="card">
    <h2><span class="badge">1</span> Doğal mı, Yapay mı?</h2>
    <p>Önce bir kartın üzerine dokun, sonra ait olduğu gruba dokun.</p>
    <div class="pool" id="pool"></div>
    <div class="drop-zones">
      <div class="zone natural" id="zone-natural">
        <h3>🌳 Doğal Çevre</h3>
        <div class="zone-items" id="zone-natural-items"></div>
      </div>
      <div class="zone artificial" id="zone-artificial">
        <h3>🏠 Yapay Çevre</h3>
        <div class="zone-items" id="zone-artificial-items"></div>
      </div>
    </div>
    <div class="feedback" id="sort-feedback"></div>
    <button class="check" onclick="checkSort()">Kontrol Et</button>
    <button class="reset" onclick="resetSort()">Baştan Başla</button>
  </div>

  <div class="card">
    <h2><span class="badge">2</span> Küçük Bilgi Yarışması</h2>
    <div id="quiz"></div>
  </div>

  <div class="card" id="score-panel">
    Puanın: <span id="score">0</span> / <span id="total">0</span>
  </div>

</div>

<script>
// ---------- Sorting activity ----------
const sortItems = [
  { text: "🏔️ Dağ", type: "natural" },
  { text: "🏫 Okul", type: "artificial" },
  { text: "🌲 Orman", type: "natural" },
  { text: "🌉 Köprü", type: "artificial" },
  { text: "💧 Göl", type: "natural" },
  { text: "🏭 Fabrika", type: "artificial" },
  { text: "🐦 Kuş", type: "natural" },
  { text: "🛣️ Yol", type: "artificial" },
];

function shuffle(arr) {
  return arr.map(v => [Math.random(), v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

let selectedEl = null;

function buildPool() {
  const pool = document.getElementById("pool");
  pool.innerHTML = "";
  shuffle(sortItems).forEach((it, idx) => {
    const el = document.createElement("div");
    el.className = "item";
    el.textContent = it.text;
    el.dataset.type = it.type;
    el.id = "item-" + idx;
    el.addEventListener("click", () => selectItem(el));
    pool.appendChild(el);
  });
}

function selectItem(el) {
  if (selectedEl) selectedEl.style.boxShadow = "";
  selectedEl = el;
  el.style.boxShadow = "0 0 0 3px " + (el.dataset.type === "natural" ? "#2E7D5B" : "#E08E45");
}

function placeInZone(zoneItemsId) {
  if (!selectedEl) return;
  document.getElementById(zoneItemsId).appendChild(selectedEl);
  selectedEl.style.boxShadow = "";
  selectedEl = null;
}

document.getElementById("zone-natural").addEventListener("click", () => placeInZone("zone-natural-items"));
document.getElementById("zone-artificial").addEventListener("click", () => placeInZone("zone-artificial-items"));
document.getElementById("pool").addEventListener("click", (e) => {
  if (e.target.id === "pool" && selectedEl) {
    document.getElementById("pool").appendChild(selectedEl);
    selectedEl.style.boxShadow = "";
    selectedEl = null;
  }
});

function resetSort() {
  selectedEl = null;
  buildPool();
  document.getElementById("zone-natural-items").innerHTML = "";
  document.getElementById("zone-artificial-items").innerHTML = "";
  document.getElementById("sort-feedback").textContent = "";
  document.getElementById("sort-feedback").className = "feedback";
}

function checkSort() {
  let correct = 0, placed = 0;
  document.querySelectorAll("#zone-natural-items .item").forEach(el => {
    placed++;
    if (el.dataset.type === "natural") correct++;
  });
  document.querySelectorAll("#zone-artificial-items .item").forEach(el => {
    placed++;
    if (el.dataset.type === "artificial") correct++;
  });
  const fb = document.getElementById("sort-feedback");
  if (placed < sortItems.length) {
    fb.textContent = "Henüz tüm kartları yerleştirmedin. Devam et!";
    fb.className = "feedback";
  } else if (correct === sortItems.length) {
    fb.textContent = "🎉 Harika! Hepsi doğru yerde!";
    fb.className = "feedback ok";
  } else {
    fb.textContent = `${correct} / ${sortItems.length} kart doğru yerde. Tekrar dener misin?`;
    fb.className = "feedback bad";
  }
  updateScoreFromSort(correct === sortItems.length && placed === sortItems.length);
}

// ---------- Quiz ----------
const quizData = [
  {
    q: "Çevre nedir?",
    options: [
      "Sadece evimiz",
      "İçinde yaşadığımız ve bizi etkileyen her şey",
      "Sadece ormanlar",
    ],
    correct: 1,
  },
  {
    q: "Aşağıdakilerden hangisi doğal çevreye örnektir?",
    options: ["Köprü", "Göl", "Bina"],
    correct: 1,
  },
  {
    q: "Aşağıdakilerden hangisi yapay (insan yapımı) çevreye örnektir?",
    options: ["Orman", "Dağ", "Okul"],
    correct: 2,
  },
  {
    q: "Çevre kirliliğini önlemek için ne yapabiliriz?",
    options: ["Çöpleri rastgele atmak", "Geri dönüşüm yapmak", "Suyu boşa harcamak"],
    correct: 1,
  },
  {
    q: "Aşağıdakilerden hangisi cansız bir varlıktır?",
    options: ["Kuş", "Ağaç", "Taş"],
    correct: 2,
  },
];

let quizAnswered = new Array(quizData.length).fill(false);
let sortCorrect = false;

function buildQuiz() {
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";
  quizData.forEach((item, qi) => {
    const qDiv = document.createElement("div");
    qDiv.className = "question";
    const p = document.createElement("p");
    p.textContent = (qi + 1) + ". " + item.q;
    qDiv.appendChild(p);
    const optsDiv = document.createElement("div");
    optsDiv.className = "options";
    item.options.forEach((opt, oi) => {
      const optDiv = document.createElement("div");
      optDiv.className = "option";
      optDiv.textContent = opt;
      optDiv.onclick = () => selectOption(qi, oi, optDiv, qDiv);
      optsDiv.appendChild(optDiv);
    });
    qDiv.appendChild(optsDiv);
    quizDiv.appendChild(qDiv);
  });
  updateTotal();
}

function selectOption(qi, oi, optDiv, qDiv) {
  if (quizAnswered[qi]) return;
  quizAnswered[qi] = true;
  const opts = qDiv.querySelectorAll(".option");
  opts.forEach((o, idx) => {
    o.classList.add("disabled");
    if (idx === quizData[qi].correct) o.classList.add("correct");
  });
  if (oi !== quizData[qi].correct) {
    optDiv.classList.add("incorrect");
  }
  updateScore();
}

function updateScoreFromSort(isCorrect) {
  sortCorrect = isCorrect;
  updateScore();
}

function updateScore() {
  let right = 0;
  const questionDivs = document.querySelectorAll(".question");
  quizData.forEach((item, qi) => {
    const qDiv = questionDivs[qi];
    if (!qDiv) return;
    if (quizAnswered[qi] && !qDiv.querySelector(".option.incorrect")) right++;
  });
  document.getElementById("score").textContent = right + (sortCorrect ? 1 : 0);
}

function updateTotal() {
  document.getElementById("total").textContent = quizData.length + 1;
}

buildPool();
buildQuiz();
</script>

</body>
</html>
