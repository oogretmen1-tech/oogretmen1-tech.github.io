<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orman Sakinleri - İnteraktif Hikaye Kitabı | Dijital Öğretmen</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --s2:#FFD93D;
  --orange:#FF9F43;
  --amber:#F59E0B;
  --bark:#6B4226;
  --bark-deep:#4A2C17;
  --cream:#FFF8EA;
  --dark:#2D2D2D;
  --leaf:#6BCB77;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Nunito",sans-serif;
  background:linear-gradient(160deg,#3a2416 0%,#1f1409 100%);
  color:var(--dark);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
  position:sticky; top:0; z-index:50;
}
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:#fff; color:var(--bark-deep);
  font-family:"Nunito",sans-serif; font-weight:800; font-size:13px;
  padding:8px 16px; border-radius:30px; text-decoration:none;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  transition:transform .18s;
}
.back-btn:hover{ transform:translateX(-3px); }
.topbar h1{
  font-family:"Baloo 2",cursive; font-weight:800; color:#FFF3D6;
  font-size:clamp(14px,3.6vw,20px);
  text-shadow:0 2px 6px rgba(0,0,0,.4);
  text-align:center;
  flex:1;
}
.page-counter{
  font-family:"Baloo 2",cursive; font-weight:700; color:#FFF3D6;
  font-size:13px; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:20px;
  white-space:nowrap;
}

/* ===== BOOK STAGE ===== */
.stage{
  flex:1; display:flex; align-items:center; justify-content:center;
  position:relative; padding:14px 10px 10px;
  min-height:0;
}
.book{
  position:relative;
  max-width:560px; width:100%;
  height:100%;
  max-height:calc(100vh - 150px);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.06);
  background:#000;
}
.page-img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  background:#111;
  opacity:0;
  transform:scale(1.02);
  transition:opacity .35s ease, transform .35s ease;
  pointer-events:none;
}
.page-img.active{
  opacity:1; transform:scale(1);
  pointer-events:auto;
}

/* tap zones for page turning */
.tap-zone{ position:absolute; top:0; bottom:0; width:32%; z-index:5; cursor:pointer; }
.tap-zone.left{ left:0; }
.tap-zone.right{ right:0; }
.tap-hint{
  position:absolute; top:50%; transform:translateY(-50%);
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.85); color:var(--bark-deep);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.3);
  opacity:0; transition:opacity .2s;
  z-index:6; pointer-events:none;
}
.tap-zone.left .tap-hint{ left:10px; }
.tap-zone.right .tap-hint{ right:10px; }
.tap-zone:hover .tap-hint{ opacity:1; }

/* ===== CONTROLS ===== */
.controls{
  display:flex; align-items:center; justify-content:center; gap:16px;
  padding:14px 16px 20px;
}
.nav-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(135deg,var(--amber),var(--orange));
  color:#fff; border:none; font-family:"Baloo 2",cursive; font-weight:700; font-size:15px;
  padding:12px 22px; border-radius:30px; cursor:pointer;
  box-shadow:0 6px 18px rgba(245,158,11,.4);
  transition:transform .18s, opacity .18s;
}
.nav-btn:hover{ transform:translateY(-2px); }
.nav-btn:disabled{ opacity:.35; cursor:default; transform:none; }
.nav-btn.secondary{
  background:#fff; color:var(--bark-deep); box-shadow:0 4px 12px rgba(0,0,0,.2);
}

/* progress dots */
.dots{
  display:flex; gap:5px; justify-content:center; flex-wrap:wrap;
  padding:0 16px 16px; max-width:560px; margin:0 auto;
}
.dot{
  width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,.25);
  cursor:pointer; transition:all .2s; flex-shrink:0;
}
.dot.active{ background:var(--s2); width:22px; border-radius:5px; }
.dot.done{ background:rgba(255,217,61,.5); }

/* ===== END CARD ===== */
.end-card{
  position:absolute; inset:0; z-index:20;
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  background:linear-gradient(160deg,#2a1a0e,#150c05);
  color:#FFF3D6; text-align:center; padding:30px;
}
.end-card.show{ display:flex; }
.end-card h2{ font-family:"Baloo 2",cursive; font-size:28px; }
.end-card p{ font-size:14px; opacity:.85; max-width:340px; line-height:1.6; }
.end-card .nav-btn{ margin-top:8px; }

footer{
  text-align:center; padding:14px; color:rgba(255,255,255,.4); font-size:11px;
}

@media (max-width:480px){
  .book{ border-radius:10px; }
  .nav-btn{ padding:11px 18px; font-size:14px; }
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html?page=hikaye">← Hikaye Köşesi</a>
  <h1>🌳 Orman Sakinleri</h1>
  <span class="page-counter"><span id="pageNow">1</span> / <span id="pageTotal">18</span></span>
</div>

<div class="stage">
  <div class="book" id="book">
    <!-- pages injected by JS -->
    <div class="tap-zone left" id="zoneLeft"><span class="tap-hint">‹</span></div>
    <div class="tap-zone right" id="zoneRight"><span class="tap-hint">›</span></div>

    <div class="end-card" id="endCard">
      <h2>🍂 Son 🍂</h2>
      <p>Orman hepimizindir... Hikayeyi tekrar okumak ister misin?</p>
      <button class="nav-btn" id="restartBtn">🔁 Baştan Oku</button>
      <a class="nav-btn secondary" href="index.html?page=hikaye">📚 Diğer Hikayeler</a>
    </div>
  </div>
</div>

<div class="controls">
  <button class="nav-btn secondary" id="prevBtn">‹ Önceki</button>
  <button class="nav-btn" id="nextBtn">Sonraki ›</button>
</div>

<div class="dots" id="dots"></div>

<footer>Dijital Öğretmen · Hikaye Köşesi</footer>

<script>
const TOTAL = 18;
const book = document.getElementById('book');
const dotsWrap = document.getElementById('dots');
const pageNowEl = document.getElementById('pageNow');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const endCard = document.getElementById('endCard');
let current = 1;

// build image elements
for(let i=1;i<=TOTAL;i++){
  const img = document.createElement('img');
  img.className = 'page-img';
  img.id = 'p'+i;
  img.src = 'orman-sakinleri-' + String(i).padStart(2,'0') + '.jpg';
  img.alt = 'Orman Sakinleri - Sayfa ' + i;
  book.insertBefore(img, document.getElementById('zoneLeft'));
}

// build dots
for(let i=1;i<=TOTAL;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  d.dataset.page = i;
  d.addEventListener('click', ()=>goTo(i));
  dotsWrap.appendChild(d);
}

function render(){
  document.querySelectorAll('.page-img').forEach(el=>el.classList.remove('active'));
  document.getElementById('p'+current).classList.add('active');
  pageNowEl.textContent = current;
  prevBtn.disabled = (current===1);
  nextBtn.textContent = (current===TOTAL) ? 'Hikaye Sonu 🏁' : 'Sonraki ›';

  document.querySelectorAll('.dot').forEach(d=>{
    const p = parseInt(d.dataset.page);
    d.classList.toggle('active', p===current);
    d.classList.toggle('done', p<current);
  });
  endCard.classList.remove('show');

  // preload neighbours
  [current-1, current+1].forEach(p=>{
    if(p>=1 && p<=TOTAL){
      const im = new Image();
      im.src = 'orman-sakinleri-' + String(p).padStart(2,'0') + '.jpg';
    }
  });
}

function goTo(n){
  if(n<1) n=1;
  if(n>TOTAL){ endCard.classList.add('show'); return; }
  current = n;
  render();
}

prevBtn.addEventListener('click', ()=>goTo(current-1));
nextBtn.addEventListener('click', ()=>{
  if(current===TOTAL){ endCard.classList.add('show'); }
  else{ goTo(current+1); }
});
document.getElementById('zoneLeft').addEventListener('click', ()=>goTo(current-1));
document.getElementById('zoneRight').addEventListener('click', ()=>{
  if(current===TOTAL){ endCard.classList.add('show'); }
  else{ goTo(current+1); }
});
document.getElementById('restartBtn').addEventListener('click', ()=>goTo(1));

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft') goTo(current-1);
  if(e.key==='ArrowRight'){ if(current===TOTAL){ endCard.classList.add('show'); } else { goTo(current+1); } }
});

// swipe support
let touchX = null;
book.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; }, {passive:true});
book.addEventListener('touchend', (e)=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 40){
    if(dx < 0){ if(current===TOTAL){ endCard.classList.add('show'); } else { goTo(current+1); } }
    else { goTo(current-1); }
  }
  touchX = null;
});

render();
</script>
</body>
</html>
