<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #4b3f72, #2c2440);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 700px;
    width: 100%;
    background: rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #ffd166, #ef476f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; opacity: 0.7; margin-bottom: 25px; font-size: 0.95rem; }

  .setup { display: flex; flex-direction: column; gap: 14px; }
  .setup label { font-size: 0.9rem; opacity: 0.85; margin-bottom: -8px; }
  select, button, input {
    font-size: 1rem;
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    outline: none;
  }
  select { background: rgba(255,255,255,0.12); color: #fff; }
  select option { color: #000; }

  .btn {
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(90deg, #06d6a0, #1b9aaa); color: #fff; }
  .btn-danger { background: linear-gradient(90deg, #ef476f, #d90429); color: #fff; }
  .btn-warn { background: linear-gradient(90deg, #ffd166, #f4a261); color: #2c2440; }
  .btn-neutral { background: rgba(255,255,255,0.15); color: #fff; }

  .game-screen { display: none; text-align: center; }
  .scoreboard {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 10px;
  }
  .team {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 14px;
  }
  .team h3 { font-size: 1rem; margin-bottom: 6px; }
  .team .score { font-size: 2rem; font-weight: 700; }
  .team.a { border-bottom: 4px solid #06d6a0; }
  .team.b { border-bottom: 4px solid #ef476f; }
  .team button { margin-top: 8px; width: 100%; padding: 8px; font-size: 0.85rem; }

  .timer {
    font-size: 3rem;
    font-weight: 700;
    margin: 10px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer.low { color: #ef476f; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .word-card {
    background: #fff;
    color: #2c2440;
    border-radius: 20px;
    padding: 40px 20px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .word-card.hidden-word { font-size: 1.2rem; color: #999; letter-spacing: normal; }

  .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .controls button { flex: 1; min-width: 120px; }

  .category-tag {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-bottom: 10px;
  }

  .footer-note {
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.5;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔐 Şifre Oyunu</h1>
  <p class="subtitle">Tek kelimelik ipuçlarıyla kelimeyi buldur!</p>

  <!-- SETUP SCREEN -->
  <div class="setup" id="setupScreen">
    <label>Kategori Seç</label>
    <select id="categorySelect">
      <option value="hayatbilgisi">Hayat Bilgisi</option>
      <option value="matematik">Matematik</option>
      <option value="turkce">Türkçe</option>
      <option value="karma">Karma (Hepsi)</option>
    </select>

    <label>Tur Süresi (saniye)</label>
    <select id="durationSelect">
      <option value="30">30 saniye</option>
      <option value="45">45 saniye</option>
      <option value="60" selected>60 saniye</option>
      <option value="90">90 saniye</option>
    </select>

    <button class="btn btn-primary" id="startBtn">Oyunu Başlat</button>
  </div>

  <!-- GAME SCREEN -->
  <div class="game-screen" id="gameScreen">
    <div class="scoreboard">
      <div class="team a">
        <h3>🟢 A Takımı</h3>
        <div class="score" id="scoreA">0</div>
        <button class="btn btn-neutral" onclick="addScore('A')">+1 Puan</button>
      </div>
      <div class="team b">
        <h3>🔴 B Takımı</h3>
        <div class="score" id="scoreB">0</div>
        <button class="btn btn-neutral" onclick="addScore('B')">+1 Puan</button>
      </div>
    </div>

    <div class="category-tag" id="categoryTag">Kategori</div>
    <div class="timer" id="timerDisplay">60</div>

    <div class="word-card hidden-word" id="wordCard">Kelimeyi görmek için dokun 👆</div>

    <div class="controls">
      <button class="btn btn-warn" id="revealBtn">Kelimeyi Göster</button>
      <button class="btn btn-danger" id="skipBtn">Pas Geç ⏭</button>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="startTimerBtn">Süreyi Başlat ⏱</button>
      <button class="btn btn-neutral" id="resetBtn">Oyunu Sıfırla</button>
    </div>
  </div>

  <p class="footer-note">Anlatıcı ekranı görür, takım arkadaşları sadece dinler.</p>
</div>

<audio id="tickSound" preload="auto"></audio>

<script>
const wordBanks = {
  hayatbilgisi: ["okul","aile","öğretmen","market","doktor","itfaiyeci","polis","bahar","kış","yaz","sonbahar","trafik ışığı","yaya geçidi","temizlik","sağlık","tasarruf","dostluk","paylaşma","nöbetçi","kütüphane","hastane","belediye","market","komşu","bayrak","vatan","atatürk","bakkal","postacı","çiftçi"],
  matematik: ["üçgen","kare","daire","dikdörtgen","toplama","çıkarma","saat","takvim","ölçü","kilogram","litre","para","onluk","birlik","yüzlük","çift sayı","tek sayı","yarım","bütün","uzunluk","cetvel","terazi","takvim","gün","hafta","ay","yıl","sıfır","toplam","fark"],
  turkce: ["kitap","hikaye","şiir","kahraman","masal","harf","hece","cümle","noktalama","büyük harf","soru işareti","ünlem","kütüphane","yazar","dinleme","konuşma","anlam","zıt anlam","eş anlam","kafiye","başlık","paragraf","özet","mektup","davetiye","bilmece","tekerleme"],
};
wordBanks.karma = [...wordBanks.hayatbilgisi, ...wordBanks.matematik, ...wordBanks.turkce];

const categoryNames = { hayatbilgisi: "Hayat Bilgisi", matematik: "Matematik", turkce: "Türkçe", karma: "Karma" };

let currentWords = [];
let usedWords = [];
let currentWord = "";
let timer = null;
let timeLeft = 60;
let duration = 60;
let scoreA = 0, scoreB = 0;
let revealed = false;

const setupScreen = document.getElementById('setupScreen');
const gameScreen = document.getElementById('gameScreen');
const wordCard = document.getElementById('wordCard');
const timerDisplay = document.getElementById('timerDisplay');
const categoryTag = document.getElementById('categoryTag');

document.getElementById('startBtn').addEventListener('click', () => {
  const cat = document.getElementById('categorySelect').value;
  duration = parseInt(document.getElementById('durationSelect').value);
  timeLeft = duration;
  currentWords = [...wordBanks[cat]];
  usedWords = [];
  categoryTag.textContent = categoryNames[cat];
  setupScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  timerDisplay.textContent = timeLeft;
  nextWord();
});

function nextWord() {
  if (currentWords.length === 0) {
    currentWords = usedWords;
    usedWords = [];
  }
  const idx = Math.floor(Math.random() * currentWords.length);
  currentWord = currentWords[idx];
  usedWords.push(currentWord);
  currentWords.splice(idx, 1);
  revealed = false;
  wordCard.textContent = "Kelimeyi görmek için dokun 👆";
  wordCard.classList.add('hidden-word');
}

wordCard.addEventListener('click', () => {
  if (!revealed) {
    wordCard.textContent = currentWord.toUpperCase();
    wordCard.classList.remove('hidden-word');
    revealed = true;
  } else {
    wordCard.textContent = "Kelimeyi görmek için dokun 👆";
    wordCard.classList.add('hidden-word');
    revealed = false;
  }
});

document.getElementById('revealBtn').addEventListener('click', () => {
  wordCard.textContent = currentWord.toUpperCase();
  wordCard.classList.remove('hidden-word');
  revealed = true;
});

document.getElementById('skipBtn').addEventListener('click', () => {
  nextWord();
});

document.getElementById('startTimerBtn').addEventListener('click', function() {
  if (timer) return;
  this.disabled = true;
  this.textContent = "Süre Devam Ediyor...";
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = timeLeft;
    if (timeLeft <= 10) {
      timerDisplay.classList.add('low');
    }
    if (timeLeft <= 0) {
      clearInterval(timer);
      timer = null;
      timerDisplay.textContent = "SÜRE BİTTİ!";
      document.getElementById('startTimerBtn').disabled = false;
      document.getElementById('startTimerBtn').textContent = "Süreyi Başlat ⏱";
    }
  }, 1000);
});

function addScore(team) {
  if (team === 'A') {
    scoreA++;
    document.getElementById('scoreA').textContent = scoreA;
  } else {
    scoreB++;
    document.getElementById('scoreB').textContent = scoreB;
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  clearInterval(timer);
  timer = null;
  scoreA = 0; scoreB = 0;
  document.getElementById('scoreA').textContent = 0;
  document.getElementById('scoreB').textContent = 0;
  timerDisplay.classList.remove('low');
  gameScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
  document.getElementById('startTimerBtn').disabled = false;
  document.getElementById('startTimerBtn').textContent = "Süreyi Başlat ⏱";
});
</script>

</body>
</html>
