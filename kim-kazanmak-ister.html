<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlkokul Bilgi Yarışması</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #06133d, #16469c);
      color: white;
    }

    .app {
      width: min(1100px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    .panel {
      background: #07143f;
      border: 3px solid #f4c542;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(244, 197, 66, .3);
    }

    .main {
      padding: 28px;
    }

    .prizes {
      padding: 20px;
    }

    h1 {
      margin: 0;
      color: #f4c542;
      text-align: center;
      font-size: 38px;
    }

    .subtitle {
      text-align: center;
      color: #dce7ff;
      margin-bottom: 25px;
    }

    .start-screen {
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .tab {
      padding: 15px 25px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .tab:hover {
      background: #285bbc;
    }

    .tab.active {
      background: #f4c542;
      color: #111b45;
      border-color: #ffe995;
      box-shadow: 0 0 15px rgba(244, 197, 66, .7);
    }

    button {
      font-family: inherit;
    }

    .start-btn,
    .next-btn,
    .new-btn,
    .back-btn {
      display: block;
      margin: 15px auto;
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #f4c542;
      color: #111b45;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .start-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .start-btn:hover:not(:disabled),
    .next-btn:hover,
    .new-btn:hover,
    .back-btn:hover {
      background: #ffe27d;
      transform: scale(1.04);
    }

    .game-screen {
      display: none;
    }

    .info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      color: #f4c542;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .lesson {
      display: inline-block;
      padding: 7px 14px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: #315bb7;
      font-weight: bold;
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .timer-bg {
      height: 15px;
      overflow: hidden;
      border: 1px solid #8eb7ff;
      border-radius: 20px;
      background: #17275b;
      margin-bottom: 20px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: #37cf5e;
      transition: width 1s linear;
    }

    .question {
      min-height: 150px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #8eb7ff;
      border-radius: 16px;
      background: #122d70;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 20px;
    }

    .answer {
      padding: 16px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer:hover:not(:disabled) {
      background: #285bbc;
      border-color: #f4c542;
    }

    .answer:disabled {
      cursor: default;
    }

    .correct {
      background: #16823a !important;
      border-color: #7dff9f !important;
    }

    .wrong {
      background: #a51c2f !important;
      border-color: #ff9ba6 !important;
    }

    .message {
      min-height: 50px;
      margin: 18px 0;
      color: #f4c542;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .prizes h2 {
      color: #f4c542;
      text-align: center;
    }

    .prize-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prize-list li {
      padding: 9px;
      margin: 5px 0;
      border-radius: 8px;
      background: #163775;
      font-size: 14px;
    }

    .prize-list li.active {
      background: #f4c542;
      color: #111b45;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      .tabs,
      .answers {
        display: grid;
        grid-template-columns: 1fr;
      }

      .main {
        padding: 18px;
      }

      .question {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <main class="panel main">

    <h1>Bilgi Yarışması</h1>

    <p class="subtitle">
      Sınıfını seç, 250 soruluk havuzdan 15 soruluk yarışmaya başla.
    </p>

    <!-- SINIF SEKMELERİ -->
    <section id="startScreen" class="start-screen">
      <h2>Sınıf seviyeni seç</h2>

      <div class="tabs">
        <button type="button" class="tab" data-grade="2">
          2. Sınıf
        </button>

        <button type="button" class="tab" data-grade="3">
          3. Sınıf
        </button>

        <button type="button" class="tab" data-grade="4">
          4. Sınıf
        </button>
      </div>

      <p id="selectedGradeText">Henüz sınıf seçilmedi.</p>

      <button id="startButton" class="start-btn" disabled>
        Yarışmayı Başlat
      </button>
    </section>

    <!-- OYUN EKRANI -->
    <section id="gameScreen" class="game-screen">

      <div class="info">
        <span id="questionNumber"></span>
        <span id="gradeInfo"></span>
        <span id="prizeInfo"></span>
      </div>

      <div id="lessonInfo" class="lesson"></div>

      <div class="timer-info">
        <span>Kalan süre</span>
        <span id="timerText">30 saniye</span>
      </div>

      <div class="timer-bg">
        <div id="timerBar" class="timer-bar"></div>
      </div>

      <div id="questionText" class="question"></div>

      <div id="answers" class="answers"></div>

      <div id="message" class="message"></div>

      <button id="nextButton" class="next-btn hidden">
        Sonraki Soru
      </button>

      <button id="newButton" class="new-btn hidden">
        Yeni Yarışmacı
      </button>

      <button id="backButton" class="back-btn hidden">
        Sınıf Seçimine Dön
      </button>

    </section>

  </main>

  <aside class="panel prizes">
    <h2>Ödül Basamakları</h2>
    <ul id="prizeList" class="prize-list"></ul>
  </aside>

</div>

<script>
/*

Her soru ayrı bir nesnedir.
Soru sırasında sadece seçilen sınıfın havuzu kullanılır.

Toplam hedef:
2. sınıf: 80 soru
3. sınıf: 85 soru
4. sınıf: 85 soru
GENEL TOPLAM: 250 soru

Yarışmada bu havuzdan rastgele 15 soru seçilir.

*/

const questionPool = [

  {

    question: "Aşağıdaki kelimelerden hangisi alfabetik sırada önce gelir?",

  {

    question: "“Gül” kelimesi hangi cümlede çiçek anlamındadır?",
    options: [
      "Bana gül.",

  {

  // 2. SINIF — HAYAT BİLGİSİ
  // =====================================================

  {

  {

    correct: 1
  },

  {

    question: "Deprem sırasında en güvenli davranış hangisidir?",
    options: [
      "Pencereye koşmak",
      "Çök-kapan-tutun yapmak",

      "Balkona çıkmak"
    ],
    correct: 1
  },

  {
    grade: 2,
    lesson: "Hayat Bilgisi",
    question: "Aşağıdakilerden hangisi geri dönüşüm kutusuna atılabilir?",
    options: ["Cam şişe", "Yemek artığı", "Toprak", "Islak mendil"],
    correct: 0
  },

  {
    grade: 2,
    lesson: "Hayat Bilgisi",
    question: "Sağlıklı büyümek için hangisini yapmalıyız?",
    options: [
      "Düzenli uyumalıyız.",
      "Hiç su içmemeliyiz.",
      "Sadece şeker yemeliyiz.",
      "Bütün gün oturmalıyız."
    ],
    correct: 0
  }

  /*
    BURAYA DEVAM EDEN 2. SINIF SORULARI,
    3. SINIF SORULARI VE 4. SINIF SORULARI EKLENECEK.

    Her soru şu biçimde olmalıdır:

    {
      grade: 3,
      lesson: "Fen Bilimleri",
      question: "Soru metni burada olur.",
      options: ["A", "B", "C", "D"],
      correct: 2
    }

    250 soru tamamlandığında sistem otomatik olarak
    seçilen sınıftan 15 soru çeker.
  */
];

const prizes = [
  "Sticker Sayfası",
  "Silgi",
  "Kalemtıraş",
  "Kurşun Kalem",
  "Hikâye Kitabı",
  "Not Defteri",
  "Renkli Kalem",
  "Resim Defteri",
  "Kuru Boya",
  "Kalem ve Defter Seti",
  "Keçeli Kalem Seti",
  "Hikâye Kitabı Seti",
  "Geometri Seti",
  "Kırtasiye Paketi",
  "Kırtasiye Çantası"
];

let selectedGrade = null;
let selectedQuestions = [];
let questionIndex = 0;
let answered = false;
let timeLeft = 30;
let timer = null;

const tabs = document.querySelectorAll(".tab");
const startButton = document.getElementById("startButton");
const selectedGradeText = document.getElementById("selectedGradeText");
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");

const questionNumber = document.getElementById("questionNumber");
const gradeInfo = document.getElementById("gradeInfo");
const prizeInfo = document.getElementById("prizeInfo");
const lessonInfo = document.getElementById("lessonInfo");
const questionText = document.getElementById("questionText");
const answers = document.getElementById("answers");
const message = document.getElementById("message");

const timerText = document.getElementById("timerText");
const timerBar = document.getElementById("timerBar");

const nextButton = document.getElementById("nextButton");
const newButton = document.getElementById("newButton");
const backButton = document.getElementById("backButton");
const prizeList = document.getElementById("prizeList");

/*
===========================================================
SEKMELERİ AKTİFLEŞTİREN KISIM
===========================================================
*/
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    selectedGrade = Number(tab.dataset.grade);

    tabs.forEach(item => item.classList.remove("active"));
    tab.classList.add("active");

    selectedGradeText.textContent =
      `${selectedGrade}. sınıf seçildi.`;

    startButton.disabled = false;
  });
});

function shuffle(array) {
  const copied = [...array];

  for (let i = copied.length - 1; i > 0; i--) {
    const random = Math.floor(Math.random() * (i + 1));
    [copied[i], copied[random]] = [copied[random], copied[i]];
  }

  return copied;
}

/*
Seçilen sınıfa ait havuzdan rastgele 15 soru seçilir.
*/
function selectQuestions() {
  const gradePool = questionPool.filter(
    question => question.grade === selectedGrade
  );

  if (gradePool.length < 15) {
    alert(
      `${selectedGrade}. sınıf havuzunda en az 15 soru bulunmalıdır.`
    );
    return false;
  }

  selectedQuestions = shuffle(gradePool).slice(0, 15);
  return true;
}

function createPrizeList() {
  prizeList.innerHTML = "";

  prizes.forEach((prize, index) => {
    const li = document.createElement("li");
    li.id = `prize-${index}`;
    li.textContent = `${index + 1}. ${prize}`;
    prizeList.appendChild(li);
  });
}

function updatePrize() {
  document.querySelectorAll(".prize-list li").forEach(item => {
    item.classList.remove("active");
  });

  const active = document.getElementById(`prize-${questionIndex}`);

  if (active) {
    active.classList.add("active");
  }
}

function startTimer() {
  clearInterval(timer);

  timeLeft = 30;
  timerText.textContent = "30 saniye";
  timerBar.style.width = "100%";
  timerBar.style.background = "#37cf5e";

  timer = setInterval(() => {
    timeLeft--;

    timerText.textContent = `${timeLeft} saniye`;
    timerBar.style.width = `${(timeLeft / 30) * 100}%`;

    if (timeLeft <= 10) {
      timerBar.style.background = "#e73345";
    }

    if (timeLeft <= 0) {
      clearInterval(timer);
      finishAsWrong("Süre doldu.");
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timer);
}

function showQuestion() {
  answered = false;

  const current = selectedQuestions[questionIndex];

  questionNumber.textContent =
    `Soru: ${questionIndex + 1} / 15`;

  gradeInfo.textContent =
    `Seviye: ${selectedGrade}. Sınıf`;

  prizeInfo.textContent =
    `Ödül: ${prizes[questionIndex]}`;

  lessonInfo.textContent = current.lesson;
  questionText.textContent = current.question;
  message.textContent = "";

  nextButton.classList.add("hidden");
  newButton.classList.add("hidden");
  backButton.classList.add("hidden");

  answers.innerHTML = "";

  current.options.forEach((option, index) => {
    const button = document.createElement("button");

    button.className = "answer";
    button.innerHTML =
      `<strong>${String.fromCharCode(65 + index)}:</strong> ${option}`;

    button.addEventListener("click", () => {
      checkAnswer(index, button);
    });

    answers.appendChild(button);
  });

  updatePrize();
  startTimer();
}

function disableAnswers() {
  document.querySelectorAll(".answer").forEach(button => {
    button.disabled = true;
  });
}

function finishAsWrong(text) {
  if (answered) return;

  answered = true;

  const current = selectedQuestions[questionIndex];
  const allAnswers = document.querySelectorAll(".answer");

  disableAnswers();
  allAnswers[current.correct].classList.add("correct");

  message.textContent =
    `${text} Doğru cevap: ${current.options[current.correct]}`;

  newButton.classList.remove("hidden");
  backButton.classList.remove("hidden");
}

function checkAnswer(index, clickedButton) {
  if (answered) return;

  answered = true;
  stopTimer();

  const current = selectedQuestions[questionIndex];
  const allAnswers = document.querySelectorAll(".answer");

  disableAnswers();

  if (index === current.correct) {
    clickedButton.classList.add("correct");

    if (questionIndex === selectedQuestions.length - 1) {
      message.textContent =
        "Tebrikler! 15 sorunun tamamını doğru cevapladın.";

      newButton.classList.remove("hidden");
      backButton.classList.remove("hidden");
    } else {
      message.textContent = "Doğru cevap!";
      nextButton.classList.remove("hidden");
    }
  } else {
    clickedButton.classList.add("wrong");
    allAnswers[current.correct].classList.add("correct");

    message.textContent =
      `Yanlış cevap. Doğru cevap: ${current.options[current.correct]}`;

    newButton.classList.remove("hidden");
    backButton.classList.remove("hidden");
  }
}

function startGame() {
  if (!selectedGrade) return;

  if (!selectQuestions()) return;

  questionIndex = 0;

  startScreen.style.display = "none";
  gameScreen.style.display = "block";

  showQuestion();
}

startButton.addEventListener("click", startGame);

nextButton.addEventListener("click", () => {
  questionIndex++;
  showQuestion();
});

newButton.addEventListener("click", () => {
  stopTimer();

  if (!selectQuestions()) return;

  questionIndex = 0;
  showQuestion();
});

backButton.addEventListener("click", () => {
