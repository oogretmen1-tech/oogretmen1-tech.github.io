  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlkokul Bilgi Yarışması</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: DORakam,Arial, sans-serif;
      color: #e2e8f0;
      background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
    }

    .container {
      width: min(1050px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    .panel {
      padding: 28px;
      border: 2px solid #48cae4;
      border-radius: 20px;
      background: linear-gradient(145deg, #101826, #1b263b);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
      color: #48cae4;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .subtitle,
    .selection-text {
      color: #90e0ef;
      text-align: center;
    }

    .class-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 25px 0;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      font-family: DORakam,Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.15);
      box-shadow: 0 4px 12px rgba(72, 202, 228, 0.3);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .class-button {
      min-width: 125px;
      border: 2px solid #415a77;
      background: linear-gradient(to bottom, #27374d, #1d2a3a);
      color: #e2e8f0;
    }

    .class-button.active {
      border-color: #48cae4;
      background: linear-gradient(to bottom, #0077b6, #03045e);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(72, 202, 228, 0.5);
    }

    .start-button,
    .next-button {
      display: block;
      margin: 18px auto;
      background: linear-gradient(to bottom, #00b4d8, #0077b6);
      color: #ffffff;
      border: 1px solid #90e0ef;
    }

    #gameScreen {
      display: none;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      color: #90e0ef;
      font-weight: bold;
    }

    .lesson {
      display: inline-block;
      padding: 8px 16px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: linear-gradient(to right, #1d3557, #457b9d);
      color: #ffffff;
      font-weight: bold;
      border: 1px solid #a8dadc;
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-weight: bold;
      color: #adb5bd;
    }

    .timer-background {
      height: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #415a77;
      border-radius: 20px;
      background: #0d1b2a;
    }

    #timerBar {
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, #2a9d8f, #2ec4b6);
      transition: width 1s linear;
    }

    .question-box {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      border: 2px solid #415a77;
      border-radius: 16px;
      background: linear-gradient(135deg, #14213d, #1d2d44);
      font-size: 22px;
      font-weight: bold;
      line-height: 1.45;
      text-align: center;
      color: #ffffff;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .answer-button {
      border: 2px solid #415a77;
      background: linear-gradient(to bottom, #1d2a3a, #131b26);
      color: #e2e8f0;
      text-align: left;
    }

    .answer-button:hover:not(:disabled) {
      border-color: #48cae4;
      background: linear-gradient(to bottom, #27374d, #1b263b);
      color: #ffffff;
    }

    .correct {
      border-color: #2ec4b6 !important;
      background: linear-gradient(to bottom, #2a9d8f, #1f7a6f) !important;
      color: #ffffff !important;
    }

    .wrong {
      border-color: #e76f51 !important;
      background: linear-gradient(to bottom, #e63946, #b71c1c) !important;
      color: #ffffff !important;
    }

    #message {
      min-height: 45px;
      margin: 16px 0 5px;
      color: #48cae4;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    .game-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .quit-button {
      background: linear-gradient(to bottom, #e63946, #c52233);
      color: white;
      border: 1px solid #ff758f;
    }

    .new-button {
      background: linear-gradient(to bottom, #2a9d8f, #218380);
      color: white;
      border: 1px solid #4ade80;
    }

    .back-button {
      background: linear-gradient(to bottom, #457b9d, #1d3557);
      color: white;
      border: 1px solid #90e0ef;
    }

    .hidden {
      display: none !important;
    }

    .prize-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prize-list li {
      margin: 6px 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #141e30;
      border: 1px solid #23395d;
      font-size: 14px;
      color: #adb5bd;
    }

    .prize-list li.active {
      background: linear-gradient(to right, #0077b6, #00b4d8);
      color: #ffffff;
      font-weight: bold;
      border-color: #90e0ef;
      box-shadow: 0 0 10px rgba(0, 180, 216, 0.4);
    }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      body {
        padding: 10px;
      }

      .panel {
        padding: 16px;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .question-box {
        font-size: 19px;
      }
    }
  </style>

<body>

  <div class="container">

    <main class="panel">

      <h1>Bilgi Yarışması</h1>

      <p class="subtitle">

      <section id="startScreen">

        <h2>Sınıf Seç</h2>

        <div class="class-buttons">
          <button class="class-button" data-grade="2">2. Sınıf</button>

          <button class="class-button" data-grade="4">4. Sınıf</button>
        </div>

        <p id="selectionText" class="selection-text">

        </p>

        <button id="startButton" class="start-button" disabled>

        </button>

      </section>

      <section id="gameScreen">

        <div class="top-info">
          <span id="questionNumber"></span>

        </div>

        <div id="lessonInfo" class="lesson"></div>

        <div class="timer-info">
          <span>Kalan Süre</span>
          <span id="timerText">30 saniye</span>
        </div>

        <div class="timer-background">
          <div id="timerBar"></div>
        </div>

        <div id="questionText" class="question-box"></div>

        <div id="answers" class="answers"></div>

        <div id="message"></div>

        <button id="nextButton" class="next-button hidden">
          Sonraki Soru
        </button>

        <div class="game-buttons">
          <button id="quitButton" class="quit-button">
            Yarışmadan Çekil
          </button>

          <button id="newContestantButton" class="new-button">

          </button>

          <button id="backButton" class="back-button">
            Sınıf Seçimine Dön
          </button>
        </div>

      </section>

    <aside class="panel">

      <ul id="prizeList" class="prize-list"></ul>

  <script>
    const questionPool = [];

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[randomIndex]] = [copy[randomIndex], copy[i]];
      }

      return copy;
    }

    function addQuestion(id, grade, lesson, question, correct, wrong1, wrong2, wrong3) {
      const options = shuffle([
        { text: String(correct), correct: true },
        { text: String(wrong1), correct: false },
        { text: String(wrong2), correct: false },
        { text: String(wrong3), correct: false }
      ]);

      questionPool.push({
        id: id,
        grade: grade,
        lesson: lesson,
        question: question,
        options: options.map(option => option.text),
        correctIndex: options.findIndex(option => option.correct)
      });
    }

    function addQuestionList(grade, lesson, list) {
      list.forEach((item, index) => {
        addQuestion(
          grade + "-" + lesson + "-" + index,
          grade,
          lesson,
          item[0],
          item[1],
          item[2],
          item[3],
          item[4]
        );
      });
    }

    for (let i = 1; i <= 30; i++) {
      const number1 = 10 + i;
      const number2 = 3 + (i % 7);

      addQuestion(
        "2-math-" + i,
        2,
        "Matematik",
        number1 + " + " + number2 + " işleminin sonucu kaçtır?",
        number1 + number2,
        number1 + number2 + 1,
        number1 + number2 - 1,
        number1 + number2 + 10
      );
    }

    for (let i = 1; i <= 30; i++) {
      const number1 = 100 + i * 4;
      const number2 = 10 + i;

      addQuestion(
        "3-math-" + i,
        3,
        "Matematik",
        number1 + " + " + number2 + " işleminin sonucu kaçtır?",
        number1 + number2,
        number1 + number2 + 10,
        number1 + number2 - 10,
        number1 + number2 + 1
      );
    }

    for (let i = 1; i <= 30; i++) {
      const number1 = 5 + (i % 8);
      const number2 = 4 + (i % 6);

      addQuestion(
        "4-math-" + i,
        4,
        "Matematik",
        number1 + " × " + number2 + " işleminin sonucu kaçtır?",
        number1 * number2,
        number1 * number2 + number1,
        number1 * number2 - number2,

    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const message = document.getElementById("message");

    const timerText = document.getElementById("timerText");
    const timerBar = document.getElementById("timerBar");

    const nextButton = document.getElementById("nextButton");
    const quitButton = document.getElementById("quitButton");
    const newContestantButton = document.getElementById("newContestantButton");
    const backButton = document.getElementById("backButton");
    const prizeList = document.getElementById("prizeList");

    function createPrizeList() {
      prizes.forEach((prize, index) => {
        const listItem = document.createElement("li");
        listItem.id = "prize-" + index;
        listItem.textContent = (index + 1) + ". " + prize;
        prizeList.appendChild(listItem);
      });
    }

    function updatePrizeList() {
      document.querySelectorAll(".prize-list li").forEach(item => {
        item.classList.remove("active");
      });

      const activePrize = document.getElementById("prize-" + questionIndex);

      if (activePrize) {
        activePrize.classList.add("active");
      }
    }

    function getAvailableQuestions() {
      return questionPool.filter(question => {
        return question.grade === selectedGrade &&
          !usedQuestions[selectedGrade].has(question.id);
      });
    }

    function selectQuestionsForContestant() {
      const quotas = lessonQuotas[selectedGrade];
      const availableQuestions = getAvailableQuestions();
      const contestantQuestions = [];

      for (const lessonName in quotas) {
        const neededCount = quotas[lessonName];

        const lessonQuestions = availableQuestions.filter(question => {
          return question.lesson === lessonName;
        });

        if (lessonQuestions.length < neededCount) {
          showPoolFinished(
            lessonName + " dersinde yeni yarışmacı için yeterli soru kalmadı."
          );

          return false;
        }

        const chosenQuestions = shuffle(lessonQuestions).slice(0, neededCount);

        contestantQuestions.push(...chosenQuestions);
      }

      selectedQuestions = shuffle(contestantQuestions);

      selectedQuestions.forEach(question => {
        usedQuestions[selectedGrade].add(question.id);
      });

      return true;
    }

    function startTimer() {
      stopTimer();

      timeLeft = 30;
      timerText.textContent = "30 saniye";
      timerBar.style.width = "100%";
      timerBar.style.background = "linear-gradient(to right, #2a9d8f, #2ec4b6)";

      timer = setInterval(() => {
        timeLeft--;

        timerText.textContent = timeLeft + " saniye";
        timerBar.style.width = (timeLeft / 30) * 100 + "%";

        if (timeLeft <= 10) {
          timerBar.style.background = "linear-gradient(to right, #e63946, #b71c1c)";
        }

        if (timeLeft <= 0) {
          stopTimer();
          timeIsUp();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function disableAnswers() {
      document.querySelectorAll(".answer-button").forEach(button => {
        button.disabled = true;
      });
    }

    function showQuestion() {
      answered = false;

      const currentQuestion = selectedQuestions[questionIndex];

      questionNumber.textContent = "Soru: " + (questionIndex + 1) + " / 15";
      gradeInfo.textContent = selectedGrade + ". Sınıf";
      prizeInfo.textContent = "Ödül: " + prizes[questionIndex];
      lessonInfo.textContent = currentQuestion.lesson;
      questionText.textContent = currentQuestion.question;

      answers.innerHTML = "";
      message.textContent = "";
      nextButton.classList.add("hidden");

      currentQuestion.options.forEach((option, optionIndex) => {
        const answerButton = document.createElement("button");

        answerButton.className = "answer-button";
        answerButton.innerHTML =
          "<strong>" + String.fromCharCode(65 + optionIndex) + ".</strong> " + option;

        answerButton.addEventListener("click", () => {
          checkAnswer(optionIndex, answerButton);
        });

        answers.appendChild(answerButton);
      });

      updatePrizeList();
      startTimer();
    }

    function checkAnswer(answerIndex, clickedButton) {
      if (answered) {
        return;
      }

      answered = true;
      stopTimer();

      const currentQuestion = selectedQuestions[questionIndex];
      const answerButtons = document.querySelectorAll(".answer-button");

      disableAnswers();

      if (answerIndex === currentQuestion.correctIndex) {
        clickedButton.classList.add("correct");

        if (questionIndex === 14) {
          message.textContent =
            "Tebrikler! 15 soruluk yarışmayı başarıyla tamamladınız.";
        } else {
          message.textContent = "Doğru cevap!";
          nextButton.classList.remove("hidden");
        }
      } else {
        clickedButton.classList.add("wrong");
        answerButtons[currentQuestion.correctIndex].classList.add("correct");

        message.textContent =
          "Yanlış cevap. Doğru cevap: " +
          currentQuestion.options[currentQuestion.correctIndex];
      }
    }

    function timeIsUp() {
      if (answered) {
        return;
      }

      answered = true;

      const currentQuestion = selectedQuestions[questionIndex];
      const answerButtons = document.querySelectorAll(".answer-button");

      disableAnswers();

      answerButtons[currentQuestion.correctIndex].classList.add("correct");

      message.textContent =
        "Süre doldu. Doğru cevap: " +
        currentQuestion.options[currentQuestion.correctIndex];
    }

    function showPoolFinished(text) {
      stopTimer();

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      questionNumber.textContent = "Soru havuzu";
      gradeInfo.textContent = selectedGrade + ". Sınıf";
      prizeInfo.textContent = "";
      lessonInfo.textContent = "Yarışma başlatılamıyor";
      questionText.textContent = "Bu sınıf için yeterli yeni soru kalmadı.";
      answers.innerHTML = "";
      message.textContent = text;

      timerText.textContent = "Süre yok";
      timerBar.style.width = "0%";

      nextButton.classList.add("hidden");
    }

    function startContest() {
      if (!selectedGrade) {
        return;
      }

      const questionsSelected = selectQuestionsForContestant();

      if (!questionsSelected) {
        return;
      }

      questionIndex = 0;

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      showQuestion();
    }

    function returnToClassSelection() {
      stopTimer();

      selectedQuestions = [];
      questionIndex = 0;

      gameScreen.style.display = "none";
      startScreen.style.display = "block";

      if (selectedGrade) {
        selectionText.textContent =
          selectedGrade +
          ". sınıf seçili. Kullanılabilir soru sayısı: " +
          getAvailableQuestions().length;
      }
    }

    classButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedGrade = Number(button.dataset.grade);

        classButtons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        selectionText.textContent =
          selectedGrade +
          ". sınıf seçildi. Kullanılabilir soru sayısı: " +
          getAvailableQuestions().length;

        startButton.disabled = false;
      });
    });

    startButton.addEventListener("click", () => {
      startContest();
    });

    nextButton.addEventListener("click", () => {
      questionIndex++;
      showQuestion();
    });

    quitButton.addEventListener("click", () => {
      const quit = confirm("Yarışmadan çekilmek istiyor musunuz?");

      if (!quit) {
        return;
      }

      stopTimer();
      disableAnswers();
      nextButton.classList.add("hidden");

      message.textContent =
        "Yarışmadan çekildiniz. Yeni yarışmacı başlatabilir veya sınıf seçimine dönebilirsiniz.";
    });

    newContestantButton.addEventListener("click", () => {
      const startNew = confirm(
        "Yeni yarışmacı başlatılsın mı? Seçilen sorular tekrar kullanılmayacaktır."
      );

      if (!startNew) {
        return;
      }

      stopTimer();

      const questionsSelected = selectQuestionsForContestant();

      if (!questionsSelected) {
        return;
      }

      questionIndex = 0;
      showQuestion();
    });

    backButton.addEventListener("click", () => {
      const goBack = confirm("Sınıf seçimine dönmek istiyor musunuz?");

      if (!goBack) {
        return;
      }

      returnToClassSelection();
    });

    createPrizeList();

    console.log("Toplam soru sayısı:", questionPool.length);
  </script>
