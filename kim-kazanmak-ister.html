<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlkokul Bilgi Yarışması</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: "Andika", Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #06133d, #16469c);
    }

    button {
      font-family: inherit;
    }

    .app {
      width: min(1100px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    .panel {
      background: #07143f;
      border: 3px solid #f4c542;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(244, 197, 66, .3);
    }

    .main {
      padding: 28px;
    }

    .prizes {
      padding: 20px;
    }

    h1 {
      margin: 0;
      color: #f4c542;
      text-align: center;
      font-size: 38px;
    }

    h2 {
      text-align: center;
    }

    .subtitle {
      color: #dce7ff;
      text-align: center;
      margin-bottom: 25px;
    }

    .start-screen {
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .tab {
      padding: 15px 25px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .tab:hover {
      background: #285bbc;
    }

    .tab.active {
      background: #f4c542;
      color: #111b45;
      border-color: #ffe995;
      box-shadow: 0 0 15px rgba(244, 197, 66, .7);
    }

    .start-btn,
    .next-btn,
    .new-btn,
    .back-btn,
    .reset-btn {
      display: block;
      margin: 15px auto;
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #f4c542;
      color: #111b45;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .reset-btn {
      background: #ff9066;
    }

    .start-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .start-btn:hover:not(:disabled),
    .next-btn:hover,
    .new-btn:hover,
    .back-btn:hover,
    .reset-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.1);
    }

    .game-screen {
      display: none;
    }

    .info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      color: #f4c542;
      font-weight: bold;
    }

    .lesson {
      display: inline-block;
      padding: 7px 14px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: #315bb7;
      font-weight: bold;
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .timer-bg {
      height: 15px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #8eb7ff;
      border-radius: 20px;
      background: #17275b;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: #37cf5e;
      transition: width 1s linear;
    }

    .question {
      min-height: 150px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #8eb7ff;
      border-radius: 16px;
      background: #122d70;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 20px;
    }

    .answer {
      padding: 16px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer:hover:not(:disabled) {
      background: #285bbc;
      border-color: #f4c542;
    }

    .answer:disabled {
      cursor: default;
    }

    .correct {
      background: #16823a !important;
      border-color: #7dff9f !important;
    }

    .wrong {
      background: #a51c2f !important;
      border-color: #ff9ba6 !important;
    }

    .message {
      min-height: 50px;
      margin: 18px 0;
      color: #f4c542;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .prizes h2 {
      color: #f4c542;
    }

    .prize-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prize-list li {
      padding: 9px;
      margin: 5px 0;
      border-radius: 8px;
      background: #163775;
      font-size: 14px;
    }

    .prize-list li.active {
      background: #f4c542;
      color: #111b45;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      .tabs,
      .answers {
        grid-template-columns: 1fr;
      }

      .tabs {
        display: grid;
      }

      .main {
        padding: 18px;
      }

      .question {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <main class="panel main">
      <h1>Bilgi Yarışması</h1>

      <p class="subtitle">
        Sınıfını seç ve 15 soruluk yarışmaya başla.
      </p>

      <section id="startScreen" class="start-screen">
        <h2>Sınıf seviyeni seç</h2>

        <div class="tabs">
          <button class="tab" data-grade="2">2. Sınıf</button>
          <button class="tab" data-grade="3">3. Sınıf</button>
          <button class="tab" data-grade="4">4. Sınıf</button>
        </div>

        <p id="selectedGradeText">Henüz sınıf seçilmedi.</p>

        <button id="startButton" class="start-btn" disabled>
          Yarışmayı Başlat
        </button>
      </section>

      <section id="gameScreen" class="game-screen">

        <div class="info">
          <span id="questionNumber"></span>
          <span id="gradeInfo"></span>
          <span id="prizeInfo"></span>
        </div>

        <div id="lessonInfo" class="lesson"></div>

        <div class="timer-info">
          <span>Kalan süre</span>
          <span id="timerText">30 saniye</span>
        </div>

        <div class="timer-bg">
          <div id="timerBar" class="timer-bar"></div>
        </div>

        <div id="questionText" class="question"></div>

        <div id="answers" class="answers"></div>

        <div id="message" class="message"></div>

        <button id="nextButton" class="next-btn hidden">
          Sonraki Soru
        </button>

        <button id="newButton" class="new-btn hidden">
          Yeni Yarışmacı
        </button>

        <button id="backButton" class="back-btn hidden">
          Sınıf Seçimine Dön
        </button>

        <button id="resetButton" class="reset-btn hidden">
          Soru Havuzunu Yeniden Başlat
        </button>

      </section>
    </main>

    <aside class="panel prizes">
      <h2>Ödül Basamakları</h2>
      <ul id="prizeList" class="prize-list"></ul>
    </aside>

  </div>

  <script>
    const questionPool = [];

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const random = Math.floor(Math.random() * (i + 1));

        [result[i], result[random]] =
          [result[random], result[i]];
      }

      return result;
    }

    function addQuestion(
      id,
      grade,
      lesson,
      question,
      correct,
      wrong1,
      wrong2,
      wrong3
    ) {
      const options = shuffle([
        { text: String(correct), correct: true },
        { text: String(wrong1), correct: false },
        { text: String(wrong2), correct: false },
        { text: String(wrong3), correct: false }
      ]);

      questionPool.push({
        id,
        grade,
        lesson,
        question,
        options: options.map(option => option.text),
        correct: options.findIndex(option => option.correct)
      });
    }

    function addQuestionsFromList(grade, lesson, list) {
      list.forEach((item, index) => {
        addQuestion(
          `${grade}-${lesson}-${index}`,
          grade,
          lesson,
          item[0],
          item[1],
          item[2],
          item[3],
          item[4]
        );
      });
    }

    console.log("Toplam soru sayısı:", questionPool.length);

    /*
      ÖDÜL LİSTESİ
    */

    const prizes = [
      "Sticker Sayfası",
      "Silgi",
      "Kalemtıraş",
      "Kurşun Kalem",
      "Hikâye Kitabı",
      "Not Defteri",
      "Renkli Kalem",
      "Resim Defteri",
      "Kuru Boya",
      "Kalem ve Defter Seti",
      "Keçeli Kalem Seti",
      "Hikâye Kitabı Seti",
      "Geometri Seti",
      "Kırtasiye Paketi",
      "Kırtasiye Çantası"
    ];

    let selectedGrade = null;
    let selectedQuestions = [];
    let questionIndex = 0;
    let answered = false;
    let timer = null;
    let timeLeft = 30;

    const usedQuestions = {
      2: new Set(),
      3: new Set(),
      4: new Set()
    };

    const lessonQuotas = {
      2: {
        "Türkçe": 5,
        "Matematik": 5,
        "Hayat Bilgisi": 5
      },

      3: {
        "Türkçe": 4,
        "Matematik": 4,
        "Fen Bilimleri": 4,
        "Hayat Bilgisi": 3
      },

      4: {
        "Türkçe": 4,
        "Matematik": 4,
        "Fen Bilimleri": 4,
        "Sosyal Bilgiler": 3
      }
    };

    const tabs = document.querySelectorAll(".tab");
    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const selectedGradeText = document.getElementById("selectedGradeText");

    const questionNumber = document.getElementById("questionNumber");
    const gradeInfo = document.getElementById("gradeInfo");
    const prizeInfo = document.getElementById("prizeInfo");
    const lessonInfo = document.getElementById("lessonInfo");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const message = document.getElementById("message");

    const timerText = document.getElementById("timerText");
    const timerBar = document.getElementById("timerBar");

    const nextButton = document.getElementById("nextButton");
    const newButton = document.getElementById("newButton");
    const backButton = document.getElementById("backButton");
    const resetButton = document.getElementById("resetButton");
    const prizeList = document.getElementById("prizeList");

    function createPrizeList() {
      prizeList.innerHTML = "";

      prizes.forEach((prize, index) => {
        const li = document.createElement("li");

        li.id = `prize-${index}`;
        li.textContent = `${index + 1}. ${prize}`;

        prizeList.appendChild(li);
      });
    }

    function updatePrize() {
      document.querySelectorAll(".prize-list li").forEach(item => {
        item.classList.remove("active");
      });

      const activePrize =
        document.getElementById(`prize-${questionIndex}`);

      if (activePrize) {
        activePrize.classList.add("active");
      }
    }

    function getAvailableQuestions() {
      return questionPool.filter(question =>
        question.grade === selectedGrade &&
        !usedQuestions[selectedGrade].has(question.id)
      );
    }

    /*
      EN ÖNEMLİ BÖLÜM:

      Her yeni yarışmacıda her dersten belirlenen miktarda soru alınır.
      Daha sonra bu 15 soru karıştırılır.
    */

    function selectQuestionsForContestant() {
      const quotas = lessonQuotas[selectedGrade];
      const contestantQuestions = [];

      for (const lesson in quotas) {
        const requiredCount = quotas[lesson];

        const availableLessonQuestions = questionPool.filter(question =>
          question.grade === selectedGrade &&
          question.lesson === lesson &&
          !usedQuestions[selectedGrade].has(question.id)
        );

        if (availableLessonQuestions.length < requiredCount) {
          showPoolFinished(
            `${lesson} dersinde yeni yarışma için yeterli soru kalmadı.`
          );

          return false;
        }

        const selectedLessonQuestions =
          shuffle(availableLessonQuestions).slice(0, requiredCount);

        contestantQuestions.push(...selectedLessonQuestions);
      }

      selectedQuestions = shuffle(contestantQuestions);

      selectedQuestions.forEach(question => {
        usedQuestions[selectedGrade].add(question.id);
      });

      return true;
    }

    function startTimer() {
      stopTimer();

      timeLeft = 30;
      timerText.textContent = "30 saniye";
      timerBar.style.width = "100%";
      timerBar.style.background = "#37cf5e";

      timer = setInterval(() => {
        timeLeft--;

        timerText.textContent = `${timeLeft} saniye`;
        timerBar.style.width = `${(timeLeft / 30) * 100}%`;

        if (timeLeft <= 10) {
          timerBar.style.background = "#e73345";
        }

        if (timeLeft <= 0) {
          stopTimer();
          finishAsWrong("Süre doldu.");
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function showQuestion() {
      answered = false;

      const current = selectedQuestions[questionIndex];

      questionNumber.textContent =
        `Soru: ${questionIndex + 1} / 15`;

      gradeInfo.textContent =
        `${selectedGrade}. Sınıf`;

      prizeInfo.textContent =
        `Ödül: ${prizes[questionIndex]}`;

      lessonInfo.textContent = current.lesson;
      questionText.textContent = current.question;
      message.textContent = "";

      answers.innerHTML = "";

      nextButton.classList.add("hidden");
      newButton.classList.add("hidden");
      backButton.classList.add("hidden");
      resetButton.classList.add("hidden");

      current.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.innerHTML =
          `<strong>${String.fromCharCode(65 + index)}:</strong> ${option}`;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        answers.appendChild(button);
      });

      updatePrize();
      startTimer();
    }

    function disableAnswers() {
      document.querySelectorAll(".answer").forEach(button => {
        button.disabled = true;
      });
    }

    function finishAsWrong(reason) {
      if (answered) return;

      answered = true;

      const current = selectedQuestions[questionIndex];
      const allAnswers = document.querySelectorAll(".answer");

      disableAnswers();

      allAnswers[current.correct].classList.add("correct");

      message.textContent =
        `${reason} Doğru cevap: ${current.options[current.correct]}`;

      newButton.classList.remove("hidden");
      backButton.classList.remove("hidden");
    }

    function checkAnswer(index, clickedButton) {
      if (answered) return;

      answered = true;
      stopTimer();

      const current = selectedQuestions[questionIndex];
      const allAnswers = document.querySelectorAll(".answer");

      disableAnswers();

      if (index === current.correct) {
        clickedButton.classList.add("correct");

        if (questionIndex === 14) {
          message.textContent =
            "Tebrikler! 15 soruluk yarışmayı tamamladın.";

          newButton.classList.remove("hidden");
          backButton.classList.remove("hidden");
        } else {
          message.textContent = "Doğru cevap!";
          nextButton.classList.remove("hidden");
        }
      } else {
        clickedButton.classList.add("wrong");
        allAnswers[current.correct].classList.add("correct");

        message.textContent =
          `Yanlış cevap. Doğru cevap: ${current.options[current.correct]}`;

        newButton.classList.remove("hidden");
        backButton.classList.remove("hidden");
      }
    }

    function showPoolFinished(reason = "") {
      stopTimer();

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      questionNumber.textContent = "Soru havuzu bitti";
      gradeInfo.textContent = `${selectedGrade}. Sınıf`;
      prizeInfo.textContent = "";
      lessonInfo.textContent = "Yarışma tamamlandı";

      questionText.textContent =
        "Bu sınıf için yeni yarışma başlatılamıyor.";

      answers.innerHTML = "";

      const remaining = getAvailableQuestions().length;

      message.textContent = reason ||
        (
          remaining === 0
            ? "Bu sınıftaki bütün sorular kullanıldı."
            : "Yeni yarışma için her dersten yeterli soru kalmadı."
        );

      timerText.textContent = "Süre yok";
      timerBar.style.width = "0%";

      nextButton.classList.add("hidden");
      newButton.classList.add("hidden");
      backButton.classList.remove("hidden");
      resetButton.classList.remove("hidden");
    }

    function startGame() {
      if (!selectedGrade) return;

      const started =
        selectQuestionsForContestant();

      if (!started) return;

      questionIndex = 0;

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      showQuestion();
    }

    function returnToStart() {
      stopTimer();

      gameScreen.style.display = "none";
      startScreen.style.display = "block";

      selectedQuestions = [];
      questionIndex = 0;
    }

    function resetPool() {
      usedQuestions[selectedGrade].clear();

      selectedQuestions = [];
      questionIndex = 0;

      gameScreen.style.display = "none";
      startScreen.style.display = "block";

      selectedGradeText.textContent =
        `${selectedGrade}. sınıf seçildi. Kullanılabilir soru: ${
          getAvailableQuestions().length
        }`;

      startButton.disabled = false;
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        selectedGrade = Number(tab.dataset.grade);

        tabs.forEach(item => {
          item.classList.remove("active");
        });

        tab.classList.add("active");

        const availableCount =
          getAvailableQuestions().length;

        selectedGradeText.textContent =
          `${selectedGrade}. sınıf seçildi. Kullanılabilir soru: ${availableCount}`;

        startButton.disabled =
          availableCount < 15;
      });
    });

    startButton.addEventListener("click", startGame);

    nextButton.addEventListener("click", () => {
      questionIndex++;
      showQuestion();
    });

    newButton.addEventListener("click", () => {
      const started =
        selectQuestionsForContestant();

      if (!started) return;

      questionIndex = 0;
      showQuestion();
    });

    backButton.addEventListener("click", returnToStart);

    resetButton.addEventListener("click", resetPool);

    createPrizeList();

    console.log("Toplam soru:", questionPool.length);
  </script>
