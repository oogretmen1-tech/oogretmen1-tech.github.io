<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>İlkokul Bilgi Yarışması</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: "Andika", Arial, sans-serif;
      background: linear-gradient(135deg, #06133d, #16469c);
      color: white;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: min(1100px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    .panel {
      background: #07143f;
      border: 3px solid #f4c542;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(244, 197, 66, .3);
    }

    .main {
      padding: 28px;
    }

    .prizes {
      padding: 20px;
    }

    h1 {
      margin: 0;
      color: #f4c542;
      text-align: center;
      font-size: 38px;
    }

    h2 {
      text-align: center;
    }

    .subtitle {
      color: #dce7ff;
      text-align: center;
      margin-bottom: 25px;
    }

    .start-screen {
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .tab {
      padding: 15px 25px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .tab:hover {
      background: #285bbc;
    }

    .tab.active {
      background: #f4c542;
      color: #111b45;
      border-color: #ffe995;
      box-shadow: 0 0 15px rgba(244, 197, 66, .7);
    }

    .start-btn,
    .next-btn,
    .new-btn,
    .back-btn,
    .reset-btn {
      display: block;
      margin: 15px auto;
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #f4c542;
      color: #111b45;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .reset-btn {
      background: #ff8b5c;
    }

    .start-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .start-btn:hover:not(:disabled),
    .next-btn:hover,
    .new-btn:hover,
    .back-btn:hover,
    .reset-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.1);
    }

    .game-screen {
      display: none;
    }

    .info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      color: #f4c542;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .lesson {
      display: inline-block;
      padding: 7px 14px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: #315bb7;
      font-weight: bold;
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .timer-bg {
      height: 15px;
      overflow: hidden;
      border: 1px solid #8eb7ff;
      border-radius: 20px;
      background: #17275b;
      margin-bottom: 20px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: #37cf5e;
      transition: width 1s linear;
    }

    .question {
      min-height: 150px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #8eb7ff;
      border-radius: 16px;
      background: #122d70;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 20px;
    }

    .answer {
      padding: 16px;
      border: 2px solid #8eb7ff;
      border-radius: 12px;
      background: #123b8c;
      color: white;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer:hover:not(:disabled) {
      background: #285bbc;
      border-color: #f4c542;
    }

    .answer:disabled {
      cursor: default;
    }

    .correct {
      background: #16823a !important;
      border-color: #7dff9f !important;
    }

    .wrong {
      background: #a51c2f !important;
      border-color: #ff9ba6 !important;
    }

    .message {
      min-height: 50px;
      margin: 18px 0;
      color: #f4c542;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .prizes h2 {
      color: #f4c542;
    }

    .prize-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prize-list li {
      padding: 9px;
      margin: 5px 0;
      border-radius: 8px;
      background: #163775;
      font-size: 14px;
    }

    .prize-list li.active {
      background: #f4c542;
      color: #111b45;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      .tabs,
      .answers {
        display: grid;
        grid-template-columns: 1fr;
      }

      .main {
        padding: 18px;
      }

      .question {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <main class="panel main">
      <h1>Bilgi Yarışması</h1>

      <p class="subtitle">
        Sınıfını seç, 250 soruluk havuzdan 15 soruluk yarışmaya başla.
      </p>

      <section id="startScreen" class="start-screen">
        <h2>Sınıf seviyeni seç</h2>

        <div class="tabs">
          <button class="tab" data-grade="2">2. Sınıf</button>
          <button class="tab" data-grade="3">3. Sınıf</button>
          <button class="tab" data-grade="4">4. Sınıf</button>
        </div>

        <p id="selectedGradeText">Henüz sınıf seçilmedi.</p>

        <button id="startButton" class="start-btn" disabled>
          Yarışmayı Başlat
        </button>
      </section>

      <section id="gameScreen" class="game-screen">

        <div class="info">
          <span id="questionNumber"></span>
          <span id="gradeInfo"></span>
          <span id="prizeInfo"></span>
        </div>

        <div id="lessonInfo" class="lesson"></div>

        <div class="timer-info">
          <span>Kalan süre</span>
          <span id="timerText">30 saniye</span>
        </div>

        <div class="timer-bg">
          <div id="timerBar" class="timer-bar"></div>
        </div>

        <div id="questionText" class="question"></div>

        <div id="answers" class="answers"></div>

        <div id="message" class="message"></div>

        <button id="nextButton" class="next-btn hidden">
          Sonraki Soru
        </button>

        <button id="newButton" class="new-btn hidden">
          Yeni Yarışmacı
        </button>

        <button id="backButton" class="back-btn hidden">
          Sınıf Seçimine Dön
        </button>

        <button id="resetButton" class="reset-btn hidden">
          Soru Havuzunu Yeniden Başlat
        </button>

      </section>
    </main>

    <aside class="panel prizes">
      <h2>Ödül Basamakları</h2>
      <ul id="prizeList" class="prize-list"></ul>
    </aside>

  </div>

  <script>
    /*
      TOPLAM SORU SAYISI: 250

      2. sınıf: 84 soru
      3. sınıf: 83 soru
      4. sınıf: 83 soru

      Her yarışmacıya 15 soru verilir.
      Kullanılan sorular tekrar seçilmez.
    */

    const questionPool = [];

    function createQuestion(id, grade, lesson, question, correct, wrong1, wrong2, wrong3) {
      const options = [
        { text: String(correct), correct: true },
        { text: String(wrong1), correct: false },
        { text: String(wrong2), correct: false },
        { text: String(wrong3), correct: false }
      ];

      options.sort(() => Math.random() - 0.5);

      return {
        id,
        grade,
        lesson,
        question,
        options: options.map(item => item.text),
        correct: options.findIndex(item => item.correct)
      };
    }

    /*
      2. SINIF SORULARI — 84 ADET
    */

    for (let i = 1; i <= 28; i++) {
      const a = 10 + i;
      const b = 2 + (i % 8);
      const result = a + b;

      questionPool.push(
        createQuestion(
          `2-toplama-${i}`,
          2,
          "Matematik",
          `${a} + ${b} işleminin sonucu kaçtır?`,
          result,
          result + 1,
          result - 1,
          result + 10
        )
      );
    }

    for (let i = 1; i <= 28; i++) {
      const a = 40 + i;
      const b = 3 + (i % 9);
      const result = a - b;

      questionPool.push(
        createQuestion(
          `2-cikarma-${i}`,
          2,
          "Matematik",
          `${a} - ${b} işleminin sonucu kaçtır?`,
          result,
          result + 1,
          result - 1,
          result + 10
        )
      );
    }

    const grade2General = [
      ["“Mutlu” kelimesinin zıt anlamlısı hangisidir?", "Üzgün", "Neşeli", "Sevinçli", "Gülümseyen"],
      ["“Hediye” kelimesinin eş anlamlısı hangisidir?", "Armağan", "Oyuncak", "Paket", "Sürpriz"],
      ["“Kitaplık” kelimesi kaç heceden oluşur?", "3", "2", "4", "5"],
      ["Aşağıdakilerden hangisi soru cümlesidir?", "Sen de gelir misin?", "Bugün parka gittik.", "Kardeşim uyuyor.", "Çantam masada."],
      ["Aşağıdakilerden hangisi özel addır?", "Ankara", "şehir", "okul", "çocuk"],
      ["Bir haftada kaç gün vardır?", "7", "5", "6", "8"],
      ["Bir üçgenin kaç köşesi vardır?", "3", "2", "4", "5"],
      ["Karşıdan karşıya geçmek için en güvenli yer hangisidir?", "Yaya geçidi", "Otopark", "Bahçe", "Bisiklet yolu"],
      ["Dişlerimizi korumak için ne yapmalıyız?", "Dişlerimizi fırçalamalıyız.", "Çok şeker yemeliyiz.", "Geç yatmalıyız.", "Su içmemeliyiz"],
      ["Kullanmadığımız ışıkları ne yapmalıyız?", "Kapatmalıyız.", "Açık bırakmalıyız.", "Kırmalıyız.", "Saklamalıyız"],
      ["Deprem sırasında hangi davranış doğrudur?", "Çök-kapan-tutun yapmak", "Pencereye koşmak", "Asansöre binmek", "Balkona çıkmak"],
      ["Aşağıdakilerden hangisi geri dönüşüme atılabilir?", "Cam şişe", "Yemek artığı", "Toprak", "Islak mendil"]
    ];

    grade2General.forEach((item, index) => {
      questionPool.push(
        createQuestion(
          `2-genel-${index}`,
          2,
          index < 5 ? "Türkçe" : index < 7 ? "Matematik" : "Hayat Bilgisi",
          item[0],
          item[1],
          item[2],
          item[3],
          item[4]
        )
      );
    });

    /*
      3. SINIF SORULARI — 83 ADET
    */

    for (let i = 1; i <= 30; i++) {
      const a = 100 + i * 3;
      const b = 20 + i;
      const result = a + b;

      questionPool.push(
        createQuestion(
          `3-toplama-${i}`,
          3,
          "Matematik",
          `${a} + ${b} işleminin sonucu kaçtır?`,
          result,
          result + 10,
          result - 10,
          result + 1
        )
      );
    }

    for (let i = 1; i <= 28; i++) {
      const a = 300 + i * 4;
      const b = 50 + i;
      const result = a - b;

      questionPool.push(
        createQuestion(
          `3-cikarma-${i}`,
          3,
          "Matematik",
          `${a} - ${b} işleminin sonucu kaçtır?`,
          result,
          result + 10,
          result - 10,
          result + 1
        )
      );
    }

    for (let i = 1; i <= 25; i++) {
      const a = 2 + (i % 8);
      const b = 3 + (i % 6);
      const result = a * b;

      questionPool.push(
        createQuestion(
          `3-carpma-${i}`,
          3,
          "Matematik",
          `${a} × ${b} işleminin sonucu kaçtır?`,
          result,
          result + a,
          result - b,
          result + 5
        )
      );
    }

    /*
      4. SINIF SORULARI — 83 ADET
    */

    for (let i = 1; i <= 30; i++) {
      const a = 10 + (i % 9);
      const b = 4 + (i % 7);
      const result = a * b;

      questionPool.push(
        createQuestion(
          `4-carpma-${i}`,
          4,
          "Matematik",
          `${a} × ${b} işleminin sonucu kaçtır?`,
          result,
          result + a,
          result - b,
          result + 10
        )
      );
    }

    for (let i = 1; i <= 27; i++) {
      const divisor = 2 + (i % 7);
      const result = 5 + i;
      const dividend = divisor * result;

      questionPool.push(
        createQuestion(
          `4-bolme-${i}`,
          4,
          "Matematik",
          `${dividend} ÷ ${divisor} işleminin sonucu kaçtır?`,
          result,
          result + 1,
          result - 1,
          result + 10
        )
      );
    }

    for (let i = 1; i <= 26; i++) {
      const a = 1000 + i * 12;
      const b = 100 + i * 3;
      const result = a + b;

      questionPool.push(
        createQuestion(
          `4-islem-${i}`,
          4,
          "Matematik",
          `${a} + ${b} işleminin sonucu kaçtır?`,
          result,
          result + 10,
          result - 10,
          result + 100
        )
      );
    }

    console.log("Toplam soru:", questionPool.length);

    const prizes = [
      "Sticker Sayfası",
      "Silgi",
      "Kalemtıraş",
      "Kurşun Kalem",
      "Hikâye Kitabı",
      "Not Defteri",
      "Renkli Kalem",
      "Resim Defteri",
      "Kuru Boya",
      "Kalem ve Defter Seti",
      "Keçeli Kalem Seti",
      "Hikâye Kitabı Seti",
      "Geometri Seti",
      "Kırtasiye Paketi",
      "Kırtasiye Çantası"
    ];

    let selectedGrade = null;
    let selectedQuestions = [];
    let questionIndex = 0;
    let answered = false;
    let timeLeft = 30;
    let timer = null;

    const usedQuestions = {
      2: new Set(),
      3: new Set(),
      4: new Set()
    };

    const tabs = document.querySelectorAll(".tab");
    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const selectedGradeText = document.getElementById("selectedGradeText");

    const questionNumber = document.getElementById("questionNumber");
    const gradeInfo = document.getElementById("gradeInfo");
    const prizeInfo = document.getElementById("prizeInfo");
    const lessonInfo = document.getElementById("lessonInfo");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const message = document.getElementById("message");

    const timerText = document.getElementById("timerText");
    const timerBar = document.getElementById("timerBar");

    const nextButton = document.getElementById("nextButton");
    const newButton = document.getElementById("newButton");
    const backButton = document.getElementById("backButton");
    const resetButton = document.getElementById("resetButton");
    const prizeList = document.getElementById("prizeList");

    function shuffle(array) {
      const copied = [...array];

      for (let i = copied.length - 1; i > 0; i--) {
        const random = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[random]] = [copied[random], copied[i]];
      }

      return copied;
    }

    function createPrizeList() {
      prizeList.innerHTML = "";

      prizes.forEach((prize, index) => {
        const li = document.createElement("li");

        li.id = `prize-${index}`;
        li.textContent = `${index + 1}. ${prize}`;

        prizeList.appendChild(li);
      });
    }

    function updatePrize() {
      document.querySelectorAll(".prize-list li").forEach(item => {
        item.classList.remove("active");
      });

      const activePrize = document.getElementById(`prize-${questionIndex}`);

      if (activePrize) {
        activePrize.classList.add("active");
      }
    }

    function getAvailableQuestions() {
      return questionPool.filter(question => {
        return (
          question.grade === selectedGrade &&
          !usedQuestions[selectedGrade].has(question.id)
        );
      });
    }

    function selectQuestionsForContestant() {
      const available = getAvailableQuestions();

      if (available.length < 15) {
        showPoolFinished(available.length);
        return false;
      }

      selectedQuestions = shuffle(available).slice(0, 15);

      selectedQuestions.forEach(question => {
        usedQuestions[selectedGrade].add(question.id);
      });

      return true;
    }

    function showPoolFinished(remaining) {
      stopTimer();

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      questionText.textContent = "Bu sınıfın soru havuzu tamamlandı.";
      answers.innerHTML = "";

      message.textContent =
        remaining === 0
          ? `${selectedGrade}. sınıf için bütün sorular kullanıldı.`
          : `${selectedGrade}. sınıfta sadece ${remaining} soru kaldı. Yeni yarışma için en az 15 soru gerekir.`;

      questionNumber.textContent = "Yarışma tamamlandı";
      gradeInfo.textContent = `${selectedGrade}. Sınıf`;
      prizeInfo.textContent = "";

      lessonInfo.textContent = "Soru havuzu bitti";

      nextButton.classList.add("hidden");
      newButton.classList.add("hidden");
      backButton.classList.remove("hidden");
      resetButton.classList.remove("hidden");

      timerText.textContent = "Süre yok";
      timerBar.style.width = "0%";
    }

    function startTimer() {
      stopTimer();

      timeLeft = 30;
      timerText.textContent = "30 saniye";
      timerBar.style.width = "100%";
      timerBar.style.background = "#37cf5e";

      timer = setInterval(() => {
        timeLeft--;

        timerText.textContent = `${timeLeft} saniye`;
        timerBar.style.width = `${(timeLeft / 30) * 100}%`;

        if (timeLeft <= 10) {
          timerBar.style.background = "#e73345";
        }

        if (timeLeft <= 0) {
          stopTimer();
          finishAsWrong("Süre doldu.");
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function showQuestion() {
      answered = false;

      const current = selectedQuestions[questionIndex];

      questionNumber.textContent = `Soru: ${questionIndex + 1} / 15`;
      gradeInfo.textContent = `Seviye: ${selectedGrade}. Sınıf`;
      prizeInfo.textContent = `Ödül: ${prizes[questionIndex]}`;

      lessonInfo.textContent = current.lesson;
      questionText.textContent = current.question;
      message.textContent = "";

      answers.innerHTML = "";

      nextButton.classList.add("hidden");
      newButton.classList.add("hidden");
      backButton.classList.add("hidden");
      resetButton.classList.add("hidden");

      current.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.innerHTML =
          `<strong>${String.fromCharCode(65 + index)}:</strong> ${option}`;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        answers.appendChild(button);
      });

      updatePrize();
      startTimer();
    }

    function disableAnswers() {
      document.querySelectorAll(".answer").forEach(button => {
        button.disabled = true;
      });
    }

    function finishAsWrong(text) {
      if (answered) return;

      answered = true;

      const current = selectedQuestions[questionIndex];
      const allAnswers = document.querySelectorAll(".answer");

      disableAnswers();

      allAnswers[current.correct].classList.add("correct");

      message.textContent =
        `${text} Doğru cevap: ${current.options[current.correct]}`;

      newButton.classList.remove("hidden");
      backButton.classList.remove("hidden");
    }

    function checkAnswer(index, clickedButton) {
      if (answered) return;

      answered = true;
      stopTimer();

      const current = selectedQuestions[questionIndex];
      const allAnswers = document.querySelectorAll(".answer");

      disableAnswers();

      if (index === current.correct) {
        clickedButton.classList.add("correct");

        if (questionIndex === selectedQuestions.length - 1) {
          message.textContent =
            "Tebrikler! 15 sorunun tamamını doğru cevapladın.";

          newButton.classList.remove("hidden");
          backButton.classList.remove("hidden");
        } else {
          message.textContent = "Doğru cevap!";
          nextButton.classList.remove("hidden");
        }
      } else {
        clickedButton.classList.add("wrong");
        allAnswers[current.correct].classList.add("correct");

        message.textContent =
          `Yanlış cevap. Doğru cevap: ${current.options[current.correct]}`;

        newButton.classList.remove("hidden");
        backButton.classList.remove("hidden");
      }
    }

    function startGame() {
      if (!selectedGrade) return;

      if (!selectQuestionsForContestant()) return;

      questionIndex = 0;

      startScreen.style.display = "none";
      gameScreen.style.display = "block";

      showQuestion();
    }

    function returnToGradeSelection() {
      stopTimer();

      selectedQuestions = [];
      questionIndex = 0;

      gameScreen.style.display = "none";
      startScreen.style.display = "block";

      nextButton.classList.add("hidden");
      newButton.classList.add("hidden");
      backButton.classList.add("hidden");
      resetButton.classList.add("hidden");
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        selectedGrade = Number(tab.dataset.grade);

        tabs.forEach(item => item.classList.remove("active"));
        tab.classList.add("active");

        const availableCount = getAvailableQuestions().length;

        selectedGradeText.textContent =
          `${selectedGrade}. sınıf seçildi. Kullanılabilir soru: ${availableCount}`;

        startButton.disabled = availableCount < 15;
      });
    });

    startButton.addEventListener("click", startGame);

    nextButton.addEventListener("click", () => {
      questionIndex++;
      showQuestion();
    });

    newButton.addEventListener("click", () => {
      stopTimer();

      if (!selectQuestionsForContestant()) return;

      questionIndex = 0;
      showQuestion();
    });

    backButton.addEventListener("click", returnToGradeSelection);

    resetButton.addEventListener("click", () => {
      usedQuestions[selectedGrade].clear();

      message.textContent =
        `${selectedGrade}. sınıfın soru havuzu yeniden başlatıldı.`;

      selectedGradeText.textContent =
        `${selectedGrade}. sınıf seçildi. Kullanılabilir soru: ${
          getAvailableQuestions().length
        }`;

      startScreen.style.display = "block";
      gameScreen.style.display = "none";

      startButton.disabled = false;
    });

    createPrizeList();
  </script>

</body>
</html>
